<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imgs/logo/github_logo.png" type="image/png">
    <title>演示文稿 - Presentations</title>
    <style>
        :root {
            /* 背景渐变（浅色 glassmorphism） */
            --bg-gradient-1: #e7f1f0;  /* 浅青绿 */
            --bg-gradient-2: #dfe9ec;  /* 浅灰蓝 */
            --bg-gradient-3: #e6edf2;  /* 浅蓝灰 */
            --bg: #e7f1f0;

            /* 卡片样式：半透明白玻璃 */
            --card: rgba(255, 255, 255, 0.50);
            --card-hover: rgba(255, 255, 255, 0.72);
            --border: rgba(255, 255, 255, 0.55);
            --border-hover: rgba(255, 255, 255, 0.85);

            /* 文字层级 */
            --text: #2c3e50;
            --text-soft: #5a6c7d;
            --text-dim: #8e9aaf;

            /* 强调色 */
            --accent: #2dd4bf;
            --accent-2: #3b82f6;
            --accent-green: #2dd4bf;
            --accent-amber: #e8c47a;

            /* 阴影层级 */
            --shadow-sm: 0 2px 8px rgba(20, 40, 50, 0.05);
            --shadow-md: 0 6px 24px rgba(20, 40, 50, 0.08);
            --shadow-lg: 0 12px 40px rgba(20, 40, 50, 0.12);

            /* 圆角尺寸 */
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 28px;

            --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 30px 20px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰光斑：营造通透玻璃氛围 */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .bg-decoration-1 {
            width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(94, 234, 212, 0.30) 0%, transparent 70%);
            top: -180px; left: -120px;
            animation: float 22s ease-in-out infinite;
        }
        .bg-decoration-2 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(125, 211, 252, 0.28) 0%, transparent 70%);
            bottom: -140px; right: -120px;
            animation: float 26s ease-in-out infinite reverse;
        }
        .bg-decoration-3 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.18) 0%, transparent 70%);
            top: 48%; left: 52%;
            transform: translate(-50%, -50%);
            animation: pulse 16s ease-in-out infinite;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        .title-section {
            text-align: center;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(18px);
            animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.02s forwards;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            line-height: 1.2;
            color: var(--text);
        }

        .highlight {
            background: linear-gradient(120deg, #2dd4bf 30%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            font-size: 1.7rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-bottom: 0.5rem;
        }

        .stats-banner {
            background-color: var(--card);
            color: var(--text-dim);
            padding: 0.35rem 1rem;
            border-radius: 16px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            margin-top: 0.3rem;
        }

        /* 搜索框 */
        .search-container {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(14px);
            animation: rise 0.45s ease 0.08s forwards;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 10px 18px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            color: var(--text);
            font-size: 0.85rem;
            transition: var(--transition);
            backdrop-filter: blur(6px);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18);
        }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(14px);
            animation: rise 0.45s ease 0.14s forwards;
        }

        .category-tab {
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-dim);
            transition: var(--transition);
            user-select: none;
            backdrop-filter: blur(6px);
        }

        .category-tab:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            color: var(--text);
        }

        .category-tab.active {
            background: rgba(45, 212, 191, 0.15);
            color: var(--accent);
            border-color: rgba(45, 212, 191, 0.35);
        }

        /* 演示文稿网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            padding: 0;
        }

        .tool-card {
            background: var(--card);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border-radius: var(--radius-md);
            padding: 0;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s ease,
                        backdrop-filter 0.35s ease,
                        background 0.35s ease,
                        border-color 0.35s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 85px;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            transform: translateY(16px);
            animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* hover 光泽扫过 */
        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.55) 48%, transparent 66%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
            pointer-events: none;
            z-index: 2;
        }

        .tool-card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            box-shadow: 0 16px 48px rgba(20, 40, 50, 0.16),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transform: perspective(800px) rotateX(2deg) rotateY(-2deg)
                       translateY(-4px) scale(1.015);
            backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
        }

        .tool-card:hover::before {
            transform: translateX(120%);
        }

        .tool-label {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            background: rgba(45, 212, 191, 0.12);
            border: 1px solid rgba(45, 212, 191, 0.25);
            border-radius: 12px;
            font-size: 0.6rem;
            color: var(--accent);
            z-index: 3;
            line-height: 1.2;
            font-weight: 600;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .tool-card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 12px 0 12px;
            margin-bottom: 0;
            padding-right: 60px;
        }

        .tool-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            background: linear-gradient(135deg, #d9efef, #c4e3e8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .tool-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .tool-content {
            flex: 1;
            min-width: 0;
        }

        .tool-name {
            font-size: 0.85rem;
            font-weight: 650;
            color: var(--text);
            margin-bottom: 3px;
            line-height: 1.3;
            letter-spacing: -0.2px;
        }

        .tool-description {
            color: var(--text-soft);
            font-size: 0.68rem;
            line-height: 1.4;
            margin-bottom: 0;
            padding-bottom: 10px;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
            font-size: 0.85rem;
            display: none;
        }

        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.75rem;
            opacity: 0;
            animation: rise 0.45s ease 0.3s forwards;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 动画关键帧 */
        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 背景光斑缓慢漂移 */
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* 光斑呼吸 */
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.45; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body { padding: 20px 14px 16px; }
            h1 { font-size: 1.2rem; }
            .highlight { font-size: 1.35rem; }
            .subtitle { font-size: 0.75rem; }
            .search-container { margin-bottom: 0.75rem; }
            .search-box { padding: 8px 14px; font-size: 0.78rem; border-radius: 14px; }
            .category-tabs { gap: 6px; margin-bottom: 0.75rem; }
            .category-tab { padding: 6px 12px; font-size: 0.68rem; }
            .tools-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
            .tool-card { min-height: 70px; border-radius: 14px; }
            .tool-card-header { padding: 9px 9px 0 9px; padding-right: 48px; gap: 7px; }
            .tool-icon { width: 28px; height: 28px; min-width: 28px; border-radius: 8px; }
            .tool-name { font-size: 0.74rem; }
            .tool-description { font-size: 0.6rem; padding-bottom: 8px; }
            .tool-label { font-size: 0.55rem; padding: 2px 6px; }
        }

        @media (max-width: 480px) {
            body { padding: 16px 10px 12px; }
            h1 { font-size: 1rem; }
            .highlight { font-size: 1.15rem; }
            .tools-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
            .tool-card { min-height: 62px; border-radius: 12px; }
            .tool-card-header { padding: 7px 7px 0 7px; padding-right: 40px; gap: 5px; }
            .tool-icon { width: 24px; height: 24px; min-width: 24px; border-radius: 7px; }
            .tool-name { font-size: 0.68rem; }
            .tool-description { font-size: 0.56rem; }
        }
    </style>
</head>
<body>
    <!-- 背景装饰光斑 -->
    <div class="bg-decoration bg-decoration-1"></div>
    <div class="bg-decoration bg-decoration-2"></div>
    <div class="bg-decoration bg-decoration-3"></div>

    <div class="container">
        <!-- 标题区域 -->
        <div class="title-section">
            <h1><span class="highlight">演示文稿</span>面试演示集合</h1>
            <p class="subtitle">面向不同公司的求职面试幻灯片</p>
            <div class="stats-banner">
                📦 共创建 2 套演示文稿
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-container">
            <input type="text" class="search-box" id="searchBox" placeholder="搜索演示文稿名称或描述...">
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs">
            <div class="category-tab active" data-category="all">全部</div>
            <div class="category-tab" data-category="interview">求职面试</div>
        </div>

        <!-- 演示文稿网格 -->
        <div class="tools-grid" id="toolsGrid">
            <!-- 华为求职面试 -->
            <a href="/ppt/hw/" class="tool-card" data-category="interview" data-name="华为求职面试" data-desc="面向华为的求职面试演示，涵盖科研经历、技术能力、竞赛荣誉与求职意向">
                <span class="tool-label">求职面试</span>
                <div class="tool-card-header">
                    <div class="tool-icon"><img src="/ppt/assets/huawei_logo.png" alt="华为求职面试"></div>
                    <div class="tool-content">
                        <h3 class="tool-name">华为求职面试</h3>
                        <p class="tool-description">科研经历 / 技术能力 / 求职意向</p>
                    </div>
                </div>
            </a>

            <!-- 网易求职面试 -->
            <a href="/ppt/netease/" class="tool-card" data-category="interview" data-name="网易求职面试" data-desc="面向网易的求职面试演示，涵盖科研经历、技术能力与求职意向">
                <span class="tool-label">求职面试</span>
                <div class="tool-card-header">
                    <div class="tool-icon"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e36d6e' stroke-width='2'%3E%3Crect x='3' y='4' width='18' height='14' rx='2'/%3E%3Cpath d='M8 21h8M12 18v3'/%3E%3C/svg%3E" alt="网易求职面试"></div>
                    <div class="tool-content">
                        <h3 class="tool-name">网易求职面试</h3>
                        <p class="tool-description">科研经历 / 技术能力 / 求职意向</p>
                    </div>
                </div>
            </a>

            <div class="empty-state" id="emptyState">没有匹配的演示文稿</div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>王京 · 演示文稿集合 · <a href="/">返回个人主页</a></p>
        </div>
    </div>

    <script>
        // 搜索和分类过滤功能
        const searchBox = document.getElementById('searchBox');
        const categoryTabs = document.querySelectorAll('.category-tab');
        const cards = document.querySelectorAll('.tool-card');
        const emptyState = document.getElementById('emptyState');
        let currentCategory = 'all';
        let currentSearch = '';

        // 搜索功能
        searchBox.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase().trim();
            filterCards();
        });

        // 分类标签点击事件
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                categoryTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                filterCards();
            });
        });

        // 过滤函数
        function filterCards() {
            let visible = 0;
            cards.forEach(card => {
                const category = card.dataset.category;
                const name = (card.dataset.name || '').toLowerCase();
                const desc = (card.dataset.desc || '').toLowerCase();

                const categoryMatch = currentCategory === 'all' || category === currentCategory;
                const searchMatch = !currentSearch ||
                    name.includes(currentSearch) ||
                    desc.includes(currentSearch);

                if (categoryMatch && searchMatch) {
                    card.style.display = 'flex';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });
            emptyState.style.display = visible === 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
