<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际穿梭 | Interstellar Warp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #000;
            cursor: none;
            font-family: 'Orbitron', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* === 自定义光标 === */
        .cursor-ring {
            position: fixed;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(0, 255, 200, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, border-color 0.3s;
        }
        .cursor-ring.warping {
            width: 44px;
            height: 44px;
            border-color: rgba(0, 255, 200, 0.5);
        }
        .cursor-dot {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(0, 255, 200, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            transform: translate(-50%, -50%);
        }

        /* === HUD 信息面板 === */
        .hud {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            user-select: none;
        }

        .hud-top {
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0.85;
        }
        .hud-top h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 10px;
            color: rgba(0, 255, 200, 0.65);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
        }
        .hud-top .sub {
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 5px;
            color: rgba(0, 255, 200, 0.35);
            margin-top: 6px;
        }

        .hud-left {
            bottom: 50px;
            left: 36px;
        }

        .speed-label {
            font-size: 8px;
            letter-spacing: 4px;
            color: rgba(0, 255, 200, 0.35);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .speed-num {
            font-size: 38px;
            font-weight: 900;
            color: rgba(0, 255, 200, 0.75);
            line-height: 1;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .speed-num.warping {
            color: rgba(120, 240, 255, 0.95);
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.5);
        }
        .speed-unit {
            font-size: 11px;
            font-weight: 400;
            color: rgba(0, 255, 200, 0.3);
            margin-left: 4px;
            vertical-align: baseline;
        }
        .speed-bar {
            width: 180px;
            height: 2px;
            background: rgba(0, 255, 200, 0.08);
            margin-top: 14px;
            border-radius: 1px;
            overflow: hidden;
        }
        .speed-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffc8, #00aaff);
            border-radius: 1px;
            transition: width 0.12s ease-out;
            box-shadow: 0 0 8px rgba(0, 255, 200, 0.4);
        }

        .hud-right {
            bottom: 50px;
            right: 36px;
            text-align: right;
        }

        .coord-label {
            font-size: 8px;
            letter-spacing: 3px;
            color: rgba(0, 255, 200, 0.25);
            text-transform: uppercase;
        }
        .coord-val {
            font-size: 13px;
            font-weight: 400;
            color: rgba(0, 255, 200, 0.45);
            letter-spacing: 1px;
            margin-top: 3px;
            margin-bottom: 10px;
        }

        .hud-hint {
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0, 255, 200, 0.2);
            transition: opacity 3s ease;
        }

        /* === 准星 === */
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 10;
            pointer-events: none;
            width: 0;
            height: 0;
        }
        .ch-ring {
            width: 52px;
            height: 52px;
            border: 1px solid rgba(0, 255, 200, 0.1);
            border-radius: 50%;
            position: absolute;
            top: -26px;
            left: -26px;
            transition: border-color 0.4s;
        }
        .ch-ring.warping {
            border-color: rgba(0, 255, 200, 0.25);
        }
        .ch-arm {
            position: absolute;
            background: rgba(0, 255, 200, 0.15);
        }
        .ch-arm.h { width: 12px; height: 1px; top: -0.5px; }
        .ch-arm.v { width: 1px; height: 12px; left: -0.5px; }
        .ch-arm.l { right: 30px; }
        .ch-arm.r { left: 30px; }
        .ch-arm.t { bottom: 30px; }
        .ch-arm.b { top: 30px; }
        .ch-dot {
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 200, 0.35);
            border-radius: 50%;
            position: absolute;
            top: -1px;
            left: -1px;
        }

        /* === 边角装饰 === */
        .corner {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            width: 40px;
            height: 40px;
        }
        .corner::before, .corner::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 200, 0.1);
        }
        .corner-tl { top: 16px; left: 16px; }
        .corner-tl::before { top: 0; left: 0; width: 20px; height: 1px; }
        .corner-tl::after { top: 0; left: 0; width: 1px; height: 20px; }
        .corner-tr { top: 16px; right: 16px; }
        .corner-tr::before { top: 0; right: 0; width: 20px; height: 1px; }
        .corner-tr::after { top: 0; right: 0; width: 1px; height: 20px; }
        .corner-bl { bottom: 16px; left: 16px; }
        .corner-bl::before { bottom: 0; left: 0; width: 20px; height: 1px; }
        .corner-bl::after { bottom: 0; left: 0; width: 1px; height: 20px; }
        .corner-br { bottom: 16px; right: 16px; }
        .corner-br::before { bottom: 0; right: 0; width: 20px; height: 1px; }
        .corner-br::after { bottom: 0; right: 0; width: 1px; height: 20px; }

        /* === 闪烁扫描线 === */
        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 200, 0.03);
            z-index: 9;
            pointer-events: none;
            animation: scanMove 4s linear infinite;
        }
        @keyframes scanMove {
            0% { transform: translateY(-2px); }
            100% { transform: translateY(100vh); }
        }

        /* === 减少动效 === */
        @media (prefers-reduced-motion: reduce) {
            .scanline { animation: none; display: none; }
            .speed-fill { transition: none; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- 自定义光标 -->
<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>

<!-- 准星 -->
<div class="crosshair">
    <div class="ch-ring" id="chRing"></div>
    <div class="ch-arm h l"></div>
    <div class="ch-arm h r"></div>
    <div class="ch-arm v t"></div>
    <div class="ch-arm v b"></div>
    <div class="ch-dot"></div>
</div>

<!-- 边角装饰 -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- 扫描线 -->
<div class="scanline"></div>

<!-- HUD -->
<div class="hud hud-top">
    <h1>Interstellar Warp</h1>
    <div class="sub">Deep Space Navigation System</div>
</div>

<div class="hud hud-left">
    <div class="speed-label">Warp Velocity</div>
    <div>
        <span class="speed-num" id="speedNum">1.0</span>
        <span class="speed-unit">LY/s</span>
    </div>
    <div class="speed-bar">
        <div class="speed-fill" id="speedFill"></div>
    </div>
</div>

<div class="hud hud-right">
    <div class="coord-label">Azimuth</div>
    <div class="coord-val" id="azVal">+0.000</div>
    <div class="coord-label">Elevation</div>
    <div class="coord-val" id="elVal">+0.000</div>
    <div class="coord-label">Depth Field</div>
    <div class="coord-val" id="depVal">2000</div>
</div>

<div class="hud hud-hint" id="hudHint">Scroll to adjust warp speed &middot; Move mouse to navigate</div>

<script>
(function () {
    'use strict';

    /* ============================================================
       配置参数
    ============================================================ */
    const STAR_COUNT   = 1600;   // 星星总数
    const Z_MAX        = 2000;   // z轴最远距离
    const FOV          = 500;    // 透视焦距
    const SPEED_MIN    = 0.3;    // 最小速度
    const SPEED_MAX    = 60;     // 最大速度
    const MOUSE_RANGE  = 800;    // 鼠标影响视野范围
    const TRAIL_THRESH = 5;      // 出现拖尾的速度阈值
    const MAX_TRAIL    = 22;     // 拖尾最大段数
    const WARP_THRESH  = 20;     // 跃迁模式速度阈值

    /* ============================================================
       Canvas 初始化
    ============================================================ */
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    /* ============================================================
       颜色方案 — 偏暖/冷混合的恒星光谱
    ============================================================ */
    const PALETTES = [
        { r: 170, g: 210, b: 255 },   // 蓝白 (O/B)
        { r: 220, g: 235, b: 255 },   // 白 (A)
        { r: 255, g: 248, b: 230 },   // 暖白 (F)
        { r: 255, g: 230, b: 180 },   // 黄 (G)
        { r: 255, g: 190, b: 130 },   // 橙 (K)
        { r: 255, g: 150, b: 100 },   // 红橙 (M)
        { r: 140, g: 210, b: 255 },   // 冰蓝
        { r: 0,   g: 255, b: 200 },   // 青绿（科幻感）
    ];

    /* ============================================================
       星星类
    ============================================================ */
    class Star {
        constructor(spread) {
            this.trail = [];
            this.init(spread);
        }

        /** 初始化/重置星星位置 */
        init(spread) {
            // 在圆柱体内均匀分布
            const angle = Math.random() * Math.PI * 2;
            const rad   = Math.sqrt(Math.random()) * 1100;
            this.x = Math.cos(angle) * rad;
            this.y = Math.sin(angle) * rad;
            this.z = spread
                ? Math.random() * Z_MAX
                : Z_MAX + Math.random() * 200;

            // 恒星类型权重：亮星少，暗星多
            const t = Math.random();
            this.brightness = t < 0.04 ? 0.85 + Math.random() * 0.15
                : t < 0.18 ? 0.5 + Math.random() * 0.35
                : 0.12 + Math.random() * 0.38;

            this.baseSize = this.brightness * 2.6 + Math.random() * 0.6;
            const p = PALETTES[Math.floor(Math.random() * PALETTES.length)];
            this.cr = p.r;
            this.cg = p.g;
            this.cb = p.b;

            // 微弱闪烁
            this.flickerSpd   = 1 + Math.random() * 4;
            this.flickerPhase = Math.random() * Math.PI * 2;

            this.trail.length = 0;
        }

        /** 每帧更新 */
        update(speed, dt) {
            const halfW = canvas.width  * 0.5;
            const halfH = canvas.height * 0.5;

            // 透视投影当前位置
            const pz = Math.max(1, this.z);
            const sx = (this.x / pz) * FOV + halfW;
            const sy = (this.y / pz) * FOV + halfH;

            // z轴运动
            this.z -= speed * dt * 60;

            // 飞出视野 → 重置
            if (this.z < 1) {
                this.init(false);
                return;
            }

            // 透视投影新位置
            const nz  = Math.max(1, this.z);
            const nx  = (this.x / nz) * FOV + halfW;
            const ny  = (this.y / nz) * FOV + halfH;

            // 拖尾记录
            this.trail.unshift({ x: nx, y: ny, z: nz });
            const cap = speed > TRAIL_THRESH
                ? Math.min(MAX_TRAIL, Math.floor(speed * 1.3) + 3)
                : 2;
            if (this.trail.length > cap) this.trail.length = cap;
        }

        /** 绘制 */
        draw(ctx, t, speed, cx, cy) {
            const z   = Math.max(1, this.z);
            const df  = (Z_MAX - z) / Z_MAX;                   // 0→1 深度因子
            const hW  = canvas.width  * 0.5;
            const hH  = canvas.height * 0.5;
            const sx  = (this.x / z) * FOV + hW;
            const sy  = (this.y / z) * FOV + hH;

            // 屏幕外裁剪
            if (sx < -80 || sx > canvas.width + 80 ||
                sy < -80 || sy > canvas.height + 80) return;

            // 闪烁
            const flick = 0.9 + 0.1 *
                Math.sin(t * this.flickerSpd + this.flickerPhase);
            const br = this.brightness * Math.min(1, df * 1.6) * flick;

            // 视角偏移（模拟飞船航向变化）
            const az = cx / MOUSE_RANGE;
            const el = cy / MOUSE_RANGE;
            const ox = -az * z * 0.12;
            const oy = -el * z * 0.12;

            const px = sx + ox;
            const py = sy + oy;
            const sz = Math.max(0.3, this.baseSize * Math.min(2.8, df * 3.2));

            // ---- 拖尾绘制 ----
            if (speed > TRAIL_THRESH && this.trail.length > 1) {
                // 预计算每个trail点的投影+偏移
                const pts = [];
                for (let i = 0; i < this.trail.length; i++) {
                    const p  = this.trail[i];
                    const pz = Math.max(1, p.z);
                    const tdf = (Z_MAX - pz) / Z_MAX;
                    pts.push({
                        x: (p.x - hW) / FOV * pz + hW - az * pz * 0.12,
                        y: (p.y - hH) / FOV * pz + hH - el * pz * 0.12,
                        df: tdf
                    });
                }

                ctx.save();
                ctx.lineCap = 'round';

                for (let i = 0; i < pts.length - 1; i++) {
                    const t0 = i / pts.length;
                    const t1 = (i + 1) / pts.length;
                    const a0 = (1 - t0) * br * 0.5;
                    const a1 = (1 - t1) * br * 0.5;
                    const w0 = Math.max(0.3, sz * (1 - t0 * 0.75));
                    const w1 = Math.max(0.3, sz * (1 - t1 * 0.75));

                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[i + 1].x, pts[i + 1].y);

                    const grad = ctx.createLinearGradient(
                        pts[i].x, pts[i].y,
                        pts[i + 1].x, pts[i + 1].y
                    );
                    grad.addColorStop(0, 'rgba(' + this.cr + ',' + this.cg + ',' + this.cb + ',' + a0.toFixed(4) + ')');
                    grad.addColorStop(1, 'rgba(' + this.cr + ',' + this.cg + ',' + this.cb + ',' + a1.toFixed(4) + ')');

                    ctx.strokeStyle = grad;
                    ctx.lineWidth   = (w0 + w1) * 0.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ---- 星体绘制 ----
            ctx.save();

            // 外层光晕
            if (sz > 1 && br > 0.2) {
                const gs = sz * 4;
                const gg = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, gs));
                gg.addColorStop(0, 'rgba(' + this.cr + ',' + this.cg + ',' + this.cb + ',' + (br * 0.3).toFixed(4) + ')');
                gg.addColorStop(1, 'rgba(' + this.cr + ',' + this.cg + ',' + this.cb + ',0)');
                ctx.fillStyle = gg;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(1, gs), 0, Math.PI * 2);
                ctx.fill();
            }

            // 核心
            ctx.beginPath();
            ctx.arc(px, py, Math.max(0.3, sz), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + this.cr + ',' + this.cg + ',' + this.cb + ',' + br.toFixed(4) + ')';
            ctx.fill();

            // 高速时中心过曝
            if (br > 0.55 && sz > 1.5) {
                ctx.beginPath();
                ctx.arc(px, py, Math.max(0.3, sz * 0.35), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + (br * 0.55).toFixed(4) + ')';
                ctx.fill();
            }

            ctx.restore();
        }
    }

    /* ============================================================
       初始化星星
    ============================================================ */
    const stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(new Star(true));
    }

    /* ============================================================
       星云背景粒子（微弱大光斑增加空间感）
    ============================================================ */
    const NEBULA_COUNT = 8;
    const nebulae = [];
    for (let i = 0; i < NEBULA_COUNT; i++) {
        nebulae.push({
            x: Math.random() * 1.2 - 0.1,
            y: Math.random() * 1.2 - 0.1,
            r: 150 + Math.random() * 250,
            cr: Math.random() < 0.5 ? 0 : 20,
            cg: Math.random() < 0.5 ? 180 + Math.floor(Math.random() * 75) : 100,
            cb: 200 + Math.floor(Math.random() * 55),
            a: 0.012 + Math.random() * 0.018,
            dx: (Math.random() - 0.5) * 0.00003,
            dy: (Math.random() - 0.5) * 0.00003,
        });
    }

    /* ============================================================
       交互状态
    ============================================================ */
    let mouseX = 0, mouseY = 0;       // 平滑后的鼠标
    let rawMX  = 0, rawMY  = 0;       // 原始鼠标
    let speed  = 2;                    // 当前穿梭速度
    let targetSpeed = 2;              // 目标速度
    let lastTS = performance.now();

    // 鼠标移动
    document.addEventListener('mousemove', function (e) {
        rawMX = e.clientX;
        rawMY = e.clientY;
    });

    // 触摸移动
    document.addEventListener('touchmove', function (e) {
        e.preventDefault();
        rawMX = e.touches[0].clientX;
        rawMY = e.touches[0].clientY;
    }, { passive: false });

    // 滚轮控制速度
    document.addEventListener('wheel', function (e) {
        e.preventDefault();
        targetSpeed += e.deltaY * 0.025;
        targetSpeed = Math.max(SPEED_MIN, Math.min(SPEED_MAX, targetSpeed));
    }, { passive: false });

    // 键盘控制速度
    document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            targetSpeed = Math.min(SPEED_MAX, targetSpeed * 1.2 + 0.5);
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            targetSpeed = Math.max(SPEED_MIN, targetSpeed * 0.8 - 0.3);
        } else if (e.key === ' ') {
            e.preventDefault();
            targetSpeed = targetSpeed > 25 ? 2 : 50;
        }
    });

    /* ============================================================
       HUD DOM 引用
    ============================================================ */
    const elSpeedNum  = document.getElementById('speedNum');
    const elSpeedFill = document.getElementById('speedFill');
    const elAz        = document.getElementById('azVal');
    const elEl        = document.getElementById('elVal');
    const elDep       = document.getElementById('depVal');
    const elCursorR   = document.getElementById('cursorRing');
    const elCursorD   = document.getElementById('cursorDot');
    const elChRing    = document.getElementById('chRing');
    const elHint      = document.getElementById('hudHint');

    // 3秒后隐藏提示
    setTimeout(function () { elHint.style.opacity = '0'; }, 5000);

    /* ============================================================
       主动画循环
    ============================================================ */
    function animate(now) {
        requestAnimationFrame(animate);

        const dt = Math.min(0.06, (now - lastTS) / 1000);
        lastTS = now;
        const t = now / 1000;

        // 平滑插值
        speed += (targetSpeed - speed) * Math.min(1, dt * 5);
        mouseX += (rawMX - mouseX) * Math.min(1, dt * 6);
        mouseY += (rawMY - mouseY) * Math.min(1, dt * 6);

        const cx = mouseX - canvas.width  * 0.5;
        const cy = mouseY - canvas.height * 0.5;

        // ---- 清屏（速度越快拖影越长） ----
        const fadeAlpha = speed > 12
            ? Math.max(0.08, 1 - speed / 75)
            : 1;
        ctx.fillStyle = 'rgba(2,4,10,' + fadeAlpha.toFixed(3) + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ---- 星云背景 ----
        for (let i = 0; i < nebulae.length; i++) {
            const n = nebulae[i];
            n.x += n.dx;
            n.y += n.dy;
            if (n.x < -0.3 || n.x > 1.3) n.dx *= -1;
            if (n.y < -0.3 || n.y > 1.3) n.dy *= -1;
            const nx = n.x * canvas.width;
            const ny = n.y * canvas.height;
            const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, Math.max(1, n.r));
            ng.addColorStop(0, 'rgba(' + n.cr + ',' + n.cg + ',' + n.cb + ',' + n.a.toFixed(4) + ')');
            ng.addColorStop(1, 'rgba(' + n.cr + ',' + n.cg + ',' + n.cb + ',0)');
            ctx.fillStyle = ng;
            ctx.beginPath();
            ctx.arc(nx, ny, Math.max(1, n.r), 0, Math.PI * 2);
            ctx.fill();
        }

        // ---- 速度线（超高速时额外径向光线） ----
        if (speed > WARP_THRESH) {
            const lineCount = Math.min(60, Math.floor((speed - WARP_THRESH) * 2));
            const hW = canvas.width * 0.5;
            const hH = canvas.height * 0.5;
            const az = cx / MOUSE_RANGE;
            const el = cy / MOUSE_RANGE;
            const vcx = hW + az * 300;  // 消失点偏移
            const vcy = hH + el * 300;

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < lineCount; i++) {
                const ang = Math.random() * Math.PI * 2;
                const startR = 30 + Math.random() * 80;
                const endR   = startR + 200 + Math.random() * 400;
                const x0 = vcx + Math.cos(ang) * startR;
                const y0 = vcy + Math.sin(ang) * startR;
                const x1 = vcx + Math.cos(ang) * endR;
                const y1 = vcy + Math.sin(ang) * endR;
                const la  = 0.02 + Math.random() * 0.04;

                const lg = ctx.createLinearGradient(x0, y0, x1, y1);
                lg.addColorStop(0, 'rgba(180,230,255,0)');
                lg.addColorStop(0.3, 'rgba(180,230,255,' + la.toFixed(4) + ')');
                lg.addColorStop(1, 'rgba(180,230,255,0)');

                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.strokeStyle = lg;
                ctx.lineWidth = 0.5 + Math.random() * 1;
                ctx.stroke();
            }
            ctx.restore();
        }

        // ---- 更新并绘制星星 ----
        for (let i = 0; i < stars.length; i++) {
            stars[i].update(speed, dt);
        }
        // 按z排序（远→近），保证近处星覆盖远处
        stars.sort(function (a, b) { return b.z - a.z; });
        for (let i = 0; i < stars.length; i++) {
            stars[i].draw(ctx, t, speed, cx, cy);
        }

        // ---- 暗角（vignette） ----
        const vigR = Math.max(canvas.width, canvas.height) * 0.75;
        const vig = ctx.createRadialGradient(
            canvas.width * 0.5, canvas.height * 0.5, vigR * 0.3,
            canvas.width * 0.5, canvas.height * 0.5, vigR
        );
        vig.addColorStop(0, 'rgba(2,4,10,0)');
        vig.addColorStop(1, 'rgba(2,4,10,0.65)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ---- 高速时中心辉光 ----
        if (speed > WARP_THRESH) {
            const ga = Math.min(0.12, (speed - WARP_THRESH) / 250);
            const cxp = canvas.width  * 0.5 + (cx / MOUSE_RANGE) * 200;
            const cyp = canvas.height * 0.5 + (cy / MOUSE_RANGE) * 200;
            const cgg = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 350);
            cgg.addColorStop(0, 'rgba(0,255,200,' + ga.toFixed(4) + ')');
            cgg.addColorStop(0.4, 'rgba(0,120,200,' + (ga * 0.3).toFixed(4) + ')');
            cgg.addColorStop(1, 'rgba(0,60,120,0)');
            ctx.fillStyle = cgg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // ---- 更新 HUD ----
        const isWarping = speed > WARP_THRESH;
        elSpeedNum.textContent = speed.toFixed(1);
        elSpeedNum.className = 'speed-num' + (isWarping ? ' warping' : '');
        elSpeedFill.style.width = ((speed / SPEED_MAX) * 100).toFixed(1) + '%';
        elCursorR.className = 'cursor-ring' + (isWarping ? ' warping' : '');
        elChRing.className  = 'ch-ring' + (isWarping ? ' warping' : '');

        const azDeg = (cx / MOUSE_RANGE * 35).toFixed(3);
        const elDeg = (-cy / MOUSE_RANGE * 35).toFixed(3);
        const sign  = function (v) { return v >= 0 ? '+' + v : v; };
        elAz.textContent  = sign(azDeg);
        elEl.textContent  = sign(elDeg);
        elDep.textContent = Math.round(Z_MAX);

        // 自定义光标
        elCursorR.style.left = mouseX + 'px';
        elCursorR.style.top  = mouseY + 'px';
        elCursorD.style.left = rawMX + 'px';
        elCursorD.style.top  = rawMY + 'px';
    }

    requestAnimationFrame(animate);
})();
</script>
