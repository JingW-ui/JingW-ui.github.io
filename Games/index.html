<head>
    <meta charset="UTF-8">

          onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient-1: #e7f1f0;
            --bg-gradient-2: #dfe9ec;
            --bg-gradient-3: #e6edf2;
            --card-bg: rgba(255, 255, 255, 0.50);
            --card-border: rgba(255, 255, 255, 0.55);
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-muted: #8e9aaf;
            --accent-teal: #2dd4bf;
            --accent-blue: #3b82f6;
            --shadow-md: 0 6px 24px rgba(20, 40, 50, 0.08);
            --shadow-lg: 0 16px 48px rgba(20, 40, 50, 0.16);
            --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        /* 背景光斑装饰 */
        .bg-decoration { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.45; pointer-events: none; z-index: 0; }
        .bg-decoration-1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(94,234,212,0.30) 0%, transparent 70%); top: -180px; left: -120px; animation: float 22s ease-in-out infinite; }
        .bg-decoration-2 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(125,211,252,0.28) 0%, transparent 70%); bottom: -140px; right: -120px; animation: float 26s ease-in-out infinite reverse; }
        .bg-decoration-3 { width: 380px; height: 380px; background: radial-gradient(circle, rgba(45,212,191,0.18) 0%, transparent 70%); top: 48%; left: 52%; transform: translate(-50%, -50%); animation: pulse 16s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(30px, -30px) rotate(120deg); } 66% { transform: translate(-20px, 20px) rotate(240deg); } }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.45; } }

        .page-title {
            font-size: 3em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }

        /* 仓库 Star / Fork(页面右上角) */
        .repo-actions {
            position: absolute;
            top: 22px;
            right: 22px;
            z-index: 15;
            display: flex;
            gap: 8px;
        }
        .repo-btn {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: var(--shadow-md);
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .repo-btn:hover { background: rgba(45, 212, 191, 0.12); border-color: rgba(45, 212, 191, 0.45); color: var(--text-primary); transform: scale(1.06); }
        .repo-btn svg { width: 17px; height: 17px; fill: currentColor; }

        /* 卡片源码角标 */
        .src-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(20, 40, 50, 0.38);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #fff;
            opacity: 0.55;
            transition: opacity 0.25s ease, transform 0.25s ease, background 0.25s ease;
        }
        .src-badge:hover { opacity: 1; background: rgba(20, 40, 50, 0.6); transform: scale(1.08); }
        .src-badge svg { width: 14px; height: 14px; fill: currentColor; }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.05em;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
        }

        /* 工具栏:搜索 + 分类 + 随机(单行) */
        .toolbar {
            position: sticky;
            top: 12px;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 210px;
            min-width: 170px;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(44, 62, 80, 0.10);
            border-radius: 11px;
            padding: 7px 12px;
            transition: var(--transition);
        }
        .search-box:focus-within { border-color: rgba(45, 212, 191, 0.5); box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.10); }
        .search-box svg { width: 14px; height: 14px; fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
        .search-box input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text-primary); }
        .search-box input::placeholder { color: var(--text-muted); }
        .random-btn {
            background: transparent;
            border: 1px solid rgba(44, 62, 80, 0.12);
            color: var(--text-secondary);
            border-radius: 11px;
            padding: 7px 15px;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            margin-left: auto;
        }
        .random-btn:hover { background: rgba(45, 212, 191, 0.10); border-color: rgba(45, 212, 191, 0.45); color: var(--text-primary); }
        .random-btn:active { transform: scale(0.96); }
        .cat-tabs { display: flex; flex-wrap: wrap; gap: 7px; }
        .cat-tab {
            background: transparent;
            border: 1px solid rgba(44, 62, 80, 0.12);
            color: var(--text-secondary);
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }
        .cat-tab:hover { background: rgba(45, 212, 191, 0.10); border-color: rgba(45, 212, 191, 0.45); color: var(--text-primary); }
        .cat-tab.active { background: rgba(45, 212, 191, 0.12); border-color: rgba(45, 212, 191, 0.5); color: var(--text-primary); font-weight: 600; }
        .cat-tab .cnt { font-size: 10.5px; color: var(--text-muted); margin-left: 5px; font-family: 'Courier New', monospace; }
        .cat-tab.active .cnt { color: var(--text-secondary); }

        .games-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 卡片（玻璃拟态，尺寸保持不变） */
        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease, backdrop-filter 0.35s ease;
            cursor: pointer;
            position: relative;
        }

        .game-card:hover {
            transform: perspective(800px) rotateX(2deg) rotateY(-2deg) translateY(-6px) scale(1.015);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
        }

        /* 图片微放大 */
        .game-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .game-card:hover .game-image {
            transform: scale(1.08);
        }

        /* 标题悬浮层（不改变卡片尺寸） */
        .game-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 14px 14px 12px;
            background: linear-gradient(to top, rgba(20, 30, 40, 0.78) 0%, rgba(20, 30, 40, 0.35) 60%, transparent 100%);
            color: #fff;
            font-size: 0.92em;
            font-weight: 600;
            letter-spacing: 0.5px;
            transform: translateY(20%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        .game-card:hover .game-overlay {
            transform: translateY(0);
            opacity: 1;
        }

        .empty-tip {
            display: none;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 60px 0;
            position: relative;
            z-index: 1;
        }
        .empty-tip.show { display: block; }

        @media (max-width: 1200px) {
            .games-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 16px;
            }

            .page-title {
                font-size: 2em;
                margin-bottom: 15px;
            }

            .page-subtitle {
                font-size: 0.95em;
                margin-bottom: 20px;
                letter-spacing: 1px;
            }

            .toolbar { position: static; padding: 10px 12px; }

            .games-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .game-card {
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .page-title {
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            .page-subtitle {
                font-size: 0.85em;
                margin-bottom: 16px;
                letter-spacing: 1px;
            }

            .games-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .game-card {
                border-radius: 10px;
            }

            .game-image {
                aspect-ratio: 5 / 3;
            }

            .src-badge { width: 22px; height: 22px; top: 5px; right: 5px; border-radius: 7px; }
            .src-badge svg { width: 12px; height: 12px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(20,40,50,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(20,40,50,0.22); }
    </style>
</head>

    <div class="game-card" data-href="/Games/puke/" data-cat="puzzle" data-name="扑克牌游戏">
        <img src="assets/img/puke.webp" alt="扑克牌游戏" class="game-image">
        <div class="game-overlay">扑克牌游戏</div>
    </div>
    <div class="game-card" data-href="/Games/earth_3D/" data-cat="scene" data-name="3D 地球模型">
        <img src="assets/img/earth.webp" alt="3D地球模型" class="game-image">
        <div class="game-overlay">3D 地球模型</div>
    </div>
    <div class="game-card" data-href="/Games/muyu/" data-cat="toy" data-name="赛博木鱼">
        <img src="assets/img/muyu.webp" alt="赛博木鱼" class="game-image">
        <div class="game-overlay">赛博木鱼</div>
    </div>
    <div class="game-card" data-href="/Games/racing/" data-cat="action" data-name="3D 极速赛车">
        <img src="assets/img/racing.webp" alt="3D极速赛车" class="game-image">
        <div class="game-overlay">3D 极速赛车</div>
    </div>
    <div class="game-card" data-href="/Games/snake" data-cat="action" data-name="霓虹贪吃蛇">
        <img src="assets/img/snake.webp" alt="霓虹贪吃蛇" class="game-image">
        <div class="game-overlay">霓虹贪吃蛇</div>
    </div>
    <div class="game-card" data-href="/Games/dice_3D/" data-cat="toy" data-name="3D 炫光骰子">
        <img src="assets/img/dice_3D.webp" alt="3D炫光骰子" class="game-image">
        <div class="game-overlay">3D 炫光骰子</div>
    </div>
    <div class="game-card" data-href="/Games/ball" data-cat="toy" data-name="无限轨道弹跳球">
        <img src="assets/img/ball.webp" alt="Three.js 无限轨道弹跳球" class="game-image">
        <div class="game-overlay">无限轨道弹跳球</div>
    </div>
    <div class="game-card" data-href="/Games/2024/" data-cat="puzzle" data-name="像素物语：4048小町">
        <img src="assets/img/2024.webp" alt="像素物语：4048小町" class="game-image">
        <div class="game-overlay">像素物语：4048小町</div>
    </div>
    <div class="empty-tip" id="empty-tip">没有匹配的游戏，换个关键词试试</div>
</div>

<script>
    const container = document.getElementById('games-container');
    const cards = Array.from(container.querySelectorAll('.game-card'));
    const tabs = document.querySelectorAll('.cat-tab');
    const searchInput = document.getElementById('search');
    const emptyTip = document.getElementById('empty-tip');
    const REPO_TREE = 'https://github.com/JingW-ui/JingW-ui.github.io/tree/main/Games/';
    const GH_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.55-1.04-2.22-.82-2.22-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>';
    let activeCat = 'all';
    let query = '';

    // 每张卡片右上角注入源码角标(从 data-href 派生仓库目录)
    cards.forEach(card => {
        const slug = (card.dataset.href || '').replace(/^\/?Games\//, '').replace(/\/+$/, '');
        if (!slug) return;
        const a = document.createElement('a');
        a.className = 'src-badge';
        a.href = REPO_TREE + slug;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = '查看源码';
        a.setAttribute('aria-label', '查看 ' + slug + ' 源码');
        a.innerHTML = GH_ICON;
        a.addEventListener('click', e => e.stopPropagation());
        card.appendChild(a);
    });

    // 入场动画（首次 + 每次过滤后重新交错浮现）
    function animateCards() {
        const visible = cards.filter(c => c.style.display !== 'none');
        visible.forEach((card, i) => {
            card.style.transition = 'none';
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'opacity 0.4s ease, transform 0.3s ease, box-shadow 0.35s ease, backdrop-filter 0.35s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, Math.min(i, 16) * 45);
        });
    }

    function applyFilter() {
        let shown = 0;
        cards.forEach(card => {
            const catOk = activeCat === 'all' || card.dataset.cat === activeCat;
            const nameOk = !query || (card.dataset.name || '').toLowerCase().includes(query);
            const show = catOk && nameOk;
            card.style.display = show ? '' : 'none';
            if (show) shown++;
        });
        emptyTip.classList.toggle('show', shown === 0);
        animateCards();
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeCat = tab.dataset.cat;
            applyFilter();
        });
    });

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            query = searchInput.value.trim().toLowerCase();
            applyFilter();
        }, 150);
    });

    // 随机一下：从全部游戏里随机跳转
    document.getElementById('random-btn').addEventListener('click', () => {
        const pick = cards[Math.floor(Math.random() * cards.length)];
        window.location.href = pick.dataset.href;
    });

    // 点击跳转
    cards.forEach(card => {
        card.addEventListener('click', () => {
            if (card.dataset.loading) return;
            card.dataset.loading = 'true';
            window.location.href = card.dataset.href;
        });
    });

    // 首屏入场
    animateCards();
</script>
</body>
</html>
