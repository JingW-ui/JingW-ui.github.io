<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 炫光骰子</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }
        #canvas-container canvas {
            display: block;
            touch-action: none;
        }
        /* UI 层 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 20px;
            padding: 5vh max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-right));
            z-index: 10;
        }
        .title {
            color: rgba(255,255,255,0.9);
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(100,200,255,0.5), 0 0 40px rgba(100,200,255,0.2);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 30px rgba(100,200,255,0.8), 0 0 60px rgba(100,200,255,0.4); }
        }
        .controls {
            pointer-events: auto;
            text-align: center;
        }
        #settings-panel {
            position: absolute;
            top: 20px;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            right: calc(20px + env(safe-area-inset-right));
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            border-radius: 999px;
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        #settings-panel label {
            user-select: none;
            white-space: nowrap;
        }
        #diceCountInput {
            appearance: none;
            -moz-appearance: textfield;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 8px 10px;
            width: 55px;
            border-radius: 999px;
            text-align: center;
            font-size: 16px;
            transition: border-color 0.3s, background 0.3s;
        }
        #diceCountInput::-webkit-outer-spin-button,
        #diceCountInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #diceCountInput:hover,
        #diceCountInput:focus {
            border-color: rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.12);
            outline: none;
        }
        .roll-btn {
            background: rgba(255,255,255,0.03);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 18px 60px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .roll-btn:hover:not(:disabled) {
            border-color: #fff;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 40px rgba(100,200,255,0.3), inset 0 0 20px rgba(100,200,255,0.05);
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .roll-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .roll-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.1);
        }
        .roll-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s;
        }
        .roll-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
            margin-top: 12px;
            letter-spacing: 0.1em;
        }
        /* 屏幕震动效果 */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            #ui-layer {
                padding-top: 4vh;
                padding-bottom: 4vh;
            }
            #settings-panel {
                top: calc(12px + env(safe-area-inset-top));
                right: calc(12px + env(safe-area-inset-right));
                padding: 6px 10px;
                gap: 6px;
                font-size: 0.8rem;
            }
            #settings-panel label {
                font-size: 0.8rem;
            }
            #diceCountInput {
                width: 48px;
                padding: 6px 8px;
                font-size: 16px;
            }
            .roll-btn {
                padding: 16px 48px;
                font-size: 1.1rem;
                letter-spacing: 0.3em;
            }
            .hint {
                font-size: 0.78rem;
                margin-top: 8px;
                line-height: 1.5;
            }
            .title {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
                letter-spacing: 0.2em;
            }
        }

        @media (max-width: 480px) {
            #settings-panel {
                top: calc(10px + env(safe-area-inset-top));
                right: calc(10px + env(safe-area-inset-right));
                padding: 5px 9px;
                gap: 5px;
                font-size: 0.75rem;
            }
            #settings-panel label {
                font-size: 0.72rem;
            }
            #diceCountInput {
                width: 42px;
                padding: 5px 6px;
                font-size: 16px;
            }
            .roll-btn {
                padding: 15px 38px;
                font-size: 1rem;
                letter-spacing: 0.25em;
            }
            .hint {
                font-size: 0.72rem;
                padding: 0 8px;
            }
            .title {
                letter-spacing: 0.15em;
            }
        }

        /* 横屏手机：压低上下间距，避免按钮被地址栏遮挡 */
        @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
            #ui-layer {
                padding-top: 2vh;
                padding-bottom: 2vh;
                justify-content: flex-end;
            }
            .title {
                position: absolute;
                top: calc(6px + env(safe-area-inset-top));
                left: 50%;
                transform: translateX(-50%);
                font-size: 1.2rem;
                letter-spacing: 0.15em;
            }
            .roll-btn {
                padding: 12px 40px;
                font-size: 1rem;
            }
            .hint {
                font-size: 0.7rem;
                margin-top: 6px;
            }
        }
    </style>
    <!-- 引入 GSAP 动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="title">3D DICE</div>
        <div id="settings-panel">
            <label for="diceCountInput">骰子数量</label>
            <input id="diceCountInput" type="number" min="1" max="20" value="1" step="1" />
        </div>
        <div class="controls">
            <button class="roll-btn" id="rollBtn">ROLL</button>
            <div class="hint">选择骰子数量后点击按钮、按空格或摇动手机摇骰子</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const gsap = window.gsap;

        // ==================== 场景初始化 ====================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030303);
        scene.fog = new THREE.FogExp2(0x030303, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

        // 根据屏幕方向自适应相机距离，竖屏下后退以容纳多骰子环形布局
        function applyResponsiveCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            let y = 5.5, z = 13.5;
            if (aspect < 0.6) {          // 窄竖屏（多数手机竖屏）
                y = 7.5; z = 21;
            } else if (aspect < 0.85) {  // 宽竖屏 / 大屏手机
                y = 6.5; z = 17;
            } else if (aspect < 1.1) {   // 接近正方形 / 横屏手机
                y = 6.0; z = 15;
            } else {
                y = 5.5; z = 13.5;       // 桌面横屏
            }
            camera.position.set(0, y, z);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // 环境贴图（让金属/玻璃质感更真实）
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        applyResponsiveCamera();

        // ==================== 灯光系统（降低光照强度） ====================
        const ambientLight = new THREE.AmbientLight(0x222222, 0.18);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.1;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.bias = -0.0005;
        mainLight.shadow.radius = 4;
        scene.add(mainLight);

        // 赛博朋克风格彩色点光源（降低强度，避免高光过曝）
        const colors = [0xff6f9b, 0x6fdcff, 0xb56dff];
        const lightPositions = [[4, 3, 4], [-4, 2, -4], [0, 4, -3]];
        const pointLights = [];
        lightPositions.forEach((pos, i) => {
            const pl = new THREE.PointLight(colors[i], 0.7, 18);
            pl.position.set(...pos);
            scene.add(pl);
            pointLights.push(pl);
        });

        // ==================== 地面 ====================
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({
            color: 0x080808,
            roughness: 0.15,
            metalness: 0.6
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.2;
        plane.receiveShadow = true;
        scene.add(plane);

        const grid = new THREE.GridHelper(100, 100, 0x333333, 0x111111);
        grid.position.y = -1.19;
        scene.add(grid);

        // ==================== 骰子纹理生成 ====================
        function createDiceMaterials() {
            const materials = [];
            // Three.js BoxGeometry 面顺序: 0:+x(右), 1:-x(左), 2:+y(上), 3:-y(下), 4:+z(前), 5:-z(后)
            // 标准骰子对面之和为7: 1对6, 2对5, 3对4
            // 设定: +z=1(前), -z=6(后), +y=2(上), -y=5(下), +x=3(右), -x=4(左)
            const faceNumbers = [3, 4, 2, 5, 1, 6];  // 对应索引 0,1,2,3,4,5
            
            console.log('面材质映射:', faceNumbers.map((num, idx) => `索引${idx}=${num}`).join(', '));
            const dotMap = {
                1: [[128, 128]],
                2: [[64, 64], [192, 192]],
                3: [[64, 64], [128, 128], [192, 192]],
                4: [[64, 64], [192, 64], [64, 192], [192, 192]],
                5: [[64, 64], [192, 64], [128, 128], [64, 192], [192, 192]],
                6: [[64, 64], [192, 64], [64, 128], [192, 128], [64, 192], [192, 192]]
            };

            faceNumbers.forEach(num => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // 底色 - 珍珠白渐变
                const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 350);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.7, '#f0f0ea');
                grad.addColorStop(1, '#d8d8d0');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                // 边框
                ctx.strokeStyle = 'rgba(180,180,170,0.5)';
                ctx.lineWidth = 16;
                ctx.strokeRect(8, 8, 496, 496);

                // 点数阴影
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = '#151515';

                const dots = dotMap[num];
                dots.forEach(([x, y]) => {
                    const cx = x * 2;
                    const cy = y * 2;
                    const r = 34;

                    // 主圆
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();

                    // 内部高光（让点数有凹陷感）
                    ctx.shadowColor = 'transparent';
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.arc(cx - 10, cy - 10, 12, 0, Math.PI * 2);
                    ctx.fill();

                    // 恢复下一点的样式
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.fillStyle = '#151515';
                });

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                materials.push(new THREE.MeshPhysicalMaterial({
                    map: tex,
                    color: 0xffffff,
                    metalness: 0.05,
                    roughness: 0.25,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.1,
                    envMapIntensity: 1.2,
                    ior: 1.45
                }));
            });

            return materials;
        }

        // ==================== 创建圆角骰子 ====================
        // 使用 RoundedBoxGeometry: width, height, depth, segments, radius
        const diceGeo = new RoundedBoxGeometry(2.2, 2.2, 2.2, 8, 0.25);
        const diceMats = createDiceMaterials();
        const diceGroup = new THREE.Group();
        scene.add(diceGroup);
        let diceList = [];

        // 骰子外轮廓发光（稍大一点的透明立方体）
        const glowGeo = new RoundedBoxGeometry(2.25, 2.25, 2.25, 8, 0.25);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.03,
            side: THREE.BackSide
        });

        function createSingleDice() {
            const dice = new THREE.Mesh(diceGeo, diceMats);
            dice.castShadow = true;
            dice.receiveShadow = true;
            dice.position.y = 1.1; // 骰子边长2.2的一半，确保底部刚好接触地面
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            dice.add(glowMesh);
            return dice;
        }

        function createDiceSet(count) {
            while (diceGroup.children.length) {
                diceGroup.remove(diceGroup.children[0]);
            }
            diceList = [];

            if (count === 1) {
                const dice = createSingleDice();
                dice.position.set(0, 1.1, 0); // 提高到地面上方
                dice.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                diceGroup.add(dice);
                diceList.push(dice);
                return;
            }

            const ringConfigs = [];
            let remaining = count;
            let ringIndex = 0;
            while (remaining > 0) {
                const maxInRing = 6 + ringIndex * 6;
                const ringCount = Math.min(remaining, maxInRing);
                const radius = 2.8 + ringIndex * 3.0;
                ringConfigs.push({ count: ringCount, radius, startAngle: Math.random() * Math.PI * 2 });
                remaining -= ringCount;
                ringIndex += 1;
            }

            ringConfigs.forEach(({ count: ringCount, radius, startAngle }, ringIndex) => {
                const ringNoise = (Math.random() - 0.5) * 0.8;
                const angleGap = Math.PI * 2 / ringCount;
                for (let j = 0; j < ringCount; j++) {
                    const dice = createSingleDice();
                    const baseAngle = startAngle + j * angleGap;
                    const angle = baseAngle + (Math.random() - 0.5) * 0.3;
                    const ringRadius = radius + ringNoise + (Math.random() - 0.5) * 0.6;
                    const x = Math.cos(angle) * ringRadius + (Math.random() - 0.5) * 0.4;
                    const z = Math.sin(angle) * ringRadius + (Math.random() - 0.5) * 0.4;
                    const y = 1.1 + Math.random() * 0.7; // 基础高度1.1 + 随机偏移
                    dice.position.set(x, y, z);
                    dice.rotation.set(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI
                    );

                    const spiralOffset = ringIndex * 0.3;
                    if (ringIndex > 0) {
                        const spiralAngle = baseAngle + Math.PI / 8;
                        dice.position.x += Math.cos(spiralAngle) * spiralOffset;
                        dice.position.z += Math.sin(spiralAngle) * spiralOffset;
                    }

                    diceGroup.add(dice);
                    diceList.push(dice);
                }
            });
        }

        createDiceSet(1);

        function computeLandingPositions(count) {
            const positions = [];
            const ringConfigs = [];
            let remaining = count;
            let ringIndex = 0;

            while (remaining > 0) {
                const maxInRing = 6 + ringIndex * 6;
                const ringCount = Math.min(remaining, maxInRing);
                const radius = 2.8 + ringIndex * 3.2;
                ringConfigs.push({ count: ringCount, radius, startAngle: Math.random() * Math.PI * 2 });
                remaining -= ringCount;
                ringIndex += 1;
            }

            ringConfigs.forEach(({ count: ringCount, radius, startAngle }, ringIndex) => {
                const angleGap = Math.PI * 2 / ringCount;
                const ringNoise = (Math.random() - 0.5) * 0.6;
                for (let j = 0; j < ringCount; j++) {
                    const baseAngle = startAngle + j * angleGap;
                    const angle = baseAngle + (Math.random() - 0.5) * 0.25;
                    const spread = radius + ringNoise + (Math.random() - 0.5) * 0.4;
                    const x = Math.cos(angle) * spread + (Math.random() - 0.5) * 0.25;
                    const z = Math.sin(angle) * spread + (Math.random() - 0.5) * 0.25;
                    const y = 0;
                    positions.push(new THREE.Vector3(x, y, z));
                }
            });

            const minDist = 2.6;
            for (let iter = 0; iter < 16; iter++) {
                let moved = false;
                for (let i = 0; i < positions.length; i++) {
                    for (let j = i + 1; j < positions.length; j++) {
                        const a = positions[i];
                        const b = positions[j];
                        const diff = new THREE.Vector3().subVectors(b, a);
                        const dist = diff.length();
                        if (dist < minDist && dist > 0.001) {
                            const overlap = (minDist - dist) * 0.52;
                            diff.normalize();
                            a.addScaledVector(diff, -overlap);
                            b.addScaledVector(diff, overlap);
                            a.y = 0;
                            b.y = 0;
                            moved = true;
                        }
                    }
                }
                if (!moved) break;
            }

            return positions;
        }

        // ==================== 粒子系统 ====================
        const particleCount = 800;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pSpeed = [];
        for (let i = 0; i < particleCount; i++) {
            pPos[i*3] = (Math.random() - 0.5) * 40;
            pPos[i*3+1] = (Math.random() - 0.5) * 30 + 5;
            pPos[i*3+2] = (Math.random() - 0.5) * 40;
            pSpeed.push((Math.random() * 0.01) + 0.002);
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffffff,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // ==================== 后期处理 Bloom（降低强度） ====================
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.15,   // strength (降低)
            0.5,    // radius
            0.9     // threshold (提高，减少泛光)
        );
        composer.addPass(bloomPass);

        // ==================== 摇骰子逻辑 ====================
        let isRolling = false;
        let hasRolled = false; // 标记是否已经摇过一次
        const rollBtn = document.getElementById('rollBtn');
        const diceCountInput = document.getElementById('diceCountInput');
        const uiLayer = document.getElementById('ui-layer');
        const hintEl = document.querySelector('.hint');

        // 触屏设备使用摇动提示，桌面端保留空格键提示
        const isTouchDevice = matchMedia('(hover: none), (pointer: coarse)').matches;
        if (isTouchDevice && hintEl) {
            hintEl.textContent = '选择骰子数量后点击按钮或摇动手机摇骰子';
        }

        // 各数字朝上（+y方向）的目标旋转
        // 初始状态: +z面(数字1)朝向相机，+y面(数字2)朝上
        // 要让某个面朝上（+y方向），需要将该面旋转到+y方向
        const faceRotations = {
            // 数字2在+y面(索引2)，已在上方，无需旋转
            2: { x: 0, y: 0, z: 0 },
            
            // 数字5在-y面(索引3)，需要绕X轴转180度让-y转到+y
            5: { x: Math.PI, y: 0, z: 0 },
            
            // 数字1在+z面(索引4)，需要绕X轴转-90度让+z转到+y
            1: { x: -Math.PI / 2, y: 0, z: 0 },
            
            // 数字6在-z面(索引5)，需要绕X轴转+90度让-z转到+y
            6: { x: Math.PI / 2, y: 0, z: 0 },
            
            // 数字3在+x面(索引0)，需要绕Z轴转-90度让+x转到+y
            3: { x: 0, y: 0, z: -Math.PI / 2 },
            
            // 数字4在-x面(索引1)，需要绕Z轴转+90度让-x转到+y
            4: { x: 0, y: 0, z: Math.PI / 2 }
        };

        // 音效合成（落地声）
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBounceSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // 加载ROLL按钮音效
        const rollSound = new Audio('audio/push-switcher.mp3');
        rollSound.preload = 'auto';
        rollSound.volume = 0.6;

        function playRollSound() {
            rollSound.currentTime = 0;
            rollSound.play().catch(e => console.log('音频播放失败:', e));
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            hasRolled = true; // 标记已摇动
            rollBtn.disabled = true;

            // 播放ROLL按钮音效
            playRollSound();

            const count = Math.min(20, Math.max(1, Number(diceCountInput.value) || 1));
            diceCountInput.value = count;
            if (diceList.length !== count) {
                createDiceSet(count);
            }
            const results = Array.from({ length: count }, () => Math.floor(Math.random() * 6) + 1);
            const targets = computeLandingPositions(count);
            const tl = gsap.timeline({
                onComplete: () => {
                    isRolling = false;
                    rollBtn.disabled = false;

                    console.log('\n=== 摇骰子调试信息 ===');
                    console.log('结果数组:', results);
                    console.log('落点位置:', targets);

                    // 落地效果
                    playBounceSound();
                    uiLayer.classList.add('shake');
                    setTimeout(() => uiLayer.classList.remove('shake'), 400);

                    // 灯光闪烁
                    pointLights.forEach((pl, i) => {
                        gsap.fromTo(pl, { intensity: 3 }, { intensity: 1.5, duration: 0.5, delay: i * 0.1 });
                    });
                }
            });

            results.forEach((result, index) => {
                const dice = diceList[index];
                const base = faceRotations[result];
                const target = targets[index];

                const curX = dice.rotation.x % (Math.PI * 2);
                const curY = dice.rotation.y % (Math.PI * 2);
                const curZ = dice.rotation.z % (Math.PI * 2);
                dice.rotation.set(curX, curY, curZ);

                const finalRotX = base.x + Math.PI * 2 * Math.floor(Math.random() * 2);
                const finalRotY = Math.PI / 2 * Math.floor(Math.random() * 4);
                const finalRotZ = base.z + Math.PI * 2 * Math.floor(Math.random() * 2);
                const delay = index * 0.05;
                const apex = 4.6 + Math.random() * 0.5;
                const driftX = target.x + (Math.random() - 0.5) * 0.8;
                const driftZ = target.z + (Math.random() - 0.5) * 0.8;
                const spinX = Math.PI * 2 * (3 + Math.random() * 2);
                const spinY = Math.PI * 2 * (3 + Math.random() * 2);
                const spinZ = Math.PI * 2 * (2 + Math.random() * 2);

                tl.to(dice.position, {
                    x: driftX,
                    z: driftZ,
                    y: apex,
                    duration: 0.35,
                    ease: 'power2.out'
                }, delay);

                tl.to(dice.position, {
                    x: target.x,
                    z: target.z,
                    y: 1.2,
                    duration: 0.45,
                    ease: 'power1.inOut'
                }, delay + 0.35);

                tl.to(dice.position, {
                    y: 0,
                    duration: 0.55,
                    ease: 'bounce.out'
                }, delay + 0.75);

                tl.to(dice.rotation, {
                    x: dice.rotation.x + spinX,
                    y: dice.rotation.y + spinY,
                    z: dice.rotation.z + spinZ,
                    duration: 0.8,
                    ease: 'linear'
                }, delay);

                tl.to(dice.rotation, {
                    x: finalRotX,
                    y: finalRotY,
                    z: finalRotZ,
                    duration: 0.55,
                    ease: 'power2.out'
                }, delay + 0.7);
            });

            tl.to(pointLights[0], { intensity: 2.5, duration: 0.3 }, 0);
            tl.to(pointLights[1], { intensity: 2.5, duration: 0.3 }, 0.1);
        }

        rollBtn.addEventListener('click', rollDice);
        diceCountInput.addEventListener('change', () => {
            const count = Math.min(20, Math.max(1, Number(diceCountInput.value) || 1));
            diceCountInput.value = count;
            createDiceSet(count);
            hasRolled = false;
        });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') rollDice();
        });

        let lastShakeTime = 0;
        let lastMotionMagnitude = 0;
        const SHAKE_THRESHOLD = 16;

        function handleDeviceMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc) return;

            const x = acc.x || 0;
            const y = acc.y || 0;
            const z = acc.z || 0;
            const magnitude = Math.sqrt(x * x + y * y + z * z);
            const delta = Math.abs(magnitude - lastMotionMagnitude);
            lastMotionMagnitude = magnitude;

            const now = Date.now();
            if (delta > SHAKE_THRESHOLD && now - lastShakeTime > 800) {
                lastShakeTime = now;
                rollDice();
            }
        }

        function initShakeDetection() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('devicemotion', handleDeviceMotion);
                    }
                }).catch(() => {
                    window.addEventListener('devicemotion', handleDeviceMotion);
                });
            } else {
                window.addEventListener('devicemotion', handleDeviceMotion);
            }
        }

        document.addEventListener('touchstart', function initShake() {
            initShakeDetection();
            document.removeEventListener('touchstart', initShake);
        }, { passive: true });

        // ==================== 窗口自适应 ====================
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            applyResponsiveCamera();
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => setTimeout(handleResize, 250));

        // ==================== 渲染循环 ====================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // 粒子缓慢漂移
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i*3+1] += Math.sin(t * 0.5 + i) * 0.005;
                if (positions[i*3+1] > 20) positions[i*3+1] = -10;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y = t * 0.02;

            // 闲置时骰子轻微悬浮呼吸（仅在未摇过时）
            if (!hasRolled && !isRolling) {
                diceList.forEach(d => {
                    d.position.y = 1.1 + Math.sin(t * 1.5) * 0.08; // 基础高度1.1 + 悬浮动画
                    d.rotation.y += 0.003;
                });
            }
            // 摇完后（!isRolling && hasRolled）骰子完全静止

            // 彩色光源环绕运动
            pointLights[0].position.x = Math.sin(t * 0.7) * 5;
            pointLights[0].position.z = Math.cos(t * 0.7) * 5;
            pointLights[1].position.x = Math.sin(t * 0.5 + 2) * 5;
            pointLights[1].position.z = Math.cos(t * 0.5 + 2) * 5;

            controls.update();
            composer.render();
        }
        animate();
    </script>
</body>
