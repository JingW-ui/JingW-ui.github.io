            const hint = document.getElementById('energyHint');
            hint.classList.add('show');
            setTimeout(() => {
                hint.classList.remove('show');
            }, 2000);
        }

        // 显示夸奖提示
        function showPraiseHint(text) {
            const hint = document.createElement('div');
            hint.style.cssText = `
                position: fixed;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 28px;
                font-weight: 700;
                color: #4CAF50;
                opacity: 0;
                pointer-events: none;
                z-index: 100;
                text-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
            `;
            hint.textContent = text;
            document.body.appendChild(hint);

            requestAnimationFrame(() => {
                hint.style.transition = 'all 1s ease-out';
                hint.style.opacity = '1';
                hint.style.transform = 'translate(-50%, -70%) scale(1.1)';
                
                setTimeout(() => {
                    hint.style.opacity = '0';
                    hint.style.transform = 'translate(-50%, -90%) scale(1)';
                    setTimeout(() => hint.remove(), 300);
                }, 800);
            });
        }
        
        // 显示高价值奖励食物提示
        function showBonusFoodHint(foodType, points) {
            const hint = document.createElement('div');
            hint.style.cssText = `
                position: fixed;
                top: 35%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 36px;
                font-weight: 700;
                color: #FFD700;
                opacity: 0;
                pointer-events: none;
                z-index: 100;
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4);
            `;
            hint.innerHTML = `${foodType.emoji} <span style="font-size: 28px;">+${points}分！</span>`;
            document.body.appendChild(hint);

            requestAnimationFrame(() => {
                hint.style.transition = 'all 1.2s ease-out';
                hint.style.opacity = '1';
                hint.style.transform = 'translate(-50%, -65%) scale(1.2)';
                
                setTimeout(() => {
                    hint.style.opacity = '0';
                    hint.style.transform = 'translate(-50%, -85%) scale(1)';
                    setTimeout(() => hint.remove(), 300);
                }, 1000);
            });
        }

        // ==================== 游戏结束 ====================
        function gameOver() {
            // 如果是无限生命，播放死亡动画后自动复活
            if (lives === 999) {
                // 播放死亡特效
                createDeathEffect();
                
                // 显示死亡提示
                showDamageHint('💀 死亡！立即复活...');
                
                // 延迟后自动复活
                setTimeout(() => {
                    autoReviveInfinite();
                }, 800);
                return;
            }
            
            isGameOver = true;
            
            // 计算最终游玩时间（排除暂停时间）
            if (gameStartTime > 0) {
                const totalTime = Date.now() - gameStartTime;
                // 如果当前处于暂停状态，需要减去当前暂停的时长
                let actualPlayTime = totalTime;
                if (pauseStartTime > 0) {
                    actualPlayTime -= (Date.now() - pauseStartTime);
                }
                totalPlayTime = actualPlayTime;
            }
            
            // 隐藏气血值条
            document.getElementById('energyBarWrapper').style.display = 'none';
            
            // 死亡特效
            createDeathEffect();

            // 显示结算界面
            setTimeout(() => {
                showGameOverModal();
            }, 500);
        }

        function createDeathEffect() {
            // 蛇身破碎效果
            snake.forEach((segment, index) => {
                setTimeout(() => {
                    createExplosion(segment.x, segment.y, CONFIG.COLORS.SNAKE_BODY_START, 8);
                }, index * 30);
            });

            // 屏幕震动
            canvas.style.animation = 'shake 0.5s ease';
            setTimeout(() => {
                canvas.style.animation = '';
            }, 500);
        }

        function showGameOverModal() {
            const modal = document.getElementById('gameOverModal');
            const finalScoreEl = document.getElementById('finalScore');
            const messageEl = document.getElementById('modalMessage');
            const nicknameInput = document.getElementById('nicknameInput');

            finalScoreEl.textContent = score;

            // 检查是否进入排行榜
            const leaderboard = getLeaderboard();
            const isNewRecord = leaderboard.length < 10 || score > leaderboard[leaderboard.length - 1].score;

            if (isNewRecord && score > 0) {
                messageEl.textContent = '🎉 恭喜！你进入了排行榜！';
                nicknameInput.style.display = 'block';
                nicknameInput.value = '';
                nicknameInput.focus();
            } else {
                messageEl.textContent = '再接再厉，挑战更高分数！';
                nicknameInput.style.display = 'none';
            }

            modal.classList.add('show');
        }

        function hideModal() {
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function submitScore() {
            // 优先使用设置面板中的昵称，其次使用输入框
            const nicknameInput = document.getElementById('nicknameInput');
            const nickname = nicknameInput.value.trim() || getPlayerNickname();
            saveToLeaderboard(nickname, score);
            updateLeaderboard();
            hideModal();
        }

        // ==================== 数据存储 ====================
        function loadHighScore() {
            const saved = localStorage.getItem('neonSnake_highScore');
            highScore = saved ? parseInt(saved) : 0;
        }

        function saveHighScore() {
            localStorage.setItem('neonSnake_highScore', highScore.toString());
        }

        function getLeaderboard() {
            const saved = localStorage.getItem('neonSnake_leaderboard');
            return saved ? JSON.parse(saved) : [];
        }

        function saveToLeaderboard(name, score) {
            let leaderboard = getLeaderboard();
            leaderboard.push({
                name: name,
                score: score,
                date: new Date().toISOString(),
                playTime: totalPlayTime // 保存游玩时间（毫秒）
            });

            // 排序并保留前10名
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);

            localStorage.setItem('neonSnake_leaderboard', JSON.stringify(leaderboard));
        }

        // 格式化时间为 MM:SS 格式
        function formatTime(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 格式化日期为 YYYY-MM-DD 格式
        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateLeaderboard() {
            const leaderboard = getLeaderboard();
            const listEl = document.getElementById('leaderboardList');

            if (leaderboard.length === 0) {
                listEl.innerHTML = `
                    <li class="leaderboard-item">
                        <span class="leaderboard-rank">-</span>
                        <span class="leaderboard-name">暂无记录</span>
                        <span class="leaderboard-score">0</span>
                    </li>
                `;
                return;
            }

            listEl.innerHTML = leaderboard.map((entry, index) => {
                const timeStr = entry.playTime ? formatTime(entry.playTime) : '--:--';
                const dateStr = entry.date ? formatDate(entry.date) : '';
                return `
                    <li class="leaderboard-item">
                        <span class="leaderboard-rank">${index + 1}</span>
                        <span class="leaderboard-name">${escapeHtml(entry.name)}</span>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                            <span class="leaderboard-score">${entry.score}</span>
                            <span style="font-size: 10px; color: #999;">⏱️ ${timeStr}${dateStr ? ' | 📅 ' + dateStr : ''}</span>
                        </div>
                    </li>
                `;
            }).join('');
        }

        function clearLeaderboard() {
            if (confirm('确定要清空所有记录吗？')) {
                localStorage.removeItem('neonSnake_leaderboard');
                localStorage.removeItem('neonSnake_highScore');
                highScore = 0;
                updateUI();
                updateLeaderboard();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 事件处理 ====================
        function bindEvents() {
            // 键盘控制
            document.addEventListener('keydown', handleKeyDown);

            // 触摸控制
            let touchStartX = 0;
            let touchStartY = 0;

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;

                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;

                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // 水平滑动
                    if (deltaX > 30 && direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    } else if (deltaX < -30 && direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                } else {
                    // 垂直滑动
                    if (deltaY > 30 && direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    } else if (deltaY < -30 && direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                }
            }, { passive: false });

            // 按钮事件
            document.getElementById('restartBtn').addEventListener('click', () => {
                const nicknameInput = document.getElementById('nicknameInput');
                if (nicknameInput.style.display !== 'none' && nicknameInput.value.trim()) {
                    submitScore();
                } else {
                    hideModal();
                }
                // 停止当前游戏
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                
                // 重置游戏状态
                isGameStarted = false;
                isGameOver = false;
                isPaused = false;
                pauseStartTime = 0;
                hidePauseOverlay();
                
                // 显示模式选择界面
                showModeSelectModal();
            });

            document.getElementById('backBtn').addEventListener('click', () => {
                const nicknameInput = document.getElementById('nicknameInput');
                if (nicknameInput.style.display !== 'none' && nicknameInput.value.trim()) {
                    submitScore();
                } else {
                    hideModal();
                }
            });

            document.getElementById('clearBtn').addEventListener('click', clearLeaderboard);

            // 回车提交
            document.getElementById('nicknameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitScore();
                    
                    // 停止当前游戏
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                    }
                    
                    // 重置游戏状态
                    isGameStarted = false;
                    isGameOver = false;
                    isPaused = false;
                    pauseStartTime = 0;
                    hidePauseOverlay();
                    
                    // 显示模式选择界面
                    showModeSelectModal();
                }
            });

            // 暂停遮罩点击继续
            document.getElementById('pauseOverlay').addEventListener('click', () => {
                if (isPaused) {
                    togglePause();
                }
            });
        }

        function handleKeyDown(e) {
            // 防止空格键滚动页面
            if (e.code === 'Space') {
                e.preventDefault();
            }

            // 空格键：暂停/恢复（仅在游戏进行中有效）
            if (e.code === 'Space' && isGameStarted && !isGameOver) {
                togglePause();
                return;
            }

            // 方向控制（仅在未暂停时有效）
            if (isPaused) return;

            // 检测双击方向键触发技能
            const directionKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'];
                    
            if (directionKeys.includes(e.key)) {
                const now = Date.now();
                const normalizedKey = e.key.toLowerCase();
                        
                // 检查是否是同一个方向键的快速双击
                if (lastDirectionPress.key === normalizedKey && 
                    (now - lastDirectionPress.time) < DOUBLE_PRESS_TIME) {
                    // 触发幽灵技能
                    if (energyValue >= maxEnergy) {
                        activateGhostMode();
                    }
                    lastDirectionPress = { key: '', time: 0 }; // 重置
                    return; // 不执行方向移动
                }
                        
                lastDirectionPress = { key: normalizedKey, time: now };
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            
            if (isPaused) {
                // 记录暂停开始时间
                pauseStartTime = Date.now();
                // 显示暂停提示
                showPauseOverlay();
            } else {
                // 计算暂停时长，从总时间中减去
                if (pauseStartTime > 0) {
                    const pauseDuration = Date.now() - pauseStartTime;
                    // 游戏开始时已经包含了暂停时间，所以不需要额外处理
                    pauseStartTime = 0;
                }
                // 隐藏暂停提示，继续游戏
                hidePauseOverlay();
                lastMoveTime = performance.now();
            }
        }

        function showPauseOverlay() {
            document.getElementById('pauseOverlay').classList.add('show');
        }

        function hidePauseOverlay() {
            document.getElementById('pauseOverlay').classList.remove('show');
        }

        // ==================== 工具函数 ====================
        function interpolateColor(color1, color2, factor) {
            const r1 = parseInt(color1.substring(1, 3), 16);
            const g1 = parseInt(color1.substring(3, 5), 16);
            const b1 = parseInt(color1.substring(5, 7), 16);

            const r2 = parseInt(color2.substring(1, 3), 16);
            const g2 = parseInt(color2.substring(3, 5), 16);
            const b2 = parseInt(color2.substring(5, 7), 16);

            const r = Math.round(r1 + (r2 - r1) * factor);
            const g = Math.round(g1 + (g2 - g1) * factor);
            const b = Math.round(b1 + (b2 - b1) * factor);

            return `rgb(${r}, ${g}, ${b})`;
        }

        // 添加震动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // ==================== 启动游戏 ====================
        window.addEventListener('load', init);
    </script>
</body>
