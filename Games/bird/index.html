<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2c3e50;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    cursor: pointer;
    max-height: 100vh;
    max-width: 100vw;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 画布尺寸
const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

// 游戏状态
const STATE = { READY: 0, PLAYING: 1, OVER: 2 };
let state = STATE.READY;

// 鸟的属性
let bird = {
  x: 80,
  y: H / 2,
  w: 34,
  h: 26,
  vy: 0,
  gravity: 0.45,
  jumpForce: -7.5,
  rotation: 0,
  flapFrame: 0,
  flapTimer: 0
};

// 管道
let pipes = [];
const PIPE_WIDTH = 56;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
let pipeTimer = 0;
const PIPE_INTERVAL = 95;

// 分数
let score = 0;
let bestScore = parseInt(localStorage.getItem('flappyBest')) || 0;

// 地面
let groundX = 0;
const GROUND_H = 80;

// 云朵
let clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 30 + Math.random() * 150,
    w: 50 + Math.random() * 60,
    speed: 0.3 + Math.random() * 0.5
  });
}

// 粒子效果
let particles = [];

function resetGame() {
  bird.y = H / 2;
  bird.vy = 0;
  bird.rotation = 0;
  pipes = [];
  pipeTimer = 0;
  score = 0;
  particles = [];
}

function jump() {
  if (state === STATE.READY) {
    state = STATE.PLAYING;
    resetGame();
    bird.vy = bird.jumpForce;
    bird.flapFrame = 1;
    bird.flapTimer = 8;
  } else if (state === STATE.PLAYING) {
    bird.vy = bird.jumpForce;
    bird.flapFrame = 1;
    bird.flapTimer = 8;
    // 飞行粒子
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: bird.x,
        y: bird.y + 10,
        vx: -1 - Math.random() * 2,
        vy: 1 + Math.random() * 2,
        life: 15 + Math.random() * 10,
        maxLife: 25,
        size: 2 + Math.random() * 3,
        color: `hsl(45, 90%, ${60 + Math.random() * 30}%)`
      });
    }
  } else if (state === STATE.OVER) {
    if (bird._overTimer > 30) {
      state = STATE.READY;
      resetGame();
    }
  }
}

// 事件
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});

function spawnPipe() {
  const minY = 80;
  const maxY = H - GROUND_H - PIPE_GAP - 80;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({
    x: W + 10,
    topH: topH,
    scored: false
  });
}

function update() {
  // 云朵移动
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x + c.w < 0) {
      c.x = W + c.w;
      c.y = 30 + Math.random() * 150;
    }
  });

  // 粒子更新
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    return p.life > 0;
  });

  if (state === STATE.READY) {
    // 待机时鸟上下浮动
    bird.y = H / 2 + Math.sin(Date.now() / 300) * 15;
    bird.flapTimer--;
    if (bird.flapTimer <= 0) {
      bird.flapFrame = (bird.flapFrame + 1) % 3;
      bird.flapTimer = 8;
    }
    groundX = (groundX - 1) % 24;
    return;
  }

  if (state === STATE.OVER) {
    bird._overTimer = (bird._overTimer || 0) + 1;
    // 掉落到地面
    if (bird.y < H - GROUND_H - bird.h / 2) {
      bird.vy += bird.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.PI / 2;
    }
    return;
  }

  // --- PLAYING 状态 ---
  // 鸟物理
  bird.vy += bird.gravity;
  bird.y += bird.vy;

  // 鸟旋转
  if (bird.vy < 0) {
    bird.rotation = Math.max(-0.5, bird.rotation - 0.12);
  } else {
    bird.rotation = Math.min(Math.PI / 2, bird.rotation + 0.04);
  }

  // 翅膀动画
  bird.flapTimer--;
  if (bird.flapTimer <= 0) {
    bird.flapFrame = (bird.flapFrame + 1) % 3;
    bird.flapTimer = 8;
  }

  // 管道生成
  pipeTimer++;
  if (pipeTimer >= PIPE_INTERVAL) {
    spawnPipe();
    pipeTimer = 0;
  }

  // 管道移动
  pipes.forEach(p => { p.x -= PIPE_SPEED; });
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

  // 得分
  pipes.forEach(p => {
    if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
      p.scored = true;
      score++;
    }
  });

  // 地面滚动
  groundX = (groundX - PIPE_SPEED) % 24;

  // 碰撞检测
  const bx = bird.x;
  const by = bird.y;
  const br = 12; // 碰撞半径

  // 地面/天花板
  if (by + br > H - GROUND_H || by - br < 0) {
    gameOver();
    return;
  }

  // 管道碰撞
  for (const p of pipes) {
    if (bx + br > p.x && bx - br < p.x + PIPE_WIDTH) {
      if (by - br < p.topH || by + br > p.topH + PIPE_GAP) {
        gameOver();
        return;
      }
    }
  }
}

function gameOver() {
  state = STATE.OVER;
  bird._overTimer = 0;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flappyBest', bestScore);
  }
  // 爆炸粒子
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: bird.x,
      y: bird.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      size: 3 + Math.random() * 4,
      color: ['#f39c12', '#e74c3c', '#f1c40f', '#e67e22'][Math.floor(Math.random() * 4)]
    });
  }
}

// ==================== 绘制 ====================

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.5, '#98D8E8');
  grad.addColorStop(1, '#B0E0E6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, c.w / 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.2, c.y + 5, c.w / 3, c.w / 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.25, c.y + 3, c.w / 3, c.w / 5, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawPipe(x, topH) {
  // 上管道
  const grad1 = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
  grad1.addColorStop(0, '#3d8b37');
  grad1.addColorStop(0.3, '#5cb85c');
  grad1.addColorStop(0.7, '#4cae4c');
  grad1.addColorStop(1, '#357a32');

  // 上管主体
  ctx.fillStyle = grad1;
  ctx.fillRect(x, 0, PIPE_WIDTH, topH);

  // 上管帽
  const capH = 26;
  const capExtra = 6;
  ctx.fillStyle = grad1;
  ctx.fillRect(x - capExtra, topH - capH, PIPE_WIDTH + capExtra * 2, capH);
  ctx.strokeStyle = '#2d6b27';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - capExtra, topH - capH, PIPE_WIDTH + capExtra * 2, capH);
  ctx.strokeRect(x, 0, PIPE_WIDTH, topH - capH);

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 6, 0, 8, topH - capH);

  // 下管道
  const bottomY = topH + PIPE_GAP;
  const bottomH = H - GROUND_H - bottomY;

  ctx.fillStyle = grad1;
  ctx.fillRect(x, bottomY, PIPE_WIDTH, bottomH);

  // 下管帽
  ctx.fillRect(x - capExtra, bottomY, PIPE_WIDTH + capExtra * 2, capH);
  ctx.strokeStyle = '#2d6b27';
  ctx.strokeRect(x - capExtra, bottomY, PIPE_WIDTH + capExtra * 2, capH);
  ctx.strokeRect(x, bottomY + capH, PIPE_WIDTH, bottomH - capH);

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 6, bottomY + capH, 8, bottomH - capH);
}

function drawBird(x, y, rotation, flapFrame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  // 身体
  const bodyGrad = ctx.createRadialGradient(0, 0, 2, 0, -2, 16);
  bodyGrad.addColorStop(0, '#FFD700');
  bodyGrad.addColorStop(0.7, '#F5A623');
  bodyGrad.addColorStop(1, '#E8941A');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#C87F10';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 翅膀
  ctx.fillStyle = '#E8941A';
  ctx.strokeStyle = '#C87F10';
  ctx.lineWidth = 1;
  const wingY = flapFrame === 0 ? 2 : flapFrame === 1 ? -5 : 6;
  ctx.beginPath();
  ctx.ellipse(-4, wingY, 11, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 眼白
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(8, -4, 6, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 眼珠
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(10, -3, 3, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛高光
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(11, -4.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // 嘴巴
  ctx.fillStyle = '#E74C3C';
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(24, 2);
  ctx.lineTo(14, 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#C0392B';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawGround() {
  // 地面
  const gy = H - GROUND_H;
  const grad = ctx.createLinearGradient(0, gy, 0, H);
  grad.addColorStop(0, '#8B6914');
  grad.addColorStop(0.15, '#DEB557');
  grad.addColorStop(0.3, '#C8A84E');
  grad.addColorStop(1, '#A08930');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gy, W, GROUND_H);

  // 草地
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, gy, W, 14);
  ctx.fillStyle = '#66BB6A';
  ctx.fillRect(0, gy, W, 6);

  // 地面纹理线条
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  for (let i = groundX; i < W; i += 24) {
    ctx.beginPath();
    ctx.moveTo(i, gy + 18);
    ctx.lineTo(i + 12, gy + 28);
    ctx.stroke();
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawScore() {
  // 描边数字
  ctx.save();
  ctx.font = 'bold 50px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  const text = score.toString();
  const tx = W / 2;
  const ty = 40;

  ctx.strokeStyle = '#553300';
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, tx, ty);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, tx, ty);
  ctx.restore();
}

function drawReadyScreen() {
  ctx.save();
  ctx.textAlign = 'center';

  // 标题
  ctx.font = 'bold 44px Arial';
  ctx.strokeStyle = '#553300';
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.strokeText('Flappy Bird', W / 2, 120);
  ctx.fillStyle = '#FFD700';
  ctx.fillText('Flappy Bird', W / 2, 120);

  // 提示
  const bounce = Math.sin(Date.now() / 400) * 5;
  ctx.font = 'bold 22px Arial';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.strokeText('点击屏幕开始', W / 2, 380 + bounce);
  ctx.fillStyle = '#fff';
  ctx.fillText('点击屏幕开始', W / 2, 380 + bounce);

  ctx.font = '16px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('点击 / 空格 / ↑ 控制飞行', W / 2, 420);

  if (bestScore > 0) {
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = '#FFD700';
    ctx.strokeStyle = '#553300';
    ctx.lineWidth = 3;
    ctx.strokeText('🏆 最高: ' + bestScore, W / 2, 460);
    ctx.fillText('🏆 最高: ' + bestScore, W / 2, 460);
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.textAlign = 'center';

  // 半透明遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, W, H);

  // 面板背景
  const px = W / 2 - 120;
  const py = 160;
  const pw = 240;
  const ph = 200;
  ctx.fillStyle = '#DEB557';
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 4;
  roundRect(ctx, px, py, pw, ph, 12);
  ctx.fill();
  ctx.stroke();

  // 内框
  ctx.fillStyle = '#C8A84E';
  roundRect(ctx, px + 15, py + 50, pw - 30, ph - 70, 8);
  ctx.fill();

  // Game Over 文字
  ctx.font = 'bold 32px Arial';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#553300';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.strokeText('Game Over', W / 2, py + 36);
  ctx.fillText('Game Over', W / 2, py + 36);

  // 分数
  ctx.font = 'bold 20px Arial';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('分数', px + 30, py + 85);
  ctx.textAlign = 'right';
  ctx.fillText(score, px + pw - 30, py + 85);

  // 最佳
  ctx.textAlign = 'left';
  ctx.fillText('最佳', px + 30, py + 120);
  ctx.textAlign = 'right';
  ctx.fillText(bestScore, px + pw - 30, py + 120);

  // 新纪录标记
  if (score >= bestScore && score > 0) {
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = '#E74C3C';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 NEW!', W / 2, py + 155);
  }

  // 重开提示
  if (bird._overTimer > 30) {
    const bounce = Math.sin(Date.now() / 400) * 3;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeText('点击重新开始', W / 2, py + ph + 50 + bounce);
    ctx.fillText('点击重新开始', W / 2, py + ph + 50 + bounce);
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ==================== 主循环 ====================

function gameLoop() {
  update();

  // 绘制
  drawSky();
  drawClouds();

  // 管道
  pipes.forEach(p => drawPipe(p.x, p.topH));

  // 地面
  drawGround();

  // 粒子
  drawParticles();

  // 鸟
  drawBird(bird.x, bird.y, bird.rotation, bird.flapFrame);

  // 分数
  if (state === STATE.PLAYING) {
    drawScore();
  }

  // 界面
  if (state === STATE.READY) drawReadyScreen();
  if (state === STATE.OVER) drawGameOver();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
