<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>67 — a brief history of art</title>
<meta name="description" content="迷因 67 的程序生成藝術史短片：p5.js + p5.brush 逐幀畫出從洞穴壁畫到 TikTok 的 15 個年代。">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  main { position: relative; width: 1920px; height: 1080px; flex: none; transform-origin: center center; }
  canvas { display: block; }
  #boot { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity .7s ease; }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-inner { text-align: center; user-select: none; }
  .boot-67 { font: bold 128px Georgia, 'Times New Roman', serif; color: #f4efe2; letter-spacing: -6px; text-shadow: 0 0 44px rgba(217,119,87,.45); }
  .boot-bar { width: 300px; height: 2px; margin: 26px auto 14px; background: #26262c; overflow: hidden; }
  .boot-bar i { display: block; height: 100%; width: 0; background: #d97757; transition: width .35s ease; }
  .boot-txt { font: 12px Menlo, Consolas, monospace; color: #6f695c; letter-spacing: .18em; }
</style>
<script>
/* boot progress (local addition): counts 6 head scripts + timeline + 17 scenes + init,
 * player.js calls finish() after the first rendered frame. */
(function () {
  var B = window.__boot = {
    done: 0, total: 25, hid: false,
    tick: function (n) { this.done += (n || 1); this.paint(); },
    paint: function () {
      var p = Math.min(99, Math.round(100 * this.done / this.total));
      var f = document.getElementById('bootFill'), t = document.getElementById('bootTxt');
      if (f) f.style.width = p + '%';
      if (t) t.textContent = 'LOADING · ' + p + '%';
    },
    finish: function () {
      if (this.hid) return;
      this.hid = true;
      var f = document.getElementById('bootFill'), t = document.getElementById('bootTxt');
      if (f) f.style.width = '100%';
      if (t) t.textContent = 'LOADING · 100%';
      var b = document.getElementById('boot');
      if (b) { b.classList.add('hide'); setTimeout(function () { var el = document.getElementById('boot'); if (el) el.remove(); }, 900); }
      clearInterval(B._iv);
    }
  };
  B._iv = setInterval(function () { if (B.hid) { clearInterval(B._iv); return; } B.paint(); }, 150);
  setTimeout(function () { if (!B.hid) { var t = document.getElementById('bootTxt'); if (t) t.textContent = '首次加载约 2MB，请稍候…'; } }, 20000);
  setTimeout(function () { if (!B.hid) { var t = document.getElementById('bootTxt'); if (t) t.textContent = '仍在加载，可刷新重试'; } }, 60000);
  addEventListener('error', function () { if (!B.hid) { var t = document.getElementById('bootTxt'); if (t) t.textContent = '加载出错，请刷新重试'; } }, true);
})();
</script>
<script src="vendor/p5.min.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="vendor/p5.brush.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="src/kit.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="src/rig67.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="src/hud.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="src/main.js" onload="window.__boot&&window.__boot.tick()"></script>
<script src="player.js"></script>
</head>
<body>
<main id="stage"></main>
<div id="boot" aria-hidden="true">
  <div class="boot-inner">
    <div class="boot-67">67</div>
    <div class="boot-bar"><i id="bootFill"></i></div>
    <div class="boot-txt" id="bootTxt">LOADING · 0%</div>
  </div>
</div>
</body>
</html>
