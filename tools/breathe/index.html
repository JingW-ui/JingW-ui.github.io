<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="引导式呼吸节律动画工具，支持盒式呼吸 4-4-4-4 与 4-7-8 助眠法，跟随绿色渐变圆圈的节奏完成吸气、屏息与呼气，缓解焦虑、放松身心，浏览器直接使用。">
    <link rel="icon" type="image/png" href="/imgs/logo/github_logo.png">
    <title>深呼吸放松 - 引导式呼吸节律动画 | JingW-ui</title>
    <style>
        :root {
            /* 纸面基调（与 tools 主页同源） */
            --bg: #ffffff;
            --chip: #f5f5f5;
            --line: #e5e5e5;
            --line-strong: #111111;
            --text: #111111;
            --text-soft: #555555;
            --text-dim: #999999;
            /* 绿色明度阶梯：吸气浅 → 屏息中 → 呼气深 */
            --green-1: #34d399;
            --green-2: #10b981;
            --green-3: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
            overflow: hidden;
            padding: 2rem;
        }

        /* 顶部标题与模式切换 */
        header {
            text-align: center;
            margin-top: 1rem;
            z-index: 10;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.35rem;
            text-indent: 0.35rem;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .page-hint {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.05rem;
            margin-bottom: 1.2rem;
        }

        .modes {
            display: inline-flex;
            background: var(--chip);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 3px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-soft);
            padding: 0.45rem 1.2rem;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            color: var(--text);
        }

        .mode-btn.active {
            background: #ffffff;
            color: var(--text);
            font-weight: 500;
            box-shadow: inset 0 0 0 1px var(--line-strong);
        }

        /* 呼吸主容器 */
        .breathing-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        /* 背景静态参考圈 */
        .guide-circle {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 1px dashed var(--line);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 动态缩放的呼吸圈 */
        .breathing-circle {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--green-2);
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.25);
            transform: scale(1);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), background-color 1s ease, box-shadow 1s ease;
        }

        /* 圆面高光：固定的绿色渐变质感，不随阶段变色打断过渡 */
        .breathing-circle::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 62%);
            pointer-events: none;
        }

        /* 中心文本 */
        .text-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        #status {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.3rem;
            text-indent: 0.3rem;
            margin-bottom: 0.4rem;
            color: var(--text);
            transition: opacity 0.3s, color 0.6s ease;
        }

        /* 静止态不显示状态字，倒计时独占居中 */
        #status:empty {
            display: none;
        }

        #timer {
            font-size: 2.8rem;
            font-weight: 300;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            color: var(--text-soft);
            opacity: 0.9;
            transition: color 0.6s ease;
        }

        /* 运行中：白字浮于绿圈之上（停止后回落深色，避免小圈阶段出圈隐形） */
        body.running #status,
        body.running #timer {
            color: #ffffff;
        }

        /* 底部控制按钮 */
        footer {
            margin-bottom: 2rem;
            z-index: 10;
        }

        .control-btn {
            background: var(--green-2);
            color: #ffffff;
            border: none;
            padding: 0.9rem 3.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.15rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: var(--green-3);
        }

        .control-btn:active {
            transform: translateY(1px);
        }

        .control-btn.running {
            background: var(--line-strong);
        }

        @media (prefers-reduced-motion: reduce) {
            .mode-btn,
            .control-btn {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>静心呼吸</h1>
        <p class="page-hint">跟随圆圈胀缩的节奏 · 吸气 — 屏息 — 呼气</p>
        <div class="modes">
            <button class="mode-btn active" onclick="switchMode('box', this)">盒子呼吸法 (4-4-4-4)</button>
            <button class="mode-btn" onclick="switchMode('relax', this)">4-7-8 助眠法</button>
        </div>
    </header>

    <div class="breathing-container">
        <div class="guide-circle"></div>
        <div class="breathing-circle" id="circle"></div>
        <div class="text-overlay">
            <span id="status"></span>
            <span id="timer">-</span>
        </div>
    </div>

    <footer>
        <button class="control-btn" id="startBtn" onclick="toggleBreathing()">开始练习</button>
    </footer>

    <script>
        const circle = document.getElementById('circle');
        const statusText = document.getElementById('status');
        const timerText = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');

        let isRunning = false;
        let currentPhaseIndex = 0;
        let countdown = 0;
        let stateInterval = null;
        let timerInterval = null;

        // 绿色明度阶梯（全页唯一颜色来源，改动只动这里）
        const PHASE_COLORS = {
            inhale: { color: '#34d399', glow: '0 0 50px rgba(52, 211, 153, 0.35)' },
            hold:   { color: '#10b981', glow: '0 0 50px rgba(16, 185, 129, 0.35)' },
            exhale: { color: '#059669', glow: '0 0 50px rgba(5, 150, 105, 0.35)' }
        };

        // 呼吸模式配置
        const modes = {
            box: [
                { name: '吸气', duration: 4, scale: 2, ...PHASE_COLORS.inhale },
                { name: '屏息', duration: 4, scale: 2, ...PHASE_COLORS.hold },
                { name: '呼气', duration: 4, scale: 1, ...PHASE_COLORS.exhale },
                { name: '屏息', duration: 4, scale: 1, ...PHASE_COLORS.hold }
            ],
            relax: [
                { name: '吸气', duration: 4, scale: 2, ...PHASE_COLORS.inhale },
                { name: '屏息', duration: 7, scale: 2, ...PHASE_COLORS.hold },
                { name: '呼气', duration: 8, scale: 1, ...PHASE_COLORS.exhale }
            ]
        };

        let currentMode = 'box';

        function switchMode(mode, btn) {
            if (isRunning) {
                stopBreathing();
            }
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            resetUI();
        }

        function toggleBreathing() {
            if (isRunning) {
                stopBreathing();
            } else {
                startBreathing();
            }
        }

        function startBreathing() {
            isRunning = true;
            document.body.classList.add('running');
            startBtn.textContent = '停止';
            startBtn.classList.add('running');
            currentPhaseIndex = 0;
            runPhase();
        }

        function stopBreathing() {
            isRunning = false;
            document.body.classList.remove('running');
            startBtn.textContent = '开始练习';
            startBtn.classList.remove('running');
            clearTimeout(stateInterval);
            clearInterval(timerInterval);
            resetUI();
        }

        function resetUI() {
            statusText.textContent = '';
            timerText.textContent = '-';
            circle.style.transition = 'all 1s ease-in-out';
            circle.style.transform = 'scale(1)';
            circle.style.backgroundColor = PHASE_COLORS.hold.color;
            circle.style.boxShadow = PHASE_COLORS.hold.glow;
        }

        function runPhase() {
            if (!isRunning) return;

            const phases = modes[currentMode];
            const phase = phases[currentPhaseIndex];

            // 更新文字与时间
            statusText.textContent = phase.name;
            countdown = phase.duration;
            timerText.textContent = countdown;

            // 应用平滑过渡动画（过渡时间正好等于当前阶段持续时间）
            circle.style.transition = `transform ${phase.duration}s cubic-bezier(0.37, 0, 0.63, 1), background-color ${phase.duration}s ease-in-out, box-shadow ${phase.duration}s ease-in-out`;
            circle.style.transform = `scale(${phase.scale})`;
            circle.style.backgroundColor = phase.color;
            circle.style.boxShadow = phase.glow;

            // 秒表倒计时
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    timerText.textContent = countdown;
                } else {
                    clearInterval(timerInterval);
                }
            }, 1000);

            // 阶段切换
            clearTimeout(stateInterval);
            stateInterval = setTimeout(() => {
                currentPhaseIndex = (currentPhaseIndex + 1) % phases.length;
                runPhase();
            }, phase.duration * 1000);
        }
    </script>
</body>
</html>
