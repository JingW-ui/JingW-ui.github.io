<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站服务器查询 - 域名 IP 与运营商识别</title>
<meta name="description" content="输入域名，一键查询网站服务器解析到的 IP 地址与运营商（阿里云、腾讯云、AWS、Cloudflare 等），支持 IPv6 与 CDN 识别。">
<link rel="stylesheet" href="../common.css">
<style>
  :root { --red:#cf222e; --red-bg:#fff0ee; --blue:#0969da; --blue-bg:#ddf4ff; --text2:#656d76; --text-muted:#9198a1; --border-light:#e8eaed; }
  .main { flex:1; padding:20px 24px; max-width:1100px; margin:0 auto; width:100%; }
  .section { background:var(--bg); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; overflow:hidden; box-shadow:var(--shadow); }
  .section-header { padding:12px 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .section-title { font-size:14px; font-weight:600; color:var(--text); }
  .section-subtitle { font-size:12px; color:var(--text2); }
  .section-body { padding:16px 20px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 16px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap; }
  .btn:hover { background:var(--bg3); }
  .btn-primary { background:var(--green); color:#fff; border-color:var(--green); }
  .btn-primary:hover { background:var(--green2); }
  .btn-sm { padding:5px 12px; font-size:12px; }

  .query-row { display:flex; gap:8px; }
  .query-row input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:'Consolas',monospace; background:var(--bg); color:var(--text); transition:border-color .15s; }
  .query-row input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(45,164,78,.12); }
  .query-row input:disabled { opacity:.6; }
  .examples { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .ex-chip { font-size:12px; font-family:'Consolas',monospace; padding:2px 10px; border-radius:12px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); cursor:pointer; transition:all .15s; }
  .ex-chip:hover { border-color:var(--green); color:var(--green); }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 10px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text2); }
  .badge.ok { background:var(--blue-bg); border-color:rgba(9,105,218,.25); color:var(--blue); }
  .badge.warn { background:#fff8c5; border-color:rgba(154,103,0,.3); color:#9a6700; }

  .srv-table { width:100%; border-collapse:collapse; font-size:13px; }
  .srv-table th, .srv-table td { padding:8px 12px; border-bottom:1px solid var(--border-light); text-align:left; vertical-align:middle; }
  .srv-table th { background:var(--bg2); font-weight:600; color:var(--text2); font-size:12px; white-space:nowrap; }
  .srv-table tr:last-child th, .srv-table tr:last-child td { border-bottom:none; }
  .srv-ip { font-family:'Consolas',monospace; color:var(--blue); word-break:break-all; }
  .v6-tag { font-size:10px; color:var(--text-muted); border:1px solid var(--border-light); border-radius:4px; padding:0 4px; margin-left:6px; }
  .srv-op { color:var(--text); }
  .srv-op .city { color:var(--text2); }
  .copy-mini { border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:0 4px; }
  .copy-mini:hover { color:var(--green); }
  .rec-empty { color:var(--text-muted); font-size:13px; padding:2px 0; }
  .rec-error { color:var(--red); font-size:13px; }

  .spin { display:inline-block; width:13px; height:13px; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .loading-line { display:flex; align-items:center; gap:8px; color:var(--text2); font-size:13px; }
  .foot-line { font-size:12px; color:var(--text-muted); line-height:1.7; margin:0 0 16px; }
  @media (max-width:640px) { .main { padding:14px 12px; } .section-body { padding:12px 14px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>网站服务器查询</h1>
    <p>查域名解析到哪些 IP、服务器在哪家运营商（CDN / 云厂商识别）</p>
  </div>
</header>

<div class="main">

  <!-- 查询输入 -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">查询域名</span>
    </div>
    <div class="section-body">
      <div class="query-row">
        <input id="domainInput" type="text" placeholder="输入域名，如 example.com" autocomplete="off" spellcheck="false">
        <button class="btn btn-primary" id="queryBtn" onclick="startQuery()">查询</button>
      </div>
      <div class="examples">
        <span class="section-subtitle">试试：</span>
        <button class="ex-chip" onclick="fillExample('github.com')">github.com</button>
        <button class="ex-chip" onclick="fillExample('baidu.com')">baidu.com</button>
        <button class="ex-chip" onclick="fillExample('qq.com')">qq.com</button>
        <span style="flex:1"></span>
        <span class="badge" id="srcBadge">线路：自动切换</span>
      </div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="section" id="resultsCard" hidden>
    <div class="section-header">
      <span class="section-title">结果</span>
      <span style="flex:1"></span>
      <button class="btn btn-sm" onclick="copyIps()">⎘ 复制 IP</button>
    </div>
    <div class="section-body" id="resultsBody"></div>
  </div>

  <p class="foot-line">查询由浏览器直连公共 DoH（默认阿里云，失败自动切 Cloudflare）；运营商信息来自 ipwho.is / ip.sb 公共接口。本站不经手、不存储查询记录。</p>

</div>

<script src="../common.js"></script>
<script>
'use strict';

/* ================= 常量与字典 ================= */

const RECORD_TYPES = [
  { key: 'CNAME', num: 5 },
  { key: 'A',     num: 1 },
  { key: 'AAAA',  num: 28 },
];
const DNS_ERRORS = { 1: '格式错误 (FormErr)', 2: '服务器失败 (ServFail)', 3: '域名不存在 (NXDOMAIN)', 4: '未实现 (NotImp)', 5: '拒绝应答 (Refused)' };

/* DoH 双线路：阿里云为主（国内可达），Cloudflare 回退（国际） */
const SOURCES = {
  alidns: {
    label: '阿里云 DoH',
    build: (name, type) => 'https://dns.alidns.com/resolve?name=' + encodeURIComponent(name) + '&type=' + type,
    init: {},
  },
  cloudflare: {
    label: 'Cloudflare DoH',
    build: (name, type) => 'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(name) + '&type=' + type,
    init: { headers: { accept: 'application/dns-json' } },
  },
};
let curSource = 'alidns'; // 会话内记忆上一次成功的线路

/* IP 情报双源：主 ipwho.is，备 ip.sb（均 HTTPS + CORS，免 key） */
const IP_SOURCES = {
  ipwho: {
    label: 'ipwho.is',
    url: ip => 'https://ipwho.is/' + encodeURIComponent(ip),
    parse: j => (j && j.success !== false && (j.connection || j.city || j.country))
      ? { org: (j.connection && (j.connection.org || j.connection.isp)) || '', city: j.city || '', country: j.country || '', cc: j.country_code || '' }
      : null,
  },
  ipsb: {
    label: 'ip.sb',
    url: ip => 'https://api.ip.sb/geoip/' + encodeURIComponent(ip),
    parse: j => (j && j.ip)
      ? { org: j.organization || j.isp || j.asn_organization || '', city: j.city || '', country: j.country || '', cc: j.country_code || '' }
      : null,
  },
};
let curIpSource = 'ipwho';

/* CNAME / 建站平台 / CDN 指纹（命中即直接作为运营商结论，跳过 IP 接口） */
const CNAME_SERVICES = [
  [/cloudflare(\.net|\.com)|pages\.dev/i, 'Cloudflare', 'CDN'],
  [/vercel-dns\.com|vercel\.app/i, 'Vercel', '建站平台'],
  [/netlify\.(app|com|globalcdn)/i, 'Netlify', '建站平台'],
  [/github\.io/i, 'GitHub Pages', '建站平台'],
  [/ghs\.googlehosted\.com/i, 'Google 主机托管', '建站平台'],
  [/web\.app|firebaseapp\.com/i, 'Firebase Hosting', '建站平台'],
  [/herokudns\.com|herokuapp\.com/i, 'Heroku', '建站平台'],
  [/azurewebsites\.net|cloudapp\.azure|trafficmanager\.net|azureedge\.net/i, 'Microsoft Azure', '建站平台'],
  [/cloudfront\.net/i, 'AWS CloudFront', 'CDN'],
  [/edgekey\.net|edgesuite\.net|akamai/i, 'Akamai', 'CDN'],
  [/fastly\.net/i, 'Fastly', 'CDN'],
  [/dnsv1\.com|tcdn\.qq\.com/i, '腾讯云 CDN', 'CDN'],
  [/kunlun(gr|sl|ea|sc|hc)?\.(com|cn)|aliyuncs\.com|aliyunwaf/i, '阿里云 CDN/云', 'CDN'],
  [/cdnhwc\d?\.|myhuaweicdn|huaweicdn/i, '华为云 CDN', 'CDN'],
  [/aicdn\.com|upyun/i, '又拍云 CDN', 'CDN'],
  [/qiniudns|qiniuio|qiniu\.com/i, '七牛云 CDN', 'CDN'],
  [/jomodns|bdydns|baidubce/i, '百度智能云 CDN', 'CDN'],
  [/lxdns\.com|wscdn|chinanetcenter/i, '网宿 CDN', 'CDN'],
  [/cdn77\.org/i, 'CDN77', 'CDN'],
  [/bunnycdn/i, 'Bunny CDN', 'CDN'],
  [/edgecast|edg\.io/i, 'Edgio (Edgecast)', 'CDN'],
  [/stackpath|stackassets/i, 'StackPath', 'CDN'],
];

/* org/isp 字符串 → 中文运营商名 */
const ORG_MAP = [
  [/aliyun|alibaba|alicloud|taobao/i, '阿里云'],
  [/tencent|\bqq\b/i, '腾讯云'],
  [/huawei/i, '华为云'],
  [/baidu/i, '百度云'],
  [/volcengine|bytedance|火山/i, '火山引擎'],
  [/ucloud/i, 'UCloud'],
  [/qiniu/i, '七牛云'],
  [/upyun/i, '又拍云'],
  [/jdcloud|jingdong|京东/i, '京东云'],
  [/amazon|aws|\bamzn/i, 'AWS'],
  [/google/i, 'Google'],
  [/microsoft|azure|msft/i, '微软 Azure'],
  [/cloudflare/i, 'Cloudflare'],
  [/oracle/i, 'Oracle 云'],
  [/akamai|linode/i, 'Akamai'],
  [/fastly/i, 'Fastly'],
  [/digitalocean/i, 'DigitalOcean'],
  [/hetzner/i, 'Hetzner'],
  [/ovh/i, 'OVH'],
  [/vultr|choopa/i, 'Vultr'],
  [/chinatelecom|china ?telecom|电信/i, '中国电信'],
  [/china ?unicom|联通/i, '中国联通'],
  [/china ?mobile|cmcc|移动/i, '中国移动'],
  [/cernet|教育网/i, '教育网'],
];

/* ================= 状态 ================= */

let curDomain = '';           // 当前查询的域名（punycode）
let displayDomain = '';       // 展示用（原样输入）
let lastResults = {};         // type -> {state, answers, chain, source, ms, json}
let usedSources = new Set();
let queryToken = 0;           // 防止并发查询串台
let dnsPending = new Set();   // 尚未返回的 DNS 类型
let ips = [];                 // [{ip, v6, op:{state:'pending'|'ok'|'fail', label, city}}]
const ipCache = new Map();    // ip -> op 结果（会话内去重，省接口配额）

/* ================= 域名处理 ================= */

function normalizeDomain(input) {
  let s = String(input || '').trim().toLowerCase();
  s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//, ''); // 去协议
  s = s.split(/[/?#]/)[0];                      // 去路径
  s = s.split('@').pop();                       // 去 userinfo
  s = s.split(':')[0];                          // 去端口
  s = s.replace(/\.+$/, '');                    // 去末尾点
  if (!s) throw new Error('请输入域名');
  if (/^[\d.]+$/.test(s)) throw new Error('这是 IP 地址而非域名，请输入域名（如 example.com）');
  if (s.includes(':')) throw new Error('这是 IPv6 地址而非域名，请输入域名');
  if (!s.includes('.')) throw new Error('请输入完整域名（如 example.com）');
  let puny;
  try { puny = new URL('http://' + s).hostname; } // 浏览器自动完成 IDN → punycode
  catch (e) { throw new Error('域名格式不正确'); }
  if (!/^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)+$/.test(puny)) {
    throw new Error('域名格式不正确');
  }
  return { puny: puny, display: s };
}

/* ================= DoH 查询层 ================= */

async function fetchJson(url, init, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal }, init || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* 先走当前线路，失败自动切备用线路重试一次 */
async function dohQuery(name, type) {
  const order = curSource === 'alidns' ? ['alidns', 'cloudflare'] : ['cloudflare', 'alidns'];
  let lastErr = null;
  for (const key of order) {
    const src = SOURCES[key];
    try {
      const t0 = performance.now();
      const json = await fetchJson(src.build(name, type), src.init, 8000);
      curSource = key; usedSources.add(key);
      return { json: json, source: key, ms: Math.round(performance.now() - t0) };
    } catch (e) { lastErr = e; }
  }
  throw (lastErr || new Error('查询失败'));
}

/* IP 情报：主源失败自动切备源 */
async function ipQuery(ip) {
  const order = curIpSource === 'ipwho' ? ['ipwho', 'ipsb'] : ['ipsb', 'ipwho'];
  let lastErr = null;
  for (const key of order) {
    const src = IP_SOURCES[key];
    try {
      const j = await fetchJson(src.url(ip), {}, 6000);
      const d = src.parse(j);
      if (!d || !d.org) throw new Error('no data');
      curIpSource = key;
      return d;
    } catch (e) { lastErr = e; }
  }
  throw (lastErr || new Error('IP 查询失败'));
}

/* ================= 查询编排 ================= */

async function startQuery() {
  const input = document.getElementById('domainInput');
  let nd;
  try { nd = normalizeDomain(input.value); }
  catch (e) { showToast(e.message); input.focus(); return; }

  const token = ++queryToken;
  curDomain = nd.puny; displayDomain = nd.display;
  lastResults = {}; usedSources = new Set();
  dnsPending = new Set(RECORD_TYPES.map(t => t.key));
  ips = [];
  document.getElementById('queryBtn').disabled = true;
  input.disabled = true;
  document.getElementById('resultsCard').hidden = false;
  renderAll();
  try {
    await Promise.all(RECORD_TYPES.map(t => runOne(t, token)));
  } finally {
    if (token === queryToken) {
      document.getElementById('queryBtn').disabled = false;
      input.disabled = false;
    }
  }
  if (token !== queryToken) return;

  buildIpList();
  renderAll();
  if (ips.length) {
    const uniq = [...new Set(ips.filter(x => !x.op).map(x => x.ip))];
    await Promise.all(uniq.map(ip => queryIpInfo(ip, token)));
    if (token === queryToken) renderAll();
  }
}

async function runOne(t, token) {
  try {
    const r = await dohQuery(curDomain, t.num);
    if (token !== queryToken) return;
    const answers = [];
    const chain = [];
    (r.json.Answer || []).forEach(a => {
      if (a.type === t.num) answers.push({ value: a.data, ttl: a.TTL });
      else if (a.type === 5) chain.push({ value: a.data, ttl: a.TTL });
    });
    const hasData = answers.length || (t.key === 'CNAME' && chain.length);
    const st = r.json.Status === 0 ? (hasData ? 'ok' : 'empty') : 'dnserror';
    lastResults[t.key] = {
      state: st, answers: answers, chain: chain,
      status: r.json.Status, source: r.source, ms: r.ms, json: r.json,
    };
  } catch (e) {
    if (token !== queryToken) return;
    lastResults[t.key] = { state: 'network', message: (e && e.name === 'AbortError') ? '请求超时' : (e.message || '网络错误'), source: null };
  }
  dnsPending.delete(t.key);
  renderAll();
  updateSourceBadge();
}

/* 从 A/AAAA 应答构建 IP 列表；CNAME 链指纹命中时直接作为运营商结论 */
function buildIpList() {
  ips = [];
  const chains = [];
  ['A', 'AAAA', 'CNAME'].forEach(k => {
    const r = lastResults[k];
    if (r && r.chain) r.chain.forEach(c => chains.push(c.value));
  });
  let chainHit = null;
  for (const c of chains) {
    for (const [re, name, kind] of CNAME_SERVICES) {
      if (re.test(c)) { chainHit = { label: name + (kind === 'CDN' ? '（CDN）' : '') }; break; }
    }
    if (chainHit) break;
  }
  ['A', 'AAAA'].forEach(k => {
    const r = lastResults[k];
    if (!r || r.state !== 'ok') return;
    r.answers.forEach(a => {
      const v6 = k === 'AAAA';
      if (ips.some(x => x.ip === a.value)) return;
      ips.push({
        ip: a.value, v6: v6,
        op: chainHit ? { state: 'ok', label: chainHit.label, city: '' } : { state: 'pending' },
      });
    });
  });
}

async function queryIpInfo(ip, token) {
  if (ipCache.has(ip)) {
    const hit = ips.find(x => x.ip === ip);
    if (hit) hit.op = ipCache.get(ip);
    return;
  }
  let op;
  try {
    const d = await ipQuery(ip);
    op = { state: 'ok', label: mapOrg(d.org), city: d.city || d.country || '' };
  } catch (e) {
    op = { state: 'fail' };
  }
  if (token !== queryToken) return;
  ipCache.set(ip, op);
  const hit = ips.find(x => x.ip === ip);
  if (hit) hit.op = op;
  renderAll();
}

function mapOrg(org) {
  const s = String(org || '');
  if (!s) return '未知';
  for (const [re, name] of ORG_MAP) {
    if (re.test(s)) return name;
  }
  return s.length > 42 ? s.slice(0, 42) + '…' : s;
}

/* ================= 渲染 ================= */

function esc(s) {
  var h = window.escapeHtml ? escapeHtml(s) : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 记录值可被域名持有者任意控制，必须转义引号，防止 data-v="..." 属性逃逸造成 XSS
  return h.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function copyBtn(text) {
  return '<button class="copy-mini" title="复制" onclick="copyText(this.dataset.v)" data-v="' + esc(text) + '">⎘</button>';
}

function renderAll() {
  const body = document.getElementById('resultsBody');
  if (!body) return;
  if (dnsPending.size === RECORD_TYPES.length) {
    body.innerHTML = '<div class="loading-line"><span class="spin"></span>查询中…</div>';
    return;
  }
  const a = lastResults.A;
  if (a && a.state === 'dnserror' && a.status === 3) {
    body.innerHTML = '<div class="rec-error">域名不存在或尚未注册（NXDOMAIN）</div>';
    return;
  }
  if (!ips.length) {
    if (dnsPending.size) {
      body.innerHTML = '<div class="loading-line"><span class="spin"></span>查询中…</div>';
      return;
    }
    const net = ['A', 'AAAA'].every(k => lastResults[k] && lastResults[k].state === 'network');
    if (net) {
      body.innerHTML = '<div class="rec-error">两条 DoH 线路均不可达，查询失败。<button class="btn btn-sm" style="margin-left:8px" onclick="startQuery()">重试</button></div>';
      return;
    }
    const dnsErr = ['A', 'AAAA'].map(k => lastResults[k]).find(r => r && r.state === 'dnserror');
    if (dnsErr) {
      body.innerHTML = '<div class="rec-error">DNS 错误：' + esc(DNS_ERRORS[dnsErr.status] || ('Status ' + dnsErr.status)) + '</div>';
      return;
    }
    body.innerHTML = '<div class="rec-empty">该域名未解析到 IP 地址。</div>';
    return;
  }
  let rows = '';
  ips.forEach(x => {
    let opHtml;
    if (!x.op || x.op.state === 'pending') opHtml = '<span class="spin"></span>';
    else if (x.op.state === 'fail') opHtml = '<span class="rec-empty">—</span>';
    else opHtml = '<span class="srv-op">' + esc(x.op.label) + (x.op.city ? '<span class="city"> · ' + esc(x.op.city) + '</span>' : '') + '</span>';
    rows += '<tr><td><span class="srv-ip">' + esc(x.ip) + '</span>' + (x.v6 ? '<span class="v6-tag">v6</span>' : '') + '</td>' +
      '<td>' + opHtml + '</td><td style="width:36px">' + copyBtn(x.ip) + '</td></tr>';
  });
  body.innerHTML = '<table class="srv-table"><tr><th>IP 地址</th><th>运营商</th><th style="width:36px"></th></tr>' + rows + '</table>';
}

function copyIps() {
  if (!ips.length) { showToast('暂无 IP 可复制'); return; }
  copyText(ips.map(x => x.ip).join('\n'), 'IP 已复制');
}

function updateSourceBadge() {
  const badge = document.getElementById('srcBadge');
  if (!usedSources.size) return;
  const names = [...usedSources].map(k => SOURCES[k].label);
  badge.textContent = '线路：' + names.join(' → ');
  badge.className = 'badge' + (usedSources.size > 1 ? ' warn' : ' ok');
  badge.title = usedSources.size > 1 ? '主线路失败，已自动切换备用线路' : '查询正常';
}

/* ================= 入口 ================= */

function fillExample(d) {
  document.getElementById('domainInput').value = d;
  startQuery();
}

document.getElementById('domainInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') startQuery();
});
