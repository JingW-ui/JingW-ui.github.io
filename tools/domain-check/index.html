<style>

<script src="../common.js"></script>
<script>
'use strict';

/* ================= 常量与字典 ================= */

const RECORD_TYPES = [
  { key: 'A',     num: 1,   zh: 'IPv4 地址' },
  { key: 'AAAA',  num: 28,  zh: 'IPv6 地址' },
  { key: 'CNAME', num: 5,   zh: '别名记录' },
  { key: 'MX',    num: 15,  zh: '邮件交换' },
  { key: 'NS',    num: 2,   zh: '域名服务器' },
  { key: 'TXT',   num: 16,  zh: '文本记录' },
  { key: 'SOA',   num: 6,   zh: '权威起始' },
  { key: 'CAA',   num: 257, zh: '证书授权策略' },
];
const TYPE_META = {};
RECORD_TYPES.forEach(t => TYPE_META[t.key] = t);

const DNS_ERRORS = { 1: '格式错误 (FormErr)', 2: '服务器失败 (ServFail)', 3: '域名不存在 (NXDOMAIN)', 4: '未实现 (NotImp)', 5: '拒绝应答 (Refused)' };

/* DoH 双线路：阿里云为主（国内可达），Cloudflare 回退（国际） */
const SOURCES = {
  alidns: {
    label: '阿里云 DoH',
    build: (name, type) => 'https://dns.alidns.com/resolve?name=' + encodeURIComponent(name) + '&type=' + type,
    init: {},
  },
  cloudflare: {
    label: 'Cloudflare DoH',
    build: (name, type) => 'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(name) + '&type=' + type,
    init: { headers: { accept: 'application/dns-json' } },
  },
};
let curSource = 'alidns'; // 会话内记忆上一次成功的线路

/* CNAME / 建站平台 / CDN 指纹 */
const CNAME_SERVICES = [
  [/cloudflare(\.net|\.com)|pages\.dev/i, 'Cloudflare', 'CDN'],
  [/vercel-dns\.com|vercel\.app/i, 'Vercel', '建站平台'],
  [/netlify\.(app|com|globalcdn)/i, 'Netlify', '建站平台'],
  [/github\.io/i, 'GitHub Pages', '建站平台'],
  [/ghs\.googlehosted\.com/i, 'Google 主机托管', '建站平台'],
  [/web\.app|firebaseapp\.com/i, 'Firebase Hosting', '建站平台'],
  [/herokudns\.com|herokuapp\.com/i, 'Heroku', '建站平台'],
  [/azurewebsites\.net|cloudapp\.azure|trafficmanager\.net|azureedge\.net/i, 'Microsoft Azure', '建站平台'],
  [/cloudfront\.net/i, 'AWS CloudFront', 'CDN'],
  [/edgekey\.net|edgesuite\.net|akamai/i, 'Akamai', 'CDN'],
  [/fastly\.net/i, 'Fastly', 'CDN'],
  [/dnsv1\.com|tcdn\.qq\.com/i, '腾讯云 CDN', 'CDN'],
  [/kunlun(gr|sl|ea|sc|hc)?\.(com|cn)|aliyuncs\.com|aliyunwaf/i, '阿里云 CDN/云', 'CDN'],
  [/cdnhwc\d?\.|myhuaweicdn|huaweicdn/i, '华为云 CDN', 'CDN'],
  [/aicdn\.com|upyun/i, '又拍云 CDN', 'CDN'],
  [/qiniudns|qiniuio|qiniu\.com/i, '七牛云 CDN', 'CDN'],
  [/jomodns|bdydns|baidubce|jomodns\.com/i, '百度智能云 CDN', 'CDN'],
  [/lxdns\.com|wscdn|chinanetcenter/i, '网宿 CDN', 'CDN'],
  [/cdn77\.org/i, 'CDN77', 'CDN'],
  [/bunnycdn/i, 'Bunny CDN', 'CDN'],
  [/edgecast|edg\.io/i, 'Edgio (Edgecast)', 'CDN'],
  [/stackpath|stackassets/i, 'StackPath', 'CDN'],
  [/myqcloud\.com/i, '腾讯云 COS/云', '对象存储'],
  [/oss\.|aliyuncs\.com/i, '阿里云 OSS/云', '对象存储'],
  [/myhuaweicloud/i, '华为云 OBS', '对象存储'],
  [/amazonaws\.com/i, 'AWS (S3/LightSail)', '云服务'],
];

/* NS 托管商指纹 */
const NS_PROVIDERS = [
  [/\.cloudflare\.com$/i, 'Cloudflare DNS'],
  [/alibabadns\.com|hichina\.com$/i, '阿里云（万网）DNS'],
  [/\.dnspod\.(net|cn)$/i, 'DNSPod（腾讯云）'],
  [/awsdns-\d+\.net$/i, 'AWS Route 53'],
  [/azure-dns|azuredns/i, 'Microsoft Azure DNS'],
  [/\.googledomains\.com$|^ns\d\.google\.com$/i, 'Google Cloud DNS'],
  [/registrar-servers\.com$/i, 'Namecheap'],
  [/domaincontrol\.com$/i, 'GoDaddy'],
  [/dns-parking\.com$/i, 'Hostinger'],
  [/\.he\.net$/i, 'Hurricane Electric'],
  [/cloudns\.(net|com)$/i, 'ClouDNS'],
  [/\.verisign-dns\.com$|verisign/i, 'Verisign'],
  [/\.ns\.cloudflare|^ns\d\.cloudflare/i, 'Cloudflare DNS'],
  [/\.xn--|\.nic\./i, null], // 忽略
  [/\.towerzone|^ns\d\.tencent/i, '腾讯云'],
];

/* MX 邮箱服务商指纹（顺序即优先级） */
const MX_PROVIDERS = [
  [/aspmx.*\.google\.com|google(mail)?\.com$/i, 'Google Workspace'],
  [/protection\.outlook\.com|outlook\.com$/i, 'Microsoft 365'],
  [/mxhichina\.com|alimail/i, '阿里云邮箱'],
  [/mxbiz.*\.qq\.com|exmail/i, '腾讯企业邮箱'],
  [/\.qq\.com$/i, 'QQ 邮箱'],
  [/qiye\.163\.com|\.163\.com$|\.126\.com$/i, '网易邮箱'],
  [/zoho/i, 'Zoho Mail'],
  [/yandex/i, 'Yandex 360'],
  [/secureserver\.net$/i, 'GoDaddy 邮件'],
  [/messagingengine\.com|fastmail/i, 'Fastmail'],
  [/migadu/i, 'Migadu'],
  [/improvmx/i, 'ImprovMX'],
  [/icloud\.com|\.apple\.com$/i, 'iCloud 邮件'],
  [/mailgun/i, 'Mailgun'],
  [/sendgrid/i, 'SendGrid'],
  [/amazonses|amazonaws/i, 'Amazon SES'],
  [/mx\.cloudflare\.(net|com)|cloudflare/i, 'Cloudflare Email Routing'],
  [/feishu|larksuite/i, '飞书邮箱'],
  [/mail\.ru$/i, 'Mail.ru'],
];

/* Cloudflare 出口 IP 常见前缀（启发式，仅提示"疑似"） */
const CF_IP_V4 = ['104.16.','104.17.','104.18.','104.19.','104.20.','104.21.','104.22.','104.23.','104.24.','104.25.','104.26.','104.27.',
  '172.64.','172.65.','172.66.','172.67.','172.68.','172.69.','172.70.','172.71.',
  '162.158.','162.159.','188.114.96.','188.114.97.','198.41.192.','198.41.200.','198.41.208.','198.41.216.','198.41.224.','198.41.232.','198.41.240.','198.41.248.',
  '131.0.72.','141.101.64.','141.101.65.','141.101.66.','141.101.67.','141.101.68.','141.101.69.','141.101.70.','141.101.71.',
  '108.162.192.','108.162.200.','108.162.216.','108.162.224.','108.162.232.','108.162.240.','108.162.248.',
  '190.93.240.','190.93.244.','190.93.248.','103.21.244.','103.22.200.','103.31.4.'];

/* ================= 状态 ================= */

let curDomain = '';           // 当前查询的域名（punycode）
let displayDomain = '';       // 展示用（原样输入）
let lastResults = {};         // type -> {state, answers, source, ms, json, chain}
let queryStart = 0;
let usedSources = new Set();
let queryToken = 0;           // 防止并发查询串台
let pending = new Set();      // 尚未返回的记录类型

/* ================= 域名处理 ================= */

function normalizeDomain(input) {
  let s = String(input || '').trim().toLowerCase();
  s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//, ''); // 去协议
  s = s.split(/[/?#]/)[0];                      // 去路径
  s = s.split('@').pop();                       // 去 userinfo
  s = s.split(':')[0];                          // 去端口
  s = s.replace(/\.+$/, '');                    // 去末尾点
  if (!s) throw new Error('请输入域名');
  if (/^[\d.]+$/.test(s)) throw new Error('这是 IP 地址而非域名，请输入域名（如 example.com）');
  if (s.includes(':')) throw new Error('这是 IPv6 地址而非域名，请输入域名');
  if (!s.includes('.')) throw new Error('请输入完整域名（如 example.com）');
  let puny;
  try { puny = new URL('http://' + s).hostname; } // 浏览器自动完成 IDN → punycode
  catch (e) { throw new Error('域名格式不正确'); }
  if (!/^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)+$/.test(puny)) {
    throw new Error('域名格式不正确');
  }
  return { puny: puny, display: s };
}

/* ================= DoH 查询层 ================= */

async function fetchJson(url, init, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal }, init || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* 先走当前线路，失败自动切备用线路重试一次 */
async function dohQuery(name, type) {
  const order = curSource === 'alidns' ? ['alidns', 'cloudflare'] : ['cloudflare', 'alidns'];
  let lastErr = null;
  for (const key of order) {
    const src = SOURCES[key];
    try {
      const t0 = performance.now();
      const json = await fetchJson(src.build(name, type), src.init, 8000);
      curSource = key; usedSources.add(key);
      return { json: json, source: key, ms: Math.round(performance.now() - t0) };
    } catch (e) { lastErr = e; }
  }
  throw (lastErr || new Error('查询失败'));
}

/* ================= 查询编排 ================= */

async function startQuery() {
  const input = document.getElementById('domainInput');
  let nd;
  try { nd = normalizeDomain(input.value); }
  catch (e) { showToast(e.message); input.focus(); return; }

  const token = ++queryToken;
  curDomain = nd.puny; displayDomain = nd.display;
  lastResults = {}; usedSources = new Set(); queryStart = performance.now();
  pending = new Set(RECORD_TYPES.map(t => t.key));
  document.getElementById('queryBtn').disabled = true;
  input.disabled = true;
  document.getElementById('resultsCard').hidden = false;
  renderAll();
  try {
    await Promise.all(RECORD_TYPES.map(t => runOne(t, token)));
  } finally {
    if (token === queryToken) {
      document.getElementById('queryBtn').disabled = false;
      input.disabled = false;
    }
  }
  if (token !== queryToken) return;
  renderAll();
}

async function runOne(t, token) {
  try {
    const r = await dohQuery(curDomain, t.num);
    if (token !== queryToken) return;
    const answers = [];
    const chain = [];
    (r.json.Answer || []).forEach(a => {
      if (a.type === t.num) answers.push({ value: a.data, ttl: a.TTL });
      else if (a.type === 5) chain.push({ value: a.data, ttl: a.TTL });
    });
    const hasData = answers.length || (t.key === 'CNAME' && chain.length);
    const st = r.json.Status === 0 ? (hasData ? 'ok' : 'empty') : 'dnserror';
    lastResults[t.key] = {
      state: st, answers: answers, chain: chain,
      status: r.json.Status, source: r.source, ms: r.ms, json: r.json,
    };
  } catch (e) {
    if (token !== queryToken) return;
    lastResults[t.key] = { state: 'network', message: (e && e.name === 'AbortError') ? '请求超时' : (e.message || '网络错误'), source: null };
  }
  pending.delete(t.key);
  renderAll();
  updateSourceBadge();
}

/* ================= 渲染 ================= */

function renderAll() {
  const body = document.getElementById('resultsBody');
  if (!body) return;
  if (pending.size === RECORD_TYPES.length) {
    body.innerHTML = '<div class="loading-line"><span class="spin"></span>查询中…</div>';
    return;
  }
  const a = lastResults.A;
  if (a && a.state === 'dnserror' && a.status === 3) {
    body.innerHTML = '<div class="rec-error">域名不存在或尚未注册（NXDOMAIN）</div>';
    return;
  }
  let html = '';
  const emptyTypes = [];
  RECORD_TYPES.forEach(t => {
    const r = lastResults[t.key];
    if (!r || pending.has(t.key)) return;
    if (r.state === 'ok' && !r.answers.length) { emptyTypes.push(t.key); return; }
    html += groupHtml(t.key, r);
  });
  if (pending.size === 0) {
    if (RECORD_TYPES.every(t => lastResults[t.key] && lastResults[t.key].state === 'network')) {
      body.innerHTML = '<div class="rec-error">两条 DoH 线路均不可达，查询失败。<button class="btn btn-sm" style="margin-left:8px" onclick="retryAll()">重试</button></div>';
      return;
    }
    const okCount = RECORD_TYPES.filter(t => lastResults[t.key] && lastResults[t.key].state === 'ok' && lastResults[t.key].answers.length).length;
    const tags = collectAllTags();
    const srcNames = [...usedSources].map(k => SOURCES[k].label);
    const cost = Math.round(performance.now() - queryStart);
    let block = '<div class="sum-meta" style="margin:0"><b>' + esc(displayDomain) + '</b> · ' + esc(srcNames.join(' → ')) + ' · ' + cost + ' ms · ' + okCount + '/' + RECORD_TYPES.length + ' 类有记录</div>';
    const chips = tags.map(tag => '<span class="tag"><b>' + esc(tag.label) + '</b><span class="tag-kind">' + esc(KIND_LABEL[tag.kind] || tag.kind) + '</span></span>').join('');
    block += '<div class="interp" style="margin-top:8px">' + (chips || '<span class="rec-empty">未识别出已知服务指纹</span>') + '</div>';
    html = '<div class="sum-block">' + block + '</div>' + html +
      (emptyTypes.length ? '<div class="rnone">' + esc(emptyTypes.join(' / ')) + ' 无记录</div>' : '');
  } else if (html) {
    html += '<div class="loading-line" style="margin-top:12px"><span class="spin"></span>剩余类型查询中…</div>';
  } else {
    html = '<div class="loading-line"><span class="spin"></span>查询中…</div>';
  }
  body.innerHTML = html;
}

function groupHtml(key, r) {
  const t = TYPE_META[key];
  let head = '<div class="rgroup-head"><span class="rkey">' + key + '</span><span class="rzh">' + esc(t.zh) + '</span>';
  if (r.state === 'ok') {
    head += '<span class="rcount">' + r.answers.length + ' 条</span><span class="rsrc">' + esc(SOURCES[r.source].label) + ' · ' + r.ms + 'ms</span>';
  } else if (r.state === 'dnserror') {
    head += '<span class="badge bad">' + esc(DNS_ERRORS[r.status] || ('Status ' + r.status)) + '</span>';
  } else {
    head += '<span class="badge bad">查询失败</span>';
  }
  head += '</div>';

  let bodyHtml = '';
  if (r.state === 'ok') {
    if (key === 'CNAME' && !r.answers.length && r.chain.length) {
      bodyHtml = '<table class="rec-table"><tr><th style="width:56px">TTL</th><th>别名（来自 A/AAAA 应答链）</th><th style="width:36px"></th></tr>' +
        r.chain.map(rec => '<tr><td class="rec-ttl">' + rec.ttl + 's</td><td><span class="rec-val">' + esc(rec.value) + '</span></td><td>' + copyBtn(rec.value) + '</td></tr>').join('') + '</table>';
    } else if (key === 'SOA') {
      bodyHtml = valueCell(key, r.answers[0]);
    } else {
      bodyHtml = '<table class="rec-table"><tr><th style="width:56px">TTL</th><th>记录值</th><th style="width:36px"></th></tr>' +
        r.answers.map(rec => '<tr><td class="rec-ttl">' + rec.ttl + 's</td><td>' + valueCell(key, rec) + '</td><td>' + copyBtn(rec.value) + '</td></tr>').join('') + '</table>';
    }
    const tags = interpret(key, r).tags;
    if (tags.length) {
      bodyHtml += '<div class="interp">' +
        tags.map(tag => '<span class="tag"><b>' + esc(tag.label) + '</b><span class="tag-kind">' + esc(tag.kind) + '</span></span>').join('') + '</div>';
    }
  } else if (r.state === 'dnserror') {
    const msg = DNS_ERRORS[r.status] || ('Status ' + r.status);
    bodyHtml = '<div class="rec-empty">DNS 错误：' + esc(msg) + '</div>';
  } else {
    bodyHtml = '<div class="rec-error">✕ ' + esc(r.message || '网络错误') + '，两条线路均不可达。<button class="btn btn-sm" style="margin-left:8px" onclick="retryOne(\'' + key + '\')">重试</button></div>';
  }

  let html = '<div class="rgroup">' + head + bodyHtml;
  if (r.json) html += '<details class="raw"><summary>原始应答 JSON</summary><pre>' + esc(JSON.stringify(r.json, null, 1)) + '</pre></details>';
  return html + '</div>';
}

function esc(s) {
  var h = window.escapeHtml ? escapeHtml(s) : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 关键：TXT 等记录值可被域名持有者任意控制，且 DoH 返回的 TXT 值自带双引号，
  // 必须转义引号，防止 data-v="..." 属性逃逸造成 XSS
  return h.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function valueCell(key, rec) {
  let html = '';
  if (key === 'MX') {
    const m = String(rec.value).trim().match(/^(\d+)\s+(\S+)$/);
    if (m) html = '优先级 <b>' + m[1] + '</b> → <span class="rec-val">' + esc(m[2]) + '</span>';
  } else if (key === 'SOA') {
    const f = String(rec.value).trim().split(/\s+/);
    if (f.length >= 7) {
      html = '<table class="rec-table" style="font-size:12px">' +
        '<tr><th>主 DNS</th><td class="rec-val">' + esc(f[0]) + '</td></tr>' +
        '<tr><th>管理员</th><td class="rec-val">' + esc(f[1].replace(/^([^.]*)\./, '$1@')) + '</td></tr>' +
        '<tr><th>序列号</th><td class="rec-val">' + esc(f[2]) + '</td><th style="border:none"></th></tr>' +
        '<tr><th>刷新 / 重试</th><td class="rec-val">' + esc(f[3]) + ' / ' + esc(f[4]) + '</td></tr>' +
        '<tr><th>过期 / 默认 TTL</th><td class="rec-val">' + esc(f[5]) + ' / ' + esc(f[6]) + '</td></tr></table>';
    }
  }
  if (!html) html = '<span class="rec-val">' + esc(rec.value) + '</span>';
  return html;
}

function copyBtn(text) {
  return '<button class="copy-mini" title="复制此值" onclick="copyText(this.dataset.v)" data-v="' + esc(text) + '">⎘</button>';
}

function retryOne(key) {
  const t = TYPE_META[key];
  if (!t || !curDomain || pending.has(key)) return;
  pending.add(key);
  renderAll();
  runOne(t, queryToken);
}

function retryAll() {
  if (!curDomain) return;
  pending = new Set(RECORD_TYPES.map(t => t.key));
  renderAll();
  RECORD_TYPES.forEach(t => runOne(t, queryToken));
}

function updateSourceBadge() {
  const badge = document.getElementById('srcBadge');
  if (!usedSources.size) return;
  const names = [...usedSources].map(k => SOURCES[k].label);
  badge.textContent = '线路：' + names.join(' → ');
  badge.className = 'badge' + (usedSources.size > 1 ? ' warn' : ' ok');
  badge.title = usedSources.size > 1 ? '主线路失败，已自动切换备用线路' : '查询正常';
}

/* ================= 服务解释引擎 ================= */

function matchDict(text, dict) {
  for (const [re, name, kind] of dict) {
    if (re.test(text)) return { label: name, kind: kind };
  }
  return null;
}

function explainTxtValue(v) {
  if (/^v=spf1/i.test(v)) {
    const inc = (v.match(/include:(\S+)/g) || []).map(x => x.replace('include:', ''));
    const all = /-all$/.test(v) ? '拒绝伪造' : /~all$/.test(v) ? '软失败' : '?all 表示不限制';
    return { tag: { label: 'SPF 发件策略', kind: '邮件安全' }, note: '声明了允许替该域名发信的服务器（' + all + '）' + (inc.length ? '，涉及：' + inc.join(', ') : '') };
  }
  if (/^v=DMARC1/i.test(v)) {
    const p = (v.match(/p=(\w+)/i) || [])[1] || 'none';
    return { tag: { label: 'DMARC 策略 (p=' + p + ')', kind: '邮件安全' }, note: '定义了伪造邮件的处置策略：' + (p === 'reject' ? '直接拒收' : p === 'quarantine' ? '进垃圾箱' : '仅上报') };
  }
  if (/v=DKIM1/i.test(v) || /\.domainkey\./i.test(v)) return { tag: { label: 'DKIM 公钥', kind: '邮件安全' }, note: '用于邮件签名防篡改' };
  if (/google-site-verification/i.test(v)) return { tag: { label: 'Google 站点验证', kind: '站点归属' }, note: '向 Google Search Console 证明域名所有权' };
  if (/^MS=ms\d+$/i.test(v)) return { tag: { label: 'Microsoft 365 域验证', kind: '站点归属' }, note: '用于绑定 Microsoft 365 服务' };
  if (/facebook-domain-verification/i.test(v)) return { tag: { label: 'Meta 域验证', kind: '站点归属' }, note: '向 Facebook/Meta 证明域名所有权' };
  if (/github-pages-challenge/i.test(v)) return { tag: { label: 'GitHub Pages 验证', kind: '站点归属' }, note: '自定义域绑定 GitHub Pages 的归属验证' };
  if (/tencent-?site-?verification/i.test(v)) return { tag: { label: '腾讯云验证', kind: '站点归属' } };
  if (/aliyun-?site-?verification/i.test(v)) return { tag: { label: '阿里云验证', kind: '站点归属' } };
  if (/atlassian-domain-verification/i.test(v)) return { tag: { label: 'Atlassian 域验证', kind: '站点归属' } };
  if (/keybase-site-verification/i.test(v)) return { tag: { label: 'Keybase 验证', kind: '站点归属' } };
  if (/brave-ledger-verification/i.test(v)) return { tag: { label: 'Brave 验证', kind: '站点归属' } };
  if (/globalsign|sectigo|comodo|digicert|trust-provider/i.test(v)) return { tag: { label: 'CA 域名验证', kind: '站点归属' }, note: '证书签发时的域名控制权验证记录' };
  return null;
}

function explainCAA(v) {
  const m = v.match(/^\d+\s+(issue|issuewild|iodef)\s+"([^"]*)"/);
  if (!m) return null;
  if (m[1] === 'iodef') return { tag: { label: 'CAA 违规上报', kind: '安全策略' }, note: '证书误签发时上报至 ' + m[2] };
  const ca = m[2] || '（任何 CA）';
  return { tag: { label: 'CAA 限定 CA: ' + ca, kind: '安全策略' }, note: (m[1] === 'issuewild' ? '通配符证书' : '证书') + '只允许由 ' + ca + ' 签发' };
}

/* 汇总所有卡片的解释结果，生成概览 */
function interpret(key, r) {
  const tags = [];
  if (key === 'CNAME' || key === 'A' || key === 'AAAA') {
    const targets = [];
    if (key === 'CNAME') r.answers.concat(r.chain || []).forEach(a => targets.push(a.value));
    if (key !== 'CNAME') (r.chain || []).forEach(a => targets.push(a.value));
    const seen = new Set();
    targets.forEach(tgt => {
      const hit = matchDict(tgt, CNAME_SERVICES);
      if (hit && !seen.has(hit.label)) { seen.add(hit.label); tags.push(hit); }
    });
  }
  if (key === 'A') {
    const cf = r.answers.some(a => CF_IP_V4.some(p => String(a.value).indexOf(p) === 0));
    if (cf && !tags.some(t => t.label.indexOf('Cloudflare') >= 0)) tags.push({ label: '疑似 Cloudflare 接入', kind: 'CDN' });
    if (r.answers.length > 1) tags.push({ label: r.answers.length + ' 个 IPv4 负载均衡', kind: '网络' });
  }
  if (key === 'AAAA' && r.answers.length) tags.push({ label: 'IPv6 已启用', kind: '网络' });
  if (key === 'NS') {
    r.answers.forEach(a => {
      const hit = matchDict(a.value, NS_PROVIDERS);
      if (hit && hit.label && !tags.some(t => t.label === hit.label)) tags.push(hit);
    });
  }
  if (key === 'MX') {
    r.answers.forEach(a => {
      const host = (String(a.value).trim().match(/^\d+\s+(\S+)$/) || [])[1];
      if (!host) return;
      const hit = matchDict(host, MX_PROVIDERS);
      if (hit && !tags.some(t => t.label === hit.label)) tags.push(hit);
    });
    if (!tags.length && r.answers.length) tags.push({ label: '自建/独立邮件服务', kind: '邮箱' });
  }
  if (key === 'TXT') {
    r.answers.forEach(a => {
      const hit = explainTxtValue(a.value);
      if (hit && !tags.some(t => t.label === hit.tag.label)) tags.push(hit.tag);
    });
  }
  if (key === 'CAA') {
    r.answers.forEach(a => {
      const hit = explainCAA(a.value);
      if (hit && !tags.some(t => t.label === hit.tag.label)) tags.push(hit.tag);
    });
  }
  return { tags: tags };
}

/* ================= 概览与报告 ================= */

const KIND_ORDER = { 'DNS 托管': 0, 'CDN': 1, '建站平台': 1, '云服务': 2, '对象存储': 2, '邮箱': 3, '邮件安全': 4, '安全策略': 5, '站点归属': 6, '网络': 7 };
const KIND_LABEL = { 'CDN': 'CDN / 建站', '建站平台': 'CDN / 建站', '云服务': '云服务', '对象存储': '云服务' };

function collectAllTags() {
  const all = [];
  RECORD_TYPES.forEach(t => {
    const r = lastResults[t.key];
    if (r && (r.state === 'ok')) {
      interpret(t.key, r).tags.forEach(tag => {
        if (!all.some(x => x.label === tag.label)) all.push(tag);
      });
    }
  });
  all.sort((a, b) => (KIND_ORDER[a.kind] || 9) - (KIND_ORDER[b.kind] || 9));
  return all;
}

function buildReport() {
  const lines = [];
  lines.push('域名信息查询报告');
  lines.push('================');
  lines.push('域名：' + displayDomain + (displayDomain !== curDomain ? ' (punycode: ' + curDomain + ')' : ''));
  lines.push('时间：' + new Date().toLocaleString('zh-CN'));
  lines.push('线路：' + ([...usedSources].map(k => SOURCES[k].label).join(' → ') || '-'));
  lines.push('');
  const tags = collectAllTags();
  if (tags.length) {
    lines.push('服务识别：' + tags.map(t => t.label + '（' + (KIND_LABEL[t.kind] || t.kind) + '）').join('、'));
    lines.push('');
  }
  RECORD_TYPES.forEach(t => {
    const r = lastResults[t.key];
    lines.push('[' + t.key + ' · ' + t.zh + ']');
    if (!r) { lines.push('  (未查询)'); return; }
    if (r.state === 'ok') {
      r.answers.forEach(a => lines.push('  ' + a.value + '   (TTL ' + a.ttl + 's)'));
    } else if (r.state === 'empty') lines.push('  (无记录)');
    else if (r.state === 'dnserror') lines.push('  (错误: ' + (DNS_ERRORS[r.status] || r.status) + ')');
    else lines.push('  (查询失败: ' + (r.message || '') + ')');
    lines.push('');
  });
  lines.push('—— 由 JingW-UI 域名信息查询生成，记录值为查询时刻快照，仅供参考。');
  return lines.join('\n');
}

function copyReport() { copyText(buildReport(), '报告已复制'); }

function downloadReport() {
  downloadBlob(buildReport(), 'dns-' + curDomain.replace(/[^a-z0-9.-]/gi, '_') + '.txt');
}

/* ================= 入口 ================= */

function fillExample(d) {
  document.getElementById('domainInput').value = d;
  startQuery();
}

document.getElementById('domainInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') startQuery();
});
</script>
