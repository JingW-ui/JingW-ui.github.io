<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站服务器查询 - 域名 IP 与运营商识别</title>
<meta name="description" content="输入域名，一键查询网站服务器解析到的 IP 地址与运营商（阿里云、腾讯云、AWS、Cloudflare 等），支持 IPv6 与 CDN 识别。">
<style>
:root {
  --bg: #ffffff; --card: #ffffff; --card-2: #f6f8fa;
  --border: #d0d7de; --text: #111111; --muted: #57606a; --tertiary: #8b949e;
  --blue: #0969da; --green: #238636; --green-b: #1a7f37;
  --green-bg: rgba(35,134,54,.08); --green-border: rgba(35,134,54,.2);
  --red: #cf222e;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04); --shadow-md: 0 3px 12px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  min-height: 100vh; padding: 0 24px 40px;
  display: flex; flex-direction: column;
}
.wrap { max-width: 960px; margin: 0 auto; width: 100%; flex: 1; }
body.centered .wrap { display: flex; flex-direction: column; justify-content: flex-start; }
body.centered .hero-pad { margin-top: 14vh; }

header { text-align: center; padding: 64px 0 8px; opacity: 0; transform: translateY(-30px); animation: headerIn .8s cubic-bezier(.16,1,.3,1) .1s forwards; }
@keyframes headerIn { to { opacity: 1; transform: translateY(0); } }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -.03em; }
h1 .accent { color: var(--green); }
.sub { color: var(--muted); font-size: 1rem; margin-top: 8px; opacity: 0; animation: fadeUp .6s ease .4s forwards; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; box-shadow: var(--shadow-sm);
  margin-top: 28px;
}
.query-row { display: flex; gap: 10px; }
.query-row input {
  flex: 1; min-width: 0; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 100px; color: var(--text); padding: 10px 18px; font: inherit;
  font-size: .95rem; outline: none; transition: border-color .25s ease, box-shadow .25s ease;
}
.query-row input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(35,134,54,.1); }
.query-row input:disabled { opacity: .55; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--green); color: #fff; border: 1.5px solid var(--green);
  border-radius: 100px; padding: 8px 22px; font: inherit; font-weight: 600;
  font-size: .85rem; cursor: pointer; transition: all .25s ease;
  box-shadow: 0 2px 8px rgba(35,134,54,.25);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost {
  background: var(--bg); color: var(--muted); border-color: var(--border);
  box-shadow: none; font-weight: 500;
}
.btn.ghost:hover { color: var(--green); border-color: var(--green); filter: none; }
.btn.sm { padding: 5px 14px; font-size: .78rem; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.ex-chip {
  font-size: .8rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: 3px 12px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--card-2); color: var(--muted); cursor: pointer; transition: all .2s ease;
}
.ex-chip:hover { border-color: var(--green-border); background: var(--green-bg); color: var(--green-b); }
.spacer { flex: 1 1 auto; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600;
  padding: 3px 11px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--border);
  background: var(--bg); color: var(--muted);
}
.badge.ok { background: var(--green-bg); color: var(--green-b); border-color: var(--green-border); }
.badge.warn { background: rgba(154,103,0,.08); color: #9a6700; border-color: rgba(154,103,0,.2); }

.results-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 12px; }
.results-head h2 { font-size: 1.05rem; font-weight: 700; }
.results-head .count { font-size: .75rem; font-weight: 500; color: var(--tertiary); margin-left: 8px; }

.srv {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; margin-bottom: 10px; transition: all .25s ease;
  opacity: 0; transform: translateY(24px);
}
.srv.visible { animation: cardIn .5s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
.srv.shown { opacity: 1; transform: none; }
.srv.skel { opacity: 1; transform: none; }
.srv:hover { border-color: var(--green-border); background: var(--green-bg); box-shadow: var(--shadow-md); }
.srv-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.srv-ip {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 1.05rem; font-weight: 700; word-break: break-all;
  display: inline-flex; align-items: center; gap: 8px;
}
.copy-mini { border: none; background: none; color: var(--tertiary); cursor: pointer; font-size: .85rem; padding: 0 2px; transition: color .2s; }
.copy-mini:hover { color: var(--green); }
.v6-tag { font-size: .62rem; font-weight: 600; color: var(--tertiary); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
.srv-op { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.b-good { background: var(--green-bg); color: var(--green-b); border-color: var(--green-border); }
.b-cold { background: rgba(139,148,158,.08); color: var(--tertiary); border-color: rgba(139,148,158,.2); }
.city { font-size: .82rem; color: var(--muted); }
.skeleton {
  background: linear-gradient(90deg, #f6f8fa 25%, #eaeef2 37%, #f6f8fa 63%);
  background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 6px; display: inline-block;
}
@keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.sk-ip { width: 180px; height: 18px; }
.sk-op { width: 130px; height: 16px; }

.empty { text-align: center; color: var(--tertiary); padding: 44px 10px; font-size: .92rem; }
.error-line { color: var(--red); font-size: .9rem; }

/* 历史记录（localStorage，仅存本机） */
.history-wrap { margin-top: 14px; }
.history-toggle {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: .8rem; padding: 4px 0;
  display: inline-flex; align-items: center; gap: 5px; transition: color .2s;
}
.history-toggle:hover { color: var(--green); }
.history-toggle .chev { display: inline-block; font-size: .7rem; transition: transform .15s; }
.history-toggle .chev.open { transform: rotate(90deg); }
.history-list { display: none; margin-top: 6px; }
.history-list.open { display: block; }
.history-head { display: flex; justify-content: flex-end; }
.history-clear { font-size: .7rem; color: var(--tertiary); cursor: pointer; background: none; border: none; padding: 2px 4px; }
.history-clear:hover { color: var(--red); text-decoration: underline; }
.history-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: .8rem;
  color: var(--muted); transition: all .2s; border: 1px solid transparent;
}
.history-item:hover { background: var(--card-2); color: var(--text); border-color: var(--border); }
.history-item.active { border-color: var(--green-border); background: var(--green-bg); color: var(--green-b); }
.history-item .hi-domain {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
}
.history-item .hi-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.history-item .hi-sub { font-size: .68rem; color: var(--tertiary); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item .hi-time { font-size: .68rem; color: var(--tertiary); white-space: nowrap; }

footer { text-align: center; color: var(--tertiary); font-size: .75rem; margin-top: 32px; padding: 0 12px 16px; opacity: 0; animation: fadeUp .6s ease .55s forwards; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--tertiary); }

@media (max-width: 640px) {
  body { padding: 0 12px 28px; }
  body.centered .hero-pad { margin-top: 8vh; }
  header { padding: 40px 0 6px; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); }
  .sub { font-size: .85rem; }
  .card { padding: 12px; margin-top: 20px; }
  .query-row { flex-direction: row; }
  .query-row input { padding: 9px 14px; font-size: .85rem; }
  .btn { padding: 8px 16px; font-size: .8rem; }
  .srv { padding: 13px 14px; }
  .srv-top { flex-direction: column; align-items: flex-start; gap: 8px; }
  .srv-ip { font-size: .95rem; }
  .srv-op { justify-content: flex-start; }
  .empty { padding: 28px 8px; font-size: .8rem; }
  .history-item { font-size: .72rem; padding: 6px 9px; }
  .history-item .hi-sub { display: none; }
}
</style>
</head>
<body class="centered">
<div class="wrap">
  <div class="hero-pad">
    <header>
      <h1>网站<span class="accent">服务器</span>查询</h1>
      <div class="sub">输入域名，看它解析到哪些 IP、服务器在哪家运营商</div>
    </header>

    <section class="card">
      <div class="query-row">
        <input id="domainInput" type="text" placeholder="example.com" autocomplete="off" spellcheck="false">
        <button class="btn" id="queryBtn" onclick="startQuery()">查询</button>
      </div>
      <div class="examples">
        <button class="ex-chip" onclick="fillExample('github.com')">github.com</button>
        <button class="ex-chip" onclick="fillExample('baidu.com')">baidu.com</button>
        <button class="ex-chip" onclick="fillExample('qq.com')">qq.com</button>
        <span class="spacer"></span>
        <span class="badge" id="srcBadge">线路：自动切换</span>
      </div>
    </section>

    <div class="history-wrap">
      <button class="history-toggle" onclick="toggleHistory()">🕘 历史记录<span id="histCount"></span><span class="chev" id="histChev">▸</span></button>
      <div class="history-list" id="histList"></div>
    </div>

    <div class="results-head" id="resultsHead" style="display:none">
      <h2>解析结果<span class="count" id="ipCount"></span></h2>
      <button class="btn ghost sm" onclick="copyIps()">⎘ 复制 IP</button>
    </div>
    <div id="results"></div>

    <footer>查询由浏览器直连公共 DoH（阿里云 → Cloudflare 自动切换）· 运营商数据 ipwho.is / ip.sb · 历史记录仅保存在本浏览器（localStorage），本站不经手查询记录</footer>
  </div>
</div>

<script src="../common.js"></script>
<script>
'use strict';

/* ================= 常量与字典 ================= */

const RECORD_TYPES = [
  { key: 'CNAME', num: 5 },
  { key: 'A',     num: 1 },
  { key: 'AAAA',  num: 28 },
];
const DNS_ERRORS = { 1: '格式错误 (FormErr)', 2: '服务器失败 (ServFail)', 3: '域名不存在 (NXDOMAIN)', 4: '未实现 (NotImp)', 5: '拒绝应答 (Refused)' };

/* DoH 双线路：阿里云为主（国内可达），Cloudflare 回退（国际） */
const SOURCES = {
  alidns: {
    label: '阿里云 DoH',
    build: (name, type) => 'https://dns.alidns.com/resolve?name=' + encodeURIComponent(name) + '&type=' + type,
    init: {},
  },
  cloudflare: {
    label: 'Cloudflare DoH',
    build: (name, type) => 'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(name) + '&type=' + type,
    init: { headers: { accept: 'application/dns-json' } },
  },
};
let curSource = 'alidns';

/* IP 情报双源：主 ipwho.is，备 ip.sb（均 HTTPS + CORS，免 key） */
const IP_SOURCES = {
  ipwho: {
    label: 'ipwho.is',
    url: ip => 'https://ipwho.is/' + encodeURIComponent(ip),
    parse: j => (j && j.success !== false && (j.connection || j.city || j.country))
      ? { org: (j.connection && (j.connection.org || j.connection.isp)) || '', city: j.city || '', country: j.country || '', cc: j.country_code || '' }
      : null,
  },
  ipsb: {
    label: 'ip.sb',
    url: ip => 'https://api.ip.sb/geoip/' + encodeURIComponent(ip),
    parse: j => (j && j.ip)
      ? { org: j.organization || j.isp || j.asn_organization || '', city: j.city || '', country: j.country || '', cc: j.country_code || '' }
      : null,
  },
};
let curIpSource = 'ipwho';

/* CNAME / 建站平台 / CDN 指纹（命中即直接作为运营商结论，跳过 IP 接口） */
const CNAME_SERVICES = [
  [/cloudflare(\.net|\.com)|pages\.dev/i, 'Cloudflare', 'CDN'],
  [/vercel-dns\.com|vercel\.app/i, 'Vercel', '建站平台'],
  [/netlify\.(app|com|globalcdn)/i, 'Netlify', '建站平台'],
  [/github\.io/i, 'GitHub Pages', '建站平台'],
  [/ghs\.googlehosted\.com/i, 'Google 主机托管', '建站平台'],
  [/web\.app|firebaseapp\.com/i, 'Firebase Hosting', '建站平台'],
  [/herokudns\.com|herokuapp\.com/i, 'Heroku', '建站平台'],
  [/azurewebsites\.net|cloudapp\.azure|trafficmanager\.net|azureedge\.net/i, 'Microsoft Azure', '建站平台'],
  [/cloudfront\.net/i, 'AWS CloudFront', 'CDN'],
  [/edgekey\.net|edgesuite\.net|akamai/i, 'Akamai', 'CDN'],
  [/fastly\.net/i, 'Fastly', 'CDN'],
  [/dnsv1\.com|tcdn\.qq\.com/i, '腾讯云 CDN', 'CDN'],
  [/kunlun(gr|sl|ea|sc|hc)?\.(com|cn)|aliyuncs\.com|aliyunwaf/i, '阿里云 CDN/云', 'CDN'],
  [/cdnhwc\d?\.|myhuaweicdn|huaweicdn/i, '华为云 CDN', 'CDN'],
  [/aicdn\.com|upyun/i, '又拍云 CDN', 'CDN'],
  [/qiniudns|qiniuio|qiniu\.com/i, '七牛云 CDN', 'CDN'],
  [/jomodns|bdydns|baidubce/i, '百度智能云 CDN', 'CDN'],
  [/lxdns\.com|wscdn|chinanetcenter/i, '网宿 CDN', 'CDN'],
  [/cdn77\.org/i, 'CDN77', 'CDN'],
  [/bunnycdn/i, 'Bunny CDN', 'CDN'],
  [/edgecast|edg\.io/i, 'Edgio (Edgecast)', 'CDN'],
  [/stackpath|stackassets/i, 'StackPath', 'CDN'],
];

/* org/isp 字符串 → 中文运营商名 */
const ORG_MAP = [
  [/aliyun|alibaba|alicloud|taobao/i, '阿里云'],
  [/tencent|\bqq\b/i, '腾讯云'],
  [/huawei/i, '华为云'],
  [/baidu/i, '百度云'],
  [/volcengine|bytedance|火山/i, '火山引擎'],
  [/ucloud/i, 'UCloud'],
  [/qiniu/i, '七牛云'],
  [/upyun/i, '又拍云'],
  [/jdcloud|jingdong|京东/i, '京东云'],
  [/amazon|aws|\bamzn/i, 'AWS'],
  [/google/i, 'Google'],
  [/microsoft|azure|msft/i, '微软 Azure'],
  [/cloudflare/i, 'Cloudflare'],
  [/oracle/i, 'Oracle 云'],
  [/akamai|linode/i, 'Akamai'],
  [/fastly/i, 'Fastly'],
  [/digitalocean/i, 'DigitalOcean'],
  [/hetzner/i, 'Hetzner'],
  [/ovh/i, 'OVH'],
  [/vultr|choopa/i, 'Vultr'],
  [/chinatelecom|china ?telecom|电信/i, '中国电信'],
  [/china ?unicom|联通/i, '中国联通'],
  [/china ?mobile|cmcc|移动/i, '中国移动'],
  [/cernet|教育网/i, '教育网'],
];

/* ================= 状态 ================= */

let curDomain = '';
let displayDomain = '';
let lastResults = {};
let usedSources = new Set();
let queryToken = 0;
let dnsPending = new Set();
let ips = [];
const ipCache = new Map();
const seenIps = new Set(); // 已播放入场动画的 IP，避免整表重建时重复动画

/* ================= 域名处理 ================= */

function normalizeDomain(input) {
  let s = String(input || '').trim().toLowerCase();
  s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//, '');
  s = s.split(/[/?#]/)[0];
  s = s.split('@').pop();
  s = s.split(':')[0];
  s = s.replace(/\.+$/, '');
  if (!s) throw new Error('请输入域名');
  if (/^[\d.]+$/.test(s)) throw new Error('这是 IP 地址而非域名，请输入域名（如 example.com）');
  if (s.includes(':')) throw new Error('这是 IPv6 地址而非域名，请输入域名');
  if (!s.includes('.')) throw new Error('请输入完整域名（如 example.com）');
  let puny;
  try { puny = new URL('http://' + s).hostname; }
  catch (e) { throw new Error('域名格式不正确'); }
  if (!/^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)+$/.test(puny)) {
    throw new Error('域名格式不正确');
  }
  return { puny: puny, display: s };
}

/* ================= DoH / IP 查询层 ================= */

async function fetchJson(url, init, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal }, init || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

async function dohQuery(name, type) {
  const order = curSource === 'alidns' ? ['alidns', 'cloudflare'] : ['cloudflare', 'alidns'];
  let lastErr = null;
  for (const key of order) {
    const src = SOURCES[key];
    try {
      const t0 = performance.now();
      const json = await fetchJson(src.build(name, type), src.init, 8000);
      curSource = key; usedSources.add(key);
      return { json: json, source: key, ms: Math.round(performance.now() - t0) };
    } catch (e) { lastErr = e; }
  }
  throw (lastErr || new Error('查询失败'));
}

async function ipQuery(ip) {
  const order = curIpSource === 'ipwho' ? ['ipwho', 'ipsb'] : ['ipsb', 'ipwho'];
  let lastErr = null;
  for (const key of order) {
    const src = IP_SOURCES[key];
    try {
      const j = await fetchJson(src.url(ip), {}, 6000);
      const d = src.parse(j);
      if (!d || !d.org) throw new Error('no data');
      curIpSource = key;
      return d;
    } catch (e) { lastErr = e; }
  }
  throw (lastErr || new Error('IP 查询失败'));
}

/* ================= 查询编排 ================= */

async function startQuery() {
  const input = document.getElementById('domainInput');
  let nd;
  try { nd = normalizeDomain(input.value); }
  catch (e) { showToast(e.message); input.focus(); return; }

  document.body.classList.remove('centered');
  const token = ++queryToken;
  curDomain = nd.puny; displayDomain = nd.display;
  lastResults = {}; usedSources = new Set();
  dnsPending = new Set(RECORD_TYPES.map(t => t.key));
  ips = []; seenIps.clear();
  document.getElementById('queryBtn').disabled = true;
  input.disabled = true;
  renderAll();
  try {
    await Promise.all(RECORD_TYPES.map(t => runOne(t, token)));
  } finally {
    if (token === queryToken) {
      document.getElementById('queryBtn').disabled = false;
      input.disabled = false;
    }
  }
  if (token !== queryToken) return;

  buildIpList();
  renderAll();
  if (ips.length) {
    pushHist({ d: displayDomain, t: Date.now(), s: '' });
    const uniq = [...new Set(ips.filter(x => x.op && x.op.state === 'pending').map(x => x.ip))];
    await Promise.all(uniq.map(ip => queryIpInfo(ip, token)));
    if (token === queryToken) {
      const labels = [...new Set(ips.filter(x => x.op && x.op.state === 'ok').map(x => x.op.label))];
      if (labels.length) updateHistSummary(displayDomain, labels.slice(0, 3).join('、') + (labels.length > 3 ? ' 等' : ''));
      renderAll();
    }
  }
}

async function runOne(t, token) {
  try {
    const r = await dohQuery(curDomain, t.num);
    if (token !== queryToken) return;
    const answers = [];
    const chain = [];
    (r.json.Answer || []).forEach(a => {
      if (a.type === t.num) answers.push({ value: a.data, ttl: a.TTL });
      else if (a.type === 5) chain.push({ value: a.data, ttl: a.TTL });
    });
    const hasData = answers.length || (t.key === 'CNAME' && chain.length);
    const st = r.json.Status === 0 ? (hasData ? 'ok' : 'empty') : 'dnserror';
    lastResults[t.key] = {
      state: st, answers: answers, chain: chain,
      status: r.json.Status, source: r.source, ms: r.ms, json: r.json,
    };
  } catch (e) {
    if (token !== queryToken) return;
    lastResults[t.key] = { state: 'network', message: (e && e.name === 'AbortError') ? '请求超时' : (e.message || '网络错误'), source: null };
  }
  dnsPending.delete(t.key);
  renderAll();
  updateSourceBadge();
}

function buildIpList() {
  ips = [];
  const chains = [];
  ['A', 'AAAA', 'CNAME'].forEach(k => {
    const r = lastResults[k];
    if (r && r.chain) r.chain.forEach(c => chains.push(c.value));
  });
  let chainHit = null;
  for (const c of chains) {
    for (const [re, name, kind] of CNAME_SERVICES) {
      if (re.test(c)) { chainHit = { label: name + (kind === 'CDN' ? '（CDN）' : '') }; break; }
    }
    if (chainHit) break;
  }
  ['A', 'AAAA'].forEach(k => {
    const r = lastResults[k];
    if (!r || r.state !== 'ok') return;
    r.answers.forEach(a => {
      const v6 = k === 'AAAA';
      if (ips.some(x => x.ip === a.value)) return;
      ips.push({
        ip: a.value, v6: v6,
        op: chainHit ? { state: 'ok', label: chainHit.label, city: '' } : { state: 'pending' },
      });
    });
  });
}

async function queryIpInfo(ip, token) {
  if (ipCache.has(ip)) {
    const hit = ips.find(x => x.ip === ip);
    if (hit) hit.op = ipCache.get(ip);
    return;
  }
  let op;
  try {
    const d = await ipQuery(ip);
    op = { state: 'ok', label: mapOrg(d.org), city: d.city || d.country || '' };
  } catch (e) {
    op = { state: 'fail' };
  }
  if (token !== queryToken) return;
  ipCache.set(ip, op);
  const hit = ips.find(x => x.ip === ip);
  if (hit) hit.op = op;
  renderAll();
}

function mapOrg(org) {
  const s = String(org || '');
  if (!s) return '未知';
  for (const [re, name] of ORG_MAP) {
    if (re.test(s)) return name;
  }
  return s.length > 42 ? s.slice(0, 42) + '…' : s;
}

/* ================= 渲染 ================= */

function esc(s) {
  var h = window.escapeHtml ? escapeHtml(s) : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 记录值可被域名持有者任意控制，必须转义引号，防止 data-v="..." 属性逃逸造成 XSS
  return h.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderAll() {
  const wrap = document.getElementById('results');
  const head = document.getElementById('resultsHead');
  if (!wrap) return;

  if (dnsPending.size === RECORD_TYPES.length) {
    head.style.display = 'none';
    wrap.innerHTML = '<div class="srv skel"><div class="srv-top"><span class="skeleton sk-ip"></span><span class="skeleton sk-op"></span></div></div>'.repeat(2);
    return;
  }

  const a = lastResults.A;
  if (a && a.state === 'dnserror' && a.status === 3) {
    head.style.display = 'none';
    wrap.innerHTML = '<div class="empty">域名不存在或尚未注册（NXDOMAIN）</div>';
    return;
  }

  if (!ips.length) {
    head.style.display = 'none';
    if (dnsPending.size) {
      wrap.innerHTML = '<div class="empty">查询中…</div>';
      return;
    }
    if (['A', 'AAAA'].every(k => lastResults[k] && lastResults[k].state === 'network')) {
      wrap.innerHTML = '<div class="empty"><span class="error-line">两条 DoH 线路均不可达，查询失败。</span><br><button class="btn sm" style="margin-top:14px" onclick="startQuery()">重试</button></div>';
      return;
    }
    const dnsErr = ['A', 'AAAA'].map(k => lastResults[k]).find(r => r && r.state === 'dnserror');
    if (dnsErr) {
      wrap.innerHTML = '<div class="empty"><span class="error-line">DNS 错误：' + esc(DNS_ERRORS[dnsErr.status] || ('Status ' + dnsErr.status)) + '</span></div>';
      return;
    }
    wrap.innerHTML = '<div class="empty">该域名未解析到 IP 地址。</div>';
    return;
  }

  head.style.display = 'flex';
  document.getElementById('ipCount').textContent = ips.length + ' 个 IP';
  let html = '';
  ips.forEach(x => {
    const fresh = !seenIps.has(x.ip);
    seenIps.add(x.ip);
    let opHtml;
    if (!x.op || x.op.state === 'pending') opHtml = '<span class="skeleton sk-op"></span>';
    else if (x.op.state === 'fail') opHtml = '<span class="badge b-cold">未能识别</span>';
    else opHtml = '<span class="badge b-good">' + esc(x.op.label) + '</span>' + (x.op.city ? '<span class="city">' + esc(x.op.city) + '</span>' : '');
    html += '<div class="srv' + (fresh ? '' : ' shown') + '">' +
      '<div class="srv-top">' +
        '<div class="srv-ip">' + esc(x.ip) + (x.v6 ? '<span class="v6-tag">v6</span>' : '') +
          '<button class="copy-mini" title="复制 IP" onclick="copyText(this.dataset.v)" data-v="' + esc(x.ip) + '">⎘</button>' +
        '</div>' +
        '<div class="srv-op">' + opHtml + '</div>' +
      '</div></div>';
  });
  wrap.innerHTML = html;
  requestAnimationFrame(() => {
    wrap.querySelectorAll('.srv:not(.shown)').forEach(el => el.classList.add('visible'));
  });
}

function copyIps() {
  if (!ips.length) { showToast('暂无 IP 可复制'); return; }
  copyText(ips.map(x => x.ip).join('\n'), 'IP 已复制');
}

function updateSourceBadge() {
  const badge = document.getElementById('srcBadge');
  if (!usedSources.size) return;
  const names = [...usedSources].map(k => SOURCES[k].label);
  badge.textContent = '线路：' + names.join(' → ');
  badge.className = 'badge' + (usedSources.size > 1 ? ' warn' : ' ok');
  badge.title = usedSources.size > 1 ? '主线路失败，已自动切换备用线路' : '查询正常';
}

/* ================= 历史记录（localStorage，仅存本机） ================= */

const LS_KEY = 'dc-history-v1';
const HIST_MAX = 20;
let histOpen = false;

function loadHist() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
}
function saveHist(list) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}
}
/* 同域名去重置顶；超出上限裁剪 */
function pushHist(entry) {
  const list = loadHist().filter(x => x.d !== entry.d);
  list.unshift(entry);
  saveHist(list.slice(0, HIST_MAX));
  renderHist();
}
function updateHistSummary(d, summary) {
  const list = loadHist();
  const e = list.find(x => x.d === d);
  if (e) { e.s = summary; saveHist(list); renderHist(); }
}
function timeAgo(t) {
  const diff = Date.now() - t;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  const d = new Date(t);
  return (d.getMonth() + 1) + '-' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toggleHistory() {
  histOpen = !histOpen;
  document.getElementById('histChev').classList.toggle('open', histOpen);
  renderHist();
}
function renderHist() {
  const list = loadHist();
  document.getElementById('histCount').textContent = list.length ? '（' + list.length + '）' : '';
  const box = document.getElementById('histList');
  if (!histOpen) { box.classList.remove('open'); box.innerHTML = ''; return; }
  box.classList.add('open');
  if (!list.length) { box.innerHTML = '<div class="history-item" style="cursor:default">暂无查询记录</div>'; return; }
  box.innerHTML = '<div class="history-head"><button class="history-clear" onclick="clearHist()">清空</button></div>' +
    list.map(e =>
      '<div class="history-item' + (e.d === displayDomain ? ' active' : '') + '" onclick="clickHist(this.dataset.d)" data-d="' + esc(e.d) + '">' +
        '<span class="hi-domain">' + esc(e.d) + '</span>' +
        '<span class="hi-right">' +
          (e.s ? '<span class="hi-sub">' + esc(e.s) + '</span>' : '') +
          '<span class="hi-time">' + timeAgo(e.t) + '</span>' +
        '</span>' +
      '</div>'
    ).join('');
}
function clickHist(d) {
  document.getElementById('domainInput').value = d;
  startQuery();
}
function clearHist() {
  saveHist([]);
  renderHist();
  showToast('历史记录已清空');
}

/* ================= 入口 ================= */

function fillExample(d) {
  document.getElementById('domainInput').value = d;
  startQuery();
}

document.getElementById('domainInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') startQuery();
});

renderHist();
</script>
