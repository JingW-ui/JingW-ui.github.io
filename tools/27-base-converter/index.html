<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>进制转换计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6f8fa;color:#1f2328;min-height:100vh}
:root{--green:#2da44e;--green2:#2c974b;--border:#d0d7de;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08)}
header{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;font-weight:600}
header p{font-size:13px;color:#656d76;margin-left:auto}
.container{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-header{background:#f6f8fa;border-bottom:1px solid var(--border);padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}
.base-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.base-item{background:#f6f8fa;border:2px solid var(--border);border-radius:var(--radius);padding:10px 12px;transition:all .15s}
.base-item.active-base{border-color:var(--green);background:#f0fff4}
.base-item label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#656d76;margin-bottom:6px;cursor:pointer}
.base-item label span{background:var(--green);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px}
.base-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:Consolas,monospace;font-weight:600;outline:none;transition:border-color .15s;background:#fff}
.base-input:focus{border-color:var(--green)}
.base-input:read-only{background:#f9f9f9;color:#1f2328;cursor:text}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-secondary{background:#f6f8fa;color:#1f2328;border:1px solid var(--border)}
.btn-secondary:hover{background:#f0f2f5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bit-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bit-cell{width:28px;height:28px;border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s;background:#fff}
.bit-cell.on{background:#2da44e;color:#fff;border-color:#2da44e}
.bit-cell:hover{border-color:var(--green)}
.bit-label{font-size:10px;text-align:center;color:#656d76;margin-top:2px}
.byte-group{display:flex;flex-direction:column;gap:2px;align-items:center;padding:0 4px;border-right:1px dashed var(--border)}
.byte-group:last-child{border-right:none}
.bytes-container{display:flex;gap:0;overflow-x:auto;padding:8px 0}
.result-panel{background:#f0fff4;border:1px solid #9be9a8;border-radius:var(--radius);padding:12px 16px;margin-top:12px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #d1f0d8;font-size:13px}
.result-row:last-child{border-bottom:none}
.result-row .base-name{color:#656d76;font-size:12px;font-weight:600}
.result-row .base-val{font-family:Consolas,monospace;font-size:14px;font-weight:700;color:#1a7f37;word-break:break-all;cursor:pointer}
.result-row .base-val:hover{text-decoration:underline}
.error{color:#cf222e;font-size:12px;margin-top:4px}
.custom-base-row{display:flex;gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
input[type=number]{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;width:80px;outline:none}
input:focus{border-color:var(--green)}
</style>
</head>
<body>
<header>
  <span style="font-size:24px">🔢</span>
  <h1>进制转换计算器</h1>
  <p>二进制 · 八进制 · 十进制 · 十六进制 · 自定义进制</p>
</header>
<div class="container">
  <div class="card">
    <div class="card-header">🔄 快速转换</div>
    <div class="card-body">
      <div class="base-grid">
        <div class="base-item" id="item-2">
          <label onclick="setActiveBase(2)"><span>BIN 二进制</span></label>
          <input class="base-input" id="base-2" placeholder="0 1" oninput="convert(2,this.value)" spellcheck="false">
          <div class="error" id="err-2"></div>
        </div>
        <div class="base-item" id="item-8">
          <label onclick="setActiveBase(8)"><span>OCT 八进制</span></label>
          <input class="base-input" id="base-8" placeholder="0-7" oninput="convert(8,this.value)" spellcheck="false">
          <div class="error" id="err-8"></div>
        </div>
        <div class="base-item active-base" id="item-10">
          <label onclick="setActiveBase(10)"><span>DEC 十进制</span></label>
          <input class="base-input" id="base-10" placeholder="0-9" oninput="convert(10,this.value)" spellcheck="false" value="255">
        </div>
        <div class="base-item" id="item-16">
          <label onclick="setActiveBase(16)"><span>HEX 十六进制</span></label>
          <input class="base-input" id="base-16" placeholder="0-9 A-F" oninput="convert(16,this.value)" spellcheck="false">
          <div class="error" id="err-16"></div>
        </div>
        <div class="base-item" id="item-32">
          <label onclick="setActiveBase(32)"><span>B32 三十二进制</span></label>
          <input class="base-input" id="base-32" placeholder="0-9 A-V" oninput="convert(32,this.value)" spellcheck="false">
          <div class="error" id="err-32"></div>
        </div>
        <div class="base-item" id="item-64">
          <label onclick="setActiveBase(64)"><span>B64 六十四进制</span></label>
          <input class="base-input" id="base-64" placeholder="0-9 A-Z a-z . /" oninput="convert(64,this.value)" spellcheck="false">
          <div class="error" id="err-64"></div>
        </div>
      </div>

      <!-- 自定义进制 -->
      <div class="custom-base-row">
        <div style="font-size:12px;color:#656d76;font-weight:500">自定义进制（2-36）：</div>
        <input type="number" id="custom-base" value="36" min="2" max="36">
        <input type="text" id="custom-input" placeholder="输入该进制数值" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;outline:none" oninput="convertCustom()">
        <div id="custom-result" style="font-size:13px;font-family:Consolas,monospace;color:var(--green);font-weight:700;min-width:100px"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">🔵 位可视化（8位/16位/32位）</div>
    <div class="card-body">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
        <span style="font-size:12px;color:#656d76;font-weight:500">位宽：</span>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer"><input type="radio" name="bitwidth" value="8" checked onchange="renderBits()" style="accent-color:var(--green)"> 8位</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer"><input type="radio" name="bitwidth" value="16" onchange="renderBits()" style="accent-color:var(--green)"> 16位</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer"><input type="radio" name="bitwidth" value="32" onchange="renderBits()" style="accent-color:var(--green)"> 32位</label>
      </div>
      <div class="bytes-container" id="bit-display"></div>
      <div id="bit-value" style="margin-top:8px;font-size:13px;color:#656d76"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">📊 数值信息</div>
    <div class="card-body">
      <div id="num-info" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;font-size:13px"></div>
    </div>
  </div>
</div>

<script>
const CHARS_64 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz./';
const CHARS_36 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

let currentValue = 255;
let activeBase = 10;

function setActiveBase(base) {
  document.querySelectorAll('.base-item').forEach(el => el.classList.remove('active-base'));
  const item = document.getElementById('item-'+base);
  if (item) item.classList.add('active-base');
  activeBase = base;
}

function toBase(n, base) {
  if (n < 0) return '-' + toBase(-n, base);
  if (base <= 36) return n.toString(base).toUpperCase();
  if (base === 64) {
    if (n === 0) return '0';
    let result = '';
    while (n > 0) { result = CHARS_64[n % 64] + result; n = Math.floor(n / 64); }
    return result;
  }
  return n.toString(base);
}

function fromBase(str, base) {
  str = str.trim().toUpperCase();
  if (!str) return NaN;
  if (base <= 36) {
    const validChars = CHARS_36.slice(0, base);
    if ([...str.replace(/^-/,'')].some(c => !validChars.includes(c))) return NaN;
    return parseInt(str, base);
  }
  if (base === 64) {
    let n = 0;
    for (const c of str) {
      const idx = CHARS_64.indexOf(c);
      if (idx < 0) return NaN;
      n = n * 64 + idx;
    }
    return n;
  }
  return NaN;
}

function convert(fromBase, val) {
  const n = fromBase <= 36 ? parseInt(val.trim(), fromBase) : fromBase === 64 ? fromBase64Val(val) : NaN;
  document.getElementById('err-'+fromBase || 'err-10')?.textContent = '';
  
  if (!val.trim()) {
    [2,8,10,16,32,64].forEach(b => { if (b !== fromBase) { const el = document.getElementById('base-'+b); if(el) el.value = ''; }});
    document.getElementById('num-info').innerHTML = '';
    document.getElementById('bit-display').innerHTML = '';
    currentValue = 0;
    return;
  }
  
  const parsed = fromBase === 64 ? fromBase(val, 64) : parseInt(val.trim().replace(/^0+/,'') || '0', fromBase);
  
  if (isNaN(parsed)) {
    const errEl = document.getElementById('err-'+fromBase);
    if (errEl) errEl.textContent = '⚠️ 输入包含无效字符';
    return;
  }
  
  currentValue = parsed;
  updateAll(fromBase);
}

function updateAll(skip) {
  [2,8,10,16,32,64].forEach(b => {
    if (b === skip) return;
    const el = document.getElementById('base-'+b);
    if (!el) return;
    el.value = toBase(currentValue, b);
  });
  renderBits();
  renderInfo();
}

function convertCustom() {
  const base = parseInt(document.getElementById('custom-base').value) || 10;
  const val = document.getElementById('custom-input').value.trim();
  if (!val) { document.getElementById('custom-result').textContent = ''; return; }
  const n = parseInt(val, base);
  if (isNaN(n)) { document.getElementById('custom-result').textContent = '无效输入'; return; }
  document.getElementById('custom-result').textContent = `= ${n} (十进制)`;
}

function renderBits() {
  const bits = parseInt(document.querySelector('input[name=bitwidth]:checked').value);
  const val = currentValue;
  const container = document.getElementById('bit-display');
  
  let html = '';
  for (let byte = Math.floor(bits/8)-1; byte >= 0; byte--) {
    html += '<div class="byte-group">';
    for (let bit = 7; bit >= 0; bit--) {
      const pos = byte * 8 + bit;
      const on = (val >> pos) & 1;
      html += `<div class="bit-cell ${on?'on':''}" onclick="toggleBit(${pos})">${on?'1':'0'}</div>`;
    }
    html += `<div class="bit-label">Byte ${byte}</div></div>`;
  }
  container.innerHTML = html;
  
  const masked = val & ((1 << bits) - 1) | 0;
  document.getElementById('bit-value').textContent = `十进制：${val}  十六进制：0x${val.toString(16).toUpperCase().padStart(bits/4,'0')}`;
}

function toggleBit(pos) {
  currentValue ^= (1 << pos);
  if (currentValue < 0) currentValue = 0;
  updateAll(-1);
  [2,8,10,16,32,64].forEach(b => {
    const el = document.getElementById('base-'+b);
    if (el) el.value = toBase(currentValue, b);
  });
}

function renderInfo() {
  const n = currentValue;
  if (isNaN(n)) { document.getElementById('num-info').innerHTML = ''; return; }
  const isPrime = (n > 1) && !Array.from({length:Math.floor(Math.sqrt(n))-1},(_,i)=>i+2).some(i=>n%i===0);
  document.getElementById('num-info').innerHTML = `
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">十进制</div><div style="font-weight:700;font-size:14px">${n}</div></div>
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">二进制位数</div><div style="font-weight:700;font-size:14px">${n === 0 ? 1 : Math.floor(Math.log2(n)) + 1}</div></div>
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">最大位</div><div style="font-weight:700;font-size:14px">Bit ${n === 0 ? 0 : Math.floor(Math.log2(n))}</div></div>
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">是否质数</div><div style="font-weight:700;font-size:14px">${isPrime ? '✅ 是' : '❌ 否'}</div></div>
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">奇/偶</div><div style="font-weight:700;font-size:14px">${n%2===0 ? '偶数' : '奇数'}</div></div>
    <div style="padding:8px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px"><div style="font-size:11px;color:#656d76">ASCII字符</div><div style="font-weight:700;font-size:14px">${n>0&&n<128?String.fromCharCode(n)+' ('+n+')':'N/A'}</div></div>
  `;
}

// 初始化
convert(10, '255');
</script>
</body>
</html>
