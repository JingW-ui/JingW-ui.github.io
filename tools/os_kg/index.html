<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手机 OS 数据仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* ============================================================
         * Design Tokens
         * ============================================================ */
        :root {
            --bg-gradient: linear-gradient(135deg, #e8eef6 0%, #f2f5fa 50%, #e4ecf4 100%);
            --surface: #ffffff;
            --surface-elevated: rgba(255,255,255,0.88);
            --border-soft: #e4eaf1;
            --border-subtle: #edf1f6;
            --text-primary: #1a2634;
            --text-secondary: #5a6b7d;
            --text-muted: #8896a6;
            --accent-blue: #5470c6;
            --shadow-sm: 0 2px 8px rgba(31,41,55,0.05);
            --shadow-md: 0 6px 20px rgba(31,41,55,0.07);
            --shadow-hover: 0 10px 28px rgba(31,41,55,0.10);
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: 'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,'Helvetica Neue',sans-serif;
            --transition-base: all 0.2s cubic-bezier(0.4,0,0.2,1);
        }

        /* ============================================================
         * Reset & Viewport-filling shell
         * ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-gradient);
            font-family: var(--font-sans);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            padding: 10px 14px 8px;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
         * Dashboard — fills viewport via flex
         * ============================================================ */
        .dashboard {
            flex: 1;
            min-height: 0;
            max-width: 1520px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ---------- Header ---------- */
        .dashboard-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 2px;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .header-title h1 .subtitle {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .header-badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--surface);
            border: 1px solid var(--border-soft);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .badge i { font-style: normal; font-weight: 600; color: var(--text-primary); }

        /* ---------- Main Content — left graph + right side panel ---------- */
        .main-content {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 8px;
        }

        /* ---------- Graph Card — left 60% ---------- */
        .graph-card {
            flex: 6;
            min-width: 0;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .graph-card .card-header {
            flex-shrink: 0;
        }

        #graph-container {
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        /* ---------- Side Panel — right 40%, 4 cards stacked ---------- */
        .side-panel {
            flex: 4;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mini-card {
            flex: 1;
            min-height: 0;
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-base);
        }

        .mini-card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ---------- Card Header ---------- */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px 8px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .card-header h2 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-tag {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            background: #f2f5fa;
            padding: 2px 9px;
            border-radius: 14px;
        }

        .chart-body {
            flex: 1;
            min-height: 0;
        }

        .chart-body > div {
            width: 100%;
            height: 100%;
        }

        /* ---------- Footer ---------- */
        .dashboard-footer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 5px 10px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .footer-legend {
            display: flex;
            gap: 12px;
        }

        .footer-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--text-secondary);
        }

        .footer-legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .footer-links {
            display: flex;
            gap: 10px;
        }

        .footer-links a {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 10px;
        }

        .footer-links a:hover { text-decoration: underline; }

        /* ============================================================
         * Responsive — narrow screens: stack vertically
         * ============================================================ */
        @media (max-width: 900px) {
            html, body { height: auto; overflow: auto; }
            body { padding: 10px 8px 16px; }
            .dashboard { gap: 6px; min-height: auto; }
            .dashboard-header { flex-wrap: wrap; gap: 6px; }
            .header-title h1 { font-size: 15px; gap: 5px; }
            .header-badges { gap: 4px; }
            .badge { font-size: 10px; padding: 2px 8px; }
            .main-content {
                flex-direction: column;
                gap: 6px;
                min-height: auto;
            }
            .graph-card {
                height: 55vh;
                min-height: 320px;
                flex: none;
            }
            .graph-card .chart-body {
                flex: 1;
                min-height: 0;
            }
            .graph-card .chart-body > div {
                height: 100%;
            }
            .card-header { padding: 7px 12px 6px; }
            .card-header h2 { font-size: 12px; }
            .card-tag { font-size: 9px; padding: 2px 7px; }
            .side-panel {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .mini-card {
                min-height: 170px;
            }
            .dashboard-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 4px 6px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 8px 5px 12px; }
            .dashboard { gap: 5px; }
            .dashboard-header { gap: 4px; }
            .header-title h1 { font-size: 13px; }
            .header-title h1 .subtitle { display: none; }
            .badge { font-size: 9px; padding: 2px 6px; }
            .graph-card { height: 48vh; min-height: 260px; }
            .card-header { padding: 5px 8px 4px; }
            .card-header h2 { font-size: 11px; gap: 3px; }
            .card-tag { font-size: 8px; padding: 1px 5px; }
            .side-panel { grid-template-columns: 1fr; gap: 5px; }
            .mini-card { min-height: 150px; }
            .footer-legend { gap: 8px; }
            .footer-legend-item { font-size: 9px; }
            .footer-links { gap: 8px; }
            .footer-links a { font-size: 9px; }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- ===================== Header ===================== -->
    <header class="dashboard-header">
        <div class="header-title">
            <h1>手机 OS 数据仪表盘<span class="subtitle">2026 Q1</span></h1>
        </div>
        <div class="header-badges">
            <span class="badge"><i>Counterpoint</i></span>
            <span class="badge"><i>Omdia</i></span>
        </div>
    </header>

    <!-- ===================== Main Content: Graph + Side Panel ===================== -->
    <div class="main-content">

        <!-- Left: Knowledge Graph (60%) -->
        <div class="graph-card">
            <div class="card-header">
                <h2>关系知识图谱</h2>
                <span class="card-tag">环形布局 · 拖拽/缩放</span>
            </div>
            <div class="chart-body">
                <div id="graph-container"></div>
            </div>
        </div>

        <!-- Right: 4 Mini Charts stacked (40%) -->
        <div class="side-panel">
            <div class="mini-card">
                <div class="card-header">
                    <h2>OS 市场份额</h2>
                </div>
                <div class="chart-body"><div id="os-share-chart"></div></div>
            </div>
            <div class="mini-card">
                <div class="card-header">
                    <h2>品牌出货量</h2>
                </div>
                <div class="chart-body"><div id="brand-shipment-chart"></div></div>
            </div>
            <div class="mini-card">
                <div class="card-header">
                    <h2>收入份额</h2>
                </div>
                <div class="chart-body"><div id="revenue-chart"></div></div>
            </div>
            <div class="mini-card">
                <div class="card-header">
                    <h2>区域 OS 对比</h2>
                </div>
                <div class="chart-body"><div id="regional-chart"></div></div>
            </div>
        </div>

    </div>

    <!-- ===================== Footer ===================== -->
    <footer class="dashboard-footer">
        <div class="footer-legend">
            <span class="footer-legend-item"><span class="footer-legend-dot" style="background:#5470c6;"></span>操作系统</span>
            <span class="footer-legend-item"><span class="footer-legend-dot" style="background:#fac858;"></span>品牌</span>
            <span class="footer-legend-item"><span class="footer-legend-dot" style="background:#ee6666;"></span>地区</span>
            <span class="footer-legend-item"><span class="footer-legend-dot" style="background:#73c0de;"></span>来源</span>
        </div>
        <div class="footer-links">
            <a href="https://www.counterpointresearch.com/" target="_blank">Counterpoint</a>
            <a href="https://www.omdia.com/" target="_blank">Omdia</a>
            <span>2026 Q1</span>
        </div>
    </footer>

</div>

<!-- ============================================================ -->
<!-- Data                                                          -->
<!-- ============================================================ -->
<script src="./data.js"></script>

<!-- ============================================================ -->
<!-- Dashboard Script                                              -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    if (typeof knowledgeGraph === 'undefined') {
        document.getElementById('graph-container').innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a5b5c5;font-size:14px;">⚠️ 未找到数据，请确认 data.js 已加载</div>';
        return;
    }

    const kg = knowledgeGraph;
    const rawNodes = kg.nodes || [];
    const rawEdges = kg.edges || [];

    /* ==========================================================
     * Data Extraction
     * ========================================================== */
    const nodeMap = Object.fromEntries(rawNodes.map(n => [n.id, n]));

    function parsePercent(val) {
        if (!val) return 0;
        const n = parseFloat(String(val).replace(/[~％%]/g, ''));
        return isNaN(n) ? 0 : n;
    }

    function getOSGlobalShare() {
        return rawEdges
            .filter(e => e.relation === 'market_share_in' && e.target === 'Region_Global' && e.source.startsWith('OS_'))
            .map(e => ({ name: nodeMap[e.source]?.name || e.source, value: parsePercent(e.value) }))
            .sort((a, b) => b.value - a.value);
    }

    function getBrandShipment() {
        return rawEdges
            .filter(e => e.relation === 'shipment_share' && e.target === 'Region_Global')
            .map(e => ({ name: nodeMap[e.source]?.name || e.source, value: parsePercent(e.value) }))
            .sort((a, b) => b.value - a.value);
    }

    function getRevenueShare() {
        return rawEdges
            .filter(e => e.relation === 'revenue_share' && e.target === 'Region_Global')
            .map(e => ({ name: nodeMap[e.source]?.name || e.source, value: parsePercent(e.value) }))
            .sort((a, b) => b.value - a.value);
    }

    function getRegionalOS() {
        const regionDefs = [
            { id: 'Region_Global', name: '全球' },
            { id: 'Region_China',  name: '中国' },
            { id: 'Region_USA',    name: '美国' },
            { id: 'Region_India',  name: '印度' },
        ];
        const osDefs = [
            { id: 'OS_Android',   name: 'Android' },
            { id: 'OS_iOS',       name: 'iOS' },
            { id: 'OS_HarmonyOS', name: 'HarmonyOS' },
        ];
        return {
            regions: regionDefs.map(r => r.name),
            series: osDefs.map(os => ({
                name: os.name,
                data: regionDefs.map(region => {
                    const edge = rawEdges.find(e =>
                        e.source === os.id && e.target === region.id && e.relation === 'market_share_in'
                    );
                    return edge ? parsePercent(edge.value) : 0;
                }),
            })),
        };
    }

    /* ==========================================================
     * Color Palettes
     * ========================================================== */
    const OS_COLORS = { 'Android': '#3ddc84', 'iOS': '#007aff', 'HarmonyOS': '#c71724' };
    const BRAND_PALETTE = ['#5470c6','#fac858','#ee6666','#73c0de','#91cc75','#ff9f7f','#3ba272'];
    const CHART_TEXT = '#1f2c39';
    const CHART_SUBTEXT = '#6b7a8a';
    const TOOLTIP_STYLE = {
        backgroundColor: 'rgba(255,255,255,0.97)',
        borderColor: '#e0e6ed',
        borderWidth: 1,
        textStyle: { color: CHART_TEXT, fontSize: 12 },
        extraCssText: 'box-shadow:0 6px 20px rgba(0,0,0,0.10);border-radius:10px;padding:10px 14px;',
    };

    /* ==========================================================
     * 1. Knowledge Graph
     * ========================================================== */
    function initGraph() {
        const isMobile = window.innerWidth < 900;
        const isSmall = window.innerWidth < 480;
        const categoryMap = {
            'OperatingSystem': { name: '操作系统', color: '#5470c6' },
            'Brand':           { name: '品牌',     color: '#fac858' },
            'Region':          { name: '地区',     color: '#ee6666' },
            'Source':          { name: '数据来源', color: '#73c0de' },
        };
        const osIconMap = {
            'Android':   'image://./assets/andriod.svg',
            'iOS':       'image://./assets/ios.png',
            'HarmonyOS': 'image://./assets/HarmonyOS.webp',
        };
        const brandIconMap = {
            'Samsung': 'image://./assets/brands/samsung_circle.svg',
            'Apple':   'image://./assets/brands/apple_circle.svg',
            'Xiaomi':  'image://./assets/brands/xiaomi_circle.svg',
            'OPPO':    'image://./assets/brands/oppo_circle.svg',
            'vivo':    'image://./assets/brands/vivo_circle.svg',
            'Huawei':  'image://./assets/brands/huawei_circle.svg',
            'Honor':   'image://./assets/brands/honor_circle.svg',
        };
        const regionIconMap = {
            'China': 'image://./assets/regions/cn.svg',
            'USA':   'image://./assets/regions/us.svg',
            'India': 'image://./assets/regions/in.svg',
        };

        /* Mobile-adaptive sizes */
        const sizeScale = isSmall ? 0.55 : (isMobile ? 0.7 : 1);
        const labelSize = isSmall ? 9 : (isMobile ? 10 : 12);
        const circDist  = isSmall ? 90 : (isMobile ? 120 : 180);

        const findIcon = (name, map) => {
            const lower = name.toLowerCase();
            const exact = Object.keys(map).find(k => k.toLowerCase() === lower);
            return exact ? map[exact] : (Object.keys(map).find(k => lower.includes(k.toLowerCase())) || null);
        };

        const nodes = rawNodes.map(n => {
            let symbolSize = Math.round(36 * sizeScale), symbol = 'circle', iconUrl = '';
            if (n.type === 'OperatingSystem') { symbolSize = Math.round(52 * sizeScale); const ic = findIcon(n.name, osIconMap); if (ic) { iconUrl = ic; symbol = ic; symbolSize = Math.round(56 * sizeScale); } }
            else if (n.type === 'Brand')      { symbolSize = Math.round(42 * sizeScale); const ic = findIcon(n.name, brandIconMap); if (ic) { iconUrl = ic; symbol = ic; symbolSize = Math.round(48 * sizeScale); } }
            else if (n.type === 'Region')     { symbolSize = Math.round(36 * sizeScale); const ic = findIcon(n.name, regionIconMap); if (ic) { iconUrl = ic; symbol = ic; symbolSize = Math.round(44 * sizeScale); } }
            else if (n.type === 'Source')     { symbolSize = Math.round(28 * sizeScale); }

            return {
                id: n.id, name: n.name,
                value: n.marketShare || n.share || n.shipment || '',
                category: n.type || 'Other',
                symbolSize, symbol,
                symbolKeepAspect: true,
                raw: n,
                label: {
                    show: true, fontSize: labelSize, fontWeight: 500,
                    color: '#1f2c39', position: 'bottom',
                    formatter: (p) => {
                        const d = p.data.raw;
                        const extra = d.marketShare || d.share || '';
                        return d.name + (extra ? ` ${extra}` : '');
                    },
                },
                itemStyle: iconUrl ? { color: 'transparent', borderColor: 'transparent', borderWidth: 0, shadowBlur: 0 } : undefined,
            };
        });

        const links = rawEdges.map(e => ({
            source: e.source, target: e.target,
            label: { show: false },
            rawRelation: e.relation, rawValue: e.value || '',
            lineStyle: { color: '#b8c7d9', width: 1.6, curveness: 0.15, opacity: 0.55 },
            emphasis: { lineStyle: { width: 2.8, color: '#3a6a9a', opacity: 0.9 } },
        }));

        const categories = Object.keys(categoryMap).map(k => ({
            name: k,
            itemStyle: { color: categoryMap[k].color },
            label: { color: '#1f2c39' },
        }));

        const el = document.getElementById('graph-container');
        const chart = echarts.init(el);
        chart.setOption({
            title: { show: false },
            tooltip: {
                trigger: 'item',
                ...TOOLTIP_STYLE,
                formatter: (params) => {
                    if (params.dataType === 'node') {
                        const d = params.data.raw;
                        let s = `<strong>${d.name}</strong>`;
                        if (d.type) s += `<br/>类型：${d.type}`;
                        if (d.marketShare) s += `<br/>市场份额：${d.marketShare}`;
                        if (d.shipment) s += `<br/>出货量：${d.shipment}`;
                        if (d.share && d.share !== d.marketShare) s += `<br/>份额：${d.share}`;
                        if (d.region) s += `<br/>区域：${d.region}`;
                        return s;
                    }
                    if (params.dataType === 'edge') {
                        const d = params.data;
                        let s = `<strong>关系</strong><br/>${d.source} → ${d.target}`;
                        if (d.rawRelation) s += `<br/>类型：${d.rawRelation}`;
                        if (d.rawValue) s += `<br/>数值：${d.rawValue}`;
                        return s;
                    }
                    return '';
                },
            },
            legend: {
                show: !isSmall,
                data: categories.map(c => ({ name: c.name, icon: 'circle', textStyle: { color: '#2d3c4c', fontSize: isMobile ? 10 : 12, fontWeight: 500 } })),
                orient: 'horizontal', left: 'center', top: 6,
                itemWidth: isMobile ? 9 : 12, itemHeight: isMobile ? 9 : 12,
                backgroundColor: 'rgba(255,255,255,0.8)',
                borderRadius: 20, padding: [3, 16],
            },
            series: [{
                type: 'graph',
                layout: 'circular',
                circular: { rotateLabel: false, distance: circDist },
                roam: true, draggable: true,
                data: nodes, links, categories,
                itemStyle: { borderColor: '#ffffff', borderWidth: 1.8, shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.06)' },
                label: { show: true, position: 'bottom', fontSize: labelSize, fontWeight: 500, color: '#1f2c39' },
                edgeLabel: { show: false },
                lineStyle: { color: 'source', curveness: 0.15, width: isMobile ? 1 : 1.6, opacity: 0.5 },
                emphasis: {
                    focus: 'adjacency',
                    lineStyle: { width: 3, color: '#3a6a9a' },
                    itemStyle: { shadowBlur: 16, shadowColor: 'rgba(0,0,0,0.12)', borderWidth: 2.5, borderColor: '#1f4b7a' },
                },
                animationDuration: 1500, animationEasing: 'cubicOut',
            }],
            backgroundColor: '#fbfdff',
        });
        return chart;
    }

    /* ==========================================================
     * 2. OS Pie — compact for mini card
     * ========================================================== */
    function initOSPie() {
        const data = getOSGlobalShare();
        const el = document.getElementById('os-share-chart');
        const chart = echarts.init(el);
        chart.setOption({
            tooltip: {
                trigger: 'item', ...TOOLTIP_STYLE,
                formatter: (p) => `<strong>${p.name}</strong> ${p.value}%`,
            },
            legend: {
                bottom: 2, left: 'center',
                itemWidth: 8, itemHeight: 8, itemGap: 10,
                textStyle: { color: CHART_TEXT, fontSize: 10 },
            },
            series: [{
                type: 'pie',
                radius: ['32%', '64%'],
                center: ['50%', '44%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 },
                label: {
                    show: true, formatter: '{b} {d}%',
                    fontSize: 10, fontWeight: 600, color: CHART_TEXT,
                },
                labelLine: { length: 8, length2: 6, lineStyle: { color: '#c4cdd8' } },
                emphasis: {
                    scaleSize: 5,
                    itemStyle: { shadowBlur: 12, shadowColor: 'rgba(0,0,0,0.15)' },
                },
                data: data.map(d => ({
                    name: d.name, value: d.value,
                    itemStyle: { color: OS_COLORS[d.name] || '#999' },
                })),
                animationDuration: 1000,
            }],
            backgroundColor: 'transparent',
        });
        return chart;
    }

    /* ==========================================================
     * 3. Brand Bar — compact horizontal bar
     * ========================================================== */
    function initBrandBar() {
        const data = getBrandShipment();
        const el = document.getElementById('brand-shipment-chart');
        const chart = echarts.init(el);
        chart.setOption({
            tooltip: {
                trigger: 'axis', ...TOOLTIP_STYLE,
                axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(84,112,198,0.05)' } },
                formatter: (p) => `<strong>${p[0].name}</strong> ${p[0].value}%`,
            },
            grid: { top: 8, right: 40, bottom: 8, left: 56, containLabel: false },
            xAxis: {
                type: 'value', max: 30,
                axisLabel: { show: false },
                splitLine: { lineStyle: { color: '#f0f3f7', type: 'dashed' } },
                axisLine: { show: false }, axisTick: { show: false },
            },
            yAxis: {
                type: 'category',
                data: data.map(d => d.name).reverse(),
                axisLabel: { fontSize: 10, fontWeight: 500, color: CHART_TEXT },
                axisLine: { show: false }, axisTick: { show: false },
            },
            series: [{
                type: 'bar',
                data: data.map((d, i) => ({
                    value: d.value,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: BRAND_PALETTE[i % BRAND_PALETTE.length] },
                            { offset: 1, color: BRAND_PALETTE[(i + 1) % BRAND_PALETTE.length] },
                        ]),
                        borderRadius: [0, 4, 4, 0],
                    },
                })).reverse(),
                barWidth: 14,
                label: {
                    show: true, position: 'right',
                    formatter: '{c}%', fontSize: 10, fontWeight: 600, color: CHART_TEXT,
                },
                animationDuration: 800,
            }],
            backgroundColor: 'transparent',
        });
        return chart;
    }

    /* ==========================================================
     * 4. Regional Stacked Bar — compact
     * ========================================================== */
    function initRegionalChart() {
        const { regions, series } = getRegionalOS();
        const el = document.getElementById('regional-chart');
        const chart = echarts.init(el);
        chart.setOption({
            tooltip: {
                trigger: 'axis', ...TOOLTIP_STYLE,
                axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(84,112,198,0.04)' } },
                formatter: (params) => {
                    let s = `<strong>${params[0].name}</strong>`;
                    params.forEach(p => { s += `<br/>${p.marker} ${p.seriesName}：${p.value}%`; });
                    return s;
                },
            },
            legend: {
                top: 2, right: 4,
                itemWidth: 8, itemHeight: 8, itemGap: 8,
                textStyle: { color: CHART_TEXT, fontSize: 9, fontWeight: 500 },
            },
            grid: { top: 22, right: 8, bottom: 16, left: 32, containLabel: true },
            xAxis: {
                type: 'category', data: regions,
                axisLabel: { fontSize: 10, fontWeight: 600, color: CHART_TEXT },
                axisLine: { lineStyle: { color: '#e0e6ed' } },
                axisTick: { show: false },
            },
            yAxis: {
                type: 'value', max: 100,
                axisLabel: { formatter: '{value}%', fontSize: 9, color: CHART_SUBTEXT },
                splitLine: { lineStyle: { color: '#f0f3f7', type: 'dashed' } },
                axisLine: { show: false }, axisTick: { show: false },
            },
            series: series.map((s, i) => ({
                name: s.name, type: 'bar', stack: 'total', data: s.data,
                barWidth: 28,
                itemStyle: {
                    color: Object.values(OS_COLORS)[i],
                    borderRadius: i === series.length - 1 ? [4, 4, 0, 0] : [0, 0, 0, 0],
                },
                label: {
                    show: true, position: 'inside',
                    formatter: (p) => p.value >= 12 ? `${p.value}%` : '',
                    fontSize: 9, fontWeight: 600, color: '#fff',
                },
                animationDuration: 800,
                animationDelay: (idx) => idx * 100,
            })),
            backgroundColor: 'transparent',
        });
        return chart;
    }

    /* ==========================================================
     * 5. Revenue Donut — compact
     * ========================================================== */
    function initRevenueChart() {
        const data = getRevenueShare();
        const sum = data.reduce((acc, d) => acc + d.value, 0);
        if (sum < 100) data.push({ name: '其他', value: 100 - sum });

        const el = document.getElementById('revenue-chart');
        const chart = echarts.init(el);
        const revenuePalette = ['#fac858','#5470c6','#ee6666','#73c0de','#91cc75','#d8d8d8'];
        chart.setOption({
            tooltip: {
                trigger: 'item', ...TOOLTIP_STYLE,
                formatter: (p) => `<strong>${p.name}</strong> ${p.value}%`,
            },
            legend: {
                bottom: 2, left: 'center',
                itemWidth: 8, itemHeight: 8, itemGap: 8,
                textStyle: { color: CHART_TEXT, fontSize: 10 },
            },
            series: [{
                type: 'pie',
                radius: ['36%', '64%'],
                center: ['50%', '44%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
                label: {
                    show: true, formatter: '{b} {d}%',
                    fontSize: 10, fontWeight: 600, color: CHART_TEXT,
                },
                labelLine: { length: 8, length2: 6, lineStyle: { color: '#c4cdd8' } },
                emphasis: {
                    scaleSize: 4,
                    itemStyle: { shadowBlur: 12, shadowColor: 'rgba(0,0,0,0.14)' },
                },
                data: data.map((d, i) => ({
                    name: d.name, value: d.value,
                    itemStyle: { color: revenuePalette[i % revenuePalette.length] },
                })),
                animationDuration: 1000,
            }],
            backgroundColor: 'transparent',
        });
        return chart;
    }

    /* ==========================================================
     * Bootstrap + Resize
     * ========================================================== */
    const allCharts = [];
    try { allCharts.push(initGraph()); }         catch (e) { console.error('Graph:', e); }
    try { allCharts.push(initOSPie()); }         catch (e) { console.error('OS Pie:', e); }
    try { allCharts.push(initBrandBar()); }      catch (e) { console.error('Brand Bar:', e); }
    try { allCharts.push(initRegionalChart()); } catch (e) { console.error('Regional:', e); }
    try { allCharts.push(initRevenueChart()); }  catch (e) { console.error('Revenue:', e); }

    window.addEventListener('resize', () => allCharts.forEach(c => c && c.resize()));
    const ro = new ResizeObserver(() => allCharts.forEach(c => c && c.resize()));
    document.querySelectorAll('.chart-body > div').forEach(el => ro.observe(el));

    window.__dashboardCharts = allCharts;
    console.log(`✅ 仪表盘渲染完成 · ${allCharts.length} 个图表`);
})();
</script>

</body>
</html>
