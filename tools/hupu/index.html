<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虎扑评分数据可视化面板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8; --bg-grad-1:#eef1f6; --bg-grad-2:#e7ebf2;
  --surface:rgba(255,255,255,0.78); --surface-2:#ffffff; --surface-hover:#ffffff;
  --border:rgba(15,23,42,0.10); --border-strong:rgba(15,23,42,0.18);
  --text:#0f172a; --text-soft:#475569; --text-dim:#94a3b8;
  --accent:#f97316; --accent-2:#fbbf24; --accent-3:#3b82f6;
  --good:#22c55e; --bad:#ef4444; --warn:#eab308;
  --shadow:0 10px 30px rgba(20,40,80,0.08);
  --radius:16px; --radius-sm:10px;
  --t:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070b12; --bg-grad-1:#0b1320; --bg-grad-2:#0a1018;
  --surface:rgba(255,255,255,0.035); --surface-2:rgba(255,255,255,0.055); --surface-hover:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text:#eaf0f6; --text-soft:#9fb0c0; --text-dim:#62748a;
  --shadow:0 10px 40px rgba(0,0,0,0.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(249,115,22,.10), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(251,191,36,.10), transparent 55%),
    linear-gradient(180deg,var(--bg-grad-1),var(--bg-grad-2));
  background-attachment:fixed;
}
.wrap{max-width:1480px;margin:0 auto;padding:0 24px 60px}

/* Header */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--border)}
.head-inner{max-width:1480px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;color:#3a1a02;font-size:20px;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand p{font-size:12px;color:var(--text-dim);white-space:nowrap}
.head-spacer{flex:1}
.head-search{position:relative;flex:0 1 320px}
.head-search input{width:100%;padding:9px 14px 9px 36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;transition:border-color .2s var(--t),background .2s var(--t)}
.head-search input:focus{border-color:var(--accent);background:var(--surface-2)}
.head-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-soft);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--t);flex:none}
.icon-btn:hover{color:var(--accent);border-color:var(--border-strong);background:var(--surface-hover)}

/* Hero bar */
.hero-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:26px 0 18px}
.hero-title h2{font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.hero-title h2 .grad{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-title p{color:var(--text-soft);font-size:12.5px;margin-top:6px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap}
.hero-meta .hm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.hero-meta .hm .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-meta .hm .l{font-size:10.5px;color:var(--text-dim);letter-spacing:.3px;margin-top:3px}
.hero-meta .hm .v.accent{color:var(--accent)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 20px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);transition:transform .25s var(--t),border-color .25s var(--t)}
.kpi:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.kpi .lbl{font-size:11px;color:var(--text-dim);letter-spacing:.4px;text-transform:uppercase}
.kpi .val{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--text-soft);margin-top:2px}
.kpi .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.7}

/* Tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab-btn{padding:9px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text-soft);border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;transition:all .25s var(--t);display:flex;align-items:center;gap:7px}
.tab-ic{width:15px;height:15px;flex:none}
.tab-btn:hover{border-color:var(--border-strong);color:var(--text)}
.tab-btn.active{background:linear-gradient(135deg,var(--accent),#ea580c);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(249,115,22,.3)}

/* Cards / charts */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(8px);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 18px 4px}
.card-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card-head h3{font-size:14.5px;font-weight:700}
.card-head .desc{font-size:11.5px;color:var(--text-dim);margin-left:auto}
.chart{width:100%;height:340px}
.chart.tall{height:420px}
.card-foot{padding:4px 18px 16px;font-size:11.5px;color:var(--text-dim)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-1{grid-template-columns:1fr}

/* List toolbar */
.list-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.list-bar .info{font-size:12.5px;color:var(--text-soft)}
.list-bar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:7px 12px;border:none;background:transparent;color:var(--text-soft);font-size:12.5px;cursor:pointer;font-weight:600;transition:all .18s var(--t)}
.seg button.active{background:var(--accent);color:#fff}
.seg button:hover:not(.active){color:var(--text)}

/* Person cards — 图鉴 (illustrated collection) style */
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.person-card{
  position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .28s var(--t),box-shadow .28s var(--t),border-color .28s var(--t);
}
.person-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.22)}
/* rarity top bar */
.person-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:3;background:var(--rarity,#64748b)}
.person-card.r-perfect{--rarity:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24)}
.person-card.r-high{--rarity:linear-gradient(90deg,#22c55e,#16a34a)}
.person-card.r-low{--rarity:linear-gradient(90deg,#ef4444,#dc2626)}
.person-card.r-perfect::before{height:4px;background:var(--rarity);box-shadow:0 0 14px rgba(251,191,36,.5)}

/* dex index number top-left */
.pc-no{position:absolute;top:10px;left:12px;z-index:3;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--text-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pc-no b{color:var(--text-soft)}

/* portrait frame */
.pc-frame{position:relative;aspect-ratio:1/1;overflow:hidden;background:linear-gradient(160deg,var(--surface-hover),var(--surface))}
.pc-frame::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,transparent 40%,rgba(0,0,0,.28) 100%);pointer-events:none}
.avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--t)}
.person-card:hover .avatar{transform:scale(1.07)}
/* type badge (category) bottom-left of frame */
.cat-tag{position:absolute;left:10px;bottom:10px;z-index:3;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;backdrop-filter:blur(6px);background:rgba(15,23,42,.55);color:#eaf0f6;border:1px solid rgba(255,255,255,.18)}
/* score medallion bottom-right of frame */
.score-badge{position:absolute;right:10px;bottom:10px;z-index:3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.score-perfect{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);color:#3a1a02;box-shadow:0 0 16px rgba(251,191,36,.55)}
.score-high{background:radial-gradient(circle at 35% 30%,#4ade80,#16a34a);color:#04210f}
.score-low{background:radial-gradient(circle at 35% 30%,#f87171,#dc2626);color:#fff}

/* body */
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc-name{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tag{font-size:.76rem;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{display:flex;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
.pc-meta .m{display:flex;flex-direction:column;gap:1px}
.pc-meta .ml{font-size:.62rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.pc-meta .mv{font-size:.82rem;font-weight:600}
.pc-highlight{font-size:.78rem;color:var(--text-soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:50px;text-align:center;color:var(--text-dim);font-size:13px}

/* Fade in */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .4s var(--t) both}

/* Avatar skeleton */
.avatar-loading{background:linear-gradient(90deg,var(--border) 25%,var(--surface-hover) 50%,var(--border) 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

footer{margin-top:30px;text-align:center;color:var(--text-dim);font-size:12px;padding:18px 0;border-top:1px solid var(--border)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);background-clip:content-box}

@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}}
@media(max-width:640px){.person-grid{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:21px}.head-search{flex-basis:160px}}
@media(max-width:420px){.person-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">虎</div>
      <div>
        <h1>虎扑评分数据可视化面板</h1>
        <p>基于 JRs 真实评分 · 60 个条目 · 真实头像</p>
      </div>
    </div>
    <div class="head-spacer"></div>
    <div class="head-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜索人物 / 分类 / 标签…" autocomplete="off">
    </div>
    <button class="icon-btn" id="themeToggle" title="切换主题">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="hero-bar">
    <div class="hero-title">
      <h2>虎扑<span class="grad">评分榜</span>全景洞察</h2>
      <p>第四轮虎扑 JRs 评分 · 评分分布 / 分类构成 / 人气热度 / 人物图鉴 多维可视化</p>
    </div>
    <div class="hero-meta" id="heroMeta"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview"><svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> 总览看板</button>
    <button class="tab-btn" data-tab="perfect"><svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg> 满分人物</button>
    <button class="tab-btn" data-tab="high"><svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="16 7 21 7 21 12"/></svg> 高分榜单</button>
    <button class="tab-btn" data-tab="low"><svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 7 9 13 13 9 21 17"/><polyline points="16 17 21 17 21 12"/></svg> 低分榜单</button>
    <button class="tab-btn" data-tab="charts"><svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="4" y2="10"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="22" y1="20" x2="2" y2="20"/></svg> 数据图表</button>
  </div>

  <!-- Overview -->
  <div id="tab-overview" class="tab-pane">
    <div class="grid g-1">
      <div class="card">
        <div class="card-head"><span class="dot"></span><h3>评分分布散点图</h3><span class="desc">评分 vs 参与人数 · 气泡大小=热度</span></div>
        <div class="chart tall" id="c-scatter"></div>
        <div class="card-foot">点击气泡可查看人物详情</div>
      </div>
    </div>
    <div class="grid g-2">
      <div class="card"><div class="card-head"><span class="dot"></span><h3>分类占比</h3></div><div class="chart" id="c-pie"></div></div>
      <div class="card"><div class="card-head"><span class="dot"></span><h3>评分 Top 10</h3></div><div class="chart" id="c-top10"></div></div>
    </div>
    <div class="grid g-1">
      <div class="card"><div class="card-head"><span class="dot"></span><h3>人气热度排行</h3><span class="desc">按评分人数</span></div><div class="chart tall" id="c-pop"></div></div>
    </div>
  </div>

  <!-- Perfect -->
  <div id="tab-perfect" class="tab-pane" hidden>
    <div class="list-bar">
      <span class="info" id="info-perfect"></span>
      <div class="spacer"></div>
      <div class="seg" data-sort="perfect"><button class="active" data-by="score">评分</button><button data-by="votes">热度</button><button data-by="name">名称</button></div>
    </div>
    <div class="person-grid" id="grid-perfect"></div>
  </div>

  <!-- High -->
  <div id="tab-high" class="tab-pane" hidden>
    <div class="list-bar">
      <span class="info" id="info-high"></span>
      <div class="spacer"></div>
      <div class="seg" data-sort="high"><button class="active" data-by="score">评分</button><button data-by="votes">热度</button><button data-by="name">名称</button></div>
    </div>
    <div class="person-grid" id="grid-high"></div>
  </div>

  <!-- Low -->
  <div id="tab-low" class="tab-pane" hidden>
    <div class="list-bar">
      <span class="info" id="info-low"></span>
      <div class="spacer"></div>
      <div class="seg" data-sort="low"><button class="active" data-by="score">评分</button><button data-by="votes">热度</button><button data-by="name">名称</button></div>
    </div>
    <div class="person-grid" id="grid-low"></div>
  </div>

  <!-- Charts -->
  <div id="tab-charts" class="tab-pane" hidden>
    <div class="grid g-2">
      <div class="card"><div class="card-head"><span class="dot"></span><h3>满分人物分类</h3></div><div class="chart" id="c-perfectcat"></div></div>
      <div class="card"><div class="card-head"><span class="dot"></span><h3>低分人物分类</h3></div><div class="chart" id="c-lowcat"></div></div>
    </div>
    <div class="grid g-1">
      <div class="card"><div class="card-head"><span class="dot"></span><h3>评分分布直方图</h3></div><div class="chart" id="c-hist"></div></div>
    </div>
    <div class="grid g-1">
      <div class="card"><div class="card-head"><span class="dot"></span><h3>分类平均评分</h3><span class="desc">条形热力</span></div><div class="chart tall" id="c-heat"></div></div>
    </div>
  </div>

  <footer>
    数据来源：虎扑体育网 (hupu.com) · 数据仅供娱乐参考 · 头像来源于网络
  </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
