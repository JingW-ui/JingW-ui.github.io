<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --green:#238636;
    --green-light:#2dba4e;
    --green-bg:rgba(35,134,54,0.08);
    --green-border:rgba(35,134,54,0.2);
    --bg:#ffffff;
    --text:#111111;
    --text-secondary:#57606a;
    --text-tertiary:#8b949e;
    --border:#d0d7de;
    --card-hover:rgba(35,134,54,0.04);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 3px 12px rgba(0,0,0,0.06);
    --red:#cf222e;--red-bg:rgba(207,34,46,0.08);--red-border:rgba(207,34,46,0.2);
    --blue:#0969da;--blue-bg:rgba(9,105,218,0.08);--blue-border:rgba(9,105,218,0.2);
    --purple:#8250df;--purple-bg:rgba(130,80,223,0.08);--purple-border:rgba(130,80,223,0.2);
    --yellow:#9a6700;--yellow-bg:rgba(154,103,0,0.08);--yellow-border:rgba(154,103,0,0.2);
    --orange:#bc4c00;--orange-bg:rgba(188,76,0,0.08);--orange-border:rgba(188,76,0,0.2);
  }
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.5;min-height:100vh;
    overflow-x:hidden;
  }

  /* ---- Header ---- */
  .header{
    text-align:center;
    padding:72px 24px 0;
    opacity:0;transform:translateY(-30px);
    animation:headerIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
  }
  @keyframes headerIn{to{opacity:1;transform:translateY(0)}}

  .header h1{
    font-size:clamp(2.2rem,5vw,3.6rem);
    font-weight:800;letter-spacing:-0.03em;
    color:var(--text);
    margin-bottom:6px;
  }
  .header h1 span{color:var(--green)}
  .header .subtitle{
    font-size:1.05rem;color:var(--text-secondary);font-weight:400;
    opacity:0;animation:fadeUp 0.6s ease 0.4s forwards;
  }

  /* ---- Controls ---- */
  .controls{
    max-width:960px;margin:40px auto 0;padding:0 24px;
    display:flex;flex-wrap:wrap;align-items:center;gap:16px;
    opacity:0;animation:fadeUp 0.6s ease 0.55s forwards;
  }
  .control-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .control-label{
    font-size:0.82rem;font-weight:600;color:var(--text-tertiary);
    text-transform:uppercase;letter-spacing:0.06em;
    margin-right:4px;white-space:nowrap;
  }

  .pill{
    padding:6px 16px;border-radius:100px;
    font-size:0.85rem;font-weight:500;
    cursor:pointer;transition:all 0.25s ease;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text-secondary);
    user-select:none;
  }
  .pill:hover{border-color:var(--green);color:var(--green)}
  .pill.active{
    background:var(--green);color:#fff;border-color:var(--green);
    box-shadow:0 2px 8px rgba(35,134,54,0.25);
  }
  .badge-style-pill{
    padding:5px 12px;border-radius:100px;
    font-size:0.78rem;font-weight:500;
    border:1.5px solid var(--border);background:var(--bg);color:var(--text-tertiary);
    cursor:pointer;outline:none;transition:all 0.25s ease;
  }
  .badge-style-pill:hover{border-color:var(--green);color:var(--green)}

  .divider{
    width:1px;height:24px;background:var(--border);margin:0 4px;
  }

  /* ---- Loading ---- */
  .loading-container{
    display:flex;justify-content:center;align-items:center;
    padding:80px 24px;
  }
  .loading-spinner{
    width:32px;height:32px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--green);
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- Cards ---- */
  .container{
    max-width:960px;margin:32px auto 80px;padding:0 24px;
  }
  .repo-list{display:flex;flex-direction:column;gap:2px}

  .repo-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px 24px;
    transition:all 0.25s ease;
    cursor:pointer;
    opacity:0;transform:translateY(24px);
    position:relative;
  }
  .repo-card.visible{
    animation:cardIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .repo-card:hover{
    border-color:var(--green-border);
    background:var(--card-hover);
    box-shadow:var(--shadow-md);
  }
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}

  .repo-card.exiting{
    animation:cardOut 0.3s ease forwards;
  }
  @keyframes cardOut{to{opacity:0;transform:translateY(-12px) scale(0.98)}}

  .repo-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px}
  .repo-rank{
    font-size:1.5rem;font-weight:800;color:var(--green);
    min-width:36px;text-align:right;line-height:1.2;
    font-variant-numeric:tabular-nums;
  }
  .repo-info{flex:1;min-width:0}
  .repo-name{
    font-size:1.08rem;font-weight:700;color:var(--text);
    text-decoration:none;
    transition:color 0.2s;
    word-break:break-all;
  }
  .repo-name:hover{color:var(--green)}
  .repo-name span.owner{color:var(--text-secondary);font-weight:400}
  .repo-name span.slash{color:var(--text-tertiary);font-weight:300;margin:0 1px}

  .repo-desc{
    font-size:0.9rem;color:var(--text-secondary);
    margin-top:6px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .repo-meta{
    display:flex;align-items:center;gap:16px;
    margin-top:10px;flex-wrap:wrap;
  }
  .meta-item{
    font-size:0.82rem;color:var(--text-tertiary);
    display:flex;align-items:center;gap:4px;
    font-variant-numeric:tabular-nums;
  }
  .meta-item.lang-dot{
    color:var(--text-secondary);font-weight:500;
  }
  .lang-color{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;
  }
  .meta-item .stars-today{
    color:var(--green);font-weight:600;
  }

  /* ---- Assess Badge ---- */
  .assess-badge{
    font-size:0.72rem;font-weight:600;padding:3px 10px;border-radius:20px;
    white-space:nowrap;border:1px solid transparent;flex-shrink:0;
    display:inline-flex;align-items:center;gap:4px;
  }
  .a-hot{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
  .a-good{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
  .a-fresh{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border)}
  .a-fair{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border)}
  .a-cold{background:rgba(139,148,158,0.08);color:var(--text-tertiary);border-color:rgba(139,148,158,0.2)}

  /* ---- Shields.io Badges Row ---- */
  .repo-badges{
    display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
    margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .repo-badges img{
    height:20px;vertical-align:middle;border-radius:3px;
    transition:opacity 0.15s;cursor:pointer;
  }
  .repo-badges img:hover{opacity:0.75}
  .embed-btn{
    background:var(--bg);color:var(--text-tertiary);border:1px solid var(--border);
    border-radius:5px;padding:3px 9px;font-size:0.72rem;cursor:pointer;
    transition:all 0.2s;white-space:nowrap;font-weight:500;
    margin-left:auto;
  }
  .embed-btn:hover{color:var(--green);border-color:var(--green)}
  .embed-btn.copied{color:var(--green);border-color:var(--green);background:var(--green-bg)}

  /* ---- Empty ---- */
  .empty-state{
    text-align:center;padding:80px 24px;
    color:var(--text-tertiary);
  }
  .empty-state p{font-size:1.1rem;margin-top:8px}

  /* ---- Footer stats ---- */
  .stats-bar{
    max-width:960px;margin:0 auto 40px;padding:0 24px;
    display:flex;justify-content:center;gap:32px;
    opacity:0;animation:fadeUp 0.5s ease 0.7s forwards;
  }
  .stat-item{text-align:center}
  .stat-value{font-size:1.5rem;font-weight:800;color:var(--green)}
  .stat-label{font-size:0.78rem;color:var(--text-tertiary);margin-top:2px}

  /* ---- Utility ---- */
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* ---- Responsive ---- */
  @media(max-width:640px){
    .header{padding-top:40px}
    .header h1{font-size:clamp(1.6rem,5vw,2.4rem)}
    .header .subtitle{font-size:0.88rem}

    .controls{gap:8px;margin-top:28px;padding:0 16px}
    .control-label{font-size:0.72rem}
    .pill{padding:5px 11px;font-size:0.76rem;border-radius:80px}
    .badge-style-pill{padding:4px 9px;font-size:0.7rem}
    .divider{display:none}

    .stats-bar{gap:18px;margin-bottom:28px;padding:0 16px}
    .stat-value{font-size:1.15rem}
    .stat-label{font-size:0.68rem}

    .container{padding:0 12px;margin-top:20px}
    .repo-card{padding:14px 14px}
    .repo-rank{font-size:1.15rem;min-width:26px}
    .repo-info{min-width:0}
    .repo-name{font-size:0.92rem}
    .repo-desc{font-size:0.8rem;margin-top:4px;-webkit-line-clamp:2}
    .repo-meta{gap:10px;margin-top:8px}
    .meta-item{font-size:0.74rem;gap:3px}
    .lang-color{width:8px;height:8px}

    .assess-badge{font-size:0.65rem;padding:2px 7px;border-radius:14px}

    .repo-badges{gap:4px 6px;margin-top:10px;padding-top:10px}
    .repo-badges img{height:17px}
    .embed-btn{padding:2px 7px;font-size:0.65rem;border-radius:4px}

    .empty-state{padding:50px 16px}
    .empty-state p{font-size:0.95rem}
  }

  @media(max-width:400px){
    .header h1{font-size:1.5rem}
    .header .subtitle{font-size:0.8rem}
    .controls{gap:6px;margin-top:20px}
    .pill{padding:4px 9px;font-size:0.7rem}
    .badge-style-pill{padding:3px 7px;font-size:0.65rem}
    .stats-bar{gap:12px}
    .stat-value{font-size:1rem}
    .stat-label{font-size:0.62rem}
    .repo-card{padding:11px 11px}
    .repo-rank{font-size:1rem;min-width:22px}
    .repo-name{font-size:0.85rem}
    .repo-desc{font-size:0.74rem}
    .repo-meta{gap:7px}
    .meta-item{font-size:0.68rem}
    .assess-badge{font-size:0.6rem;padding:2px 6px}
    .repo-badges img{height:15px}
    .embed-btn{font-size:0.6rem;padding:2px 5px}
  }

  /* scrollbar */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary)}

  /* Language color map */
  .lang-python{background:#3572A5}
  .lang-rust{background:#dea584}
  .lang-html{background:#e34c26}
  .lang-javascript{background:#f1e05a}
  .lang-typescript{background:#3178c6}
  .lang-go{background:#00ADD8}
  .lang-java{background:#b07219}
  .lang-c{background:#555555}
  .lang-cplusplus{background:#f34b7d}
  .lang-csharp{background:#178600}
  .lang-ruby{background:#701516}
  .lang-php{background:#4F5D95}
  .lang-swift{background:#F05138}
  .lang-kotlin{background:#A97BFF}
  .lang-dart{background:#00B4AB}
  .lang-scala{background:#c22d40}
  .lang-shell{background:#89e051}
  .lang-lua{background:#000080}
  .lang-r{background:#198CE7}
  .lang-julia{background:#A270BA}
  .lang-zig{background:#ec915c}
  .lang-default{background:var(--text-tertiary)}

  /* transition for control changes */
  .repo-list.transitioning{
    opacity:0.3;transform:translateY(8px);
    transition:all 0.2s ease;
  }

  /* link style reset */
  a{text-decoration:none;color:inherit}
</style>
</head>
<body>

<header class="header">
  <h1>GitHub <span>Trending</span></h1>
  <p class="subtitle">Discover what the community is building</p>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-item">
    <div class="stat-value" id="statTotal">--</div>
    <div class="stat-label">repositories</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="statStars">--</div>
    <div class="stat-label">total stars gained</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="statLangs">--</div>
    <div class="stat-label">languages</div>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <span class="control-label">Period</span>
    <button class="pill since-pill active" data-since="daily">Daily</button>
    <button class="pill since-pill" data-since="weekly">Weekly</button>
    <button class="pill since-pill" data-since="monthly">Monthly</button>
  </div>
  <div class="divider"></div>
  <div class="control-group">
    <span class="control-label">Language</span>
    <select class="badge-style-pill" id="langSel" title="筛选语言">
      <option value="">All</option>
    </select>
  </div>
  <div class="divider"></div>
  <div class="control-group">
    <span class="control-label">Badge</span>
    <select class="badge-style-pill" id="badgeStyleSel">
      <option value="social">social</option>
      <option value="flat">flat</option>
      <option value="flat-square">flat-square</option>
      <option value="plastic">plastic</option>
      <option value="for-the-badge">for-the-badge</option>
    </select>
  </div>
</div>

<div class="container">
  <div id="repoList" class="repo-list"></div>
</div>

<script>
(function(){
  var API_BASE = "https://cloudflare-mcp1.zx1993.top/api/trending";
  var currentSince = "daily";
  var currentLang = "";
  var cachedData = {};
  var loading = false;

  // 支持的全部语言 [slug, 显示名],按显示名字母序;含特殊字符的 slug(c++/c#/f#)在 fetchData 中统一编码
  var LANGS = [
    ["ada", "Ada"], ["assembly", "Assembly"], ["astro", "Astro"],
    ["c", "C"], ["c#", "C#"], ["c++", "C++"],
    ["clojure", "Clojure"], ["cmake", "CMake"], ["coffee-script", "CoffeeScript"],
    ["crystal", "Crystal"], ["css", "CSS"], ["d", "D"],
    ["dart", "Dart"], ["dockerfile", "Dockerfile"], ["elixir", "Elixir"],
    ["elm", "Elm"], ["emacs-lisp", "Emacs Lisp"], ["erlang", "Erlang"],
    ["f#", "F#"], ["fennel", "Fennel"], ["fortran", "Fortran"],
    ["glsl", "GLSL"], ["go", "Go"], ["groovy", "Groovy"],
    ["haskell", "Haskell"], ["hcl", "HCL"], ["html", "HTML"],
    ["java", "Java"], ["javascript", "JavaScript"], ["julia", "Julia"],
    ["jupyter-notebook", "Jupyter Notebook"], ["kotlin", "Kotlin"], ["less", "Less"],
    ["lisp", "Lisp"], ["lua", "Lua"], ["makefile", "Makefile"],
    ["matlab", "MATLAB"], ["nim", "Nim"], ["nix", "Nix"],
    ["objective-c", "Objective-C"], ["ocaml", "OCaml"], ["pascal", "Pascal"],
    ["perl", "Perl"], ["php", "PHP"], ["powershell", "PowerShell"],
    ["prolog", "Prolog"], ["purescript", "PureScript"], ["python", "Python"],
    ["r", "R"], ["ruby", "Ruby"], ["rust", "Rust"],
    ["sass", "Sass"], ["scala", "Scala"], ["scheme", "Scheme"],
    ["scss", "SCSS"], ["shell", "Shell"], ["solidity", "Solidity"],
    ["svelte", "Svelte"], ["swift", "Swift"], ["tex", "TeX"],
    ["typescript", "TypeScript"], ["vala", "Vala"], ["vim-script", "Vim Script"],
    ["vue", "Vue"], ["webassembly", "WebAssembly"], ["zig", "Zig"]
  ];

  var repoListEl = document.getElementById("repoList");
  var statTotal = document.getElementById("statTotal");
  var statStars = document.getElementById("statStars");
  var statLangs = document.getElementById("statLangs");
  var badgeStyleSel = document.getElementById("badgeStyleSel");
  var langSel = document.getElementById("langSel");

  // ---- Language color helper ----
  function langClass(lang) {
    if (!lang) return "lang-default";
    var l = lang.toLowerCase().replace("++", "plus").replace("#", "sharp").replace(" ", "");
    return "lang-" + l;
  }

  // ---- Format numbers ----
  function fmtNum(n) {
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return n.toString();
  }

  // ---- Escape HTML ----
  function escHtml(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- Assess learning value (based on stars) ----
  function assess(stars) {
    if (stars >= 50000) return { cls: "a-hot", txt: "Top Project", tip: "Star >= 50k" };
    if (stars >= 10000) return { cls: "a-hot", txt: "Very Popular", tip: "Star >= 10k" };
    if (stars >= 1000)  return { cls: "a-good", txt: "Worth Learning", tip: "Star >= 1k" };
    if (stars >= 100)   return { cls: "a-fair", txt: "Niche but Useful", tip: "Star >= 100" };
    return { cls: "a-cold", txt: "Emerging", tip: "Star < 100" };
  }

  // ---- Cache key ----
  function cacheKey(since, lang) {
    return since + ":" + (lang || "all");
  }

  // ---- Fetch data ----
  async function fetchData(since, lang) {
    var key = cacheKey(since, lang);
    if (cachedData[key]) return cachedData[key];

    var url = API_BASE + "?since=" + since;
    if (lang) url += "&language=" + encodeURIComponent(lang);

    var res = await fetch(url);
    if (!res.ok) throw new Error("API error");
    var json = await res.json();
    cachedData[key] = json.data || [];
    return cachedData[key];
  }

  // ---- Badge style ----
  function getBadgeStyle() {
    return badgeStyleSel ? badgeStyleSel.value : "social";
  }

  function badgeUrl(path) {
    var base = "https://img.shields.io/" + path;
    var style = getBadgeStyle();
    if (style && style !== "social") base += "?style=" + encodeURIComponent(style);
    return base;
  }

  // ---- Build shields.io badges HTML ----
  function buildBadges(username, reponame) {
    var enc = encodeURIComponent(username) + "/" + encodeURIComponent(reponame);
    var defs = [
      { path: "github/stars/" + enc,           alt: "stars" },
      { path: "github/forks/" + enc,           alt: "forks" },
      { path: "github/issues/" + enc,          alt: "issues" },
      { path: "github/license/" + enc,         alt: "license" },
      { path: "github/languages/top/" + enc,   alt: "language" },
      { path: "github/last-commit/" + enc,     alt: "last commit" },
      { path: "github/repo-size/" + enc,       alt: "repo size" },
      { path: "github/contributors/" + enc,    alt: "contributors" }
    ];
    var html = "";
    for (var i = 0; i < defs.length; i++) {
      var b = defs[i];
      html += '<a href="https://github.com/' + enc + '" target="_blank" rel="noopener">' +
              '<img src="' + badgeUrl(b.path) + '" alt="' + b.alt + '" title="' + b.alt + '">' +
              '</a>';
    }
    return html;
  }

  // ---- Build embed markdown ----
  function buildEmbedMarkdown(username, reponame) {
    var enc = encodeURIComponent(username) + "/" + encodeURIComponent(reponame);
    var href = "https://github.com/" + enc;
    var defs = [
      { path: "github/stars/" + enc,         label: "stars" },
      { path: "github/forks/" + enc,         label: "forks" },
      { path: "github/issues/" + enc,        label: "issues" },
      { path: "github/license/" + enc,       label: "license" },
      { path: "github/languages/top/" + enc, label: "language" },
      { path: "github/last-commit/" + enc,   label: "last commit" }
    ];
    var parts = [];
    for (var i = 0; i < defs.length; i++) {
      var b = defs[i];
      var url = badgeUrl(b.path);
      parts.push("[![" + b.label + "](" + url + ")](" + href + ")");
    }
    return parts.join(" ");
  }

  // ---- Render cards ----
  function renderCards(repos) {
    repoListEl.innerHTML = "";

    if (!repos.length) {
      repoListEl.innerHTML = '<div class="empty-state"><p>No trending repositories found for this filter.</p></div>';
      updateStats([]);
      return;
    }

    updateStats(repos);

    var frag = document.createDocumentFragment();
    repos.forEach(function(repo, i) {
      var card = document.createElement("div");
      card.className = "repo-card";
      card.style.animationDelay = (i * 50) + "ms";

      var langColorHtml = repo.language
        ? '<span class="lang-color ' + langClass(repo.language) + '"></span>'
        : "";

      var langHtml = repo.language
        ? '<span class="meta-item lang-dot">' + langColorHtml + " " + escHtml(repo.language) + "</span>"
        : "";

      var starsTodayLabel = {
        daily: "stars today",
        weekly: "stars this week",
        monthly: "stars this month"
      }[currentSince] || "stars today";

      var a = assess(repo.stars || 0);
      var badgesHtml = buildBadges(repo.username, repo.reponame);
      var repoUrl = "https://github.com/" + encodeURIComponent(repo.username) + "/" + encodeURIComponent(repo.reponame);

      card.innerHTML =
        '<div class="repo-top">' +
          '<div class="repo-rank">' + repo.rank + '</div>' +
          '<div class="repo-info">' +
            '<a class="repo-name" href="' + repo.url + '" target="_blank" rel="noopener">' +
              '<span class="owner">' + escHtml(repo.username) + '</span>' +
              '<span class="slash">/</span>' +
              escHtml(repo.reponame) +
            '</a>' +
            (repo.description ? '<p class="repo-desc">' + escHtml(repo.description) + '</p>' : '') +
          '</div>' +
          '<span class="assess-badge ' + a.cls + '" title="' + a.tip + '">' + a.txt + '</span>' +
        '</div>' +
        '<div class="repo-meta">' +
          langHtml +
          '<span class="meta-item">' + fmtNum(repo.stars) + ' stars</span>' +
          '<span class="meta-item">' + fmtNum(repo.forks) + ' forks</span>' +
          '<span class="meta-item"><span class="stars-today">+' + fmtNum(repo.starsToday) + '</span> ' + starsTodayLabel + '</span>' +
        '</div>' +
        '<div class="repo-badges">' +
          badgesHtml +
          '<button class="embed-btn" data-user="' + escHtml(repo.username) + '" data-repo="' + escHtml(repo.reponame) + '" title="Copy Markdown embed code">Copy Embed</button>' +
        '</div>';

      frag.appendChild(card);
    });

    repoListEl.appendChild(frag);

    // Trigger entrance with stagger
    requestAnimationFrame(function() {
      var cards = repoListEl.querySelectorAll(".repo-card");
      cards.forEach(function(card, i) {
        setTimeout(function() {
          card.classList.add("visible");
        }, i * 45);
      });
    });
  }

  function updateStats(repos) {
    if (!repos.length) {
      statTotal.textContent = "0";
      statStars.textContent = "0";
      statLangs.textContent = "0";
      return;
    }
    statTotal.textContent = repos.length;
    var totalGained = repos.reduce(function(s, r) { return s + (r.starsToday || 0); }, 0);
    statStars.textContent = fmtNum(totalGained);
    var langs = new Set(repos.map(function(r) { return r.language; }).filter(Boolean));
    statLangs.textContent = langs.size;
  }

  // ---- Load and render ----
  async function loadAndRender(animate) {
    if (loading) return;
    loading = true;

    repoListEl.innerHTML = '<div class="loading-container"><div class="loading-spinner"></div></div>';

    try {
      var repos = await fetchData(currentSince, currentLang);

      if (animate) {
        repoListEl.classList.add("transitioning");
        await sleep(200);
        repoListEl.classList.remove("transitioning");
      }

      renderCards(repos);
    } catch (err) {
      repoListEl.innerHTML = '<div class="empty-state"><p>Failed to load trending data. Please try again.</p></div>';
    }

    loading = false;
  }

  function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  // ---- Event: since pills ----
  document.querySelectorAll(".since-pill").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var since = btn.dataset.since;
      if (since === currentSince) return;
      document.querySelectorAll(".since-pill").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentSince = since;
      loadAndRender(true);
    });
  });

  // ---- Event: language select ----
  langSel.addEventListener("change", function() {
    var lang = langSel.value;
    if (lang === currentLang) return;
    currentLang = lang;
    loadAndRender(true);
  });

  // ---- Event: badge style change (re-render without refetch) ----
  badgeStyleSel.addEventListener("change", function() {
    var key = cacheKey(currentSince, currentLang);
    if (cachedData[key]) {
      renderCards(cachedData[key]);
    }
  });

  // ---- Event: copy embed (delegated) ----
  repoListEl.addEventListener("click", function(e) {
    var btn = e.target.closest(".embed-btn");
    if (!btn) return;
    e.stopPropagation();
    var user = btn.getAttribute("data-user");
    var repo = btn.getAttribute("data-repo");
    var md = buildEmbedMarkdown(user, repo);
    navigator.clipboard.writeText(md).then(function() {
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(function() {
        btn.textContent = "Copy Embed";
        btn.classList.remove("copied");
      }, 1800);
    }).catch(function() {
      btn.textContent = "Failed";
      setTimeout(function() { btn.textContent = "Copy Embed"; }, 1500);
    });
  });

  // ---- 填充语言下拉框 ----
  if (langSel) {
    var langFrag = document.createDocumentFragment();
    LANGS.forEach(function(item) {
      var opt = document.createElement("option");
      opt.value = item[0];
      opt.textContent = item[1];
      langFrag.appendChild(opt);
    });
    langSel.appendChild(langFrag);
  }

  // ---- Initial load ----
  loadAndRender(false);
})();
</script>
</body>
</html>
