<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费追剧资源导航</title>
<meta name="description" content="免费无广告追剧资源聚合导航：在线影视、TVBox接口、磁力BT、网盘搜索等分类一站式浏览，支持搜索与风险标注。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 纸面清单主题（与 tools 页对齐）：纯白底 / 黑字 / 灰阶层级 ============ */
:root {
    --bg: #ffffff;
    --chip: #f5f5f5;          /* 卡片默认浅灰 */
    --chip-hover: #ffffff;    /* hover 反转为白 + 黑边浮现 */
    --line: #e5e5e5;          /* 分隔线 */
    --line-strong: #111111;   /* hover 黑边 */

    --text: #111111;
    --text-soft: #555555;
    --text-dim: #999999;

    /* 功能色：仅风险标注与状态提示小面积使用 */
    --ok: #4E9A82;
    --warn: #B0803B;
    --danger: #C0564F;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-pill: 999px;

    --transition: all 0.2s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

::selection { background: rgba(17, 17, 17, 0.12); }

:focus-visible {
    outline: 2px solid var(--line-strong);
    outline-offset: 2px;
}

/* ============ 布局 ============ */
.page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 20px;
    position: relative;
}

/* ============ Hero：扁平长方形卡 ============ */
.hero {
    background: var(--chip);
    border-radius: var(--radius-md);
    padding: 18px 22px 16px;
    transition: var(--transition);
}
.hero-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.2px;
    line-height: 1.25;
    padding-left: 12px;
    position: relative;
}
/* tools 页小节标题同款黑色竖条 */
.hero-title::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 16px;
    border-radius: 1px;
    background: var(--line-strong);
}
.hero-line {
    margin-top: 6px;
    font-size: 0.82rem;
    color: var(--text-soft);
}
.hero-note { color: var(--text-dim); }
.hero-note.stale { color: var(--warn); }

/* ============ 搜索 + 排序工具栏 ============ */
.toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 16px 0 12px;
    flex-wrap: wrap;
}
.search-box { flex: 1 1 260px; min-width: 220px; }
.search-box input {
    width: 100%;
    padding: 10px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    outline: none;
    transition: var(--transition);
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { border-color: var(--line-strong); }

.select-wrap { position: relative; flex: 0 0 auto; }
.select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding: 10px 32px 10px 14px;
    font-size: 0.78rem;
    font-family: inherit;
    color: var(--text-soft);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    outline: none;
    cursor: pointer;
    transition: var(--transition);
}
.select-wrap select:hover { border-color: var(--line-strong); }
.select-wrap select:focus { border-color: var(--line-strong); }
.select-wrap::after {
    content: '';
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid var(--text-dim);
    pointer-events: none;
}

/* ============ 分类 chip 行 ============ */
.tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.15) transparent;
}
.tabs::-webkit-scrollbar { height: 5px; }
.tabs::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
.tab {
    flex: 0 0 auto;
    padding: 5px 12px;
    font-size: 0.72rem;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    white-space: nowrap;
}
.tab:hover { background: var(--chip); color: var(--text); }
.tab.active {
    background: rgba(17, 17, 17, 0.05);
    border-color: var(--line-strong);
    color: var(--text);
    font-weight: 600;
}
.tab .count {
    font-size: 0.62rem;
    color: var(--text-dim);
    margin-left: 3px;
    font-weight: 500;
}

.result-info { font-size: 0.72rem; color: var(--text-dim); margin: 10px 2px; }

/* ============ 卡片网格：浅灰素面 chip，hover 白底黑边 ============ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
}

.card {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 13px 15px 12px;
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    transition: background 0.2s ease, border-color 0.2s ease;
    animation: cardIn .4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.card:hover {
    background: var(--chip-hover);
    border-color: var(--line-strong);
}

.card-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    word-break: break-all;
}
.card-desc {
    font-size: 0.75rem;
    color: var(--text-soft);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* 风险：单行低饱和文本（未知折叠、版权常态灰、红色仅真正高危） */
.risk-line {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 10px;
    font-size: 0.68rem;
    color: var(--text-dim);
}
.risk-seg.high { color: var(--danger); }
.risk-seg.low  { color: var(--ok); }

/* 操作区：打开 = 细线框，复制/接口 = 文字链 */
.card-actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
    padding-top: 3px;
    flex-wrap: wrap;
    align-items: center;
}
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    font-size: 0.72rem;
    font-weight: 500;
    font-family: inherit;
    border-radius: var(--radius-pill);
    border: none;
    background: none;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
}
.btn-open {
    color: var(--text-soft);
    border: 1px solid var(--line);
}
.btn-open:hover {
    color: var(--text);
    border-color: var(--line-strong);
    background: #fff;
}
.btn-ghost, .btn-config {
    color: var(--text-dim);
    border: 1px solid transparent;
    padding: 4px 6px;
}
.btn-ghost:hover, .btn-config:hover {
    color: var(--text);
    text-decoration: underline;
}
.btn-ghost.copied, .btn-config.copied { color: var(--ok); text-decoration: none; }

/* 空状态 */
.empty {
    text-align: center;
    padding: 44px 20px;
    color: var(--text-dim);
    font-size: 0.85rem;
    border: 1px dashed var(--line);
    border-radius: var(--radius-md);
}
.empty .btn { margin-top: 12px; }

/* 页脚 */
footer {
    margin-top: 36px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    padding: 18px 10px;
    border-top: 1px solid var(--line);
}
footer a { color: var(--text); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* ============ 响应式 ============ */
@media (max-width: 640px) {
    .page { padding: 16px 14px 30px; }
    .hero { padding: 15px 16px 14px; }
    .grid { grid-template-columns: 1fr; }
}

/* 减少动效偏好 */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="page">
    <!-- Hero：扁平长方形卡，标题 + 一句描述 -->
    <section class="hero">
        <h1 class="hero-title">免费追剧资源导航</h1>
        <p class="hero-line">无广告追剧入口索引，持续检测可用性<span class="hero-note" id="heroNote"></span></p>
    </section>

    <!-- 搜索 + 排序 -->
    <div class="toolbar">
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="搜索站点、剧集类型、TVBox、磁力、字幕…" aria-label="搜索资源">
        </div>
        <div class="select-wrap">
            <select id="sortSelect" aria-label="排序方式">
                <option value="default">默认排序</option>
                <option value="rating">按评分</option>
                <option value="latest">最近收录</option>
            </select>
        </div>
    </div>

    <!-- 分类 chip 行 -->
    <div class="tabs" id="tabs" role="tablist" aria-label="资源分类"></div>

    <div class="result-info" id="resultInfo"></div>

    <!-- 卡片网格 -->
    <main class="grid" id="grid"></main>

    <!-- 空状态 -->
    <div class="empty" id="empty" hidden>
        <p id="emptyText">没有找到匹配的资源</p>
        <button class="btn btn-ghost" id="emptyReset">清空筛选</button>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>数据来源：<a href="https://github.com/laoma2053/awesome-zhuiju-free" target="_blank" rel="noopener noreferrer">laoma2053/awesome-zhuiju-free</a>（CC BY 4.0）· 仅收录入口索引，不托管任何资源，版权与安全风险请自行判断</p>
        <p id="footerMeta"></p>
    </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
