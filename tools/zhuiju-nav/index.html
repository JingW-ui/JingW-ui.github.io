<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费追剧资源导航</title>
<meta name="description" content="免费无广告追剧资源聚合导航：在线影视、TVBox接口、磁力BT、网盘搜索等分类一站式浏览，支持搜索、评分与风险标注。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌（克制的浅色专业风） ============ */
:root {
    --primary: #1EAFA0;
    --primary-deep: #178F83;
    --teal-soft: #A8D7CF;

    --ink: #3A4A49;         /* 标题/数字 */
    --text: #5F6F6E;        /* 正文 */
    --text-2: #889695;      /* 次要 */
    --text-faint: #AEBAB8;  /* 弱化 */

    --line: #E6EFEC;        /* 卡片描边 */
    --line-strong: #DBE7E4; /* 输入框描边 */

    --card: #FFFFFF;

    --ring: #DDE4E3;        /* 评分环（灰） */
    --dot-on: #8CCDBF;      /* 指标点亮（低饱和青） */
    --dot-off: #E4EBE9;     /* 指标点暗 */

    --ok: #4E9A82;          /* 低风险绿 */
    --warn: #C98A3B;        /* 谨慎琥珀（低饱和） */
    --danger: #C0564F;      /* 高风险红（仅真正高危用） */

    --shadow-card: 0 6px 18px rgba(20, 50, 45, 0.045);
    --shadow-hover: 0 10px 26px rgba(20, 50, 45, 0.07);

    --radius-card: 16px;
    --radius-panel: 20px;
    --radius-pill: 999px;

    --transition: all 0.25s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #F0F7F4 0%, #EAF3F1 50%, #E9F0EF 100%);
    min-height: 100vh;
    line-height: 1.6;
}

/* ============ 背景装饰（更克制） ============ */
.bg-decoration {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    pointer-events: none;
    z-index: 0;
}
.bg-decoration-1 {
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(94,234,212,0.28) 0%, transparent 70%);
    top: -180px; left: -120px;
    animation: float 22s ease-in-out infinite;
}
.bg-decoration-2 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(125,211,252,0.24) 0%, transparent 70%);
    bottom: -140px; right: -120px;
    animation: float 26s ease-in-out infinite reverse;
}
.bg-decoration-3 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(45,212,191,0.16) 0%, transparent 70%);
    top: 48%; left: 52%;
    transform: translate(-50%, -50%);
    animation: pulse 16s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(30px, -30px) rotate(120deg); }
    66% { transform: translate(-20px, 20px) rotate(240deg); }
}
@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.45; }
}

/* ============ 布局 ============ */
.page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    position: relative;
    z-index: 1;
}

/* ============ Hero（浅色一体化顶区，不做厚重白卡） ============ */
.hero {
    padding: 34px 34px 26px;
    background: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42));
    border: 1px solid rgba(214,232,228,0.7);
    border-radius: var(--radius-panel);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
}
.hero-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
.hero-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}
.hero-logo {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1EAFA0, #3B82F6);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 17px;
    box-shadow: var(--shadow-card);
}
/* 标题：品牌词更重，「导航」稍轻 */
.hero-title {
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .5px;
    line-height: 1.2;
}
.hero-accent {
    color: var(--primary);
    font-weight: 500;
    margin-left: 4px;
}

/* 状态徽章：浅灰绿 + 小点，不像按钮 */
.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 11px;
    font-size: 12px;
    color: #5F7A76;
    background: #EEF6F3;
    border-radius: var(--radius-pill);
    white-space: nowrap;
}
.status-pill i { font-size: 8px; color: #4E9A82; }
.status-pill.is-stale {
    color: #8A6D3B;
    background: #FAF4E8;
}
.status-pill.is-stale i { color: var(--warn); }

.hero-sub {
    margin-top: 10px;
    color: var(--text);
    font-size: 14px;
}
.hero-stats {
    margin-top: 18px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-faint);
}
.stat-num {
    font-family: 'Courier New', monospace;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
}
.stat-unit { color: var(--text-2); margin-left: 5px; }
.stat-sep { color: var(--line-strong); }

/* ============ 搜索工具栏（透明底，独立行） ============ */
.search-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 18px;
    flex-wrap: wrap;
}
.search-box {
    position: relative;
    flex: 1 1 300px;
    min-width: 220px;
}
.search-box i {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 13px;
    pointer-events: none;
}
.search-box input {
    width: 100%;
    padding: 11px 16px 11px 42px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    outline: none;
    transition: var(--transition);
    box-shadow: var(--shadow-card);
}
.search-box input::placeholder { color: var(--text-faint); }
.search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,175,160,0.14);
}
.select-wrap {
    position: relative;
    flex: 0 0 auto;
}
.select-wrap select {
    appearance: none;
    -webkit-appearance: none;
    padding: 11px 32px 11px 15px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    outline: none;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-card);
}
.select-wrap select:hover { border-color: var(--line-strong); }
.select-wrap select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30,175,160,0.14);
}
.select-wrap::after {
    content: "\f078";
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 10px;
    color: var(--text-faint);
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
}

/* ============ 分类 chip 行（透明底，轻量） ============ */
.tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-top: 14px;
    padding: 2px 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(140,150,148,0.3) transparent;
}
.tabs::-webkit-scrollbar { height: 5px; }
.tabs::-webkit-scrollbar-thumb { background: rgba(140,150,148,0.3); border-radius: 3px; }
.tab {
    flex: 0 0 auto;
    padding: 5px 12px;
    font-size: 12.5px;
    color: var(--text-2);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    white-space: nowrap;
}
.tab:hover { background: rgba(255,255,255,0.8); color: var(--text); }
.tab.active {
    background: var(--primary);
    color: #fff;
    border-color: transparent;
    box-shadow: none;
}
.tab .count {
    font-size: 10.5px;
    opacity: 0.72;
    margin-left: 3px;
    font-weight: 500;
}

.result-info { font-size: 12px; color: var(--text-faint); margin: 12px 2px 12px; }

/* ============ 卡片网格 ============ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
    gap: 12px;
}

.card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 14px 14px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    transition: var(--transition);
    animation: cardIn .35s ease both;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
}

.card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
}
.card-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.35;
    word-break: break-all;
}
.card-badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 4px;
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
}
.badge-cat { color: #6B7F80; background: transparent; border: 1px solid rgba(120,140,138,0.22); }
.badge-ok   { color: var(--ok); background: transparent; border: 1px solid rgba(78,154,130,0.25); }
.badge-warn { color: #B0803B; background: transparent; border: 1px solid rgba(176,128,59,0.28); }

/* 评分环：一律灰色安静（数据中 65% 均分为 5.0，不着色） */
.score-circle {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Courier New', monospace;
    color: var(--text-2);
    background: transparent;
    border: 1px solid var(--ring);
}

.card-desc { font-size: 12.5px; color: var(--text); line-height: 1.55; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
    font-size: 10.5px;
    color: var(--text-faint);
    background: transparent;
    padding: 1px 7px;
    border-radius: 6px;
    white-space: nowrap;
}

/* 评分五维点阵（点更小、更淡） */
.card-scores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 14px;
}
.score-row {
    display: flex;
    align-items: center;
    gap: 7px;
}
.score-row .s-label {
    font-size: 10.5px;
    color: var(--text-faint);
    flex: 0 0 auto;
    width: 28px;
}
.dots { display: flex; gap: 3px; }
.dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--dot-off);
}
.dot.on { background: var(--dot-on); }
.dot.half {
    background: linear-gradient(90deg, var(--dot-on) 50%, var(--dot-off) 50%);
}

/* 风险：单行低饱和文本（未知折叠、版权常态灰、红色仅真正高危） */
.risk-line {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 12px;
    font-size: 11px;
    color: var(--text-faint);
}
.risk-seg.high { color: var(--danger); }
.risk-seg.low  { color: var(--ok); }

/* 操作区：打开 = 浅线框，复制 = 文字链 */
.card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 2px;
    flex-wrap: wrap;
    align-items: center;
}
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    border-radius: var(--radius-pill);
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
}
.btn-open {
    background: transparent;
    color: var(--primary-deep);
    border: 1px solid rgba(30,175,160,0.32);
}
.btn-open:hover {
    background: #F1FAF8;
    border-color: rgba(30,175,160,0.5);
}
.btn-ghost, .btn-config {
    background: none;
    color: var(--text-2);
    border: 1px solid transparent;
    padding: 5px 6px;
}
.btn-ghost i, .btn-config i { color: var(--text-faint); }
.btn-ghost:hover, .btn-config:hover {
    color: var(--primary-deep);
    text-decoration: underline;
}
.btn-ghost:hover i, .btn-config:hover i { color: var(--primary-deep); }
.btn-ghost.copied, .btn-config.copied { color: var(--ok); text-decoration: none; }

/* 空状态 */
.empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-2);
    background: transparent;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-card);
}
.empty i { font-size: 28px; margin-bottom: 10px; color: rgba(140,150,148,0.45); }
.empty .btn { margin-top: 14px; }

/* 页脚 */
footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    padding: 18px 10px;
    border-top: 1px solid rgba(140,150,148,0.16);
}
footer a { color: #3B82F6; text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* 焦点可见性 */
:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

/* ============ 响应式 ============ */
@media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (max-width: 560px) {
    .page { padding: 16px 14px 30px; }
    .hero { padding: 24px 20px 22px; }
    .hero-title { font-size: 24px; }
    .hero-logo { width: 36px; height: 36px; font-size: 15px; }
    .grid { grid-template-columns: 1fr; }
    .card-scores { grid-template-columns: 1fr; }
}

/* 减少动效偏好 */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
<body>

<div class="bg-decoration bg-decoration-1"></div>
<div class="bg-decoration bg-decoration-2"></div>
<div class="bg-decoration bg-decoration-3"></div>

<div class="page">
    <!-- Hero 一体化顶区 -->
    <section class="hero">
        <div class="hero-head">
            <div class="hero-brand">
                <div class="hero-logo"><i class="fa-solid fa-play"></i></div>
                <h1 class="hero-title">免费追剧资源<span class="hero-accent">导航</span></h1>
            </div>
            <div class="status-pill" id="statusPill">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span id="statusText">加载中…</span>
            </div>
        </div>
        <p class="hero-sub">人工筛选、每日检测可用性的无广告追剧入口索引</p>
        <div class="hero-stats">
            <span class="stat-num" id="statTotal">–</span><span class="stat-unit">个资源</span>
            <span class="stat-sep">·</span>
            <span class="stat-num" id="statCats">–</span><span class="stat-unit">个分类</span>
        </div>
    </section>

    <!-- 搜索 + 排序：同一工具栏 -->
    <div class="search-toolbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="searchInput" placeholder="搜索站点、剧集类型、TVBox、磁力、字幕…" aria-label="搜索资源">
        </div>
        <div class="select-wrap">
            <select id="sortSelect" aria-label="排序方式">
                <option value="default">默认排序</option>
                <option value="rating">按评分</option>
                <option value="latest">最近收录</option>
            </select>
        </div>
    </div>

    <!-- 分类 chip 行 -->
    <div class="tabs" id="tabs" role="tablist" aria-label="资源分类"></div>

    <div class="result-info" id="resultInfo"></div>

    <!-- 卡片网格 -->
    <main class="grid" id="grid"></main>

    <!-- 空状态 -->
    <div class="empty" id="empty" hidden>
        <div><i class="fa-solid fa-film"></i></div>
        <p id="emptyText">没有找到匹配的资源</p>
        <button class="btn btn-ghost" id="emptyReset">清空筛选</button>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>数据来源：<a href="https://github.com/laoma2053/awesome-zhuiju-free" target="_blank" rel="noopener noreferrer">laoma2053/awesome-zhuiju-free</a>（CC BY 4.0）· 仅收录入口索引，不托管任何资源，版权与安全风险请自行判断</p>
        <p id="footerMeta"></p>
    </footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
