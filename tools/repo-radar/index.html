<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Radar - GitHub 仓库嗅探</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --card-2: #1c2128;
  --border: #30363d; --text: #e6edf3; --muted: #7d8590;
  --blue: #2f81f7; --green: #238636; --green-b: #3fb950;
  --yellow: #d29922; --red: #f85149; --purple: #a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  min-height: 100vh; padding: 0 14px 70px;
}
.wrap { max-width: 820px; margin: 0 auto; }
header { text-align: center; padding: 26px 0 16px; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
h1 .accent { color: var(--blue); }
.sub { color: var(--muted); font-size: .84rem; margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
textarea {
  width: 100%; min-height: 110px; resize: vertical;
  background: #010409; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 12px; font: inherit; font-size: .9rem; line-height: 1.5; outline: none;
}
textarea:focus { border-color: var(--blue); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  background: var(--green); color: #fff; border: 1px solid rgba(240,246,252,.1);
  border-radius: 7px; padding: 10px 18px; font: inherit; font-weight: 600;
  font-size: .9rem; cursor: pointer; transition: filter .15s, transform .05s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: var(--card-2); color: var(--text); border-color: var(--border); }
.btn.sm { padding: 6px 12px; font-size: .8rem; }
.toolbar { margin-top: 10px; gap: 8px; }
.token-inp {
  flex: 1; min-width: 180px; background: #010409; border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); padding: 6px 10px; font: inherit;
  font-size: .78rem; outline: none; transition: border-color .15s;
}
.token-inp:focus { border-color: var(--purple); }
.token-inp::placeholder { color: var(--muted); opacity: .6; }
.max-sel {
  background: var(--card-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; font-size: .78rem; outline: none;
}
.quota-bar {
  display: inline-flex; align-items: center; gap: 5px; font-size: .75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--card-2); border-radius: 5px; padding: 2px 8px;
}
.quota-bar.low { color: var(--yellow); }
.quota-bar.exhausted { color: var(--red); }
.cache-tag {
  font-size: .65rem; color: var(--purple); background: rgba(163,113,247,.1);
  border-radius: 3px; padding: 1px 5px; margin-left: 4px; vertical-align: middle;
}
.lang-load-btn {
  background: var(--card-2); color: var(--blue); border: 1px solid var(--border);
  border-radius: 5px; padding: 3px 10px; font-size: .72rem; cursor: pointer;
  margin-top: 8px; transition: color .15s, border-color .15s;
}
.lang-load-btn:hover { border-color: var(--blue); }
.lang-load-btn:disabled { opacity: .5; cursor: not-allowed; }
.lang-load-btn.loaded { color: var(--green-b); border-color: rgba(63,185,80,.3); }
.spacer { flex: 1 1 auto; }
.status {
  margin: 14px 0; font-size: .82rem; color: var(--muted);
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
}
.quota { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.quota b { color: var(--green-b); }
.results-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 10px; }
.results-head h2 { font-size: 1rem; font-weight: 600; }
.sortsel {
  background: var(--card-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; font-size: .8rem; outline: none;
}
.repo {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin-bottom: 10px; transition: border-color .15s;
}
.repo:hover { border-color: #4b5563; }
.repo-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.repo-name { font-size: 1.02rem; font-weight: 600; word-break: break-all; }
.repo-name a { color: var(--blue); text-decoration: none; }
.repo-name a:hover { text-decoration: underline; }
.repo-desc { color: var(--muted); font-size: .85rem; margin-top: 5px; }
.badge {
  font-size: .72rem; font-weight: 600; padding: 3px 8px; border-radius: 20px;
  white-space: nowrap; border: 1px solid transparent; flex-shrink: 0;
}
.b-hot { background: rgba(248,81,73,.12); color: #ff7b72; border-color: rgba(248,81,73,.3); }
.b-good { background: rgba(63,185,80,.12); color: var(--green-b); border-color: rgba(63,185,80,.3); }
.b-fresh { background: rgba(163,113,247,.12); color: var(--purple); border-color: rgba(163,113,247,.3); }
.b-fair { background: rgba(210,153,34,.12); color: var(--yellow); border-color: rgba(210,153,34,.3); }
.b-cold { background: rgba(125,133,144,.12); color: var(--muted); border-color: rgba(125,133,144,.3); }
.b-stale { background: rgba(125,133,144,.1); color: #f0883e; border-color: rgba(240,136,62,.3); }
.repo-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: .82rem; color: var(--muted); }
.meta-item { display: inline-flex; align-items: center; gap: 4px; }
.star-ic { color: var(--yellow); }
.langs { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.lang-pill { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); }
.lang-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.lang-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--card-2); }
.lang-bar span { display: block; }
.progress { height: 4px; background: var(--card-2); border-radius: 2px; overflow: hidden; margin: 6px 0; }
.progress > i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .25s; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: .88rem; }
.error-card { border-color: rgba(248,81,73,.4); opacity: .85; }
.error-card .repo-name a { color: #ff7b72; }
.history-wrap { margin-top: 10px; }
.history-toggle {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: .78rem; padding: 4px 0; display: flex; align-items: center; gap: 4px;
}
.history-toggle:hover { color: var(--text); }
.history-list { display: none; margin-top: 4px; }
.history-list.open { display: block; }
.history-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: .78rem;
  color: var(--muted); transition: background .12s; border: 1px solid transparent;
}
.history-item:hover { background: var(--card-2); color: var(--text); border-color: var(--border); }
.history-item .hi-time { font-size: .7rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.history-item .hi-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.history-clear { font-size: .7rem; color: var(--red); cursor: pointer; background: none; border: none; }
.history-clear:hover { text-decoration: underline; }
.fav-quick { margin-top: 10px; }
.fav-quick-btn {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 8px 12px; font: inherit; font-size: .8rem;
  cursor: pointer; transition: border-color .15s, background .12s;
}
.fav-quick-btn:hover { border-color: var(--yellow); background: var(--card-2); }
.fav-btn {
  background: none; border: none; cursor: pointer; font-size: .95rem; padding: 0 4px;
  color: var(--muted); transition: color .12s, transform .1s; line-height: 1;
  vertical-align: middle; flex-shrink: 0;
}
.fav-btn:hover { color: var(--yellow); transform: scale(1.15); }
.fav-btn.active { color: var(--yellow); }
.fav-filter {
  background: var(--card-2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: .75rem; cursor: pointer;
  transition: color .12s, border-color .12s; white-space: nowrap;
}
.fav-filter.active { color: var(--yellow); border-color: var(--yellow); }
.fav-list { display: none; margin-top: 4px; }
.fav-list.open { display: block; }
.fav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: .78rem;
  color: var(--muted); transition: background .12s; border: 1px solid transparent;
}
.fav-item:hover { background: var(--card-2); color: var(--text); border-color: var(--border); }
.fav-item .fi-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.fav-item .fi-sub {
  font-size: .7rem; color: var(--muted); max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1;
}
.fav-item-rm { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; padding: 0 2px; flex-shrink: 0; }
.fav-item-rm:hover { color: var(--red); }
.fav-quick-arrow { display: inline-block; font-size: .75rem; color: var(--muted); transition: transform .15s; }
.fav-quick-arrow.open { transform: rotate(90deg); }
.skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 37%, var(--card) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 6px; }
@keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.repo-badges {
  display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
}
.repo-badges img {
  height: 20px; vertical-align: middle; border-radius: 3px; transition: opacity .15s;
}
.repo-badges img:hover { opacity: .8; }
.embed-btn {
  background: var(--card-2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 5px; padding: 3px 9px; font-size: .72rem; cursor: pointer;
  transition: color .15s, border-color .15s; white-space: nowrap;
}
.embed-btn:hover { color: var(--text); border-color: var(--blue); }
.embed-btn.copied { color: var(--green-b); border-color: var(--green-b); }
.style-sel {
  background: var(--card-2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; font-size: .8rem; outline: none;
}
footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 28px; }
footer a { color: var(--muted); }

/* ---- Mobile: 520px ---- */
@media (max-width: 520px) {
  body { padding: 0 6px 40px; }
  body.centered {
    display: flex; flex-direction: column;
    min-height: 100vh;
    padding-bottom: 0;
  }
  body.centered .wrap { width: 100%; margin-top: 18vh; margin-bottom: auto; }
  header { padding: 14px 0 8px; }
  .sub { font-size: .65rem; margin-top: 3px; }
  .card { padding: 8px; border-radius: 7px; }
  textarea { min-height: 100px; padding: 6px 8px; font-size: .7rem; border-radius: 6px; }
  .btn { padding: 5px 10px; font-size: .7rem; border-radius: 5px; }
  .toolbar { margin-top: 6px; gap: 5px; }
  .status { margin: 8px 0; font-size: .65rem; gap: 8px; }
  .results-head { margin: 10px 0 6px; }
  .results-head h2 { font-size: .78rem; }
  .sortsel, .style-sel { padding: 3px 5px; font-size: .65rem; border-radius: 4px; }
  .repo { padding: 8px; border-radius: 7px; margin-bottom: 6px; }
  .repo-top { flex-direction: column; gap: 5px; }
  .repo-name { font-size: .82rem; }
  .repo-desc { font-size: .68rem; margin-top: 3px; }
  .badge { font-size: .56rem; padding: 2px 5px; border-radius: 12px; align-self: flex-start; }
  .repo-meta { gap: 6px; margin-top: 6px; font-size: .65rem; }
  .meta-item { gap: 2px; }
  .langs { gap: 3px 8px; margin-top: 6px; }
  .lang-pill { font-size: .6rem; gap: 3px; }
  .lang-dot { width: 6px; height: 6px; }
  .lang-bar { height: 3px; margin-top: 4px; }
  .empty { padding: 16px 6px; font-size: .7rem; }
  .repo-badges { gap: 3px 5px; margin-top: 6px; padding-top: 6px; }
  .repo-badges img { height: 14px; }
  .embed-btn { padding: 2px 5px; font-size: .56rem; border-radius: 3px; }
  footer { font-size: .56rem; margin-top: 14px; }
      .token-inp { font-size: .6rem; padding: 3px 6px; min-width: 0; }
      .max-sel { font-size: .6rem; padding: 2px 4px; }
      .quota-bar { font-size: .6rem; padding: 1px 5px; }
      .cache-tag { font-size: .52rem; }
      .lang-load-btn { font-size: .58rem; padding: 2px 7px; }
      .history-item { font-size: .65rem; padding: 4px 6px; }
      .history-toggle { font-size: .65rem; }
      .fav-btn { font-size: .8rem; }
      .fav-filter { font-size: .6rem; padding: 2px 6px; }
      .fav-quick-btn { font-size: .65rem; padding: 5px 8px; }
      .fav-item { font-size: .65rem; padding: 4px 6px; gap: 5px; }
      .fav-item-rm { font-size: .8rem; }
      .fav-item .fi-sub { max-width: 55%; }
      .fav-quick-arrow { font-size: .65rem; }
}

/* ---- Mobile: 400px ---- */
@media (max-width: 400px) {
  body { padding: 0 5px 32px; }
  .sub { font-size: .58rem; }
  .card { padding: 6px; }
  textarea { min-height: 80px; padding: 5px 6px; font-size: .62rem; }
  .btn { padding: 4px 8px; font-size: .62rem; }
  .toolbar { gap: 4px; }
  .status { font-size: .58rem; }
  .results-head h2 { font-size: .7rem; }
  .sortsel, .style-sel { padding: 2px 4px; font-size: .58rem; }
  .repo { padding: 6px; margin-bottom: 5px; }
  .repo-name { font-size: .75rem; }
  .repo-desc { font-size: .6rem; }
  .badge { font-size: .5rem; padding: 1px 4px; }
  .repo-meta { gap: 4px; font-size: .58rem; }
  .lang-pill { font-size: .54rem; }
  .lang-dot { width: 5px; height: 5px; }
  .repo-badges img { height: 12px; }
  .embed-btn { font-size: .5rem; padding: 1px 4px; }
  footer { font-size: .5rem; }
      .token-inp { font-size: .5rem; padding: 2px 4px; min-width: 0; }
      .max-sel { font-size: .5rem; padding: 1px 3px; }
      .quota-bar { font-size: .5rem; }
      .cache-tag { font-size: .45rem; }
      .lang-load-btn { font-size: .48rem; padding: 1px 5px; }
}
</style>
</head>
<body class="centered">
<div class="wrap">
  <header>
    <h1>Repo <span class="accent">Radar</span></h1>
    <p class="sub">粘贴任意文本 / 自动嗅探 GitHub 仓库 / 一眼判断是否值得学习</p>
  </header>
  <main id="app">
    <section class="card">
      <textarea id="input" placeholder="把包含 GitHub 链接或 Owner/Repo 简写的文本粘贴到这里，例如：&#10;推荐几个好项目 TencentCloud/TencentDB-Agent-Memory 和 https://github.com/facebook/react"></textarea>
      <div class="row toolbar">
        <button class="btn" id="analyzeBtn" type="button">嗅探分析</button>
        <button class="btn ghost" id="pasteBtn" type="button">粘贴</button>
        <button class="btn ghost" id="clearBtn" type="button">清空</button>
        <div class="spacer"></div>
        <select class="max-sel" id="maxSel" title="最大分析数量">
          <option value="10">10 个</option>
          <option value="20" selected>20 个</option>
          <option value="30">30 个</option>
          <option value="50">50 个</option>
        </select>
      </div>
      <div class="row" style="margin-top:6px;gap:8px;">
        <input class="token-inp" id="tokenInput" type="password" placeholder="GitHub Token (可选，提升额度至 5000/h)" autocomplete="off">
        <a href="https://github.com/settings/tokens/new?description=Repo%20Radar" target="_blank" rel="noopener" style="color:var(--blue);font-size:.75rem;white-space:nowrap;text-decoration:none" title="无需勾选任何权限，创建后粘贴即可">🔑 获取 →</a>
        <span id="quotaDisplay" class="quota-bar" style="display:none"></span>
      </div>
    </section>

    <div class="history-wrap" id="historyWrap" style="display:none">
      <button class="history-toggle" id="historyToggle"><span>📋</span> 最近搜索 <span id="historyCount"></span></button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="fav-quick" id="favQuick" style="display:none">
      <button class="fav-quick-btn" id="favQuickBtn">
        <span>★ 我的收藏 (<span id="favQuickCount">0</span>)</span>
        <span class="fav-quick-arrow" id="favQuickArrow">▸</span>
      </button>
      <div class="fav-list" id="favList"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="results-head" id="resultsHead" style="display:none">
      <h2 id="resultsTitle">分析结果</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="fav-filter" id="favFilter" title="仅显示已收藏">★ 收藏</button>
        <select class="sortsel" id="sortSel">
          <option value="stars">按 Star 排序</option>
          <option value="updated">按更新时间</option>
          <option value="name">按名称</option>
        </select>
        <select class="style-sel" id="badgeStyleSel" title="徽章风格">
          <option value="social">风格: social</option>
          <option value="flat">风格: flat</option>
          <option value="flat-square">风格: flat-square</option>
          <option value="plastic">风格: plastic</option>
          <option value="for-the-badge">风格: for-the-badge</option>
        </select>
      </div>
    </div>
    <div id="results"></div>

    <footer>
      <p>Repo Radar - GitHub 仓库嗅探与分析工具</p>
    </footer>
  </main>
</div>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var input = $("input");
  var results = $("results");
  var statusEl = $("status");
  var analyzeBtn = $("analyzeBtn");
  var resultsHead = $("resultsHead");
  var sortSel = $("sortSel");

  // ---- Cache layer ----
  var CACHE_PREFIX = "rr_cache_";
  var CACHE_TTL = 30 * 60 * 1000; // 30 minutes

  function cacheGet(key) {
    try {
      var raw = localStorage.getItem(CACHE_PREFIX + key);
      if (!raw) return null;
      var entry = JSON.parse(raw);
      if (Date.now() - entry.ts > CACHE_TTL) {
        localStorage.removeItem(CACHE_PREFIX + key);
        return null;
      }
      return entry.data;
    } catch (e) { return null; }
  }

  function cacheSet(key, data) {
    try {
      localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), data: data }));
    } catch (e) { /* storage full, ignore */ }
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // ---- Quota state ----
  var quotaRemain = null;
  var quotaTotal = null;
  var quotaUsedApprox = 0;

  function updateQuotaDisplay() {
    var el = $("quotaDisplay");
    if (!el) return;
    if (quotaRemain == null) { el.style.display = "none"; return; }
    el.style.display = "";
    var cls = "quota-bar";
    if (quotaRemain === 0) cls += " exhausted";
    else if (quotaRemain < 10) cls += " low";
    el.className = cls;
    el.textContent = "配额剩余: " + quotaRemain + (quotaTotal ? " / " + quotaTotal : "") + " | 已用约: " + quotaUsedApprox;
  }

  function recordQuota(headers) {
    var r = headers.get("X-RateLimit-Remaining");
    var t = headers.get("X-RateLimit-Limit");
    if (r != null) quotaRemain = parseInt(r, 10);
    if (t != null) quotaTotal = parseInt(t, 10);
    updateQuotaDisplay();
  }

  // ---- Search history (rr_history) ----
  var HISTORY_KEY = "rr_history";
  var HISTORY_MAX = 20;

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveHistory(text, repoCount) {
    var list = loadHistory();
    // Deduplicate: remove existing entry with same text
    list = list.filter(function (h) { return h.text !== text; });
    // Prepend new entry
    list.unshift({ ts: Date.now(), text: text, count: repoCount });
    // Cap at HISTORY_MAX
    if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
    renderHistory();
  }

  function clearHistory() {
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* ignore */ }
    renderHistory();
  }

  function renderHistory() {
    var wrap = $("historyWrap");
    var listEl = $("historyList");
    var countEl = $("historyCount");
    var toggle = $("historyToggle");
    if (!wrap) return;
    var list = loadHistory();
    if (!list.length) { wrap.style.display = "none"; return; }
    wrap.style.display = "";

  // ---- Favorites (rr_favorites) ----
  var FAV_KEY = "rr_favorites";
  var FAV_DATA_PREFIX = "rr_favdata_";
  var FAV_DATA_TTL = 7 * 24 * 60 * 60 * 1000; // 1 week

  function favDataGet(key) {
    try {
      var raw = localStorage.getItem(FAV_DATA_PREFIX + key);
      if (!raw) return null;
      var entry = JSON.parse(raw);
      if (Date.now() - entry.ts > FAV_DATA_TTL) {
        localStorage.removeItem(FAV_DATA_PREFIX + key);
        return null;
      }
      return entry.data;
    } catch (e) { return null; }
  }

  function favDataSet(key, data) {
    try {
      localStorage.setItem(FAV_DATA_PREFIX + key, JSON.stringify({ ts: Date.now(), data: data }));
    } catch (e) { /* ignore */ }
  }

  var favCache = null;

  function loadFavorites() {
    if (favCache) return favCache;
    try {
      var raw = localStorage.getItem(FAV_KEY);
      favCache = raw ? JSON.parse(raw) : {};
    } catch (e) { favCache = {}; }
    return favCache;
  }

  function saveFavorites(favs) {
    favCache = favs;
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) { /* ignore */ }
  }

  function isFavorite(owner, repo) {
    var key = (owner + "/" + repo).toLowerCase();
    return !!loadFavorites()[key];
  }

  function toggleFavorite(owner, repo) {
    var favs = loadFavorites();
    var key = (owner + "/" + repo).toLowerCase();
    if (favs[key]) {
      delete favs[key];
    } else {
      favs[key] = { owner: owner, repo: repo, full: owner + "/" + repo, savedAt: Date.now() };
      // Save full API data to long-term cache (1 week TTL)
      for (var i = 0; i < lastResults.length; i++) {
        var r = lastResults[i];
        if (r.item && r.item.owner === owner && r.item.repo === repo && r.res && r.res.repo) {
          favDataSet(key, { repo: r.res.repo, langs: cropLangs(r.res.langs) });
          break;
        }
      }
    }
    saveFavorites(favs);
  }

  var favFilterOn = false;
  var favListOpen = false;

  function cropLangs(langs) {
    if (!langs) return langs;
    var entries = Object.entries(langs).filter(function (e) { return e[1] > 0; });
    entries.sort(function (a, b) { return b[1] - a[1]; });
    if (entries.length <= 4) return langs;
    var out = {};
    for (var i = 0; i < 4; i++) out[entries[i][0]] = entries[i][1];
    return out;
  }

  function renderFavQuick() {

      favListOpen = false;
      renderFavQuick();
      return;

    listEl.innerHTML = keys.map(function (key) {
      var f = favs[key];

        if (cached.repo.stargazers_count != null) bits.push("★ " + fmtNum(cached.repo.stargazers_count));
        if (cached.repo.language) bits.push(cached.repo.language);
        if (bits.length) sub = bits.join(" · ");
      }
      return '<div class="fav-item" data-owner="' + escapeHtml(f.owner) + '" data-repo="' + escapeHtml(f.repo) + '">' +
        '<span class="fi-text">' + escapeHtml(f.full) + '</span>' +
        '<span class="fi-sub">' + escapeHtml(sub) + '</span>' +
        '<button class="fav-item-rm" data-owner="' + escapeHtml(f.owner) + '" data-repo="' + escapeHtml(f.repo) + '" title="取消收藏">×</button>' +
      '</div>';
    }).join("");
  }

  function toggleFavList() {
    favListOpen = !favListOpen;
    renderFavQuick();
    if (favListOpen) refreshFavPanelData();

  async function refreshFavPanelData() {
    var token = ($("tokenInput") && $("tokenInput").value.trim()) || null;
    if (!token) return;
    var favs = loadFavorites();
    var missing = Object.keys(favs).filter(function (k) { return !favDataGet(k); });
    if (!missing.length) return;
    var controller = new AbortController();
    var abortState = { aborted: false };
    await pool(missing, function (key) {
      var f = favs[key];
      return fetchRepo(f.owner, f.repo, controller.signal, token).then(function (res) {
        if (res && res.repo) favDataSet(key, { repo: res.repo, langs: cropLangs(res.langs) });
      });
    }, 4, abortState);
    if (favListOpen) renderFavList();
  }

  var LANG_COLORS = {
    JavaScript: "#f1e05a", TypeScript: "#3178c6", Python: "#3572A5", Java: "#b07219",
    Go: "#00ADD8", Rust: "#dea584", "C++": "#f34b7d", C: "#555555", "C#": "#178600",
    Ruby: "#701516", PHP: "#4F5D95", Swift: "#F05138", Kotlin: "#A97BFF", Dart: "#00B4AB",
    Shell: "#89e051", HTML: "#e34c26", CSS: "#563d7c", Vue: "#41b883", Svelte: "#ff3e00",
    Lua: "#000080", Perl: "#0298c3", Scala: "#c22d40", Clojure: "#db5855", Elixir: "#6e4a7e",
    Haskell: "#5e5086", R: "#198CE7", Julia: "#a270ba", Zig: "#ec915c", Nim: "#37775b",
    "Jupyter Notebook": "#DA5B0B", Dockerfile: "#384d54", Makefile: "#427819", Assembly: "#6E4C13",
    ObjectiveC: "#438eff", PowerShell: "#012456", OCaml: "#3be133", Erlang: "#B83998", "F#": "#b845fc",
    Markdown: "#083fa1", SCSS: "#c6538c", Less: "#1d365d", Solidity: "#AA6741", Astro: "#ff5a03"
  };

  function langColor(l) { return LANG_COLORS[l] || "#8b949e"; }

  var REPO_RE = /(?:https?:\/\/)?(?:www\.)?github\.com\/([A-Za-z0-9][A-Za-z0-9_-]{0,38})\/([A-Za-z0-9._-]+)/g;
  // Bare "Owner/Repo" references without a github.com prefix (e.g. TencentCloud/TencentDB-Agent-Memory).
  // Greedy repo token consumes trailing separators; extractRepos rejects path/query continuations
  // (Owner/Repo/…) via the character right after the match, trims trailing separators, and requires the
  // owner to look org-like (contain an uppercase letter) so prose like "src/main" or "path/to" is not matched.
  var BARE_RE = /(?<![A-Za-z0-9._/-])([A-Za-z0-9][A-Za-z0-9-]{2,38})\/([A-Za-z0-9][A-Za-z0-9._-]*)/g;
  var RESERVED = new Set([
    "settings", "orgs", "notifications", "explore", "features", "pricing",
    "marketplace", "collections", "sponsors", "topics", "trending", "search",
    "new", "login", "join", "about", "security", "enterprise", "team", "apps",
    "oauth", "site", "github", "gist", "gists", "blog", "contact", "resources",
    "developers", "events", "services", "partnership", "updates", "organizations"
  ]);

  var lastResults = [];

  function extractRepos(text) {
    var seen = new Set();
    var out = [];
    var add = function (owner, repo) {
      if (repo.charAt(repo.length - 1) === ".") repo = repo.slice(0, -1);
      if (RESERVED.has(owner.toLowerCase())) return;
      if (repo.length < 1 || repo.length > 100) return;
      var key = (owner + "/" + repo).toLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ owner: owner, repo: repo, full: owner + "/" + repo });
    };
    var m;
    // 1) Full / partial github.com URLs
    REPO_RE.lastIndex = 0;
    while ((m = REPO_RE.exec(text)) !== null) add(m[1], m[2]);
    // 2) Bare "Owner/Repo" refs without a URL prefix.
    //    Owner must look org-like (contain an uppercase letter) to avoid matching prose
    //    like "src/main"; repo must contain a letter to avoid version-like "1.0.3".
    BARE_RE.lastIndex = 0;
    while ((m = BARE_RE.exec(text)) !== null) {
      var owner = m[1], repo = m[2];
      if (owner.charAt(owner.length - 1) === "-") continue;
      if (!/[A-Z]/.test(owner)) continue;
      // Greedy repo already consumed trailing separators — reject only if the bare ref
      // continues into a path/query (Owner/Repo/…) or a URL-ish tail.
      var after = text.charAt(m.index + m[0].length);
      if (after === "/" || after === "?" || after === "#") continue;
      repo = repo.replace(/[._-]+$/, "");
      if (!/[A-Za-z]/.test(repo)) continue;
      add(owner, repo);
    }
    return out;
  }

  function fmtNum(n) {
    if (n == null) return "-";
    if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return String(n);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function relTime(iso) {
    if (!iso) return "-";
    var t = new Date(iso).getTime();
    var d = (Date.now() - t) / 86400000;
    if (d < 1) return "今天";
    if (d < 30) return Math.floor(d) + " 天前";
    if (d < 365) return Math.floor(d / 30) + " 个月前";
    return Math.floor(d / 365) + " 年前";
  }

  // Languages with smaller ecosystems — lower the bar for "worth learning"
  var HIGH_ECOSYSTEM = new Set(["JavaScript", "TypeScript", "Python", "Java", "Go", "HTML", "CSS"]);
  var LOW_ECOSYSTEM = new Set(["Rust", "C", "C++", "C#", "Kotlin", "Swift", "Dart", "Lua", "Perl", "Scala",
    "Clojure", "Elixir", "Haskell", "R", "Julia", "Zig", "Nim", "OCaml", "Erlang", "F#", "Assembly", "Solidity"]);

  function assess(r) {
    var stars = r.stargazers_count || 0;
    var lang = r.language || "";
    var months = (Date.now() - new Date(r.pushed_at || r.updated_at).getTime()) / 2592000000;
    if (months > 24) return { cls: "b-stale", txt: "疑似停更", tip: "已 " + Math.floor(months) + " 个月未推送" };

    // Adjust thresholds for language ecosystem size
    var hotThreshold = LOW_ECOSYSTEM.has(lang) ? 3000 : 10000;
    var goodThreshold = LOW_ECOSYSTEM.has(lang) ? 500 : 1000;
    var fairThreshold = LOW_ECOSYSTEM.has(lang) ? 50 : 100;

    // For very high-ecosystem languages, slightly raise the bar
    if (HIGH_ECOSYSTEM.has(lang)) {
      hotThreshold = 15000;
      goodThreshold = 2000;
      fairThreshold = 200;
    }

    if (stars >= hotThreshold && months <= 6) return { cls: "b-hot", txt: "热门活跃", tip: "高星且近期活跃" };
    if (stars >= goodThreshold) return { cls: "b-good", txt: "值得学习", tip: "社区认可度较高" };
    if (months <= 3) return { cls: "b-fresh", txt: "活跃新项目", tip: "近期仍在更新" };
    if (stars >= fairThreshold) return { cls: "b-fair", txt: "小众可用", tip: "有一定关注" };
    return { cls: "b-cold", txt: "冷门项目", tip: "关注较少，自行评估" };
  }

  async function fetchRepo(owner, repo, signal, token) {
    var cacheKey = (owner + "/" + repo).toLowerCase();
    var cached = cacheGet(cacheKey);
    if (cached) return cached;

    var headers = { "Accept": "application/vnd.github+json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    var base = "https://api.github.com/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo);

    var attempt = 0;
    var maxAttempts = 2;
    var resp;

    while (attempt < maxAttempts) {
      attempt++;
      try {
        resp = await fetch(base, { headers: headers, signal: signal });
      } catch (e) {
        if (e.name === "AbortError") return { error: "aborted" };
        throw e;
      }

      recordQuota(resp.headers);

      if (resp.status === 404) return { error: "404", notFound: true };

      // Rate-limited — try Retry-After
      if (resp.status === 429 || (resp.status === 403 && resp.headers.get("X-RateLimit-Remaining") === "0")) {
        var retryAfter = resp.headers.get("Retry-After");
        var wait = retryAfter ? parseInt(retryAfter, 10) : 60;
        if (wait <= 30 && attempt < maxAttempts) {
          await sleep(wait * 1000 + 500);
          continue;
        }
        return { error: "rate" };
      }

      if (resp.status === 403) return { error: "forbid" };
      if (!resp.ok) return { error: "http" + resp.status };

      break; // success
    }

    var data = await resp.json();
    var langs = null;
    try {
      var lr = await fetch(base + "/languages", { headers: headers, signal: signal });
      recordQuota(lr.headers);
      if (lr.ok) langs = await lr.json();
    } catch (e) { /* ignore */ }

    var result = { repo: data, langs: langs, fromCache: false };
    cacheSet(cacheKey, result);
    return result;
  }

  async function pool(items, worker, concurrency, abortState) {
    var out = new Array(items.length);
    var idx = 0;
    var runners = Array.from({ length: Math.min(concurrency, items.length) }, async function () {
      while (idx < items.length) {
        if (abortState && abortState.aborted) break;
        var i = idx++;
        out[i] = await worker(items[i], i);
        // If this result is a rate-limit error, signal abort to all runners
        if (abortState && out[i] && out[i].res && out[i].res.error === "rate") {
          abortState.aborted = true;
        }
      }
    });
    await Promise.all(runners);
    return out;
  }

  async function analyze() {
    var text = input.value;
    var repos = extractRepos(text);
    resultsHead.style.display = "none";
    results.innerHTML = "";
    favFilterOn = false;
    document.body.classList.remove("centered");
    quotaRemain = null;
    quotaTotal = null;
    quotaUsedApprox = 0;
    updateQuotaDisplay();

    if (!repos.length) {
      statusEl.innerHTML = '<span style="color:var(--yellow)">未在文本中检测到 GitHub 仓库链接</span>';
      return;
    }

    var maxSel = $("maxSel");
    var MAX = maxSel ? parseInt(maxSel.value, 10) : 20;
    var token = ($("tokenInput") && $("tokenInput").value.trim()) || null;
    var truncated = repos.length > MAX;
    var list = repos.slice(0, MAX);

    var tokenNote = token ? " (已认证)" : "";
    statusEl.innerHTML = "<span>嗅探到 <b style=\"color:var(--text)\">" + repos.length + "</b> 个仓库"
      + (truncated ? "（仅分析前 " + MAX + " 个）" : "")
      + tokenNote + "，正在获取...</span>";

    results.innerHTML = list.map(function () {
      return '<div class="repo"><div class="skeleton" style="height:14px;width:55%;margin-bottom:8px"></div><div class="skeleton" style="height:12px;width:80%"></div><div class="skeleton" style="height:12px;width:40%;margin-top:8px"></div></div>';
    }).join("");

    // ---- Phase 1: Fetch main repo data (no languages) ----
    var controller = new AbortController();
    var abortState = { aborted: false };

    // Adaptive concurrency: start at 4, drop to 1 when quota is low
    var concurrency = 4;

    var done = 0;
    var skipped = 0;
    var phase1Fetched = await pool(list, async function (item) {
      if (abortState.aborted) {
        skipped++;
        return { item: item, res: { error: "skipped" } };
      }

      // Adaptive concurrency: check remaining quota and throttle
      if (quotaRemain != null && quotaRemain <= 10 && concurrency > 1) {
        concurrency = 1;
      }
      if (quotaRemain === 0) {
        abortState.aborted = true;
        skipped++;
        return { item: item, res: { error: "rate" } };
      }

      var res = await fetchRepo(item.owner, item.repo, controller.signal, token);
      quotaUsedApprox++;
      done++;
      updateQuotaDisplay();

      var cacheMarker = res.fromCache ? " 缓存" : "";
      statusEl.innerHTML = "<span>获取中 " + done + "/" + list.length + cacheMarker + "...</span>";
      return { item: item, res: res };
    }, concurrency, abortState);

    // After rate limit hit, abort pending requests
    if (abortState.aborted) {
      try { controller.abort(); } catch (e) { /* ignore */ }
    }

    // Mark remaining unfilled slots as skipped
    for (var i = 0; i < phase1Fetched.length; i++) {
      if (!phase1Fetched[i]) phase1Fetched[i] = { item: list[i], res: { error: "skipped" } };
    }

    lastResults = phase1Fetched;

    var rateHit = phase1Fetched.some(function (f) { return f.res.error === "rate"; });
    var tokenUrl = "https://github.com/settings/tokens/new?description=Repo%20Radar";
    var statusText = "分析完成 / " + list.length + " 个仓库";
    if (rateHit) statusText += ' · <a href="' + tokenUrl + '" target="_blank" style="color:var(--blue)">获取 Token</a> 提升额度';
    if (skipped > 0) statusText += "，跳过 " + skipped + " 个";
    statusEl.innerHTML = "<span>" + statusText + "</span>";

    resultsHead.style.display = "flex";
    renderResults();

    // ---- Phase 2: Lazy-load languages for repos that got main data ----
    loadLanguagesLazy(phase1Fetched, controller.signal, token);

    // Save to search history if we got any actual data
    var hasData = phase1Fetched.some(function (f) { return f.res && f.res.repo; });
    if (hasData) saveHistory(text, list.length);
  }

  // Lazily load language data for repos that have main data but no language data yet
  async function loadLanguagesLazy(fetched, signal, token) {
    var needLang = fetched.filter(function (f) {
      return f.res && f.res.repo && !f.res.langs && !f.res.error;
    });
    if (!needLang.length) return;

    var done = 0;
    for (var i = 0; i < needLang.length; i++) {
      if (signal && signal.aborted) break;
      var f = needLang[i];
      var cacheKey = (f.item.owner + "/" + f.item.repo).toLowerCase();
      var cached = cacheGet(cacheKey);
      if (cached && cached.langs) {
        f.res.langs = cached.langs;
        continue;
      }
      try {
        var base = "https://api.github.com/repos/" + encodeURIComponent(f.item.owner) + "/" + encodeURIComponent(f.item.repo);
        var headers = { "Accept": "application/vnd.github+json" };
        if (token) headers["Authorization"] = "Bearer " + token;
        var lr = await fetch(base + "/languages", { headers: headers, signal: signal });
        recordQuota(lr.headers);
        if (lr.ok) {
          f.res.langs = await lr.json();
          // Update cache
          cacheSet(cacheKey, { repo: f.res.repo, langs: f.res.langs, fromCache: false });
        }
      } catch (e) { /* ignore */ }
      done++;
    }
    if (done > 0) {
      statusEl.innerHTML = "<span>分析完成 / " + fetched.length + " 个仓库 (语言数据已补全 " + done + " 个)</span>";
      renderResults();
    }
  }

  function renderResults() {
    var sorted = lastResults.slice();
    var v = sortSel.value;
    sorted.sort(function (a, b) {
      if (a.res.error && !b.res.error) return 1;
      if (b.res.error && !a.res.error) return -1;
      if (v === "name") return a.item.full.localeCompare(b.item.full);
      if (v === "updated") {
        var ta = a.res.repo ? new Date(a.res.repo.pushed_at || a.res.repo.updated_at).getTime() : 0;
        var tb = b.res.repo ? new Date(b.res.repo.pushed_at || b.res.repo.updated_at).getTime() : 0;
        return tb - ta;
      }
      var sa = a.res.repo ? (a.res.repo.stargazers_count || 0) : -1;
      var sb = b.res.repo ? (b.res.repo.stargazers_count || 0) : -1;
      return sb - sa;
    });

    // Apply favorites filter
    if (favFilterOn) {
      sorted = sorted.filter(function (o) { return isFavorite(o.item.owner, o.item.repo); });
    }

    // Update favorites filter button state
    var favBtn = $("favFilter");
    if (favBtn) {
      if (favFilterOn) { favBtn.classList.add("active"); favBtn.textContent = "★ 全部"; }
      else { favBtn.classList.remove("active"); var fc = Object.keys(loadFavorites()).length; favBtn.textContent = fc > 0 ? "★ 收藏 (" + fc + ")" : "★ 收藏"; }
    }

    var html = sorted.map(function (o) { return renderRepo(o.item, o.res); }).join("");
    if (favFilterOn && !sorted.length) html = '<div class="empty">没有已收藏的仓库</div>';
    if (!html) html = '<div class="empty">无结果</div>';
    results.innerHTML = html;
  }

  function langList(langs) {
    if (!langs) return "";
    var entries = Object.entries(langs).filter(function (e) { return e[1] > 0; });
    var total = entries.reduce(function (s, e) { return s + e[1]; }, 0);
    if (!total) return "";
    entries.sort(function (a, b) { return b[1] - a[1]; });
    var top = entries.slice(0, 4);
    var pills = top.map(function (e) {
      var pct = (e[1] / total * 100).toFixed(1);
      return '<span class="lang-pill"><span class="lang-dot" style="background:' + langColor(e[0]) + '"></span>' + escapeHtml(e[0]) + " " + pct + "%</span>";
    }).join("");
    var bar = entries.map(function (e) {
      return '<span style="width:' + (e[1] / total * 100).toFixed(2) + '%;background:' + langColor(e[0]) + '" title="' + escapeHtml(e[0]) + '"></span>';
    }).join("");
    return '<div class="langs">' + pills + '</div><div class="lang-bar">' + bar + "</div>";
  }

  function getBadgeStyle() {
    var sel = $("badgeStyleSel");
    return sel ? sel.value : "social";
  }

  function badgeUrl(path, style) {
    var base = "https://img.shields.io/" + path;
    if (style && style !== "social") base += "?style=" + encodeURIComponent(style);
    return base;
  }

  function buildBadges(owner, repo) {
    var style = getBadgeStyle();
    var enc = encodeURIComponent(owner) + "/" + encodeURIComponent(repo);
    var defs = [
      { path: "github/stars/" + enc, alt: "stars" },
      { path: "github/forks/" + enc, alt: "forks" },
      { path: "github/issues/" + enc, alt: "issues" },
      { path: "github/license/" + enc, alt: "license" },
      { path: "github/languages/top/" + enc, alt: "language" },
      { path: "github/last-commit/" + enc, alt: "last commit" },
      { path: "github/repo-size/" + enc, alt: "repo size" },
      { path: "github/contributors/" + enc, alt: "contributors" }
    ];
    var html = defs.map(function (b) {
      var src = badgeUrl(b.path, style);
      return '<a href="https://github.com/' + enc + '" target="_blank" rel="noopener"><img src="' + src + '" alt="' + b.alt + '" title="' + b.alt + '"></a>';
    }).join("");
    return html;
  }

  function buildEmbedMarkdown(owner, repo) {
    var style = getBadgeStyle();
    var enc = encodeURIComponent(owner) + "/" + encodeURIComponent(repo);
    var href = "https://github.com/" + enc;
    var defs = [
      { path: "github/stars/" + enc, label: "stars" },
      { path: "github/forks/" + enc, label: "forks" },
      { path: "github/issues/" + enc, label: "issues" },
      { path: "github/license/" + enc, label: "license" },
      { path: "github/languages/top/" + enc, label: "language" },
      { path: "github/last-commit/" + enc, label: "last commit" }
    ];
    return defs.map(function (b) {
      var url = badgeUrl(b.path, style);
      return "[![" + b.label + "](" + url + ")](" + href + ")";
    }).join(" ");
  }

  function renderLiteRepo(item) {
    var href = "https://github.com/" + item.owner + "/" + item.repo;
    var badgesHtml = buildBadges(item.owner, item.repo);
    var tokenUrl = "https://github.com/settings/tokens/new?description=Repo%20Radar";
    var hasToken = ($("tokenInput") && $("tokenInput").value.trim());
    var favClass = isFavorite(item.owner, item.repo) ? "fav-btn active" : "fav-btn";
    var favStar = isFavorite(item.owner, item.repo) ? "★" : "☆";
    var descHtml = hasToken
      ? '<span style="color:var(--muted)">正在获取数据...</span>'
      : '🔑 <a href="' + tokenUrl + '" target="_blank" rel="noopener" style="color:var(--blue)">添加 Token</a> 可解锁项目描述、质量评分与语言详情';
    return '<div class="repo">' +
      '<div class="repo-top"><div>' +
        '<div class="repo-name"><a href="' + href + '" target="_blank" rel="noopener">' + escapeHtml(item.full) + '</a>' +
        '<button class="' + favClass + '" data-action="fav" data-owner="' + escapeHtml(item.owner) + '" data-repo="' + escapeHtml(item.repo) + '" title="收藏 / 取消收藏" style="margin-left:6px">' + favStar + '</button></div>' +
        '<p class="repo-desc">' + descHtml + '</p>' +
      '</div></div>' +
      '<div class="repo-badges" style="margin-top:8px;padding-top:0;border-top:none">' +
        badgesHtml +
        '<button class="embed-btn" data-owner="' + escapeHtml(item.owner) + '" data-repo="' + escapeHtml(item.repo) + '" title="复制 Markdown 嵌入代码">复制 Embed</button>' +
      '</div>' +
    '</div>';
  }

  function renderRepo(item, res) {
    var href = "https://github.com/" + item.owner + "/" + item.repo;
    if (res.error) {
      if (res.error === "rate" || res.error === "skipped") {
        return renderLiteRepo(item);
      }
      var msg;
      if (res.error === "aborted") msg = "已取消（配额不足）";
      else if (res.notFound) msg = "仓库不存在或已删除";
      else if (res.error === "forbid") msg = "访问被拒绝";
      else msg = "获取失败 (" + escapeHtml(res.error) + ")";
      return '<div class="repo error-card"><div class="repo-top"><div class="repo-name"><a href="' + href + '" target="_blank" rel="noopener">' + escapeHtml(item.full) + '</a></div></div><p class="repo-desc">' + msg + "</p></div>";
    }
    var r = res.repo;
    var a = assess(r);
    var topics = "";
    if (r.topics && r.topics.length) {
      topics = '<div class="repo-meta"><span class="meta-item">' + r.topics.slice(0, 5).map(function (t) { return escapeHtml("#" + t); }).join(" ") + "</span></div>";
    }
    var badgesHtml = buildBadges(item.owner, item.repo);
    var cacheTag = res.fromCache ? '<span class="cache-tag">缓存</span>' : "";
    var langSection = langList(res.langs);
    var favClass = isFavorite(item.owner, item.repo) ? "fav-btn active" : "fav-btn";
    var favStar = isFavorite(item.owner, item.repo) ? "★" : "☆";
    return '<div class="repo" data-owner="' + escapeHtml(item.owner) + '" data-repo="' + escapeHtml(item.repo) + '">' +
      '<div class="repo-top"><div>' +
        '<div class="repo-name"><a href="' + (r.html_url || href) + '" target="_blank" rel="noopener">' + escapeHtml(r.full_name) + '</a>' + cacheTag + '</div>' +
        (r.description ? '<p class="repo-desc">' + escapeHtml(r.description) + '</p>' : '') +
      '</div><div style="display:flex;align-items:center;gap:4px;flex-shrink:0">' +
        '<button class="' + favClass + '" data-action="fav" data-owner="' + escapeHtml(item.owner) + '" data-repo="' + escapeHtml(item.repo) + '" title="收藏 / 取消收藏">' + favStar + '</button>' +
        '<span class="badge ' + a.cls + '" title="' + escapeHtml(a.tip) + '">' + a.txt + '</span>' +
      '</div></div>' +
      '<div class="repo-meta">' +
        '<span class="meta-item"><span class="star-ic">&#9733;</span> ' + fmtNum(r.stargazers_count) + ' / ' + fmtNum(r.forks_count) + ' / ' + fmtNum(r.subscribers_count || r.watchers_count) + '</span>' +
        '<span class="meta-item">' + (r.language ? escapeHtml(r.language) : "—") + '</span>' +
        '<span class="meta-item">' + relTime(r.pushed_at) + '</span>' +
        '<span class="meta-item">' + (r.license ? escapeHtml(r.license.spdx_id || r.license.name) : "无 License") + '</span>' +
        '<span class="meta-item">' + fmtNum(r.open_issues_count) + ' open issue</span>' +
      '</div>' +
      topics +
      langSection +
      '<div class="repo-badges">' +
        badgesHtml +
        '<button class="embed-btn" data-owner="' + escapeHtml(item.owner) + '" data-repo="' + escapeHtml(item.repo) + '" title="复制 Markdown 嵌入代码">复制 Embed</button>' +
      '</div>' +
    '</div>';
  }

  analyzeBtn.addEventListener("click", analyze);

  $("clearBtn").addEventListener("click", function () {
    input.value = "";
    results.innerHTML = "";
    statusEl.innerHTML = "";
    resultsHead.style.display = "none";
    lastResults = [];
    quotaRemain = null;
    quotaTotal = null;
    quotaUsedApprox = 0;
    updateQuotaDisplay();
    document.body.classList.add("centered");
    input.focus();
  });

  $("pasteBtn").addEventListener("click", function () {
    navigator.clipboard.readText().then(function (text) {
      input.value = text;
      input.focus();
    }).catch(function () {
      statusEl.innerHTML = '<span style="color:var(--yellow)">无法读取剪贴板，请手动 Ctrl+V 粘贴</span>';
    });
  });

  sortSel.addEventListener("change", renderResults);
  $("badgeStyleSel").addEventListener("change", renderResults);

  // Token input: persist to localStorage for convenience
  var tokenInputEl = $("tokenInput");
  if (tokenInputEl) {
    // Restore saved token
    try {
      var saved = localStorage.getItem("rr_token");
      if (saved) tokenInputEl.value = saved;
    } catch (e) { /* ignore */ }
    tokenInputEl.addEventListener("change", function () {
      try {
        var v = tokenInputEl.value.trim();
        if (v) localStorage.setItem("rr_token", v);
        else localStorage.removeItem("rr_token");
      } catch (e) { /* ignore */ }
    });
  }

  // MAX select: warn for high values when unauthenticated
  var maxSelEl = $("maxSel");
  if (maxSelEl) {
    maxSelEl.addEventListener("change", function () {
      var v = parseInt(maxSelEl.value, 10);
      var hasToken = tokenInputEl && tokenInputEl.value.trim();
      if (v > 20 && !hasToken) {
        statusEl.innerHTML = '<span style="color:var(--yellow)">⚠ 未认证模式下建议 ≤20 个，避免配额不足。可添加 GitHub Token 提升额度。</span>';
      }
    });
  }

  results.addEventListener("click", function (e) {
    // Handle favorite toggle
    var favBtn = e.target.closest("[data-action='fav']");
    if (favBtn) {
      var owner = favBtn.getAttribute("data-owner");
      var repo = favBtn.getAttribute("data-repo");
      toggleFavorite(owner, repo);
      // Auto-exit favorites filter when the last favorite is removed
      if (!Object.keys(loadFavorites()).length && favFilterOn) {
        favFilterOn = false;
      }
      renderResults();
      renderFavQuick();
      return;
    }
    // Handle embed copy
    var btn = e.target.closest(".embed-btn");
    if (!btn) return;
    var owner = btn.getAttribute("data-owner");
    var repo = btn.getAttribute("data-repo");
    var md = buildEmbedMarkdown(owner, repo);
    navigator.clipboard.writeText(md).then(function () {
      btn.textContent = "已复制!";
      btn.classList.add("copied");
      setTimeout(function () { btn.textContent = "复制 Embed"; btn.classList.remove("copied"); }, 1800);
    }).catch(function () {
      btn.textContent = "复制失败";
      setTimeout(function () { btn.textContent = "复制 Embed"; }, 1500);
    });
  });

  // Favorites quick-access panel: toggle expand/collapse
  var favQuickBtn = $("favQuickBtn");
  if (favQuickBtn) {
    favQuickBtn.addEventListener("click", toggleFavList);
  }

  // Favorites quick-access panel: item click / remove (event delegation)
  var favQuickEl = $("favQuick");
  if (favQuickEl) {
    favQuickEl.addEventListener("click", function (e) {
      var rm = e.target.closest(".fav-item-rm");
      if (rm) {
        toggleFavorite(rm.getAttribute("data-owner"), rm.getAttribute("data-repo"));
        if (!Object.keys(loadFavorites()).length && favFilterOn) {
          favFilterOn = false;
        }
        renderFavQuick();
        renderResults();
        return;
      }
      var item = e.target.closest(".fav-item");
      if (!item) return;
      input.value = "https://github.com/" + item.getAttribute("data-owner") + "/" + item.getAttribute("data-repo");
      analyze();
    });
  }

  // Favorites filter toggle
  var favFilterBtn = $("favFilter");
  if (favFilterBtn) {
    favFilterBtn.addEventListener("click", function () {
      favFilterOn = !favFilterOn;
      renderResults();
    });
  }

  input.addEventListener("paste", function () { setTimeout(analyze, 50); });
  input.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") analyze();
  });

  // Init: render search history + favorites quick-access on page load
  renderHistory();
  renderFavQuick();
})();
</script>
</body>
</html>
