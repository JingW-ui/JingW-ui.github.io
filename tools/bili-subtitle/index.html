<!DOCTYPE html>

<!-- 扫码登录弹窗 -->

<script src="../common.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/md5.min.js"></script>
<script>
'use strict';

/* ================= 配置 ================= */

// 中继服务地址（部署在阿里云函数计算，B 站 WAF 封锁 CF Workers 出口段故迁至国内）
const WORKER_BASE = 'https://bili-subtitle-ovpdktbmmq.cn-hangzhou.fcapp.run';

const LS_LOGIN = 'bili-sub-login-v1';
const LS_WBI = 'bili-sub-wbi-v1';
const LS_HIST = 'bili-sub-history-v1';
const LS_PREFS = 'bili-sub-prefs-v1';
const HIST_MAX = 20;
const WBI_TTL = 6 * 3600 * 1000;

/* ================= 状态 ================= */

const state = {
  login: null,          // { sessdata, dede, uname, face, exp }
  video: null,          // { bvid, title, owner, duration, pages[] }
  cid: 0,
  p: 1,
  subtitles: [],        // player API 返回的字幕列表
  curLan: '',
  body: null,           // 当前字幕 JSON
  view: 'list',         // 'list' 紧凑列表 | 'text' 纯文稿
  showTs: true,         // 时间戳显示开关
  token: 0,
};

/* ================= 基础工具 ================= */

function esc(s) {
  return escapeHtml(String(s == null ? '' : s))
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtShort(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h > 0
    ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
    : m + ':' + String(s).padStart(2, '0');
}

function fmtSrtTime(sec) {
  // 先化总毫秒再拆分：避免「先 floor 秒、毫秒又四舍五入到 1000」的进位溢出
  const total = Math.max(0, Math.round((sec || 0) * 1000));
  const h = Math.floor(total / 3600000), m = Math.floor(total % 3600000 / 60000);
  const s = Math.floor(total % 60000 / 1000), ms = total % 1000;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ',' + String(ms).padStart(3, '0');
}

function fmtAssTime(sec) {
  const total = Math.max(0, Math.round((sec || 0) * 100));
  const h = Math.floor(total / 360000), m = Math.floor(total % 360000 / 6000);
  const s = Math.floor(total % 6000 / 100), cs = total % 100;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
}

/* ================= Worker 请求层 ================= */

function assertWorker() {
  if (!WORKER_BASE) throw new Error('中继服务未配置：请先部署 tools/bili-subtitle/relay-aliyun 并回填 WORKER_BASE');
}

function cookieHeader() {
  if (!state.login || !state.login.sessdata) return '';
  let c = 'SESSDATA=' + state.login.sessdata;
  if (state.login.dede) c += '; DedeUserID=' + state.login.dede;
  return c;
}

async function biliFetch(kind, path, params, opts) {
  assertWorker();
  opts = opts || {};
  const qs = new URLSearchParams(params || {}).toString();
  const url = WORKER_BASE + '/bili/' + kind + '/' + path + (qs ? '?' + qs : '');
  const headers = {};
  if (opts.auth && state.login && state.login.sessdata) headers['x-bili-cookie'] = cookieHeader();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(url, { headers, signal: ctrl.signal });
    if (!res.ok) throw new Error('网络错误 HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* ================= WBI 签名（移植自 Bili23-Downloader） ================= */

const WBI_TAB = [
  46, 47, 18, 2, 53, 8, 23, 32, 15, 50, 10, 31, 58, 3, 45, 35, 27, 43, 5, 49,
  33, 9, 42, 19, 29, 28, 14, 39, 12, 38, 41, 13, 37, 48, 7, 16, 24, 55, 40,
  61, 26, 17, 0, 1, 60, 51, 30, 4, 22, 25, 54, 21, 56, 59, 6, 63, 57, 62, 11,
  36, 20, 34, 44, 52
];

function getMixinKey(orig) {
  let s = '';
  for (const i of WBI_TAB) { if (i < orig.length) s += orig[i]; }
  return s.slice(0, 32);
}

function wbiSign(params, imgKey, subKey) {
  const mixin = getMixinKey(imgKey + subKey);
  const all = Object.assign({}, params, { wts: Math.round(Date.now() / 1000) });
  const keys = Object.keys(all).sort();
  const q = keys
    .map(k => k + '=' + encodeURIComponent(String(all[k]).replace(/[!'()*]/g, '')))
    .join('&');
  return q + '&w_rid=' + md5(q + mixin);
}

async function getWbiKeys() {
  const cached = localStorage.getItem(LS_WBI);
  if (cached) {
    try {
      const c = JSON.parse(cached);
      if (c.img && c.sub && Date.now() - c.ts < WBI_TTL) return c;
    } catch (e) { /* 忽略坏缓存 */ }
  }
  const j = await biliFetch('api', 'x/web-interface/nav', {}, { auth: true });
  const wbi = j.data && j.data.wbi_img;
  if (!wbi || !wbi.img_url || !wbi.sub_url) throw new Error('无法获取签名密钥');
  const keys = {
    img: wbi.img_url.split('/').pop().split('.')[0],
    sub: wbi.sub_url.split('/').pop().split('.')[0],
    ts: Date.now(),
  };
  localStorage.setItem(LS_WBI, JSON.stringify(keys));
  return keys;
}

async function signedFetch(path, params) {
  const keys = await getWbiKeys();
  const qs = wbiSign(params, keys.img, keys.sub);
  const headers = {};
  if (state.login && state.login.sessdata) headers['x-bili-cookie'] = cookieHeader();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(WORKER_BASE + '/bili/api/' + path + '?' + qs, { headers, signal: ctrl.signal });
    if (!res.ok) throw new Error('网络错误 HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* ================= 链接解析 ================= */

function avToBv(aid) {
  const XOR = 23442827791579n, MAX = 1n << 51n;
  const ALPHA = 'FcwAPNKTMug3GV5Lj7EJnHpWsx4tb8haYeviqBz6rkCy12mUSDQX9RdoZf';
  const MAP = [8, 7, 0, 5, 1, 3, 2, 4, 6];
  const bv = Array(9).fill('');
  let tmp = (MAX | BigInt(aid)) ^ XOR;
  for (let i = 0; i < 9; i++) {
    bv[MAP[i]] = ALPHA[Number(tmp % 58n)];
    tmp /= 58n;
  }
  return 'BV1' + bv.join('');
}

async function parseVideoInput(input) {
  let s = String(input || '').trim();
  if (!s) throw new Error('请输入视频链接或 BV 号');

  // b23.tv 短链：经 Worker 跟随重定向取最终地址
  const short = s.match(/https?:\/\/b23\.tv\/[0-9A-Za-z]+/i);
  if (short) {
    const res = await fetch(WORKER_BASE + '/resolve?url=' + encodeURIComponent(short[0]));
    const j = await res.json();
    if (j.code !== 0 || !j.data || !j.data.url) throw new Error('短链解析失败，可能已过期');
    s = j.data.url;
  }

  const bv = s.match(/[Bb][Vv][1-9A-HJ-NP-Za-km-z]{10}/);
  const av = s.match(/[^A-Za-z]av(\d+)|^av(\d+)/i) || s.match(/av(\d+)/i);
  let bvid;
  if (bv) {
    bvid = 'BV' + bv[0].slice(2);
  } else if (av) {
    bvid = avToBv(av[1] || av[2]);
  } else {
    throw new Error('未识别到 BV 号或 av 号');
  }

  const pMatch = s.match(/[?&]p=(\d+)/);
  return { bvid: bvid, p: pMatch ? parseInt(pMatch[1], 10) : 1 };
}

/* ================= 查询流程 ================= */

async function startQuery() {
  const input = document.getElementById('videoInput');
  assertWorker();

  document.body.classList.remove('centered');
  const token = ++state.token;
  const btn = document.getElementById('queryBtn');
  btn.disabled = true;

  try {
    const parsed = await parseVideoInput(input.value);
    if (token !== state.token) return;

    const view = await signedFetch('x/web-interface/wbi/view', { bvid: parsed.bvid });
    if (token !== state.token) return;
    if (view.code !== 0) throw new Error(view.message || '视频信息获取失败');
    const d = view.data;

    if (d.redirect_url) throw new Error('这是番剧 / 影视等特殊内容，暂不支持');
    if (!d.pages || !d.pages.length) throw new Error('未找到可播放的分P');

    state.video = {
      bvid: d.bvid,
      title: d.title,
      owner: d.owner ? d.owner.name : '',
      duration: d.duration || 0,
      pages: d.pages,
    };
    pushHist(d.bvid, d.title);
    renderVideoCard();
    await selectP(parsed.p, token);
  } catch (e) {
    if (token === state.token) showError(e.message);
  } finally {
    btn.disabled = false;
  }
}

async function selectP(page, token) {
  const pages = state.video.pages;
  const pg = pages.find(x => x.page === page) || pages[0];
  state.p = pg.page;
  state.cid = pg.cid;
  state.subtitles = [];
  state.curLan = '';
  state.body = null;

  renderPTabs(pg.page);
  renderLangTabs();
  showLoading('正在获取字幕列表…');

  const player = await signedFetch('x/player/wbi/v2', {
    bvid: state.video.bvid,
    cid: state.cid,
    dm_img_list: '[]',
    dm_img_str: 'V2ViR0wgMS4wIChPcGVuR0wgRVMgMi4wIENocm9taXVtKQ',
    dm_cover_img_str: 'QU5HTEUgKE5WSURJQSwgTlZJRElBIEdlRm9yY2UgUlRYIDQwNjAgTGFwdG9wIEdQVSAoMHgwMDAwMjhFMCkgRGlyZWN0M0QxMSB2c181XzAgcHNfNV8wLCBEM0QxMSlHb29nbGUgSW5jLiAoTlZJRElBKQ',
    dm_img_inter: '{"ds":[],"wh":[5231,6067,75],"of":[475,950,475]}',
  });
  if (token !== state.token) return;
  if (player.code !== 0) throw new Error(player.message || '字幕列表获取失败（code ' + player.code + '）');

  const subs = (player.data.subtitle && player.data.subtitle.subtitles) || [];
  state.subtitles = subs;

  if (!subs.length) {
    if (!state.login) showNotLogin();
    else showEmpty('该视频没有可用的字幕');
    return;
  }

  renderLangTabs();
  await loadSubtitle(subs[0].lan, token);
}

async function loadSubtitle(lan, token) {
  const entry = state.subtitles.find(x => x.lan === lan);
  if (!entry) return;
  state.curLan = lan;
  renderLangTabs();

  let url = entry.subtitle_url || '';
  if (!url) { showEmpty('该语言字幕地址为空'); return; }
  if (url.startsWith('//')) url = 'https:' + url;

  const res = await fetch(WORKER_BASE + '/bili/cdn?url=' + encodeURIComponent(url));
  if (token !== state.token) return;
  const body = await res.json();
  if (token !== state.token) return;
  if (!body || !Array.isArray(body.body)) { showEmpty('字幕内容为空'); return; }

  state.body = body;
  renderCurrent();
}

/* ================= 字幕渲染（列表 / 文稿） ================= */
// 注：曾按时间间隔做碎句合并，实测 CC 字幕行间天然无缝（间隔≈0）会把整段并成一坨，
// 且句子边界缺可靠判定信号，故放弃合并，两视图均按原始行渲染。

function renderCurrent() {
  const body = state.body.body;
  document.getElementById('resultsHead').style.display = '';
  document.getElementById('lineCount').textContent = '（' + body.length + ' 条）';
  if (state.view === 'text') renderTextView(body); else renderListView(body);
}

function renderListView(bodyArr) {
  document.getElementById('results').innerHTML =
    '<div class="st-box">' + bodyArr.map(it =>
      '<div class="st-row">' +
      '<span class="st-time">' + fmtShort(it.from || 0) + '</span>' +
      '<span class="st-text">' + esc(it.content || '') + '</span>' +
      '</div>').join('') + '</div>';
}

function renderTextView(bodyArr) {
  document.getElementById('results').innerHTML =
    '<div class="st-plain">' + bodyArr.map(it =>
      (state.showTs ? '<span class="ts">' + fmtShort(it.from || 0) + '</span>' : '') + esc(it.content || '')
    ).join('<br>') + '</div>';
}

function setView(v) {
  state.view = v;
  document.getElementById('segList').classList.toggle('active', v === 'list');
  document.getElementById('segText').classList.toggle('active', v === 'text');
  savePrefs();
  if (state.body) renderCurrent();
}

function toggleTs() {
  state.showTs = !state.showTs;
  document.getElementById('tsToggle').classList.toggle('on', state.showTs);
  savePrefs();
  if (state.body) renderCurrent();
}

function savePrefs() {
  localStorage.setItem(LS_PREFS, JSON.stringify({ view: state.view, ts: state.showTs }));
}

function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_PREFS) || '{}');
    if (p.view === 'text' || p.view === 'list') state.view = p.view;
    if (typeof p.ts === 'boolean') state.showTs = p.ts;
  } catch (e) { /* 忽略坏数据 */ }
  document.getElementById('segList').classList.toggle('active', state.view === 'list');
  document.getElementById('segText').classList.toggle('active', state.view === 'text');
  document.getElementById('tsToggle').classList.toggle('on', state.showTs);
}

/* ================= 渲染 ================= */

function renderVideoCard() {
  const card = document.getElementById('videoCard');
  card.style.display = '';
  document.getElementById('videoTitle').textContent = state.video.title;
  const parts = [];
  if (state.video.owner) parts.push('UP：' + state.video.owner);
  if (state.video.duration) parts.push('时长 ' + fmtShort(state.video.duration));
  if (state.video.pages.length > 1) parts.push('共 ' + state.video.pages.length + 'P');
  document.getElementById('videoMeta').textContent = parts.join(' · ');
  renderPTabs(state.p);
}

function renderPTabs(active) {
  const box = document.getElementById('pChips');
  const pages = state.video.pages;
  if (pages.length <= 1) { box.innerHTML = ''; return; }
  box.innerHTML = pages.map(pg =>
    '<button class="p-chip' + (pg.page === active ? ' active' : '') + '" title="' + esc(pg.part) + '"' +
    ' onclick="selectP(' + pg.page + ', state.token)">P' + pg.page + '</button>'
  ).join('');
}

function renderLangTabs() {
  const row = document.getElementById('langRow');
  const subs = state.subtitles;
  if (!subs.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
  row.style.display = '';
  row.innerHTML = subs.map(s => {
    const isAI = /^ai-/i.test(s.lan);
    return '<button class="lang-tab' + (s.lan === state.curLan ? ' active' : '') + '"' +
      ' onclick="loadSubtitle(\'' + esc(s.lan) + '\', state.token)">' + esc(s.lan_doc || s.lan) +
      (isAI ? ' <span class="ai-tag">AI</span>' : '') + '</button>';
  }).join('');
}

function showLoading(msg) {
  document.getElementById('resultsHead').style.display = 'none';
  document.getElementById('results').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
}

function showError(msg) {
  document.getElementById('resultsHead').style.display = 'none';
  document.getElementById('results').innerHTML =
    '<div class="empty"><div class="error-line">' + esc(msg) + '</div></div>';
}

function showEmpty(msg) {
  document.getElementById('resultsHead').style.display = 'none';
  document.getElementById('langRow').style.display = 'none';
  document.getElementById('results').innerHTML = '<div class="empty">' + esc(msg) + '</div>';
}

function showNotLogin() {
  document.getElementById('resultsHead').style.display = 'none';
  document.getElementById('results').innerHTML =
    '<div class="empty">该视频的字幕需要登录后才能获取<br><br>' +
    '<button class="btn" onclick="openLogin()">扫码登录</button></div>';
}

/* ================= 导出 ================= */

// Windows 文件名安全化：非法字符、换行归一、首尾空格与尾部点去除
function safeFilename(s) {
  return String(s || '').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().replace(/\.+$/, '').trim();
}

function exportName(ext) {
  const pg = state.video && state.video.pages.find(x => x.page === state.p);
  const base = (pg && pg.part ? pg.part : state.video ? state.video.title : 'subtitle') || 'subtitle';
  return safeFilename(base).slice(0, 60) + '.' + ext;
}

// ASS 台词净化：花括号会被解析器当作覆盖标签（{\b1}），替换为全角括号
function assText(s) {
  return String(s || '').replace(/[{}]/g, c => c === '{' ? '（' : '）').replace(/\r?\n/g, '\\N');
}

function exportSub(fmt) {
  if (!state.body || !Array.isArray(state.body.body)) { showToast('暂无字幕可导出'); return; }
  const body = state.body.body;
  if (!body.length) { showToast('字幕为空，无可导出内容'); return; }
  // 文本格式带 UTF-8 BOM：无 BOM 时部分 Windows 播放器会误判 GBK 导致中文乱码
  const BOM = '\uFEFF';

  if (fmt === 'srt') {
    const lines = body.map((it, i) =>
      (i + 1) + '\n' + fmtSrtTime(it.from || 0) + ' --> ' + fmtSrtTime(it.to || 0) + '\n' + (it.content || ''));
    downloadBlob(BOM + lines.join('\n\n') + '\n', exportName('srt'), 'text/plain;charset=utf-8');
  } else if (fmt === 'txt') {
    downloadBlob(BOM + body.map(it => it.content || '').join('\n') + '\n', exportName('txt'), 'text/plain;charset=utf-8');
  } else if (fmt === 'json') {
    downloadBlob(JSON.stringify(state.body, null, 2), exportName('json'), 'application/json;charset=utf-8');
  } else if (fmt === 'ass') {
    const dialogues = body.map(it =>
      'Dialogue: 0,' + fmtAssTime(it.from || 0) + ',' + fmtAssTime(it.to || 0) + ',Default,,0,0,0,,' + assText(it.content));
    const title = safeFilename(state.video ? state.video.title : '') || 'bilibili subtitle';
    const ass = [
      '[Script Info]', 'Title: ' + title, 'ScriptType: v4.00+',
      'WrapStyle: 2', 'ScaledBorderAndShadow: yes', 'PlayResX: 1920', 'PlayResY: 1080', '',
      '[V4+ Styles]',
      'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
      'Style: Default,Microsoft YaHei,54,&H00FFFFFF,&H000000FF,&H00000000,&H64000000,0,0,0,0,100,100,0,0,1,2,1,2,60,60,40,1', '',
      '[Events]',
      'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text',
      dialogues.join('\n'), '',
    ].join('\n');
    downloadBlob(BOM + ass, exportName('ass'), 'text/plain;charset=utf-8');
  }
  showToast('已导出 ' + fmt.toUpperCase() + '（' + body.length + ' 条）');
}

/* ================= 登录模块（扫码） ================= */

let pollTimer = null;
let pollKey = null;

function onBadgeClick() {
  if (state.login) {
    if (confirm('退出登录「' + (state.login.uname || 'B 站账号') + '」？')) logout();
  } else {
    openLogin();
  }
}

function renderBadge() {
  const b = document.getElementById('loginBadge');
  if (state.login && state.login.sessdata) {
    b.textContent = state.login.uname ? '已登录：' + state.login.uname : '已登录';
    b.classList.add('ok');
  } else {
    b.textContent = '未登录';
    b.classList.remove('ok');
  }
}

async function openLogin() {
  assertWorker();
  stopPoll();
  document.getElementById('loginMask').style.display = '';
  document.getElementById('qrRefresh').style.display = 'none';
  document.getElementById('qrStatus').textContent = '正在获取二维码…';
  document.getElementById('qrBox').innerHTML = '';

  const j = await biliFetch('passport', 'x/passport-login/web/qrcode/generate', {}, { auth: false });
  if (j.code !== 0 || !j.data) throw new Error('二维码获取失败');
  pollKey = j.data.qrcode_key;

  const qr = qrcode(0, 'M');
  qr.addData(j.data.url);
  qr.make();
  document.getElementById('qrBox').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
  document.getElementById('qrStatus').textContent = '请使用 B 站 App 扫码';

  pollTimer = setInterval(pollLogin, 2000);
  pollLogin();
}

async function pollLogin() {
  if (!pollKey) return;
  let j;
  try {
    j = await biliFetch('passport', 'x/passport-login/web/qrcode/poll', { qrcode_key: pollKey }, { auth: false });
  } catch (e) { return; /* 网络抖动，下个周期重试 */ }

  const st = (j.data && typeof j.data.code === 'number') ? j.data.code : j.code;
  const statusEl = document.getElementById('qrStatus');

  if (st === 0) {
    stopPoll();
    let sessdata = '', dede = '';
    // 凭证通过 poll 响应的 Set-Cookie 下发，中继转写为 bili_cookies 字段
    const list = Array.isArray(j.bili_cookies) ? j.bili_cookies : [];
    for (const line of list) {
      let mm = /(?:^|[\s,])SESSDATA=([^;]+)/.exec(line);
      if (mm) sessdata = mm[1];
      mm = /(?:^|[\s,])DedeUserID=([^;]+)/.exec(line);
      if (mm) dede = mm[1];
    }
    // 兜底一：旧版响应的 cookie_info
    if (!sessdata) {
      const cookies = (j.data.cookie_info && j.data.cookie_info.cookies) || [];
      for (const c of cookies) {
        if (c.name === 'SESSDATA') sessdata = c.value;
        if (c.name === 'DedeUserID') dede = c.value;
      }
    }
    // 兜底二：旧版 crossDomain URL 查询串
    if (!sessdata && j.data.url) {
      try {
        const u = new URL(j.data.url);
        sessdata = u.searchParams.get('SESSDATA') || '';
        dede = u.searchParams.get('DedeUserID') || '';
      } catch (e) { /* 忽略 */ }
    }
    if (!sessdata) { statusEl.textContent = '登录失败：未取到凭证'; return; }
    statusEl.textContent = '登录成功，正在验证…';
    const ok = await verifyLogin(sessdata, dede);
    if (ok) {
      closeLogin();
      showToast('登录成功');
    } else {
      statusEl.textContent = '凭证校验失败，请重试';
    }
  } else if (st === 86090) {
    statusEl.textContent = '已扫码，请在手机上确认';
  } else if (st === 86038) {
    stopPoll();
    statusEl.textContent = '二维码已过期';
    document.getElementById('qrRefresh').style.display = '';
  } else {
    statusEl.textContent = '请使用 B 站 App 扫码';
  }
}

function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  pollKey = null;
}

function closeLogin() {
  stopPoll();
  document.getElementById('loginMask').style.display = 'none';
}

function maskClick(e) {
  if (e.target === e.currentTarget) closeLogin();
}

async function verifyLogin(sessdata, dede) {
  const prev = state.login;
  state.login = { sessdata: sessdata, dede: dede, uname: '', face: '', exp: Date.now() + 25 * 86400 * 1000 };
  try {
    const j = await biliFetch('api', 'x/web-interface/nav', {}, { auth: true });
    const d = j.data || {};
    if (d.isLogin && d.uname) {
      state.login.uname = d.uname;
      state.login.face = d.face || '';
      localStorage.setItem(LS_LOGIN, JSON.stringify(state.login));
      renderBadge();
      return true;
    }
    state.login = prev;
    return false;
  } catch (e) {
    state.login = prev;
    return false;
  }
}

function logout() {
  state.login = null;
  localStorage.removeItem(LS_LOGIN);
  renderBadge();
  showToast('已退出登录');
}

async function restoreLogin() {
  const raw = localStorage.getItem(LS_LOGIN);
  if (!raw) return;
  try {
    const saved = JSON.parse(raw);
    if (!saved.sessdata) return;
    state.login = saved;
    // 校验是否仍有效，顺带刷新昵称头像
    const j = await biliFetch('api', 'x/web-interface/nav', {}, { auth: true });
    const d = j.data || {};
    if (d.isLogin && d.uname) {
      state.login.uname = d.uname;
      state.login.face = d.face || '';
      localStorage.setItem(LS_LOGIN, JSON.stringify(state.login));
    } else {
      state.login = null;
      localStorage.removeItem(LS_LOGIN);
    }
  } catch (e) {
    // 网络失败时保留本地状态，不打断使用
  }
  renderBadge();
}

/* ================= 历史记录 ================= */

function pushHist(bvid, title) {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch (e) { /* 忽略 */ }
  arr = arr.filter(x => x.bvid !== bvid);
  arr.unshift({ bvid: bvid, title: title, ts: Date.now() });
  arr = arr.slice(0, HIST_MAX);
  localStorage.setItem(LS_HIST, JSON.stringify(arr));
  renderHist();
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return Math.floor(diff / 86400000) + ' 天前';
}

function renderHist() {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(LS_HIST)) || []; } catch (e) { /* 忽略 */ }
  document.getElementById('histCount').textContent = arr.length ? '（' + arr.length + '）' : '';
  const list = document.getElementById('histList');
  if (!arr.length) { list.innerHTML = '<div class="empty" style="padding:18px 10px">暂无记录</div>'; return; }
  list.innerHTML = '<div class="history-head"><button class="history-clear" onclick="clearHist()">清空</button></div>' +
    arr.map(h =>
      '<div class="history-item" onclick="clickHist(\'' + esc(h.bvid) + '\')">' +
      '<span class="hi-bvid">' + esc(h.bvid) + '</span>' +
      '<span class="hi-right"><span class="hi-sub">' + esc(h.title) + '</span>' +
      '<span class="hi-time">' + timeAgo(h.ts) + '</span></span>' +
      '</div>'
    ).join('');
}

function clickHist(bvid) {
  document.getElementById('videoInput').value = 'https://www.bilibili.com/video/' + bvid;
  startQuery();
}

function clearHist() {
  localStorage.removeItem(LS_HIST);
  renderHist();
}

function toggleHistory() {
  const list = document.getElementById('histList');
  const chev = document.getElementById('histChev');
  const open = list.classList.toggle('open');
  chev.classList.toggle('open', open);
}

/* ================= 入口 ================= */

document.getElementById('videoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startQuery();
});

(async function init() {
  if (!WORKER_BASE) {
    document.getElementById('loginBadge').textContent = '中继未配置';
    return;
  }
  loadPrefs();
  renderBadge();
  renderHist();
  await restoreLogin();
})();
</script>
