<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时毫秒薪计时器</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换深浅色模式">☀</button>

<!-- Toast容器 -->
<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <!-- 页头 -->
  <header class="app-header glass">
    <h1>实时毫秒薪计时器</h1>
    <div class="status-badge resting" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">等待配置</span>
    </div>
  </header>

  <!-- 设置区 -->
  <section>
    <div class="section-title glass" id="settingsToggle">
      <span>配置参数</span>
      <span class="arrow" id="settingsArrow">▼</span>
    </div>
    <div class="settings-section glass" id="settingsPanel">
      <div class="settings-inner">
        <!-- 月薪 -->
        <div class="form-row">
          <label class="form-label" for="salaryInput">月薪（元）</label>
          <input class="form-input" type="number" id="salaryInput" placeholder="例如 10000" min="0" step="100">
        </div>

        <!-- 工作制模板 -->
        <div class="form-row">
          <label class="form-label">工作制模板</label>
          <div class="template-grid" id="templateGrid">
            <button class="tpl-btn" data-mode="955">标准955</button>
            <button class="tpl-btn" data-mode="996">996</button>
            <button class="tpl-btn" data-mode="1055">1055</button>
            <button class="tpl-btn" data-mode="custom">自定义</button>
          </div>
        </div>

        <!-- 自定义参数 -->
        <div class="custom-grid" id="customFields">
          <div class="form-row full">
            <label class="form-label" for="startDateInput">开始工作日（用于补算此前已上班的天数）</label>
            <input class="form-input" type="date" id="startDateInput">
          </div>
          <div class="form-row">
            <label class="form-label" for="workDaysInput">每月工作日（天）</label>
            <input class="form-input" type="number" id="workDaysInput" placeholder="22" min="1" max="31">
          </div>
          <div class="form-row">
            <label class="form-label" for="workHoursInput">每日工时（小时）</label>
            <input class="form-input" type="number" id="workHoursInput" placeholder="8" min="0.5" max="24" step="0.5">
          </div>
          <div class="form-row">
            <label class="form-label" for="startTimeInput">上班时间</label>
            <input class="form-input" type="time" id="startTimeInput" value="09:00">
          </div>
          <div class="form-row">
            <label class="form-label" for="endTimeInput">下班时间</label>
            <input class="form-input" type="time" id="endTimeInput" value="17:00">
          </div>
          <div class="form-row">
            <label class="form-label" for="noonRestInput">午休时长（小时）</label>
            <input class="form-input" type="number" id="noonRestInput" placeholder="1" min="0" max="8" step="0.5" value="0">
          </div>
        </div>

        <!-- 保存 / 重置 -->
        <div class="save-row">
          <button class="btn btn-primary" id="saveBtn">保存配置</button>
          <button class="btn btn-ghost" id="resetAllBtn">重置全部</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 数据展示区 -->
  <section class="data-section glass" id="dataSection">
    <div id="noConfigHint" class="no-config" style="display:none">
      <p>请先配置薪资参数并保存</p>
      <button class="btn btn-primary btn-sm" id="goConfigBtn">前往配置</button>
    </div>
    <div id="dataDisplay">
      <!-- 实时秒收入 -->
      <div class="second-income">
        <div class="label">实时每秒收入</div>
        <div><span class="value" id="secIncome">0.00</span><span class="unit">元/秒</span></div>
      </div>

      <!-- 今日 / 本月累计 -->
      <div class="data-grid">
        <div class="data-card">
          <div class="dc-label">今日累计</div>
          <div class="dc-value" id="todayIncome">0.00 元</div>
          <div class="dc-sub" id="todaySeconds">已工作 0 秒</div>
        </div>
        <div class="data-card">
          <div class="dc-label">本月累计</div>
          <div class="dc-value" id="monthIncome">0.00 元</div>
          <div class="dc-sub" id="monthSeconds">已工作 0 秒</div>
        </div>
      </div>

      <!-- 辅助信息 -->
      <div class="aux-row">
        <div class="aux-item">
          <div class="au-label">时薪</div>
          <div class="au-value" id="hourlyRate">0.00</div>
        </div>
        <div class="aux-item">
          <div class="au-label">日薪</div>
          <div class="au-value" id="dailyRate">0.00</div>
        </div>
        <div class="aux-item">
          <div class="au-label">下班倒计时</div>
          <div class="au-value" id="countdown">--:--:--</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 操作区 -->
  <section class="action-section glass" id="actionSection">
    <button class="btn btn-primary" id="toggleTimerBtn">开始计时</button>
    <button class="btn btn-ghost btn-sm" id="resetTodayBtn">重置今日</button>
    <button class="btn btn-ghost btn-sm" id="resetMonthBtn">重置本月</button>
    <button class="btn btn-ghost btn-sm" id="openFloatBtn">悬浮窗</button>
  </section>
</div>

<!-- 悬浮窗 -->
<div class="float-window glass" id="floatWindow" style="display:none">
  <div class="fw-header" id="fwHeader">
    <span class="fw-title">毫秒薪计时器</span>
    <div class="fw-controls">
      <button class="fw-dot minimize" id="fwMinimize" aria-label="最小化" title="最小化"></button>
      <button class="fw-dot close" id="fwClose" aria-label="关闭" title="关闭"></button>
    </div>
  </div>
  <div class="fw-body" id="fwBody">
    <div class="fw-row main">
      <span class="fw-label">每秒收入</span>
      <span class="fw-val" id="fwSec">0.00</span>
    </div>
    <div class="fw-row">
      <span class="fw-label">今日累计</span>
      <span class="fw-val" id="fwToday">0.00</span>
    </div>
    <div class="fw-row">
      <span class="fw-label">本月累计</span>
      <span class="fw-val" id="fwMonth">0.00</span>
    </div>
    <div class="fw-footer">
      <label>透明度</label>
      <input type="range" id="fwOpacity" min="10" max="100" value="70">
    </div>
  </div>
  <div class="fw-resize" id="fwResize"></div>
</div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
