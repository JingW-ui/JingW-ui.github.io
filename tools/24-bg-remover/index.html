<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片去背景工具（轻量版）</title>
<link rel="stylesheet" href="../common.css">
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6f8fa;color:#1f2328;min-height:100vh;display:block;flex-direction:row}
:root{--green:#2da44e;--green2:#2c974b;--border:#d0d7de;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08)}
header{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:none}

header p{font-size:13px;color:#656d76;margin-left:auto}
.container{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;display:block;flex-direction:row}
.card-header{background:#f6f8fa;border-bottom:1px solid var(--border);padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:normal}
.card-body{padding:16px;flex:0 1 auto;display:block;flex-direction:row;gap:normal}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.dropzone:hover{border-color:var(--green);background:#f0fff4}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;justify-content:normal;font-family:Arial}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-secondary{background:#f6f8fa;color:#1f2328;border:1px solid var(--border)}
.btn-secondary:hover{background:#f0f2f5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.layout{grid-template-columns:1fr}}
.canvas-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
canvas{max-width:100%;max-height:400px;display:block}
.checker{background-image:linear-gradient(45deg,#e8e8e8 25%,transparent 25%),linear-gradient(-45deg,#e8e8e8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e8e8 75%),linear-gradient(-45deg,transparent 75%,#e8e8e8 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
label{display:block;font-size:12px;color:#656d76;margin-bottom:4px;font-weight:500}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:#d1f0d8;border-radius:2px;outline:none;margin-top:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--green);cursor:pointer}
input[type=color]{width:100%;height:36px;padding:2px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.info-banner{background:#fff3cd;border:1px solid #f0d060;border-radius:var(--radius);padding:10px 14px;font-size:12px;color:#856404;margin-bottom:12px}
.section{font-size:12px;font-weight:600;color:#656d76;margin:12px 0 6px;text-transform:uppercase}
.tool-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tool-btn{padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:pointer;transition:all .15s;background:#fff}
.tool-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<header>
  <span style="font-size:24px">✂️</span>
  <h1>图片去背景工具（轻量版）</h1>
  <p>颜色容差去背 · 魔法橡皮擦 · 自定义背景</p>
</header>
<div class="container">
  <div class="info-banner">
    ℹ️ 本工具为轻量级纯前端实现，使用颜色容差算法。对纯色/近似色背景效果较好，复杂背景建议使用 AI 抠图工具。
  </div>

  <div class="card">
    <div class="card-body">
      <div class="layout">
        <div>
          <div style="font-size:12px;font-weight:600;color:#656d76;margin-bottom:8px">📸 原始图片</div>
          <div class="canvas-wrap" id="orig-wrap">
            <div style="color:#ccc;font-size:13px;padding:32px;text-align:center">
              <div style="font-size:40px;margin-bottom:8px">🖼️</div>
              <div>点击下方按钮上传图片</div>
            </div>
          </div>
          <input type="file" id="file-input" accept="image/*" style="display:none" onchange="loadImage(this.files[0])">
          <div class="actions">
            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📁 上传图片</button>
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:#656d76;margin-bottom:8px">🎨 去背景结果</div>
          <div class="canvas-wrap checker" id="result-wrap">
            <canvas id="result-canvas"></canvas>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="downloadResult()">⬇️ 下载 PNG</button>
            <button class="btn btn-secondary" onclick="resetResult()">🔄 重置</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-header">⚙️ 去背景设置</div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;flex-wrap:wrap">
            <div>
              <div class="section">颜色阈值法</div>
              <label>背景颜色（点击取色）</label>
              <input type="color" id="bg-color-pick" value="#ffffff">
              <div style="margin-top:8px">
                <label>容差：<span id="tolerance-val">30</span></label>
                <input type="range" id="tolerance" min="0" max="150" value="30" oninput="document.getElementById('tolerance-val').textContent=this.value">
              </div>
              <button class="btn btn-primary" style="margin-top:10px;width:100%;justify-content:center" onclick="removeByColor()">🎨 按颜色去背</button>
            </div>
            <div>
              <div class="section">魔法橡皮擦</div>
              <label>点击原图中要去除的颜色</label>
              <div style="height:40px;background:#f6f8fa;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#656d76">点击原图上的背景区域</div>
              <div style="margin-top:8px">
                <label>容差：<span id="magic-tolerance-val">20</span></label>
                <input type="range" id="magic-tolerance" min="0" max="150" value="20" oninput="document.getElementById('magic-tolerance-val').textContent=this.value">
              </div>
              <div style="margin-top:6px;font-size:11px;color:#656d76">✅ 魔法擦除模式已激活：直接点击原图</div>
            </div>
            <div>
              <div class="section">替换背景</div>
              <label>新背景颜色</label>
              <input type="color" id="new-bg-color" value="#00ff00">
              <div style="margin-top:8px">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="use-transparent" checked style="accent-color:var(--green)"> 保持透明（PNG）</label>
              </div>
              <button class="btn btn-secondary" style="margin-top:10px;width:100%;justify-content:center" onclick="applyBg()">🎨 应用背景颜色</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script>
let origImage = null;
let origCanvas = null;
let resultData = null;

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      origImage = img;
      // 显示原图
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      origCanvas = canvas;
      
      const wrap = document.getElementById('orig-wrap');
      wrap.innerHTML = '';
      const displayCanvas = document.createElement('canvas');
      const maxW = wrap.clientWidth - 2;
      const scale = Math.min(1, maxW / img.width, 400 / img.height);
      displayCanvas.width = Math.round(img.width * scale);
      displayCanvas.height = Math.round(img.height * scale);
      displayCanvas.style.maxWidth = '100%';
      displayCanvas.getContext('2d').drawImage(img, 0, 0, displayCanvas.width, displayCanvas.height);
      displayCanvas.onclick = e => {
        const rect = displayCanvas.getBoundingClientRect();
        const sx = Math.round((e.clientX - rect.left) / scale);
        const sy = Math.round((e.clientY - rect.top) / scale);
        const ctx = origCanvas.getContext('2d');
        const pixel = ctx.getImageData(sx, sy, 1, 1).data;
        magicErase(pixel[0], pixel[1], pixel[2]);
      };
      displayCanvas.style.cursor = 'crosshair';
      wrap.appendChild(displayCanvas);
      
      // 初始化结果
      resetResult();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function resetResult() {
  if (!origCanvas) return;
  const rc = document.getElementById('result-canvas');
  rc.width = origCanvas.width;
  rc.height = origCanvas.height;
  const ctx = rc.getContext('2d');
  ctx.drawImage(origCanvas, 0, 0);
  resultData = ctx.getImageData(0, 0, rc.width, rc.height);
}

function colorDistance(r1,g1,b1, r2,g2,b2) {
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

function removeByColor() {
  if (!origCanvas) { showToast('请先上传图片'); return; }
  const hexColor = document.getElementById('bg-color-pick').value;
  const r = parseInt(hexColor.slice(1,3),16);
  const g = parseInt(hexColor.slice(3,5),16);
  const b = parseInt(hexColor.slice(5,7),16);
  const tolerance = parseInt(document.getElementById('tolerance').value);
  
  const rc = document.getElementById('result-canvas');
  const ctx = rc.getContext('2d');
  ctx.drawImage(origCanvas, 0, 0);
  const imgData = ctx.getImageData(0, 0, rc.width, rc.height);
  const data = imgData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    if (colorDistance(data[i], data[i+1], data[i+2], r, g, b) <= tolerance) {
      data[i+3] = 0; // 透明
    }
  }
  ctx.putImageData(imgData, 0, 0);
  resultData = imgData;
  showToast('去背景完成！');
}

function magicErase(r, g, b) {
  if (!origCanvas) return;
  const tolerance = parseInt(document.getElementById('magic-tolerance').value);
  const rc = document.getElementById('result-canvas');
  const ctx = rc.getContext('2d');
  const imgData = ctx.getImageData(0, 0, rc.width, rc.height);
  const data = imgData.data;
  
  // Flood fill
  const visited = new Uint8Array(rc.width * rc.height);
  const queue = [];
  
  // 找所有匹配颜色的像素（全局模式）
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+3] > 0 && colorDistance(data[i], data[i+1], data[i+2], r, g, b) <= tolerance) {
      data[i+3] = 0;
    }
  }
  
  ctx.putImageData(imgData, 0, 0);
  resultData = imgData;
  showToast(`已擦除相近颜色区域（容差：${tolerance}）`);
}

function applyBg() {
  const rc = document.getElementById('result-canvas');
  const ctx = rc.getContext('2d');
  if (!resultData) return;
  
  const useTransparent = document.getElementById('use-transparent').checked;
  if (useTransparent) {
    ctx.putImageData(resultData, 0, 0);
    return;
  }
  
  const hexColor = document.getElementById('new-bg-color').value;
  const bgR = parseInt(hexColor.slice(1,3),16);
  const bgG = parseInt(hexColor.slice(3,5),16);
  const bgB = parseInt(hexColor.slice(5,7),16);
  
  const newData = new ImageData(new Uint8ClampedArray(resultData.data), resultData.width, resultData.height);
  for (let i = 0; i < newData.data.length; i += 4) {
    if (newData.data[i+3] === 0) {
      newData.data[i] = bgR;
      newData.data[i+1] = bgG;
      newData.data[i+2] = bgB;
      newData.data[i+3] = 255;
    }
  }
  ctx.putImageData(newData, 0, 0);
}

function downloadResult() {
  const canvas = document.getElementById('result-canvas');
  if (canvas.width === 0) { showToast('请先处理图片'); return; }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'removed_bg.png';
    a.click();
  }, 'image/png');
}

</script>
</body>
</html>
