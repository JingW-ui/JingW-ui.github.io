<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/imgs/logo/github_logo.png" type="image/png">
<title>神经影像工具知识图谱 · 可视化面板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============ 设计系统（参考 react-dashboard-toolkit） ============ */
:root{
  color-scheme:dark;
  --bg:#07100f; --bg-grad-1:#0b1614; --bg-grad-2:#08110f;
  --surface:rgba(255,255,255,0.045); --surface-2:rgba(255,255,255,0.07);
  --surface-hover:rgba(255,255,255,0.10);
  --surface-strong:#0e1c1a;
  --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.18);
  --text:#e6f1ef; --text-soft:#9fb4af; --text-dim:#5f7370;
  --accent:#37d8c5; --accent-dark:#78efe0; --accent-2:#818cf8;
  --shadow:0 18px 46px rgba(0,0,0,0.38);
  --soft-shadow:0 10px 28px rgba(0,0,0,0.26);
  --radius:14px; --radius-sm:10px; --pill:999px;
  --t:cubic-bezier(.22,1,.36,1);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f8f8; --bg-grad-1:#eef4f2; --bg-grad-2:#e6eeec;
  --surface:rgba(255,255,255,0.88); --surface-2:#ffffff; --surface-hover:#ffffff;
  --surface-strong:#ffffff;
  --border:rgba(15,30,50,0.09); --border-strong:rgba(15,30,50,0.18);
  --text:#1f2937; --text-soft:#5b6b78; --text-dim:#8a98a4;
  --accent:#0f9b8e; --accent-dark:#087b72; --accent-2:#6366f1;
  --shadow:0 10px 30px rgba(31,41,55,0.08);
  --soft-shadow:0 5px 18px rgba(31,41,55,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;transition:background-color .25s var(--t),border-color .25s var(--t),color .25s var(--t)}
html{scroll-behavior:smooth}
body{
  font-family:var(--font); color:var(--text); min-height:100vh; line-height:1.5;
  background:
    radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 60%),
    radial-gradient(1000px 520px at 100% 0%, color-mix(in srgb,var(--accent-2) 12%,transparent), transparent 55%),
    linear-gradient(180deg,var(--bg-grad-1),var(--bg-grad-2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap{max-width:1520px;margin:0 auto;padding:0 24px 72px}

/* ============ 顶栏 ============ */
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  border-bottom:1px solid var(--border);
}
.head-inner{max-width:1520px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#06231f;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);
}
.logo svg{width:22px;height:22px}
.brand-txt b{font-size:16px;font-weight:800;letter-spacing:.2px;display:block;line-height:1.15}
.brand-txt span{font-size:11px;color:var(--text-dim);font-weight:700}
.head-spacer{flex:1}
.head-btn{
  width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface-strong);color:var(--accent-dark);
  box-shadow:var(--soft-shadow);cursor:pointer;
}
.head-btn:hover{background:var(--surface-hover);transform:translateY(-1px)}

/* ============ 统计卡片 ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0 18px}
.stat{
  position:relative;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--soft-shadow);padding:16px 18px;
  animation:card-enter .35s var(--t) both;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.stat .v{font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1}
.stat .v small{font-size:13px;color:var(--text-dim);font-weight:700;margin-left:3px}
.stat .k{font-size:11px;font-weight:700;color:var(--text-soft);margin-top:6px;letter-spacing:.4px}

/* ============ 主面板 ============ */
.panel{
  display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;
}
.card{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--soft-shadow);overflow:hidden;animation:card-enter .35s var(--t) both;
}
.card-head{
  min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px 12px;border-bottom:1px solid var(--border);
}
.card-head .t{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--text)}
.card-head .t i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card-head .sub{font-size:11px;color:var(--text-dim);font-weight:700}

/* 图谱容器 */
#graph{width:100%;height:680px;display:block}
.graph-wrap{position:relative}
.graph-loading{
  position:absolute;inset:0;display:grid;place-items:center;color:var(--text-dim);
  font-weight:700;font-size:13px;gap:12px;
}
.graph-loading .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
.graph-ctrl{
  position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;
}
.chip-btn{
  height:32px;padding:0 12px;border:1px solid var(--border);border-radius:var(--pill);
  background:color-mix(in srgb,var(--surface-strong) 80%,transparent);color:var(--text-soft);
  font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  backdrop-filter:blur(8px);
}
.chip-btn:hover{color:var(--accent-dark);border-color:var(--accent)}

/* ============ 侧栏 ============ */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
.search-box{
  display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;
  padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-strong);
}
.search-box svg{width:16px;height:16px;color:var(--text-dim)}
.search-box input{border:0;outline:0;background:transparent;color:var(--text);font-size:13px;font-weight:600;font-family:inherit}
.search-box input::placeholder{color:var(--text-dim)}
.search-box .cnt{font-size:11px;color:var(--text-dim);font-weight:700;padding-right:2px}

/* 类型筛选 */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px 16px}
.type-toggle{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface-strong);cursor:pointer;
  font-size:12px;font-weight:700;color:var(--text-soft);user-select:none;
}
.type-toggle .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 25%,transparent)}
.type-toggle .n{margin-left:auto;color:var(--text-dim);font-size:11px}
.type-toggle.on{color:var(--text);border-color:color-mix(in srgb,var(--tc) 50%,var(--border));background:color-mix(in srgb,var(--tc) 12%,var(--surface-strong))}
.type-toggle.off{opacity:.5}

/* 详情面板 */
.detail-empty{padding:30px 18px;text-align:center;color:var(--text-dim);font-size:12px;font-weight:700;line-height:1.7}
.detail-body{padding:6px 18px 18px;max-height:560px;overflow:auto}
.detail-body::-webkit-scrollbar{width:6px}
.detail-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
.d-label{font-size:11px;font-weight:800;color:var(--text-dim);letter-spacing:.6px;margin:14px 0 8px}
.d-title{display:flex;align-items:center;gap:10px;padding:4px 0 2px}
.d-title .dot{width:14px;height:14px;border-radius:50%;flex:none}
.d-title h3{font-size:17px;font-weight:800;line-height:1.2}
.d-type{font-size:10px;font-weight:800;color:#06231f;background:var(--tc,var(--accent));padding:2px 8px;border-radius:var(--pill);letter-spacing:.4px}
.d-props{font-size:12px;color:var(--text-soft);line-height:1.65;word-break:break-word}
.d-props .row{display:flex;gap:8px;padding:3px 0}
.d-props .row b{color:var(--text-dim);font-weight:700;min-width:64px;flex:none}
.d-props .row span{color:var(--text)}
.triple{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 8px;border-radius:8px;cursor:pointer;font-weight:600}
.triple:hover{background:var(--surface-hover)}
.triple .h{color:var(--text)}
.triple .r{color:var(--accent-dark);font-weight:700;font-size:11px}
.triple .t2{color:var(--text)}
.triple .dir{color:var(--text-dim)}
.triple.muted{opacity:.55}

/* 图例 */
.legend{padding:14px 16px 16px;display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-soft)}
.lg .dot{width:9px;height:9px;border-radius:50%}

footer{margin-top:30px;text-align:center;color:var(--text-dim);font-size:11px;font-weight:700;line-height:1.8}

/* ============ 动效 ============ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes card-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ============ 响应式 ============ */
@media (max-width:1080px){
  .panel{grid-template-columns:1fr}
  .side{position:static}
  #graph{height:560px}
}
@media (max-width:640px){
  .wrap{padding:0 14px 56px}
  .head-inner{padding:12px 14px}
  .brand-txt b{font-size:14px}
  #graph{height:440px}
  .type-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="14" r="2.2"/><circle cx="19" cy="14" r="2.2"/><circle cx="12" cy="19" r="2.2"/>
          <path d="M12 7v10M7 14h10M6.6 12.4 17 6.6M17.4 12.4 7 6.6"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>神经影像工具知识图谱</b>
        <span>NeuroImaging Tool KG · 三元组可视化</span>
      </div>
    </div>
    <div class="head-spacer"></div>
    <button class="head-btn" id="themeBtn" title="切换主题">
      <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <button class="head-btn" id="resetBtn" title="重置视图">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <!-- 统计卡片 -->
  <div class="stats" id="stats"></div>

  <!-- 主面板 -->
  <div class="panel">
    <!-- 图谱 -->
    <div class="card graph-wrap">
      <div class="card-head">
        <div class="t"><i></i>知识图谱网络</div>
        <div class="sub" id="graphSub">力导向布局 · 拖拽节点 / 滚轮缩放 / 点击查看详情</div>
      </div>
      <div id="graph"></div>
      <div class="graph-loading" id="loading"><div class="spin"></div>正在加载知识图谱…</div>
      <div class="graph-ctrl">
        <button class="chip-btn" id="labelBtn">显示全部标签</button>
        <button class="chip-btn" id="focusBtn">聚焦模式</button>
        <button class="chip-btn" id="relayoutBtn">重新布局</button>
      </div>
    </div>

    <!-- 侧栏 -->
    <div class="side">
      <div class="card">
        <div class="card-head"><div class="t"><i></i>搜索</div><div class="sub">实体 / 关系</div></div>
        <div style="padding:14px 16px 16px">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="search" type="text" placeholder="输入实体名，如 海马 / AD / FreeSurfer…">
            <span class="cnt" id="searchCnt"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="t"><i></i>实体类型</div><div class="sub">点击切换显示</div></div>
        <div class="type-grid" id="typeGrid"></div>
      </div>

      <div class="card">
        <div class="card-head"><div class="t"><i></i>节点详情</div><div class="sub" id="detailSub">未选中</div></div>
        <div id="detail"><div class="detail-empty">点击图谱中的节点<br>查看其属性与三元组关系</div></div>
      </div>
    </div>
  </div>

  <footer>
    数据来源：tools/kg/tool_knowledge_graph.py · 三元组提取：extract_kg_triples.py<br>
    节点 <span id="fNodes">0</span> · 关系 <span id="fLinks">0</span> · 共 16 种关系类型
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
