<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="日语五十音互动课件：PPT 式翻页学习 46 清音、25 浊音与 33 拗音，平假名片假名对照、逐字发音、记忆口诀与真实例词，配闪卡记忆与测验，进度本地保存。">
    <title>日语五十音 · 拼读课件</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    </noscript>
    <style>
        /* ===== 玻璃态设计令牌（glassmorphism-design-system） ===== */
        :root {
            --bg-gradient-1: #e7f1f0;
            --bg-gradient-2: #dfe9ec;
            --bg-gradient-3: #e6edf2;
            --card-bg: rgba(255, 255, 255, 0.50);
            --card-bg-strong: rgba(255, 255, 255, 0.68);
            --card-border: rgba(255, 255, 255, 0.55);
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-muted: #8e9aaf;
            --accent-teal: #2dd4bf;
            --accent-blue: #3b82f6;
            --accent-pink: #f472b6;
            --shadow-sm: 0 2px 8px rgba(20,40,50,0.05);
            --shadow-md: 0 6px 24px rgba(20,40,50,0.08);
            --shadow-lg: 0 12px 40px rgba(20,40,50,0.12);
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .bg-decoration { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.45; pointer-events: none; z-index: 0; }
        .bg-decoration-1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(94,234,212,0.30) 0%, transparent 70%); top: -180px; left: -120px; animation: float 22s ease-in-out infinite; }
        .bg-decoration-2 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(125,211,252,0.28) 0%, transparent 70%); bottom: -140px; right: -120px; animation: float 26s ease-in-out infinite reverse; }
        .bg-decoration-3 { width: 380px; height: 380px; background: radial-gradient(circle, rgba(45,212,191,0.18) 0%, transparent 70%); top: 48%; left: 52%; transform: translate(-50%, -50%); animation: pulse 16s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(30px, -30px) rotate(120deg); } 66% { transform: translate(-20px, 20px) rotate(240deg); } }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.45; } }
        @keyframes play-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(45,212,191,0.0); } 50% { box-shadow: 0 0 0 14px rgba(45,212,191,0.18); } }

        /* ===== 顶栏 ===== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            display: flex; align-items: center; gap: 14px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border-bottom: 1px solid var(--card-border);
        }
        .topbar .back-link {
            color: var(--text-secondary); text-decoration: none; font-size: 13px;
            padding: 6px 12px; border-radius: 10px;
            border: 1px solid rgba(44,62,80,0.12); background: transparent;
            transition: var(--transition); white-space: nowrap;
        }
        .topbar .back-link:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); color: var(--text-primary); }
        .topbar .page-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }
        .topbar .page-title .kr-mark { color: var(--accent-teal); margin-right: 4px; font-family: 'Noto Sans JP', sans-serif; }
        .mode-tabs { margin-left: auto; display: flex; gap: 6px; }
        .mode-tabs button {
            font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap;
            padding: 6px 16px; border-radius: 10px; cursor: pointer;
            background: transparent; border: 1px solid rgba(44,62,80,0.12); color: var(--text-secondary);
            transition: var(--transition);
        }
        .mode-tabs button:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); color: var(--text-primary); }
        .mode-tabs button.active { background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.45); color: var(--text-primary); font-weight: 700; }

        /* ===== 课件视图 ===== */
        .deck-view { position: relative; z-index: 1; padding: 76px 16px 96px; max-width: 980px; margin: 0 auto; }
        .slide-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: clamp(22px, 4vw, 44px);
            min-height: min(62vh, 560px);
            display: flex; flex-direction: column;
            animation: slide-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slide-in { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: translateX(0); } }
        .slide-card.back-dir { animation-name: slide-in-back; }
        @keyframes slide-in-back { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: translateX(0); } }

        .slide-head { display: flex; align-items: flex-start; gap: 10px; }
        .slide-tag {
            display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
            font-size: 11.5px; font-weight: 600; color: var(--accent-teal);
            background: rgba(45,212,191,0.12); padding: 3px 12px; border-radius: 12px;
            margin-bottom: 10px;
        }
        .slide-tag .idx { color: var(--text-muted); font-weight: 500; }
        .script-toggle { margin-left: auto; display: flex; gap: 6px; }
        .script-toggle button {
            font-family: 'Noto Sans JP', sans-serif; font-size: 13px; cursor: pointer;
            padding: 4px 13px; border-radius: 10px;
            border: 1px solid rgba(44,62,80,0.12); background: transparent; color: var(--text-secondary);
            transition: var(--transition);
        }
        .script-toggle button:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); }
        .script-toggle button.active { background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.45); color: var(--text-primary); font-weight: 700; }

        /* 封面 */
        .cover { align-items: center; justify-content: center; text-align: center; gap: 14px; }
        .cover .cover-kr {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(56px, 12vw, 108px); font-weight: 700; line-height: 1.15;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .cover .cover-sub { font-size: clamp(15px, 2.4vw, 18px); color: var(--text-secondary); max-width: 600px; line-height: 1.8; }
        .cover-stats { display: flex; gap: 10px; margin: 12px 0 6px; flex-wrap: wrap; justify-content: center; }
        .cover-stat { text-align: center; padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,0.5); min-width: 84px; transition: var(--transition); }
        .cover-stat:hover { transform: scale(1.04); background: rgba(255,255,255,0.72); }
        .cover-stat .v { font-family: 'Courier New', monospace; font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #3b82f6, #2dd4bf); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .cover-stat .l { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
        .cover-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
        .primary-btn {
            font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
            padding: 10px 26px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf); color: #fff;
            box-shadow: var(--shadow-sm); transition: var(--transition);
        }
        .primary-btn:hover { box-shadow: var(--shadow-md); filter: brightness(1.06); }

        /* 使用说明 / 特殊假名 */
        .info-list { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
        .info-item { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.45); border: 1px solid var(--card-border); }
        .info-item .num {
            flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(59,130,246,0.14), rgba(45,212,191,0.14));
            color: var(--accent-teal); font-weight: 800; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .info-item .num.jp { font-family: 'Noto Sans JP', sans-serif; background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(59,130,246,0.14)); }
        .info-item h4 { font-size: 14.5px; margin-bottom: 3px; }
        .info-item h4 .jp-inline { font-family: 'Noto Sans JP', sans-serif; color: var(--accent-teal); }
        .info-item p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
        .info-item p .w-audio { color: var(--accent-blue); cursor: pointer; text-decoration: underline dotted; }

        /* 组概览页 */
        .group-intro h2 { font-size: clamp(22px, 4vw, 30px); font-weight: 700; margin: 4px 0 10px; }
        .group-intro h2 .kr-inline { font-family: 'Noto Sans JP', sans-serif; color: var(--accent-teal); }
        .group-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.9; background: rgba(255,255,255,0.42); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--card-border); }
        .group-desc strong { color: var(--text-primary); }
        .group-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
        .strip-card {
            flex: 1; min-width: 86px; text-align: center; cursor: pointer;
            padding: 14px 8px 12px; border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.45); border: 1px solid var(--card-border);
            transition: var(--transition);
        }
        .strip-card:hover { background: rgba(255,255,255,0.75); box-shadow: var(--shadow-sm); }
        .strip-card .sc-ch { font-family: 'Noto Sans JP', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.3; }
        .strip-card .sc-rr { font-size: 12px; color: var(--accent-teal); font-weight: 600; margin-top: 2px; }
        .strip-card .sc-k { display: block; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text-muted); font-weight: 500; }

        /* 字母页 */
        .letter-slide { justify-content: center; }
        .letter-main { display: flex; gap: clamp(18px, 4vw, 42px); align-items: center; margin: 8px 0 4px; flex-wrap: wrap; }
        .letter-glyph {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(110px, 24vw, 180px); font-weight: 700; line-height: 1;
            color: var(--text-primary); cursor: pointer; user-select: none;
            padding: 6px 24px 16px; border-radius: var(--radius-md); transition: var(--transition);
            position: relative;
        }
        .letter-glyph:hover { background: rgba(255,255,255,0.55); color: var(--accent-teal); }
        .letter-glyph.playing { animation: play-glow 0.9s ease-in-out; color: var(--accent-teal); }
        .letter-glyph .glyph-hint {
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            font-size: 10.5px; color: var(--text-muted); font-weight: 500; letter-spacing: 1px;
            opacity: 0; transition: var(--transition); white-space: nowrap;
        }
        .letter-glyph:hover .glyph-hint { opacity: 1; }
        .letter-side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
        .letter-rr { font-size: clamp(24px, 4.6vw, 34px); font-weight: 800; letter-spacing: 1px; }
        .letter-rr .rr-main { background: linear-gradient(135deg, #3b82f6, #2dd4bf); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .letter-rr .rr-zh { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-left: 10px; -webkit-text-fill-color: var(--text-muted); }
        .memo-card, .tip-card {
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13.5px; line-height: 1.75;
            border: 1px solid var(--card-border); background: rgba(255,255,255,0.42);
        }
        .memo-card b, .tip-card b { color: var(--accent-teal); margin-right: 6px; font-size: 12px; letter-spacing: 2px; }
        .memo-card .jp-inline, .tip-card .jp-inline { font-family: 'Noto Sans JP', sans-serif; }
        .memo-card { color: var(--text-primary); }
        .tip-card { color: var(--text-secondary); }
        .word-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .word-card {
            flex: 1; min-width: 150px; display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.45); border: 1px solid var(--card-border);
            transition: var(--transition); cursor: pointer;
        }
        .word-card:hover { background: rgba(255,255,255,0.75); }
        .word-card .w-k { font-family: 'Noto Sans JP', sans-serif; font-size: 21px; font-weight: 700; white-space: nowrap; }
        .word-card .w-meta { flex: 1; }
        .word-card .w-r { font-size: 12px; color: var(--accent-teal); font-weight: 600; white-space: nowrap; }
        .word-card .w-zh { font-size: 12.5px; color: var(--text-secondary); }
        .word-card .w-play {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid rgba(44,62,80,0.12); background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .word-card .w-play:hover { background: rgba(45,212,191,0.12); border-color: rgba(45,212,191,0.45); }
        .word-card .w-play svg { width: 12px; height: 12px; fill: var(--text-secondary); margin-left: 2px; }
        .word-empty-note { font-size: 12.5px; color: var(--text-muted); margin-top: 16px; }

        /* 拗音行页 */
        .yoon-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
        .yoon-cell {
            flex: 1; min-width: 200px; text-align: center; cursor: pointer;
            padding: 18px 10px 16px; border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.45); border: 1px solid var(--card-border);
            transition: var(--transition);
        }
        .yoon-cell:hover { background: rgba(255,255,255,0.75); box-shadow: var(--shadow-sm); }
        .yoon-cell .y-ch { font-family: 'Noto Sans JP', sans-serif; font-size: clamp(46px, 9vw, 64px); font-weight: 700; line-height: 1.25; }
        .yoon-cell .y-ch .small { font-size: 0.55em; }
        .yoon-cell .y-rr { font-size: 15px; font-weight: 700; color: var(--accent-teal); margin: 2px 0 6px; }
        .yoon-cell .y-word { font-family: 'Noto Sans JP', sans-serif; font-size: 14px; color: var(--text-secondary); }
        .yoon-cell .y-word .w-audio { color: var(--accent-blue); }
        .yoon-cell .y-zh { font-size: 11.5px; color: var(--text-muted); }

        /* 易混对比 */
        .duo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 14px; }
        .duo-cell { padding: 16px 14px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.45); border: 1px solid var(--card-border); text-align: center; cursor: pointer; transition: var(--transition); }
        .duo-cell:hover { background: rgba(255,255,255,0.75); box-shadow: var(--shadow-sm); }
        .duo-cell .d-pair { font-family: 'Noto Sans JP', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: 8px; }
        .duo-cell .d-pair .sep { color: var(--text-muted); font-weight: 300; }
        .duo-cell .d-rule { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; margin-top: 8px; }
        .duo-cell .d-rule b { color: var(--accent-teal); }

        /* 底部导航 */
        .deck-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
            display: flex; align-items: center; gap: 12px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border-top: 1px solid var(--card-border);
        }
        .nav-arrow {
            width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
            border: 1px solid rgba(44,62,80,0.12); background: transparent;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .nav-arrow:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); }
        .nav-arrow:disabled { opacity: 0.35; cursor: default; }
        .nav-arrow:disabled:hover { background: transparent; border-color: rgba(44,62,80,0.12); }
        .nav-arrow svg { width: 15px; height: 15px; fill: none; stroke: var(--text-secondary); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-progress { flex: 1; height: 5px; border-radius: 3px; background: rgba(20,40,50,0.10); overflow: hidden; cursor: pointer; }
        .nav-progress .fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #2dd4bf); border-radius: 3px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-counter { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
        .nav-counter .cur { color: var(--text-primary); }
        .nav-ov-btn {
            font-family: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
            padding: 8px 14px; border-radius: 10px;
            border: 1px solid rgba(44,62,80,0.12); background: transparent; color: var(--text-secondary);
            transition: var(--transition);
        }
        .nav-ov-btn:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); color: var(--text-primary); }

        /* ===== 总览弹层 ===== */
        .overview-modal {
            position: fixed; inset: 0; z-index: 40; display: none;
            background: rgba(230,237,242,0.72);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            overflow-y: auto; padding: 70px 20px 40px;
        }
        .overview-modal.open { display: block; }
        .ov-panel {
            max-width: 880px; margin: 0 auto;
            background: var(--card-bg-strong); border: 1px solid var(--card-border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
            padding: 26px clamp(18px, 4vw, 36px) 30px;
        }
        .ov-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .ov-head h3 { font-size: 18px; }
        .ov-close {
            width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(44,62,80,0.12); background: transparent;
            font-size: 15px; color: var(--text-secondary); transition: var(--transition);
        }
        .ov-close:hover { background: rgba(45,212,191,0.10); border-color: rgba(45,212,191,0.45); }
        .ov-group { margin-bottom: 16px; }
        .ov-group h4 { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 8px; }
        .ov-group h4 .g-en { color: var(--text-muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
        .ov-grid { display: flex; gap: 7px; flex-wrap: wrap; }
        .ov-cell {
            text-align: center; cursor: pointer; padding: 8px 6px 6px; min-width: 58px;
            border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid var(--card-border);
            transition: var(--transition); position: relative;
        }
        .ov-cell:hover { background: rgba(255,255,255,0.85); box-shadow: var(--shadow-sm); }
        .ov-cell .c-ch { font-family: 'Noto Sans JP', sans-serif; font-size: 21px; font-weight: 700; line-height: 1.3; }
        .ov-cell .c-rr { font-size: 10px; color: var(--accent-teal); font-weight: 600; }
        .ov-cell .c-dot { position: absolute; top: 5px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-teal); }
        .ov-cell.unknown .c-dot { background: var(--accent-pink); }
        .ov-block-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 18px 0 10px; padding-left: 10px; border-left: 3px solid var(--accent-teal); }

        /* ===== 闪卡视图 ===== */
        .flash-view, .quiz-view {
            position: relative; z-index: 1; padding: 86px 16px 40px;
            max-width: 760px; margin: 0 auto; display: none;
        }
        .flash-view.visible, .quiz-view.visible { display: block; }
        .view-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .view-head h2 { font-size: 20px; }
        .view-head .hint { font-size: 12.5px; color: var(--text-muted); }

    <script>
    /* ================= 数据：假名 ================= */
    function def(id, hira, kata, rr, zh, group, hmn, kmn, tip, words) {

        for (var i = 9; i < arguments.length; i++) {

    }
    var K = {};

    /* ---- 清音 46 ---- */
    def('a','あ','ア','a','a','a','像「安」的草书','像「阿」的耳刀旁','五个元音之首，口型开得最大；后四行全靠它拼',['asa','ame']);
    def('i','い','イ','i','i','a','两短一长三笔，像「以」的简写','单人旁「イ」','嘴角左右拉开，像汉语「衣」',['inu','isu']);
    def('u','う','ウ','u','u','a','源字「宇」，像侧放的「3」加一竖','宝盖头「宀」','双唇微圆前突，嘴唇别太用力',['umi','uta']);
    def('e','え','エ','e','e（读「欸」）','a','像「元」少一撇','像「工」','嘴半开、舌尖抵下齿，不是拼音 e 的「鹅」',['eki','e']);
    def('o','お','オ','o','o','a','像「才」，收笔多一点','像「才」','双唇拢圆，喉咙放松',['ocha','okashi']);
    def('ka','か','カ','ka','ka','k','像「力」加一点（刀刻一下）','像「力」','k + a；送气清音',['kasa','kaze']);
    def('ki','き','キ','ki','ki','k','像一把钥匙（key）','钥匙齿加一横','き/キ 都联想 key',['ki','kinoko']);
    def('ku','ku','ク','ku','ku','k','像张开嘴的侧面「＜」','像「＜」','口自然张开送气',['kutsu','kumo']);
    def('ke','け','ケ','ke','ke','k','像「计」字的右半','像「介」','','kemuri','ken');
    def('ko','こ','コ','ko','ko','k','两个小弯钩上下排','像「口」缺一边','','kodomo','koe');
    def('sa','さ','サ','sa','sa','s','像「杀」字的上半','像草字头「サ」','','sakana','sakura');
    def('shi','し','シ','shi','shi（读「西」）','s','像一根竖弯的吸管','三点水「氵」','整行读「西」不是 s+i；与 ツ 区分见对比页',['shio','shinbun']);
    def('su','す','ス','su','su','s','像数字「5」加一横','像「个」','日语 u 双唇不圆，别噘嘴读「苏」',['sushi','suika']);
    def('se','せ','セ','se','se','s','像「世」的连笔','像「世」','','sensei','sekai');
    def('so','そ','ソ','so','so','s','像 z 加一撇，缝纫走线','右上到左下两点','与 ン 区分见对比页',['sora','soto']);
    def('ta','た','タ','ta','ta','t','像「太」的草书','像「夕」','','tamago','tako');
    def('chi','ち','チ','chi','chi（读「七」）','t','一横一折一钩，像夹起面条','像「千」','读「七」不是 t+i',['chizu','chikatetsu']);
    def('tsu','つ','ツ','tsu','tsu（读「呲」）','t','像一道海浪的弯钩','三点头朝上排','读「呲」，气流顶在牙齿后（类似汉语 c）',['tsuki','tsukue']);
    def('te','て','テ','te','te','t','像一只摊开的手掌（手）','三笔像小天线','','te','tegami');
    def('to','と','ト','to','to','t','像一枚钉在墙上的钉子','像「卜」','','tori','tokei');

    def('hi','ひ','ヒ','hi','hi','h','像一张笑脸（两个酒窝）','像「匕首」','','hi','hikouki');
    def('fu','ふ','フ','fu','fu','h','像富士山的轮廓（ふじさん）','像「厂」缺竖','双唇轻吹，介于 fu / hu 之间',['fune','fuyu']);
    def('he','へ','ヘ','he','he','h','像一座小山峰','与平假名几乎同形','平片假名同形的少数特例',['heya']);
    def('ho','ほ','ホ','ho','ho','h','像「ま」多两横','像「木」','','hoshi','hon');

    def('wa','わ','ワ','wa','wa','w','源字「和」，右半像 る 的开口版','像鱼尾「ワ」','','watashi','wani');

    def('n','ん','ン','n','n','w','像躺着的「n」加尾巴','左点加竖撇','拨音：独占一拍，跟在词尾拖住不吞掉',['minna','pan']);

    /* ---- 浊音 25 ---- */
    def('ga','が','ガ','ga','ga','g','か + 两点浊点','カ + 两点','两点＝浊化：读「嘎」','gakkou');

    def('gu','ぐ','グ','gu','gu','g','く + 两点','ク + 两点','','gumi');
    def('ge','げ','ゲ','ge','ge','g','け + 两点','ケ + 两点','','genki');
    def('go','ご','ゴ','go','go','g','こ + 两点','コ + 两点','','gohan');
    def('za','ざ','ザ','za','za（读「砸」）','z','さ + 两点','サ + 两点','za 读「砸」不是「匝」','zasshi');

    def('zo','ぞ','ゾ','zo','zo（读「造」）','z','そ + 两点','ソ + 两点','','zou');
    def('da','だ','ダ','da','da','d','た + 两点','タ + 两点','','daigaku');
    def('di','ぢ','ヂ','ji','≈ji','d','ち + 两点','チ + 两点','现代极少用，读音≈じ（如 はなぢ 鼻血）',[]);
    def('du','づ','ヅ','zu','≈zu','d','つ + 两点','ツ + 两点','现代极少用，读音≈ず',[]);

    def('do','ど','ド','do','do','d','と + 两点','ト + 两点','','doa');
    def('ba','ば','バ','ba','ba','b','は + 两点','ハ + 两点','b 系浊音','','basu');
    def('bi','び','ビ','bi','bi','b','ひ + 两点','ヒ + 两点','','byouin');

    def('be','べ','ベ','be','be','b','へ + 两点','ヘ + 两点','','benri','taberu');
    def('bo','ぼ','ボ','bo','bo','b','ほ + 两点','ホ + 两点','','boushi');
    def('pa','ぱ','パ','pa','pa','p','は + 小圈「°」','ハ + 小圈','半浊音＝小圈：读 p（送气清音）','pan');

    def('pu','ぷ','プ','pu','pu','p','ふ + 小圈','フ + 小圈','','purin');
    def('pe','ぺ','ペ','pe','pe','p','へ + 小圈','ヘ + 小圈','','pen');
    def('po','ぽ','ポ','po','po','p','ほ + 小圈','ホ + 小圈','','sanpo');

    /* ---- 拗音 33 ---- */
    def('kya','きゃ','キャ','kya','kya','yoon','き + 小ゃ（右下角）','キ + 小ャ','小字另占半拍，连读成一个音','kyaku');

    function render() {
        holder.innerHTML = '';
        var card = buildSlide(slides[cur]);
        if (lastDir < 0) card.classList.add('back-dir');
        holder.appendChild(card);

        var start = card.querySelector('#cover-start');
        if (start) start.addEventListener('click', function () { goTo(1); });
        var resume = card.querySelector('#cover-resume');
        if (resume) resume.addEventListener('click', function () { goTo(cur); });
        var gf = card.querySelector('#go-flash'); if (gf) gf.addEventListener('click', function () { setMode('flash'); });
        var gq = card.querySelector('#go-quiz'); if (gq) gq.addEventListener('click', function () { setMode('quiz'); });
        var gc = card.querySelector('#go-cover'); if (gc) gc.addEventListener('click', function () { goTo(0); });

        document.getElementById('cur-page').textContent = cur + 1;
        document.getElementById('total-page').textContent = slides.length;
        document.getElementById('nav-fill').style.width = (cur / (slides.length - 1) * 100) + '%';
        document.getElementById('btn-prev').disabled = cur === 0;
        document.getElementById('btn-next').disabled = cur === slides.length - 1;
        try { localStorage.setItem('jp50_last', String(cur)); } catch (e) {}
    }

    function goTo(i, dir) {
        var t = Math.max(0, Math.min(slides.length - 1, i));
        if (t === cur) return;
        lastDir = dir !== undefined ? dir : (t > cur ? 1 : -1);
        cur = t;
        render();
        window.scrollTo({ top: 0 });
    }

    document.getElementById('btn-prev').addEventListener('click', function () { goTo(cur - 1, -1); });
    document.getElementById('btn-next').addEventListener('click', function () { goTo(cur + 1, 1); });
    document.getElementById('nav-progress').addEventListener('click', function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        goTo(Math.round((e.clientX - r.left) / r.width * (slides.length - 1)));
    });

    var mode = 'deck';
    document.addEventListener('keydown', function (e) {
        if (document.querySelector('.overview-modal.open')) {
            if (e.key === 'Escape') closeOverview();
            return;
        }
        if (mode !== 'deck') return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(cur + 1, 1); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(cur - 1, -1); }
        else if (e.key === 'Home') goTo(0, -1);
        else if (e.key === 'End') goTo(slides.length - 1, 1);
    });

    var touchX = null, touchY = null;
    document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', function (e) {
        if (touchX === null || mode !== 'deck') return;
        var dx = e.changedTouches[0].clientX - touchX;
        var dy = e.changedTouches[0].clientY - touchY;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx < 0) goTo(cur + 1, 1); else goTo(cur - 1, -1);
        }
        touchX = touchY = null;
    }, { passive: true });

            }).join('');
        body.querySelectorAll('.ov-cell').forEach(function (c) {

    /* ================= 模式切换 ================= */
    function setMode(m) {
        mode = m;
        document.querySelectorAll('.mode-tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.mode === m); });
        document.getElementById('deck-view').style.display = m === 'deck' ? '' : 'none';
        document.getElementById('deck-nav').style.display = m === 'deck' ? '' : 'none';
        document.getElementById('flash-view').classList.toggle('visible', m === 'flash');
        document.getElementById('quiz-view').classList.toggle('visible', m === 'quiz');
        window.scrollTo({ top: 0 });
    }

    });

    var FLASH_POOL = { all: ALL_IDS, seion: SEION_IDS, dakuon: DAKUON_IDS, yoon: YOON_IDS };
    function flashPool() {
        var pool = flashFilter === 'unknown' ? ALL_IDS.filter(function (id) { return !known[id]; })
            : flashFilter === 'known' ? ALL_IDS.filter(function (id) { return known[id]; })
            : FLASH_POOL[flashFilter];
        return pool;
    }
    function shuffle(a) {
        var r = a.slice();
        for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
        return r;
    }

    function buildChips(containerId, items, active, onPick) {
        var c = document.getElementById(containerId);
        c.innerHTML = '';
        items.forEach(function (it) {
            var b = document.createElement('button');
            b.className = 'chip' + (it[0] === active ? ' active' : '');
            b.textContent = it[1];
            b.addEventListener('click', function () { onPick(it[0]); });
            c.appendChild(b);
        });
    }

    function flashGlyph(id) {
        if (flashScript === 'mix') return Math.random() < 0.5 ? K[id].hira : K[id].kata;
        return flashScript === 'kata' ? K[id].kata : K[id].hira;
    }

    function initFlash() {
        buildChips('flash-script-chips', SCRIPT_FILTERS, flashScript, function (k) { flashScript = k; initFlash(); });
        buildChips('flash-chips', FLASH_FILTERS, flashFilter, function (k) { flashFilter = k; initFlash(); });
        var pool = flashPool();
        var fc = document.getElementById('flip-card');
        if (!pool.length) {
            fc.style.display = 'none';
            renderFlashStats('这个筛选下没有卡片');
            flashDeck = [];
            return;
        }
        fc.style.display = '';
        flashDeck = shuffle(pool);
        flashPos = 0; flipped = false;
        fc.classList.remove('flipped');
        showFlashCard();
        renderFlashStats();
    }
    function showFlashCard() {
        if (!flashDeck.length) return;
        flashPos = flashPos % flashDeck.length;
        var d = K[flashDeck[flashPos]];
        document.getElementById('fc-front').textContent = flashGlyph(d.id);
        document.getElementById('fc-rr').textContent = d.rr;
        document.getElementById('fc-zh').textContent = d.zh + ' · ' + (d.group === 'yoon' ? '拗音' : GROUPS[d.group].name);
        document.getElementById('fc-mn').textContent = '平' + d.hira + '：' + d.hmn + '；片' + d.kata + '：' + d.kmn + '。' + (d.tip || '');
        document.getElementById('fc-audio').onclick = function (e) { e.stopPropagation(); playAudio(d.id, d.hira); };
    }
    function renderFlashStats(extra) {
        var n = ALL_IDS.filter(function (id) { return known[id]; }).length;
        document.getElementById('flash-stats').innerHTML =
            (extra ? extra + '<br>' : '') +
            '已认识 <b style="color:var(--text-primary);">' + n + '</b> / 104 · 当前牌组 ' + flashDeck.length + ' 张 <a id="flash-reset">重置进度</a>';
        var rs = document.getElementById('flash-reset');
        if (rs) rs.addEventListener('click', function () { known = {}; saveKnown(); initFlash(); });
    }
    document.getElementById('flip-card').addEventListener('click', function () {
        if (!flashDeck.length) return;
        flipped = !flipped; this.classList.toggle('flipped', flipped);
        if (flipped) { var d = K[flashDeck[flashPos]]; playAudio(d.id, d.hira); }
    });
    document.getElementById('fc-fuzzy').addEventListener('click', function () {
        if (!flashDeck.length) return;
        known[flashDeck[flashPos]] = false; saveKnown(); nextCard();
    });
    document.getElementById('fc-know').addEventListener('click', function () {
        if (!flashDeck.length) return;
        known[flashDeck[flashPos]] = true; saveKnown(); nextCard();
    });
    function nextCard() {
        if (!flashDeck.length) return;
        var fc = document.getElementById('flip-card');
        flipped = false; fc.classList.remove('flipped');
        flashPos++;
        if (flashPos >= flashDeck.length) { flashDeck = shuffle(flashPool()); flashPos = 0; }
        showFlashCard(); renderFlashStats();
    }

    /* ================= 测验 ================= */
    var QUIZ_FILTERS = [['all', '全部 104'], ['seion', '清音 46'], ['dakuon', '浊音 25'], ['yoon', '拗音 33']];
    var QUIZ_POOL = { all: ALL_IDS, seion: SEION_IDS, dakuon: DAKUON_IDS, yoon: YOON_IDS };
    var quizFilter = 'all', quizQueue = [], quizScore = 0, quizIdx = 0, quizWrong = [], quizLocked = false;
    var bestScore = -1;
    try { bestScore = parseInt(localStorage.getItem('jp50_best'), 10); if (isNaN(bestScore)) bestScore = -1; } catch (e) { bestScore = -1; }

    function startQuiz(filter) {
        quizFilter = filter;
        buildChips('quiz-chips', QUIZ_FILTERS, filter, function (k) { startQuiz(k); });
        var pool = QUIZ_POOL[filter];
        quizQueue = shuffle(pool).slice(0, 10).map(function (id) {
            var types = ['listen', 'read', 'romaji'];
            return { id: id, type: types[Math.floor(Math.random() * 3)] };
        });
        if (pool.length < 10) quizQueue = shuffle(pool).map(function (id) {
            var types = ['listen', 'read', 'romaji'];
            return { id: id, type: types[Math.floor(Math.random() * 3)] };
        });
        quizScore = 0; quizIdx = 0; quizWrong = [];
        showQuizQuestion();
    }

    function showQuizQuestion() {
        var card = document.getElementById('quiz-card');
        quizLocked = false;
        if (quizIdx >= quizQueue.length) { showQuizResult(); return; }
        var q = quizQueue[quizIdx], d = K[q.id];
        var pool = QUIZ_POOL[quizFilter];
        var distractors = shuffle(pool.filter(function (x) { return x !== q.id && K[x].rr !== d.rr; })).slice(0, 3);
        var opts = shuffle([q.id].concat(distractors));

        if (q.type === 'listen') {
            var script = Math.random() < 0.5 ? 'hira' : 'kata';
            card.innerHTML = '<div class="quiz-meta"><span>第 ' + (quizIdx + 1) + ' / ' + quizQueue.length + ' 题</span><span>听音选假名</span></div>'
                + '<div class="quiz-q-text">听发音，选出对应的假名</div>'
                + '<button class="quiz-replay" id="q-replay">重新播放</button>'
                + '<div class="quiz-opts">' + opts.map(function (o) {
                    return '<button class="quiz-opt" data-o="' + o + '">' + (script === 'kata' ? K[o].kata : K[o].hira) + '</button>';
                }).join('') + '</div>'
                + '<div class="quiz-feedback" id="q-fb"></div>';
            playAudio(d.id, d.hira);
            document.getElementById('q-replay').addEventListener('click', function () { playAudio(d.id, d.hira); });
        } else if (q.type === 'romaji') {
            var script2 = Math.random() < 0.5 ? 'hira' : 'kata';
            card.innerHTML = '<div class="quiz-meta"><span>第 ' + (quizIdx + 1) + ' / ' + quizQueue.length + ' 题</span><span>看音选假名</span></div>'
                + '<div class="quiz-q-text">这个读音对应的假名是？</div>'
                + '<div style="font-size:clamp(40px,9vw,64px);font-weight:800;background:linear-gradient(135deg,#3b82f6,#2dd4bf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:\'Courier New\',monospace;">' + d.rr + '</div>'
                + '<div class="quiz-opts">' + opts.map(function (o) {
                    return '<button class="quiz-opt" data-o="' + o + '">' + (script2 === 'kata' ? K[o].kata : K[o].hira) + '</button>';
                }).join('') + '</div>'
                + '<div class="quiz-feedback" id="q-fb"></div>';
        } else {
            var script3 = Math.random() < 0.5;
            card.innerHTML = '<div class="quiz-meta"><span>第 ' + (quizIdx + 1) + ' / ' + quizQueue.length + ' 题</span><span>' + (script3 ? '看平假名选音' : '看片假名选音') + '</span></div>'
                + '<div class="quiz-q-text">这个假名的发音是？</div>'
                + '<div class="quiz-q-ch">' + (script3 ? d.hira : d.kata) + '</div>'
                + '<div class="quiz-opts">' + opts.map(function (o) {
                    return '<button class="quiz-opt" data-o="' + o + '">' + K[o].rr + '<span class="q-rr">' + K[o].zh + '</span></button>';
                }).join('') + '</div>'
                + '<div class="quiz-feedback" id="q-fb"></div>';
        }
        card.querySelectorAll('.quiz-opt').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (quizLocked) return;
                quizLocked = true;
                var pick = btn.dataset.o;
                var right = pick === q.id;
                if (right) quizScore++; else quizWrong.push(q.id);
                card.querySelectorAll('.quiz-opt').forEach(function (b) {
                    b.disabled = true;
                    if (b.dataset.o === q.id) b.classList.add('right');
                });
                if (!right) btn.classList.add('wrong');
                document.getElementById('q-fb').textContent = right ? '正确！' : ('是 ' + d.hira + ' / ' + d.kata + '（' + d.rr + '）');
                playAudio(d.id, d.hira);
                setTimeout(function () { quizIdx++; showQuizQuestion(); }, right ? 700 : 1500);
            });
        });
    }

    function showQuizResult() {
        var card = document.getElementById('quiz-card');
        if (quizScore > bestScore) { bestScore = quizScore; try { localStorage.setItem('jp50_best', String(bestScore)); } catch (e) {} }
        card.innerHTML = '<div class="quiz-score">'
            + '<div style="font-size:14px;color:var(--text-secondary);">本轮成绩</div>'
            + '<div class="big">' + quizScore + ' / ' + quizQueue.length + '</div>'
            + '<div style="font-size:12.5px;color:var(--text-muted);margin:4px 0 8px;">历史最佳：' + bestScore + '</div>'
            + (quizWrong.length
                ? '<div style="font-size:13px;color:var(--text-secondary);">错题卡（点击听发音）：</div><div class="quiz-wrong-list">'
                    + quizWrong.map(function (id) {
                        return '<button class="quiz-wrong-item" data-id="' + id + '">' + K[id].hira + K[id].kata + '<span> ' + K[id].rr + '</span></button>';
                    }).join('') + '</div>'
                : '<div style="font-size:13.5px;color:var(--text-secondary);margin-top:6px;">全对，一个不漏！</div>')
            + '<div class="cover-actions" style="margin-top:18px;">'
            + '<button class="primary-btn" id="quiz-again">再来一轮</button>'
            + '<button class="primary-btn" id="quiz-flash" style="background:rgba(255,255,255,0.6);color:var(--text-primary);">错题去闪卡</button>'
            + '</div></div>';
        document.getElementById('quiz-again').addEventListener('click', function () { startQuiz(quizFilter); });
        document.getElementById('quiz-flash').addEventListener('click', function () { setMode('flash'); });
        card.querySelectorAll('.quiz-wrong-item').forEach(function (b) {
            b.addEventListener('click', function () { playAudio(b.dataset.id, K[b.dataset.id].hira); });
        });
    }

    /* ================= 启动 ================= */
    render();
    initFlash();
    startQuiz('all');
    </script>
</body>
</html>
