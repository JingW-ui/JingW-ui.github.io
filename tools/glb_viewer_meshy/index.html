<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JingW · GLB 动画查看器</title>
  <style>
    /* ========== 全局基础样式 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #0a0a0a; color: #ffffff; line-height: 1.5;
    }

    /* ========== 顶部导航栏 ========== */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background-color: #111111;
      border-bottom: 1px solid #1a1a1a; z-index: 100; position: relative;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 20px; }
    .logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 18px; color: #84cc16; cursor: pointer;
    }
    .logo svg { width: 24px; height: 24px; }
    .nav-link {
      text-decoration: none; color: #ffffff; font-size: 14px; transition: color 0.2s;
    }
    .nav-link:hover { color: #84cc16; }
    .nav-btn {
      padding: 6px 16px; border-radius: 4px; font-size: 14px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-green { background-color: #84cc16; color: #000000; border: none; font-weight: 500; }
    .btn-green:hover { background-color: #9dee32; }
    .btn-dark {
      background-color: #222222; color: #ffffff; border: 1px solid #333333;
    }
    .btn-dark:hover { background-color: #333333; }

    /* 历史记录下拉 */
    .nav-history { position: relative; }
    .nav-history-dropdown {
      display: none; position: absolute; top: calc(100% + 8px); right: 0;
      width: 300px; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 200; overflow: hidden;
    }
    .nav-history-dropdown.open { display: block; }
    .nav-history-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid #222;
      font-size: 12px; color: #888;
    }
    .nav-history-clear {
      background: none; border: none; color: #666; font-size: 11px;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s;
    }
    .nav-history-clear:hover { color: #e74c3c; background: rgba(231,76,60,0.1); }
    .nav-history-list { max-height: 280px; overflow-y: auto; padding: 6px; }
    .nav-history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 6px; font-size: 12px;
      transition: background 0.15s; cursor: pointer;
    }
    .nav-history-item:hover { background: #222; }
    .nav-history-item-info { flex: 1; min-width: 0; }
    .nav-history-item-name {
      color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-history-item-meta { font-size: 10px; color: #555; margin-top: 2px; }
    .nav-history-item-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .nav-history-item-btn {
      width: 22px; height: 22px; border-radius: 4px; border: none;
      cursor: pointer; font-size: 11px; display: flex; align-items: center;
      justify-content: center; transition: all 0.2s;
    }
    .nav-history-item-btn.load { background: rgba(132,204,22,0.15); color: #84cc16; }
    .nav-history-item-btn.load:hover { background: rgba(132,204,22,0.3); }
    .nav-history-item-btn.delete { background: rgba(231,76,60,0.1); color: #e74c3c; }
    .nav-history-item-btn.delete:hover { background: rgba(231,76,60,0.25); }
    .nav-history-empty { padding: 20px; text-align: center; color: #555; font-size: 12px; }
    .nav-history-list::-webkit-scrollbar { width: 4px; }
    .nav-history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* ========== 主容器 ========== */
    .main-container { display: flex; flex: 1; height: calc(100vh - 52px); position: relative; }

    /* ========== Hero / Landing ========== */
    .hero-section {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px; overflow-y: auto;
      background-image: radial-gradient(circle at 50% 50%, rgba(132, 204, 22, 0.05) 0%, transparent 70%);
      transition: opacity 0.4s ease;
    }
    .hero-section.hidden { display: none; }

    .hero-title {
      font-size: 42px; font-weight: bold; text-align: center;
      margin-bottom: 16px; letter-spacing: 1px;
    }
    .hero-subtitle {
      font-size: 15px; color: #aaaaaa; text-align: center;
      max-width: 560px; margin-bottom: 36px;
    }

    /* ========== 上传卡片 ========== */
    .upload-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }

    .upload-card {
      width: 280px; background-color: #1a1a1a;
      border: 1px dashed #333333; border-radius: 12px;
      padding: 32px 24px; text-align: center;
      transition: all 0.3s ease; cursor: pointer; position: relative;
    }
    .upload-card:hover {
      background-color: #222222; border-color: #84cc16;
      transform: translateY(-2px);
    }
    .upload-card.dragover {
      border-color: #84cc16; background-color: rgba(132, 204, 22, 0.08);
      transform: scale(1.02);
    }
    .upload-card.has-file { border-color: #84cc16; border-style: solid; }

    .upload-card input[type="file"] { display: none; }

    .card-icon {
      width: 56px; height: 56px; background-color: #2d2d2d; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; transition: background-color 0.3s;
    }
    .upload-card:hover .card-icon { background-color: #333333; }
    .card-icon svg { width: 28px; height: 28px; fill: #84cc16; }

    .card-label { font-size: 15px; font-weight: 500; color: #ffffff; margin-bottom: 6px; }
    .card-hint { font-size: 13px; color: #84cc16; margin-bottom: 14px; }

    .file-types { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .file-type-tag {
      padding: 3px 10px; background-color: #2d2d2d; border-radius: 4px;
      font-size: 11px; color: #cccccc;
    }

    .card-filename {
      font-size: 12px; color: #84cc16; margin-top: 10px;
      word-break: break-all; max-height: 36px; overflow: hidden;
    }

    .privacy-note {
      font-size: 12px; color: #888888; display: flex; align-items: center;
      justify-content: center; gap: 6px; max-width: 560px;
    }
    .privacy-note svg { width: 14px; height: 14px; fill: #888888; flex-shrink: 0; }

    /* ========== 查看器布局 ========== */
    .viewer-layout {
      flex: 1; display: none; height: 100%; position: relative;
    }
    .viewer-layout.active { display: flex; }

    /* 3D 视口 */
    #viewport { flex: 1; position: relative; background: #b8e6ff; }
    #viewport canvas { display: block; width: 100%; height: 100%; }

    /* ========== 右侧面板 ========== */
    #sidebar {
      width: 300px; min-width: 300px; background: #111111;
      border-left: 1px solid #1a1a1a; display: flex; flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, min-width 0.3s ease, border-left-width 0.3s ease;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border-left-width: 0; }

    .sidebar-header {
      padding: 14px 16px; background: #151515; border-bottom: 1px solid #1a1a1a;
    }
    .sidebar-header h3 { font-size: 14px; font-weight: 600; }

    #sidebar-content { flex: 1; overflow-y: auto; padding: 14px; }

    .section { margin-bottom: 18px; }
    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: #666; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title::before {
      content: ''; width: 3px; height: 12px; background: #84cc16; border-radius: 2px;
    }

    /* 面板内上传区 */
    .mini-upload {
      border: 1px dashed #333; border-radius: 8px; padding: 12px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      margin-bottom: 8px; position: relative;
    }
    .mini-upload:hover { border-color: #84cc16; background: rgba(132,204,22,0.05); }
    .mini-upload.dragover { border-color: #84cc16; background: rgba(132,204,22,0.08); }
    .mini-upload.has-file { border-color: #84cc16; border-style: solid; }
    .mini-upload input[type="file"] { display: none; }
    .mini-upload-label { font-size: 12px; color: #aaa; }
    .mini-upload-label span { color: #84cc16; }
    .mini-upload-name { font-size: 11px; color: #84cc16; margin-top: 4px; word-break: break-all; }

    /* 动画列表 */
    #animList { display: flex; flex-direction: column; gap: 3px; }
    .anim-btn {
      display: flex; align-items: center; padding: 8px 12px;
      background: #1a1a1a; border: 1px solid #222;
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
      color: #ccc; font-size: 12px; text-align: left;
    }
    .anim-btn:hover { background: #222; border-color: #333; color: #fff; }
    .anim-btn.active { background: rgba(132,204,22,0.15); border-color: #84cc16; color: #84cc16; }
    .anim-btn .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #444;
      margin-right: 10px; flex-shrink: 0; transition: background 0.2s;
    }
    .anim-btn.active .dot { background: #84cc16; }

    /* 历史记录 */
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; background: #1a1a1a; border-radius: 6px;
      margin-bottom: 4px; font-size: 12px; border: 1px solid #1f1f1f;
      transition: all 0.2s;
    }
    .history-item:hover { background: #1f1f1f; border-color: #2a2a2a; }
    .history-info { flex: 1; min-width: 0; }
    .history-name {
      font-weight: 500; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; color: #ddd;
    }
    .history-meta { font-size: 10px; opacity: 0.4; margin-top: 2px; }
    .history-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .history-btn {
      padding: 3px 8px; font-size: 10px; border-radius: 4px;
      border: none; cursor: pointer; transition: all 0.2s;
    }
    .history-btn.load { background: #84cc16; color: #000; font-weight: 500; }
    .history-btn.load:hover { background: #9dee32; }
    .history-btn.delete { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .history-btn.delete:hover { background: rgba(231,76,60,0.3); }

    .empty-state { text-align: center; padding: 16px; color: #555; font-size: 12px; }

    /* ========== 底部状态栏 ========== */
    #statusbar {
      position: absolute; bottom: 14px; left: 14px;
      background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px;
      font-size: 11px; backdrop-filter: blur(10px); border: 1px solid #222;
      display: flex; gap: 20px;
    }
    .status-item { display: flex; align-items: center; gap: 5px; }
    .status-label { color: #666; }
    .status-value { color: #84cc16; font-weight: 500; }

    /* 视口工具栏 */
    #viewport-toolbar {
      position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 10;
      pointer-events: auto;
    }
    .vp-btn {
      width: 34px; height: 34px; background: rgba(0,0,0,0.6); border: 1px solid #333;
      border-radius: 6px; color: #aaa; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); transition: all 0.2s;
      pointer-events: auto; position: relative; z-index: 11;
    }
    .vp-btn:hover { background: rgba(0,0,0,0.8); color: #fff; border-color: #84cc16; }
    .vp-btn.active { color: #84cc16; border-color: #84cc16; background: rgba(132,204,22,0.1); }

    /* 操作提示 */
    #controls-hint {
      position: absolute; bottom: 14px; right: 14px;
      background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
      font-size: 10px; color: #888; backdrop-filter: blur(10px);
      border: 1px solid #222;
    }

    /* ========== Toast 通知 ========== */
    #toast-container {
      position: fixed; top: 64px; right: 20px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      padding: 10px 18px; border-radius: 8px; font-size: 13px;
      animation: slideIn 0.3s ease; min-width: 200px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid;
    }
    .toast.success { background: rgba(132,204,22,0.15); color: #84cc16; border-color: rgba(132,204,22,0.3); }
    .toast.error { background: rgba(231,76,60,0.15); color: #e74c3c; border-color: rgba(231,76,60,0.3); }
    .toast.info { background: rgba(52,152,219,0.15); color: #3498db; border-color: rgba(52,152,219,0.3); }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ========== 返回按钮 ========== */
    .back-btn {
      display: none; align-items: center; gap: 6px;
      padding: 6px 14px; background: #1a1a1a; border: 1px solid #333;
      border-radius: 6px; color: #aaa; cursor: pointer; font-size: 13px;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #222; color: #fff; border-color: #84cc16; }
    .back-btn.visible { display: flex; }

    /* ========== 滚动条 ========== */
    #sidebar-content::-webkit-scrollbar { width: 5px; }
    #sidebar-content::-webkit-scrollbar-track { background: transparent; }
    #sidebar-content::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    #sidebar-content::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
  </style>
</head>
<body>

  <!-- ========== 顶部导航栏 ========== -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="https://jingw-ui.github.io/" class="logo" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="#84cc16">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        JingW
      </a>
      <a href="https://jingw-ui.github.io/" class="nav-link">作者主页</a>
      <a href="https://jingw-ui.github.io/tools/" class="nav-link">工具箱</a>
      <a href="https://jingw-ui.github.io/director/" class="nav-link">创意</a>
      <button class="back-btn" id="backBtn" onclick="goBack()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回
      </button>
    </div>
    <div class="nav-right">
      <!-- 历史记录下拉 -->
      <div class="nav-history" id="navHistory">
        <button class="nav-btn btn-dark" onclick="toggleNavHistory()" id="navHistoryBtn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="vertical-align:-2px;margin-right:4px;"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          历史记录
        </button>
        <div class="nav-history-dropdown" id="navHistoryDropdown">
          <div class="nav-history-header">
            <span>最近使用</span>
            <button class="nav-history-clear" onclick="clearAllHistory(event)">清空</button>
          </div>
          <div class="nav-history-list" id="navHistoryList">
            <div class="nav-history-empty">暂无历史记录</div>
          </div>
        </div>
      </div>
      <a href="https://github.com/JingW-ui" target="_blank" style="display:flex;align-items:center;" title="GitHub">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      </a>
    </div>
  </nav>

  <!-- ========== 主容器 ========== -->
  <div class="main-container">

    <!-- Hero / Landing -->
    <section class="hero-section" id="heroSection">
      <h1 class="hero-title">GLB 动画查看器</h1>
      <p class="hero-subtitle">
        上传 Meshy 导出的静态模型和动画文件，在浏览器中实时预览 3D 模型与动画。
        文件在本地处理，安全且免费。
      </p>

      <div class="upload-cards">
        <!-- 静态模型上传 -->
        <div class="upload-card" id="heroStaticZone">
          <input type="file" id="heroStaticInput" accept=".glb,.gltf" />
          <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          </div>
          <div class="card-label">静态模型</div>
          <div class="card-hint">将文件拖放到此处或点击上传</div>
          <div class="file-types">
            <span class="file-type-tag">GLB</span>
            <span class="file-type-tag">GLTF</span>
          </div>
          <div class="card-filename" id="heroStaticName"></div>
        </div>

        <!-- 动画文件上传 -->
        <div class="upload-card" id="heroAnimZone">
          <input type="file" id="heroAnimInput" accept=".glb,.gltf" />
          <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
          </div>
          <div class="card-label">动画文件</div>
          <div class="card-hint">将文件拖放到此处或点击上传</div>
          <div class="file-types">
            <span class="file-type-tag">GLB</span>
            <span class="file-type-tag">GLTF</span>
          </div>
          <div class="card-filename" id="heroAnimName"></div>
        </div>
      </div>

      <p class="privacy-note">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.8 1.1 2.8 2.5V11c.6 0 1.2.6 1.2 1.2v3.5c0 .6-.6 1.2-1.2 1.2H9.2c-.6 0-1.2-.6-1.2-1.2v-3.5c0-.6.6-1.2 1.2-1.2V9.5C9.2 8.1 10.6 7 12 7zm0 1c-.8 0-1.5.7-1.5 1.5V11h3V9.5c0-.8-.7-1.5-1.5-1.5z"/></svg>
        文件在您的浏览器本地处理，不会上传至服务器。支持最大 200MB 文件。
      </p>
    </section>

    <!-- 查看器布局 -->
    <div class="viewer-layout" id="viewerLayout">
      <!-- 3D 视口 -->
      <div id="viewport">
        <div id="viewport-toolbar">
          <button class="vp-btn active" id="sidebarToggleBtn" title="收起面板">☰</button>
          <button class="vp-btn" id="resetCameraBtn" title="重置视角">⟲</button>
          <button class="vp-btn" id="goBackBtn" title="返回首页">✕</button>
        </div>
        <div id="statusbar">
          <div class="status-item">
            <span class="status-label">模型</span>
            <span class="status-value" id="statusModel">未加载</span>
          </div>
          <div class="status-item">
            <span class="status-label">动画</span>
            <span class="status-value" id="statusAnim">-</span>
          </div>
        </div>
        <div id="controls-hint">
          🖱 左键旋转 · 右键平移 · 滚轮缩放
        </div>
      </div>

      <!-- 右侧面板 -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>控制面板</h3>
        </div>
        <div id="sidebar-content">
          <!-- 面板内上传 -->
          <div class="section">
            <div class="section-title">文件管理</div>
            <div class="mini-upload" id="sideStaticZone">
              <input type="file" id="sideStaticInput" accept=".glb,.gltf" />
              <div class="mini-upload-label">🧍 <span>静态模型</span> — 点击上传</div>
              <div class="mini-upload-name" id="sideStaticName"></div>
            </div>
            <div class="mini-upload" id="sideAnimZone">
              <input type="file" id="sideAnimInput" accept=".glb,.gltf" />
              <div class="mini-upload-label">🎬 <span>动画文件</span> — 点击上传</div>
              <div class="mini-upload-name" id="sideAnimName"></div>
            </div>
          </div>

          <!-- 动画列表 -->
          <div class="section">
            <div class="section-title">动画列表</div>
            <div id="animList"><div class="empty-state">请先上传模型文件</div></div>
          </div>

          <!-- 历史记录 -->
          <div class="section">
            <div class="section-title">历史记录</div>
            <div id="historyList"><div class="empty-state">暂无历史记录</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container"></div>

  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    // ==================== IndexedDB ====================
    const DB_NAME = 'meshy_glb_viewer';
    const DB_VERSION = 1;
    const STORE_NAME = 'files';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME))
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
      });
    }

    async function saveFile(id, blob, name) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ id, blob, name, timestamp: Date.now() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadFile(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteFile(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // ==================== localStorage 历史（配对绑定） ====================
    const STORAGE_KEY = 'meshy_glb_history';
    // 当前加载的静态模型名（用于将动画自动绑定到同一对）
    let currentStaticName = null;

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function saveHistory(h) { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

    // 添加/更新历史记录
    // type='static' → 创建新配对条目
    // type='anim'   → 绑定到当前配对的 animName
    function addToHistory(name, type) {
      const h = getHistory();

      if (type === 'static') {
        const id = `pair_${name}`;
        // 去重后置顶
        const idx = h.findIndex(i => i.id === id);
        if (idx >= 0) h.splice(idx, 1);
        h.unshift({ id, staticName: name, animName: null, timestamp: Date.now() });
        currentStaticName = name;
      } else {
        // 动画：绑定到当前静态模型
        if (currentStaticName) {
          const id = `pair_${currentStaticName}`;
          const pair = h.find(i => i.id === id);
          if (pair) {
            pair.animName = name;
            pair.timestamp = Date.now();
            // 置顶
            const idx = h.indexOf(pair);
            h.splice(idx, 1);
            h.unshift(pair);
          } else {
            // 配对条目不存在（理论上不会发生），新建
            h.unshift({ id: `pair_${currentStaticName}`, staticName: currentStaticName, animName: name, timestamp: Date.now() });
          }
        } else {
          // 没有静态模型，存为独立动画条目
          const id = `solo_anim_${name}`;
          const idx = h.findIndex(i => i.id === id);
          if (idx >= 0) h.splice(idx, 1);
          h.unshift({ id, staticName: null, animName: name, timestamp: Date.now() });
        }
      }

      if (h.length > 20) h.pop();
      saveHistory(h);
      renderHistory();
      renderNavHistory();
    }

    function removeFromHistory(id) {
      const h = getHistory();
      const item = h.find(i => i.id === id);
      if (item) {
        // 删除绑定的所有文件
        if (item.staticName) deleteFile(`static_${item.staticName}`);
        if (item.animName) deleteFile(`anim_${item.animName}`);
      }
      saveHistory(h.filter(i => i.id !== id));
      renderHistory();
      renderNavHistory();
      showToast('已删除历史记录', 'success');
    }

    // 从历史记录加载一对文件
    async function loadFromHistory(item) {
      let loaded = 0;
      if (item.staticName) {
        const data = await loadFile(`static_${item.staticName}`);
        if (data) {
          const ab = await data.blob.arrayBuffer();
          // 更新 UI
          ['heroStaticName','sideStaticName'].forEach(id => {
            const el = document.getElementById(id); if (el) el.textContent = item.staticName;
          });
          ['heroStaticZone','sideStaticZone'].forEach(id => {
            const el = document.getElementById(id); if (el) el.classList.add('has-file');
          });
          loadStaticModel(ab, item.staticName);
          currentStaticName = item.staticName;
          loaded++;
        }
      }
      if (item.animName) {
        const data = await loadFile(`anim_${item.animName}`);
        if (data) {
          const ab = await data.blob.arrayBuffer();
          ['heroAnimName','sideAnimName'].forEach(id => {
            const el = document.getElementById(id); if (el) el.textContent = item.animName;
          });
          ['heroAnimZone','sideAnimZone'].forEach(id => {
            const el = document.getElementById(id); if (el) el.classList.add('has-file');
          });
          // 等静态模型加载完成再绑动画（最多等 5 秒）
          await new Promise(r => {
            let attempts = 0;
            const check = () => {
              if (mixer) r();
              else if (++attempts > 100) r(); // 5s 超时
              else setTimeout(check, 50);
            };
            check();
          });
          loadAnimations(ab, item.animName);
          loaded++;
        }
      }
      if (loaded === 0) {
        showToast('文件数据已丢失', 'error');
      } else {
        const desc = [item.staticName, item.animName].filter(Boolean).join(' + ');
        showToast(`已加载: ${desc}`, 'success');
      }
    }

    // ==================== 导航栏历史下拉 ====================
    window.toggleNavHistory = function() {
      const dd = document.getElementById('navHistoryDropdown');
      dd.classList.toggle('open');
      if (dd.classList.contains('open')) renderNavHistory();
    };

    // 点击外部关闭下拉
    document.addEventListener('click', (e) => {
      const nh = document.getElementById('navHistory');
      if (nh && !nh.contains(e.target)) {
        document.getElementById('navHistoryDropdown').classList.remove('open');
      }
    });

    // 渲染单条历史记录的 HTML
    function renderHistoryItemHTML(item) {
      const d = new Date(item.timestamp);
      const ts = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
      const hasPair = item.staticName && item.animName;
      const displayName = hasPair
        ? `🧍 ${item.staticName} <span style="opacity:.5">+</span> 🎬 ${item.animName}`
        : item.staticName
          ? `🧍 ${item.staticName} <span style="opacity:.4">(无动画)</span>`
          : `🎬 ${item.animName} <span style="opacity:.4">(独立动画)</span>`;
      return { ts, displayName };
    }

    function renderNavHistory() {
      const list = document.getElementById('navHistoryList');
      if (!list) return;
      const history = getHistory();
      if (history.length === 0) {
        list.innerHTML = '<div class="nav-history-empty">暂无历史记录</div>';
        return;
      }
      list.innerHTML = '';
      history.forEach(item => {
        const { ts, displayName } = renderHistoryItemHTML(item);
        const el = document.createElement('div');
        el.className = 'nav-history-item';
        el.innerHTML = `
          <div class="nav-history-item-info">
            <div class="nav-history-item-name">${displayName}</div>
            <div class="nav-history-item-meta">${ts}</div>
          </div>
          <div class="nav-history-item-actions">
            <button class="nav-history-item-btn load" data-id="${item.id}" title="加载">▶</button>
            <button class="nav-history-item-btn delete" data-id="${item.id}" title="删除">✕</button>
          </div>
        `;
        list.appendChild(el);
      });

      list.querySelectorAll('.nav-history-item-btn.load').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = e.target.dataset.id;
          const item = getHistory().find(i => i.id === id);
          if (item) {
            await loadFromHistory(item);
            document.getElementById('navHistoryDropdown').classList.remove('open');
          }
        });
      });

      list.querySelectorAll('.nav-history-item-btn.delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeFromHistory(e.target.dataset.id);
        });
      });
    }

    window.clearAllHistory = async function(e) {
      e.stopPropagation();
      const history = getHistory();
      for (const item of history) {
        if (item.staticName) await deleteFile(`static_${item.staticName}`);
        if (item.animName) await deleteFile(`anim_${item.animName}`);
        // 兼容旧格式
        await deleteFile(item.id);
      }
      saveHistory([]);
      renderHistory();
      renderNavHistory();
      showToast('已清空所有历史记录', 'success');
    };

    // ==================== Toast ====================
    function showToast(message, type = 'info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = message;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0'; t.style.transform = 'translateX(100%)';
        t.style.transition = 'all 0.3s ease';
        setTimeout(() => t.remove(), 300);
      }, 3000);
    }

    // ==================== 视图切换 ====================
    let isViewerMode = false;
    const heroSection = document.getElementById('heroSection');
    const viewerLayout = document.getElementById('viewerLayout');
    const backBtn = document.getElementById('backBtn');

    function enterViewer() {
      if (isViewerMode) return;
      isViewerMode = true;
      heroSection.classList.add('hidden');
      viewerLayout.classList.add('active');
      backBtn.classList.add('visible');
      updateSize();
    }

    window.goBack = function() {
      isViewerMode = false;
      heroSection.classList.remove('hidden');
      viewerLayout.classList.remove('active');
      backBtn.classList.remove('visible');
    };

    // ==================== 侧边栏展开/收起 ====================
    const sidebar = document.getElementById('sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');

    function toggleSidebar() {
      const isCollapsed = sidebar.classList.toggle('collapsed');
      // 同步按钮状态：active=面板展开中
      sidebarToggleBtn.classList.toggle('active', !isCollapsed);
      sidebarToggleBtn.title = isCollapsed ? '展开面板' : '收起面板';
    }

    sidebarToggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleSidebar();
    });

    document.getElementById('resetCameraBtn').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      resetCamera();
    });

    document.getElementById('goBackBtn').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      window.goBack();
    });

    function resetCamera() {
      if (staticModel) {
        frameTarget(staticModel, true);
      } else {
        // 复刻参考场景的默认视角
        animateCamera(new THREE.Vector3(3, 2, 5), new THREE.Vector3(0, 1, 0));
      }
    }

    // ==================== Three.js ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8e6ff);
    scene.fog = new THREE.Fog(0xb8e6ff, 20, 80);

    // 地面（复刻参考场景的草地平面）
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x6ab04c, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 灯光（复刻参考场景配置）
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 50;
    scene.add(dirLight);
    scene.add(dirLight.target);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(3, 2, 5);

    const viewport = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(viewport.clientWidth || 800, viewport.clientHeight || 600);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    // ==================== 模型管理 ====================
    const loader = new GLTFLoader();
    let mixer = null, currentAction = null;
    const clock = new THREE.Clock();
    const clips = new Map();
    let staticModel = null;

    function playClip(name) {
      if (!mixer || !clips.has(name)) return;
      if (currentAction) currentAction.fadeOut(0.3);
      const action = mixer.clipAction(clips.get(name));
      action.reset().fadeIn(0.3).play();
      currentAction = action;
      document.getElementById('statusAnim').textContent = name;
      document.querySelectorAll('#animList .anim-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.name === name));
    }

    function buildAnimList() {
      const list = document.getElementById('animList');
      list.innerHTML = '';
      if (clips.size === 0) {
        list.innerHTML = '<div class="empty-state">未找到动画</div>';
        return;
      }
      const names = [...clips.keys()].sort((a, b) => a.localeCompare(b));
      names.forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'anim-btn';
        btn.dataset.name = n;
        btn.innerHTML = `<span class="dot"></span>${n}`;
        btn.onclick = () => playClip(n);
        list.appendChild(btn);
      });
    }

    function autoPlayFirst() {
      const names = [...clips.keys()];
      if (names.length > 0) playClip(names[0]);
    }

    function clearModel() {
      if (staticModel) {
        scene.remove(staticModel);
        staticModel.traverse(ch => {
          if (ch.geometry) ch.geometry.dispose();
          if (ch.material) {
            if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
            else ch.material.dispose();
          }
        });
        staticModel = null;
      }
      if (mixer) { mixer.stopAllAction(); mixer = null; }
      clips.clear();
      currentAction = null;
      buildAnimList();
      document.getElementById('statusModel').textContent = '未加载';
      document.getElementById('statusAnim').textContent = '-';
    }

    // ==================== 相机控制系统 ====================
    // 相机动画状态
    const camAnim = {
      active: false,
      startPos: new THREE.Vector3(),
      endPos: new THREE.Vector3(),
      startTarget: new THREE.Vector3(),
      endTarget: new THREE.Vector3(),
      progress: 0,
      duration: 0.6, // 秒
    };

    // 从世界轴对齐的包围盒计算最佳相机位姿
    function computeCameraPose(bbox) {
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      // 瞄准点：角色类模型瞄准上半身（65% 高度），其他模型瞄准中心
      const target = center.clone();
      if (size.y >= Math.max(size.x, size.z)) {
        // 竖长型（角色/站立物体）→ 瞄准上半身
        target.y = bbox.min.y + size.y * 0.65;
      }

      // 包围球半径
      const boundingRadius = bbox.getBoundingSphere(new THREE.Sphere()).radius;
      const fovRad = camera.fov * Math.PI / 180;

      // 垂直方向刚好容纳包围球需要的距离
      const vertDist = boundingRadius / Math.sin(fovRad / 2);
      // 水平方向刚好容纳包围球需要的距离（考虑画幅宽高比）
      const halfHFov = Math.atan(Math.tan(fovRad / 2) * camera.aspect);
      const horzDist = boundingRadius / Math.sin(halfHFov);
      // 取较大值，确保模型在两个方向都完整可见
      const fitDist = Math.max(vertDist, horzDist);

      // 留 30% 呼吸空间（乘数 > 1 = 相机更远）
      const distance = fitDist * 4;

      // 3/4 俯视视角：水平偏 45°，垂直偏 20°
      const azimuth = Math.PI / 4;
      const elevation = Math.PI / 9;

      const horizontalDist = distance * Math.cos(elevation);
      const offsetY = distance * Math.sin(elevation);

      const position = new THREE.Vector3(
        target.x + horizontalDist * Math.sin(azimuth),
        target.y + offsetY,
        target.z + horizontalDist * Math.cos(azimuth)
      );

      return { position, target, distance, maxDim, size, center };
    }

    // 动态调整相机近远裁剪面，适配不同尺度模型
    function adjustClippingPlanes(distance, maxDim) {
      camera.near = Math.max(0.001, distance * 0.001);
      camera.far = Math.max(distance * 10, maxDim * 20);
      camera.updateProjectionMatrix();
    }

    // 动态调整阴影相机 + 地面跟随模型 + 雾气范围
    function adjustSceneToModel(center, maxDim, bbox) {
      // 阴影相机范围适配模型尺寸
      const extent = Math.max(maxDim * 1.5, 5);
      const sc = dirLight.shadow.camera;
      sc.left = -extent; sc.right = extent;
      sc.top = extent; sc.bottom = -extent;
      sc.near = 0.1; sc.far = Math.max(maxDim * 30, 50);
      sc.updateProjectionMatrix();
      // 光源跟随模型
      dirLight.position.set(center.x + maxDim * 2, center.y + maxDim * 4, center.z + maxDim * 2);
      dirLight.target.position.copy(center);
      dirLight.target.updateMatrixWorld();

      // 地面平面移到模型脚下
      ground.position.y = bbox.min.y;

      // 雾气范围适配模型（避免大模型被雾气吞掉）
      scene.fog.near = Math.max(maxDim * 5, 20);
      scene.fog.far = Math.max(maxDim * 20, 80);
    }

    // 平滑过渡相机到新位姿
    function animateCamera(targetPos, targetLookAt, duration = 0.6) {
      camAnim.startPos.copy(camera.position);
      camAnim.endPos.copy(targetPos);
      camAnim.startTarget.copy(controls.target);
      camAnim.endTarget.copy(targetLookAt);
      camAnim.progress = 0;
      camAnim.duration = duration;
      camAnim.active = true;
    }

    // 缓动函数 (ease-in-out cubic)
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // 每帧更新相机动画
    function updateCameraAnimation(dt) {
      if (!camAnim.active) return;
      camAnim.progress += dt / camAnim.duration;
      if (camAnim.progress >= 1) {
        camAnim.progress = 1;
        camAnim.active = false;
      }
      const t = easeInOutCubic(camAnim.progress);
      camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, t);
      controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, t);
      controls.update();
    }

    // 核心方法：将相机对齐到目标物体
    function frameTarget(object, smooth = true) {
      const bbox = new THREE.Box3().setFromObject(object);
      if (bbox.isEmpty()) return;

      const pose = computeCameraPose(bbox);
      adjustClippingPlanes(pose.distance, pose.maxDim);
      adjustSceneToModel(pose.center, pose.maxDim, bbox);

      if (smooth && !camera.position.equals(pose.position)) {
        animateCamera(pose.position, pose.target);
      } else {
        camera.position.copy(pose.position);
        controls.target.copy(pose.target);
        controls.update();
      }
    }

    function loadStaticModel(arrayBuffer, fileName) {
      clearModel();
      const blob = new Blob([arrayBuffer]);
      const url = URL.createObjectURL(blob);

      loader.load(url, (gltf) => {
        staticModel = gltf.scene;
        staticModel.traverse(ch => {
          if (ch.isMesh) { ch.castShadow = true; ch.receiveShadow = true; }
        });
        scene.add(staticModel);
        mixer = new THREE.AnimationMixer(staticModel);

        if (gltf.animations.length > 0) {
          gltf.animations.forEach(clip => clips.set(clip.name || 'clip', clip));
          buildAnimList();
          autoPlayFirst();
        }

        document.getElementById('statusModel').textContent = fileName;
        showToast(`模型加载成功: ${fileName}`, 'success');
        URL.revokeObjectURL(url);
        frameTarget(staticModel, false); // 首次加载用即时定位，避免动画延迟
        enterViewer();
      }, undefined, (err) => {
        showToast(`模型加载失败: ${err.message}`, 'error');
        URL.revokeObjectURL(url);
      });
    }

    function loadAnimations(arrayBuffer, fileName) {
      if (!mixer) { showToast('请先加载静态模型', 'error'); return; }
      const blob = new Blob([arrayBuffer]);
      const url = URL.createObjectURL(blob);

      loader.load(url, (gltf) => {
        if (gltf.animations.length === 0) {
          showToast('动画文件中未找到动画', 'error');
          URL.revokeObjectURL(url); return;
        }
        gltf.animations.forEach(clip => clips.set(clip.name || 'clip', clip));
        buildAnimList();
        autoPlayFirst();
        showToast(`动画加载成功: ${fileName}`, 'success');
        URL.revokeObjectURL(url);
      }, undefined, (err) => {
        showToast(`动画加载失败: ${err.message}`, 'error');
        URL.revokeObjectURL(url);
      });
    }

    // ==================== 上传区域绑定 ====================
    function bindUploadZone(zoneId, inputId, type) {
      const zone = document.getElementById(zoneId);
      const input = document.getElementById(inputId);
      if (!zone || !input) return;

      zone.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT') input.click();
      });
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault(); zone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0], type);
      });
      input.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0], type);
      });
    }

    async function handleFile(file, type) {
      const ext = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
      if (!['.glb', '.gltf'].includes(ext)) {
        showToast('请选择 .glb 或 .gltf 文件', 'error'); return;
      }

      const arrayBuffer = await file.arrayBuffer();

      // 更新所有同名 UI
      const nameElIds = type === 'static'
        ? ['heroStaticName', 'sideStaticName']
        : ['heroAnimName', 'sideAnimName'];
      const zoneIds = type === 'static'
        ? ['heroStaticZone', 'sideStaticZone']
        : ['heroAnimZone', 'sideAnimZone'];

      nameElIds.forEach(id => { const el = document.getElementById(id); if (el) el.textContent = file.name; });
      zoneIds.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('has-file'); });

      if (type === 'static') {
        loadStaticModel(arrayBuffer, file.name);
        await saveFile(`static_${file.name}`, new Blob([arrayBuffer]), file.name);
        addToHistory(file.name, 'static');
      } else {
        loadAnimations(arrayBuffer, file.name);
        await saveFile(`anim_${file.name}`, new Blob([arrayBuffer]), file.name);
        addToHistory(file.name, 'anim');
      }
    }

    // ==================== 侧边栏历史记录 ====================
    function renderHistory() {
      const history = getHistory();
      const list = document.getElementById('historyList');
      if (!list) return;

      if (history.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无历史记录</div>';
        return;
      }

      list.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const { ts, displayName } = renderHistoryItemHTML(item);

        div.innerHTML = `
          <div class="history-info">
            <div class="history-name">${displayName}</div>
            <div class="history-meta">${ts}</div>
          </div>
          <div class="history-actions">
            <button class="history-btn load" data-id="${item.id}">加载</button>
            <button class="history-btn delete" data-id="${item.id}">✕</button>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll('.history-btn.load').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          const item = getHistory().find(i => i.id === id);
          if (item) await loadFromHistory(item);
        });
      });

      list.querySelectorAll('.history-btn.delete').forEach(btn => {
        btn.addEventListener('click', (e) => removeFromHistory(e.target.dataset.id));
      });
    }

    // ==================== 初始化 ====================
    function updateSize() {
      const rect = viewport.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
      renderer.setSize(rect.width, rect.height);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      updateCameraAnimation(dt);
      if (mixer) mixer.update(dt);
      controls.update();
      renderer.render(scene, camera);
    }

    // 绑定所有上传区域
    bindUploadZone('heroStaticZone', 'heroStaticInput', 'static');
    bindUploadZone('heroAnimZone', 'heroAnimInput', 'anim');
    bindUploadZone('sideStaticZone', 'sideStaticInput', 'static');
    bindUploadZone('sideAnimZone', 'sideAnimInput', 'anim');

    renderHistory();
    renderNavHistory();
    updateSize();
    animate();

    window.addEventListener('resize', updateSize);
    new ResizeObserver(updateSize).observe(viewport);

    showToast('欢迎使用 GLB 动画查看器', 'info');
  </script>
</body>
</html>
