<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转PDF - 在线工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* 小米SU7粉色 + 米其林低饱和度配色 */
        :root {
            --primary: #E8B4B8;
            --primary-dark: #D4969B;
            --primary-light: #F5D5D8;
            --accent: #C9929A;
            --bg: #FAF8F5;
            --bg-warm: #FDF9F6;
            --card: #FFFFFF;
            --card-hover: #FFFDFB;
            --text: #4A4A4A;
            --text-light: #7A7A7A;
            --border: #E8E4E1;
            --border-hover: #D4CFC9;
            --shadow: rgba(200, 180, 175, 0.15);
            --shadow-hover: rgba(200, 180, 175, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .header h1 .icon {
            color: var(--primary-dark);
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 4px 24px var(--shadow);
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 32px var(--shadow-hover);
        }

        .upload-zone {
            border: 2px dashed var(--border-hover);
            border-radius: 16px;
            padding: 64px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-warm);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--primary-light);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 400;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 300;
        }

        .preview-section {
            margin-top: 32px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .preview-title {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 400;
        }

        .preview-title span {
            color: var(--accent);
            font-weight: 500;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .preview-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .preview-item {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px var(--shadow);
            background: var(--bg-warm);
            aspect-ratio: 1;
            transition: all 0.3s ease;
        }

        .preview-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow-hover);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .序号 {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--card);
            color: var(--accent);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .preview-item .删除-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--card);
            color: var(--text-light);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .preview-item .删除-btn:hover {
            background: #FFE4E6;
            color: #D4707A;
            transform: scale(1.1);
        }

        .preview-item .上移-btn,
        .preview-item .下移-btn {
            position: absolute;
            bottom: 8px;
            background: var(--card);
            color: var(--accent);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .preview-item .上移-btn {
            left: 8px;
        }

        .preview-item .下移-btn {
            right: 8px;
        }

        .preview-item .上移-btn:hover,
        .preview-item .下移-btn:hover {
            background: var(--primary-light);
            transform: scale(1.1);
        }

        /* 拖拽排序样式 */
        .preview-item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .preview-item.drag-over {
            border: 2px dashed var(--accent);
            transform: scale(1.02);
        }

        .preview-item .拖拽手柄 {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            color: var(--text-light);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .preview-item .拖拽手柄:hover {
            background: var(--primary-light);
            color: var(--accent);
            transform: translateX(-50%) scale(1.1);
        }

        .preview-item .拖拽手柄:active {
            cursor: grabbing;
        }

        .settings-section {
            margin-top: 32px;
        }

        .settings-title {
            font-size: 1.15rem;
            color: var(--text);
            font-weight: 400;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 400;
        }

        .setting-control {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: var(--card);
            color: var(--text);
        }

        .setting-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .mode-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .mode-option {
            flex: 1;
            min-width: 180px;
            padding: 20px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: var(--card);
        }

        .mode-option:hover {
            border-color: var(--primary);
            background: var(--bg-warm);
        }

        .mode-option.active {
            border-color: var(--primary);
            background: linear-gradient(145deg, var(--primary-light) 0%, #F9E4E6 100%);
            box-shadow: 0 4px 16px var(--shadow);
        }

        .mode-option .mode-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .mode-option .mode-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text);
        }

        .mode-option .mode-desc {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 300;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary-dark) 0%, var(--accent) 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(232, 180, 184, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(232, 180, 184, 0.5);
        }

        .btn-secondary {
            background: var(--bg-warm);
            color: var(--text-light);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--text);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(250, 248, 245, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .progress-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .progress-card {
            background: var(--card);
            border-radius: 20px;
            padding: 48px 56px;
            text-align: center;
            min-width: 320px;
            box-shadow: 0 12px 48px var(--shadow);
            border: 1px solid var(--border);
        }

        .progress-spinner {
            width: 56px;
            height: 56px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-text {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 12px;
            font-weight: 400;
        }

        .progress-percent {
            font-size: 2rem;
            font-weight: 300;
            color: var(--accent);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-group label {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .tips {
            background: var(--bg-warm);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-light);
            border-left: 3px solid var(--primary);
        }

        .tips strong {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .card {
                padding: 24px 20px;
            }

            .upload-zone {
                padding: 48px 24px;
            }

            .preview-list {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 图片转PDF</h1>
            <p>纯前端实现，保护隐私，无需上传服务器</p>
        </div>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">🖼️</div>
                <div class="upload-text">点击或拖拽图片到这里上传</div>
                <div class="upload-hint">支持 JPG、PNG、GIF、WebP 格式，可同时选择多张图片</div>
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="preview-header">
                    <div class="preview-title">已上传 <span id="imageCount">0</span> 张图片</div>
                    <div class="preview-actions">
                        <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空全部</button>
                    </div>
                </div>
                <div class="preview-list" id="previewList"></div>
            </div>
        </div>

        <div class="card" id="settingsCard" style="display: none;">
            <div class="settings-title">⚙️ 转换设置</div>

            <div class="mode-selector">
                <div class="mode-option active" data-mode="merge" onclick="setMode('merge')">
                    <div class="mode-icon">📚</div>
                    <div class="mode-title">合并为单个PDF</div>
                    <div class="mode-desc">所有图片合并到一个PDF文件</div>
                </div>
                <div class="mode-option" data-mode="split" onclick="setMode('split')">
                    <div class="mode-icon">📑</div>
                    <div class="mode-title">每张图片一个PDF</div>
                    <div class="mode-desc">每张图片分别生成单独的PDF</div>
                </div>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <label class="setting-label">📐 PDF纸张大小</label>
                    <select class="setting-control" id="paperSize">
                        <option value="a4" selected>A4 (210 × 297 mm)</option>
                        <option value="a3">A3 (297 × 420 mm)</option>
                        <option value="a5">A5 (148 × 210 mm)</option>
                        <option value="letter">Letter (8.5 × 11 in)</option>
                        <option value="legal">Legal (8.5 × 14 in)</option>
                        <option value="fit">适应图片尺寸</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label class="setting-label">🖼️ 图片排版</label>
                    <select class="setting-control" id="layout">
                        <option value="fit" selected>适应页面（保持比例）</option>
                        <option value="fill">填充页面</option>
                        <option value="original">保持原始尺寸</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label class="setting-label">📐 图片质量</label>
                    <select class="setting-control" id="quality">
                        <option value="low">低（压缩率高）</option>
                        <option value="medium" selected>中（平衡）</option>
                        <option value="high">高（最佳质量）</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label class="setting-label">📄 页边距 (mm)</label>
                    <input type="number" class="setting-control" id="margin" value="10" min="0" max="50">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="compress" checked>
                <label for="compress">压缩PDF文件</label>
            </div>

            <div class="tips">
                <strong>💡 提示：</strong>所有处理均在本地浏览器完成，图片不会上传到任何服务器。
                点击"开始转换"后，PDF文件将自动下载。
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-primary" id="convertBtn" onclick="startConvert()">
                    🚀 开始转换
                </button>
            </div>
        </div>

        <div class="footer">
            <p>隐私保护 · 本地处理 · 无需上传</p>
        </div>
    </div>

    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-card">
            <div class="progress-spinner"></div>
            <div class="progress-text" id="progressText">正在处理图片...</div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        // 状态管理
        let images = [];
        let currentMode = 'merge';

        // 纸张尺寸 (mm)
        const paperSizes = {
            a4: { width: 210, height: 297 },
            a3: { width: 297, height: 420 },
            a5: { width: 148, height: 210 },
            letter: { width: 215.9, height: 279.4 },
            legal: { width: 215.9, height: 355.6 },
            fit: null
        };

        // DOM元素
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewList = document.getElementById('previewList');
        const settingsCard = document.getElementById('settingsCard');
        const imageCount = document.getElementById('imageCount');
        const convertBtn = document.getElementById('convertBtn');

        // 上传区域事件
        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 处理文件
        function handleFiles(files) {
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

            for (const file of files) {
                if (validTypes.includes(file.type)) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        images.push({
                            id: Date.now() + Math.random(),
                            name: file.name,
                            dataUrl: e.target.result,
                            width: 0,
                            height: 0
                        });
                        updatePreview();
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        // 更新预览
        function updatePreview() {
            imageCount.textContent = images.length;

            if (images.length > 0) {
                previewSection.style.display = 'block';
                settingsCard.style.display = 'block';
            } else {
                previewSection.style.display = 'none';
                settingsCard.style.display = 'none';
            }

            previewList.innerHTML = images.map((img, index) => `
                <div class="preview-item" data-id="${img.id}" data-index="${index}" draggable="true">
                    <img src="${img.dataUrl}" alt="${img.name}" title="${img.name}">
                    <div class="序号">${index + 1}</div>
                    <button class="删除-btn" onclick="deleteImage(${index})" title="删除">×</button>
                    <button class="拖拽手柄" title="拖拽排序">☰</button>
                </div>
            `).join('');

            // 绑定拖拽事件
            initDragEvents();
        }

        // 删除图片
        function deleteImage(index) {
            images.splice(index, 1);
            updatePreview();
        }

        // 移动图片
        function moveImage(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < images.length) {
                [images[index], images[newIndex]] = [images[newIndex], images[index]];
                updatePreview();
            }
        }

        // 拖拽排序 - 初始化拖拽事件
        let draggedIndex = null;

        function initDragEvents() {
            const items = document.querySelectorAll('.preview-item');

            items.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('dragenter', handleDragEnter);
                item.addEventListener('dragleave', handleDragLeave);
                item.addEventListener('drop', handleDrop);
            });
        }

        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.preview-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            draggedIndex = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();

            const targetIndex = parseInt(this.dataset.index);

            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                // 重新排序数组
                const draggedItem = images[draggedIndex];
                images.splice(draggedIndex, 1);
                images.splice(targetIndex, 0, draggedItem);
                updatePreview();
            }

            return false;
        }

        // 清空全部
        function clearAll() {
            images = [];
            updatePreview();
            fileInput.value = '';
        }

        // 设置模式
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-option').forEach(el => {
                el.classList.toggle('active', el.dataset.mode === mode);
            });
        }

        // 获取图片尺寸
        function getImageDimensions(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    resolve({ width: img.width, height: img.height });
                };
                img.src = dataUrl;
            });
        }

        // 加载图片
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // 显示进度
        function showProgress(text, percent) {
            document.getElementById('progressText').textContent = text;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressOverlay').classList.add('active');
        }

        // 隐藏进度
        function hideProgress() {
            document.getElementById('progressOverlay').classList.remove('active');
        }

        // 开始转换
        async function startConvert() {
            if (images.length === 0) {
                alert('请先上传图片！');
                return;
            }

            convertBtn.disabled = true;
            showProgress('正在加载图片...', 0);

            try {
                const paperSize = document.getElementById('paperSize').value;
                const layout = document.getElementById('layout').value;
                const quality = document.getElementById('quality').value;
                const margin = parseInt(document.getElementById('margin').value) || 0;
                const compress = document.getElementById('compress').checked;

                // 质量设置
                const qualityMap = {
                    low: 0.3,
                    medium: 0.6,
                    high: 0.9
                };
                const imgQuality = qualityMap[quality];

                if (currentMode === 'merge') {
                    await createMergedPDF(paperSize, layout, margin, imgQuality, compress);
                } else {
                    await createSplitPDFs(paperSize, layout, margin, imgQuality, compress);
                }

                hideProgress();
                alert(currentMode === 'merge' ? '✅ PDF已生成并下载！' : '✅ 所有PDF已生成并下载！');

            } catch (error) {
                console.error('转换错误:', error);
                hideProgress();
                alert('转换失败: ' + error.message);
            }

            convertBtn.disabled = false;
        }

        // 创建合并PDF
        async function createMergedPDF(paperSize, layout, margin, quality, compress) {
            const size = paperSizes[paperSize];

            for (let i = 0; i < images.length; i++) {
                showProgress(`处理第 ${i + 1}/${images.length} 张图片...`, Math.round((i / images.length) * 100));

                const img = await loadImage(images[i].dataUrl);
                const imgWidth = img.width;
                const imgHeight = img.height;

                let pageWidth, pageHeight, imgX, imgY, imgW, imgH;

                if (size) {
                    pageWidth = size.width;
                    pageHeight = size.height;
                } else {
                    // 适应图片尺寸
                    const ratio = imgWidth / imgHeight;
                    pageWidth = Math.min(imgWidth / 3.78, 595); // 最大A4宽度
                    pageHeight = pageWidth / ratio;
                }

                if (i === 0) {
                    var pdf = new jsPDF({
                        orientation: pageWidth > pageHeight ? 'landscape' : 'portrait',
                        unit: 'mm',
                        format: [pageWidth, pageHeight]
                    });
                } else {
                    pdf.addPage([pageWidth, pageHeight], pageWidth > pageHeight ? 'landscape' : 'portrait');
                }

                const availableWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);

                switch (layout) {
                    case 'fit':
                        const ratio = Math.min(availableWidth / imgWidth, availableHeight / imgHeight);
                        imgW = imgWidth * ratio;
                        imgH = imgHeight * ratio;
                        imgX = margin + (availableWidth - imgW) / 2;
                        imgY = margin + (availableHeight - imgH) / 2;
                        break;
                    case 'fill':
                        imgX = margin;
                        imgY = margin;
                        imgW = availableWidth;
                        imgH = availableHeight;
                        break;
                    case 'original':
                        imgX = margin;
                        imgY = margin;
                        imgW = Math.min(imgWidth / 3.78, availableWidth);
                        imgH = imgW * (imgHeight / imgWidth);
                        if (imgH > availableHeight) {
                            imgH = availableHeight;
                            imgW = imgH * (imgWidth / imgHeight);
                        }
                        break;
                }

                // 将图片转换为JPEG格式以减少大小
                const canvas = document.createElement('canvas');
                canvas.width = imgW * 3.78; // 72 DPI
                canvas.height = imgH * 3.78;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const imgData = canvas.toDataURL('image/jpeg', quality);

                pdf.addImage(imgData, 'JPEG', imgX, imgY, imgW, imgH);
            }

            showProgress('正在生成PDF...', 95);

            // 生成文件名
            const timestamp = new Date().toISOString().slice(0, 10);
            const filename = `图片合并_${timestamp}.pdf`;

            if (compress) {
                pdf.save(filename, { compress: true });
            } else {
                pdf.save(filename);
            }
        }

        // 创建分离PDF - 每张图片单独导出
        async function createSplitPDFs(paperSize, layout, margin, quality, compress) {
            const size = paperSizes[paperSize];
            const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const total = images.length;

            for (let i = 0; i < images.length; i++) {
                showProgress(`正在导出 ${i + 1}/${total}...`, Math.round((i / total) * 100));

                const img = await loadImage(images[i].dataUrl);
                const imgWidth = img.width;
                const imgHeight = img.height;

                let pageWidth, pageHeight, imgX, imgY, imgW, imgH;

                if (size) {
                    pageWidth = size.width;
                    pageHeight = size.height;
                } else {
                    const ratio = imgWidth / imgHeight;
                    pageWidth = Math.min(imgWidth / 3.78, 595);
                    pageHeight = pageWidth / ratio;
                }

                const pdf = new jsPDF({
                    orientation: pageWidth > pageHeight ? 'landscape' : 'portrait',
                    unit: 'mm',
                    format: [pageWidth, pageHeight]
                });

                const availableWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);

                switch (layout) {
                    case 'fit':
                        const ratio = Math.min(availableWidth / imgWidth, availableHeight / imgHeight);
                        imgW = imgWidth * ratio;
                        imgH = imgHeight * ratio;
                        imgX = margin + (availableWidth - imgW) / 2;
                        imgY = margin + (availableHeight - imgH) / 2;
                        break;
                    case 'fill':
                        imgX = margin;
                        imgY = margin;
                        imgW = availableWidth;
                        imgH = availableHeight;
                        break;
                    case 'original':
                        imgX = margin;
                        imgY = margin;
                        imgW = Math.min(imgWidth / 3.78, availableWidth);
                        imgH = imgW * (imgWidth / imgHeight) * (imgHeight / imgWidth);
                        imgH = imgW * (imgHeight / imgWidth);
                        if (imgH > availableHeight) {
                            imgH = availableHeight;
                            imgW = imgH * (imgWidth / imgHeight);
                        }
                        break;
                }

                const canvas = document.createElement('canvas');
                canvas.width = imgW * 3.78;
                canvas.height = imgH * 3.78;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const imgData = canvas.toDataURL('image/jpeg', quality);

                pdf.addImage(imgData, 'JPEG', imgX, imgY, imgW, imgH);

                // 智能命名：序号(3位) + 原文件名(去掉扩展名)，避免文件名冲突
                const originalName = images[i].name.replace(/\.[^/.]+$/, '').replace(/[\\\/\:\*\?\"\<\>\|]/g, '_');
                const paddedIndex = String(i + 1).padStart(3, '0');
                const filename = `${paddedIndex}_${originalName}.pdf`;

                if (compress) {
                    pdf.save(filename, { compress: true });
                } else {
                    pdf.save(filename);
                }

                // 等待一段时间让浏览器处理下载
                await new Promise(resolve => setTimeout(resolve, 400));
            }
        }
    </script>
