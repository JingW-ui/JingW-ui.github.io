<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片转Base64工具</title>
<link rel="stylesheet" href="../common.css">
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6f8fa;color:#1f2328;min-height:100vh;display:block;flex-direction:row}
:root{--green:#2da44e;--green2:#2c974b;--border:#d0d7de;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08)}
header{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:none}

header p{font-size:13px;color:#656d76;margin-left:auto}
.container{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;display:block;flex-direction:row}
.card-header{background:#f6f8fa;border-bottom:1px solid var(--border);padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-body{padding:16px;flex:0 1 auto;display:block;flex-direction:row;gap:normal}
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 20px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:#656d76;transition:all .15s}
.tab.active{border-bottom-color:var(--green);color:var(--green);font-weight:600}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.dropzone:hover{border-color:var(--green);background:#f0fff4}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;justify-content:normal;font-family:Arial}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green2)}
.btn-secondary{background:#f6f8fa;color:#1f2328;border:1px solid var(--border)}
.btn-secondary:hover{background:#f0f2f5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;resize:vertical;min-height:160px;font-family:Consolas,monospace;line-height:1.5;outline:none;transition:border-color .15s;word-break:break-all;background:#fff;color:#000}
textarea:focus{border-color:var(--green);outline:none;box-shadow:none}
.result-preview{max-width:100%;max-height:200px;border-radius:var(--radius);border:1px solid var(--border);background:#f0f0f0;display:block}
.info-bar{background:#f6f8fa;padding:8px 12px;font-size:12px;color:#656d76;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#dff4e0;color:#1a7f37}
.img-list{display:flex;flex-direction:column;gap:8px}
.img-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius)}
.img-item img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border)}
.img-item-info{flex:1;overflow:hidden}
.img-item-info .name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-item-info .meta{font-size:11px;color:#656d76;margin-top:2px}
.format-badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.format-badge{padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:#fff}
.format-badge:hover{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<header>
  <span style="font-size:24px">🔗</span>
  <h1>图片转 Base64 工具</h1>
  <p>图片↔Base64 · Data URI · CSS 背景</p>
</header>
<div class="container">
  <div class="card">
    <div class="card-body">
      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('img2base64')">图片 → Base64</div>
        <div class="tab" onclick="switchTab('base642img')">Base64 → 图片</div>
        <div class="tab" onclick="switchTab('batch')">批量转换</div>
      </div>

      <!-- 图片→Base64 -->
      <div id="panel-img2base64">
        <div class="dropzone" onclick="document.getElementById('img-input').click()"
          ondragover="event.preventDefault();this.style.borderColor='#2da44e'"
          ondragleave="this.style.borderColor=''"
          ondrop="handleDrop(event,'single')">
          <div style="font-size:48px;margin-bottom:12px">🖼️</div>
          <p style="color:#656d76">点击选择图片或拖拽到此处</p>
          <div style="font-size:12px;color:#aaa;margin-top:6px">支持所有图片格式</div>
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="img2base64(this.files[0])">
        
        <div id="b64-result" style="display:none;margin-top:16px">
          <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-start">
            <img id="b64-preview" class="result-preview" src="" alt="预览">
            <div id="b64-info" style="font-size:13px;color:#656d76;flex:1"></div>
          </div>
          <label style="font-size:12px;color:#656d76;font-weight:500;margin-bottom:4px;display:block">输出格式</label>
          <div class="format-badges" id="output-format-btns">
            <span class="format-badge active" onclick="setOutputFmt('datauri',this)">Data URI</span>
            <span class="format-badge" onclick="setOutputFmt('base64only',this)">纯 Base64</span>
            <span class="format-badge" onclick="setOutputFmt('css',this)">CSS 背景</span>
            <span class="format-badge" onclick="setOutputFmt('html-img',this)">HTML &lt;img&gt;</span>
            <span class="format-badge" onclick="setOutputFmt('markdown',this)">Markdown</span>
          </div>
          <div style="margin-top:8px">
            <textarea id="b64-output" readonly></textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="copyB64()">📋 复制</button>
          </div>
        </div>
      </div>

      <!-- Base64→图片 -->
      <div id="panel-base642img" style="display:none">
        <label style="font-size:12px;color:#656d76;font-weight:500;margin-bottom:4px;display:block">粘贴 Base64 字符串（支持 Data URI 或纯 Base64）</label>
        <textarea id="b64-input" placeholder="data:image/png;base64,iVBORw0KGgo... 或纯 Base64 字符串" style="min-height:120px"></textarea>
        <div class="actions">
          <button class="btn btn-primary" onclick="base642img()">🖼️ 生成图片</button>
          <button class="btn btn-secondary" onclick="document.getElementById('b64-input').value='';document.getElementById('decode-result').style.display='none'">🗑 清空</button>
        </div>
        <div id="decode-result" style="display:none;margin-top:16px">
          <div style="margin-bottom:8px;font-size:13px;color:#656d76" id="decode-info"></div>
          <img id="decode-preview" class="result-preview" src="" alt="解码图片" style="max-height:300px">
          <div class="actions">
            <button class="btn btn-primary" onclick="downloadDecoded()">⬇️ 下载图片</button>
          </div>
        </div>
      </div>

      <!-- 批量 -->
      <div id="panel-batch" style="display:none">
        <div class="dropzone" onclick="document.getElementById('batch-input').click()"
          ondragover="event.preventDefault();this.style.borderColor='#2da44e'"
          ondragleave="this.style.borderColor=''"
          ondrop="handleDrop(event,'batch')">
          <div style="font-size:48px;margin-bottom:12px">📁</div>
          <p style="color:#656d76">点击选择多张图片或拖拽到此处</p>
          <div style="font-size:12px;color:#aaa;margin-top:6px">可多选</div>
        </div>
        <input type="file" id="batch-input" accept="image/*" multiple style="display:none" onchange="batchConvert(this.files)">
        <div id="batch-list" class="img-list" style="margin-top:16px"></div>
        <div class="actions" id="batch-actions" style="display:none">
          <button class="btn btn-primary" onclick="copyAllBase64()">📋 复制全部（JSON）</button>
          <button class="btn btn-secondary" onclick="clearBatch()">🗑 清空</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script>
let currentB64 = '';
let currentMime = '';
let currentFmt = 'datauri';
let batchResults = [];

function switchTab(tab) {
  ['img2base64','base642img','batch'].forEach(t => {
    document.getElementById('panel-'+t).style.display = t===tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['img2base64','base642img','batch'][i]===tab);
  });
}

function handleDrop(e, mode) {
  e.preventDefault();
  e.target.style.borderColor = '';
  if (mode === 'single') img2base64(e.dataTransfer.files[0]);
  else batchConvert(e.dataTransfer.files);
}

function img2base64(file) {
  if (!file || !file.type.startsWith('image/')) { showToast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    currentB64 = e.target.result.split(',')[1];
    currentMime = file.type;
    document.getElementById('b64-preview').src = e.target.result;
    document.getElementById('b64-result').style.display = 'block';
    
    const img = new Image();
    img.onload = () => {
      document.getElementById('b64-info').innerHTML = `
        <div><b>${file.name}</b></div>
        <div>原始大小：${(file.size/1024).toFixed(1)} KB</div>
        <div>Base64大小：${Math.round(currentB64.length * 3/4 / 1024)} KB（约 ${((currentB64.length*3/4/file.size-1)*100).toFixed(0)+33}% 膨胀）</div>
        <div>尺寸：${img.width} × ${img.height} px</div>
        <div>类型：${file.type}</div>
      `;
    };
    img.src = e.target.result;
    updateOutput();
  };
  reader.readAsDataURL(file);
}

function setOutputFmt(fmt, el) {
  currentFmt = fmt;
  document.querySelectorAll('.format-badge').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  updateOutput();
}

function updateOutput() {
  if (!currentB64) return;
  const dataURI = `data:${currentMime};base64,${currentB64}`;
  let out = '';
  switch (currentFmt) {
    case 'datauri': out = dataURI; break;
    case 'base64only': out = currentB64; break;
    case 'css': out = `background-image: url('${dataURI}');`; break;
    case 'html-img': out = `<img src="${dataURI}" alt="图片">`;  break;
    case 'markdown': out = `![图片](${dataURI})`; break;
  }
  document.getElementById('b64-output').value = out;
}

function copyB64() {
  copyText(document.getElementById('b64-output').value, '已复制！');
}

function base642img() {
  let input = document.getElementById('b64-input').value.trim();
  if (!input) { showToast('请粘贴 Base64 内容'); return; }
  // 处理纯Base64（无data:前缀）
  if (!input.startsWith('data:')) {
    input = `data:image/png;base64,${input}`;
  }
  const img = document.getElementById('decode-preview');
  img.onload = () => {
    document.getElementById('decode-result').style.display = 'block';
    document.getElementById('decode-info').textContent = `图片尺寸：${img.naturalWidth} × ${img.naturalHeight} px`;
  };
  img.onerror = () => { showToast('Base64 解码失败，请检查内容是否正确'); };
  img.src = input;
}

function downloadDecoded() {
  const src = document.getElementById('decode-preview').src;
  if (!src) return;
  const a = document.createElement('a');
  a.href = src;
  a.download = 'decoded_image.png';
  a.click();
}

function batchConvert(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  batchResults = [];
  const list = document.getElementById('batch-list');
  list.innerHTML = '';
  arr.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = e => {
      const b64 = e.target.result;
      batchResults[i] = { name: file.name, b64, size: file.size };
      const div = document.createElement('div');
      div.className = 'img-item';
      div.innerHTML = `
        <img src="${b64}" alt="">
        <div class="img-item-info">
          <div class="name">${file.name}</div>
          <div class="meta">原始：${(file.size/1024).toFixed(1)} KB → Base64：${(b64.length/1024).toFixed(1)} KB</div>
        </div>
        <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px" onclick="copyItem(${i})">📋 复制</button>
      `;
      list.appendChild(div);
      if (batchResults.filter(Boolean).length === arr.length) {
        document.getElementById('batch-actions').style.display = 'flex';
      }
    };
    reader.readAsDataURL(file);
  });
}

function copyItem(i) {
  if (batchResults[i]) {
    copyText(batchResults[i].b64, '已复制 ' + batchResults[i].name);
  }
}

function copyAllBase64() {
  const data = batchResults.filter(Boolean).reduce((obj, item) => {
    obj[item.name] = item.b64;
    return obj;
  }, {});
  copyText(JSON.stringify(data, null, 2), '已复制所有 Base64（JSON格式）');
}

function clearBatch() {
  batchResults = [];
  document.getElementById('batch-list').innerHTML = '';
  document.getElementById('batch-actions').style.display = 'none';
}

</script>
</body>
</html>
