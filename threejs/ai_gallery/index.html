<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gallery - Cyberpunk Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cccccc;
            font-size: 24px;
            text-shadow: 0 0 10px #cccccc;
        }
        /* 英雄镜头控制面板 */
        #hero-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #hero-controls:hover {
            opacity: 0.9;
        }
        .hero-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hero-btn:hover {
            background: rgba(100, 100, 100, 0.8);
            border-color: #999;
            color: #fff;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.5);
        }
        .hero-btn.active {
            background: rgba(150, 150, 150, 0.9);
            border-color: #ccc;
            color: #fff;
        }
        /* OUT标签样式 - 居中显示 */
        .out-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            border: 2px solid rgba(255, 50, 50, 0.9);
        }
        .out-label.visible {
            opacity: 1;
        }
        /* OUT按钮样式 */
        .out-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .out-btn:hover {
            background: rgba(150, 50, 50, 0.8);
            border-color: #ff4444;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .out-btn.active {
            background: rgba(200, 50, 50, 0.9);
            border-color: #ff6666;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading" id="loading">加载中...</div>
    <div id="hero-controls"></div>
    <div id="out-controls"></div>
    <div id="out-labels-container"></div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Logo 列表
        const logoList = ["doubao", "deepseek", "kimi", "yuanbao", "glm", "longcat", "qianwen"];
        
        // 场景初始化
        let scene, camera, renderer;
        let stands = [];
        let particles;
        let clock = new THREE.Clock();
        let isHeroMode = false; // 是否处于英雄镜头模式
        let heroTarget = null; // 英雄镜头目标位置
        let autoRotateEnabled = true; // 自动旋转是否启用
        let outStates = {}; // 记录每个logo的OUT状态
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 15);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x111111, 0.3);
            scene.add(ambientLight);
            
            // 添加方向光
            const directionalLight = new THREE.DirectionalLight(0xcccccc, 0.6);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // 添加点光源（灰色霓虹效果）
            const pointLight1 = new THREE.PointLight(0xaaaaaa, 1.5, 50);
            pointLight1.position.set(-10, 5, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x999999, 1.5, 50);
            pointLight2.position.set(10, 5, 0);
            scene.add(pointLight2);
            
            // 添加更多灰色霓虹灯效果
            const pointLight3 = new THREE.PointLight(0xbbbbbb, 1, 40);
            pointLight3.position.set(0, 8, -5);
            scene.add(pointLight3);
            
            const pointLight4 = new THREE.PointLight(0x888888, 1, 40);
            pointLight4.position.set(0, 3, 10);
            scene.add(pointLight4);
            
            // 创建赛博朋克风格的大厅地面
            createCyberFloor();
            
            // 创建粒子效果
            createParticles();
            
            // 创建六个立牌
            createStands();
            
            // 创建英雄镜头控制按钮
            createHeroControls();
            
            // 创建OUT控制按钮
            createOutControls();
            
            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            // 开始动画循环
            animate();
        }
        
        // 创建赛博朋克风格的地面
        function createCyberFloor() {
            const geometry = new THREE.PlaneGeometry(100, 100, 20, 20);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x111111,
                emissiveIntensity: 0.15
            });
            
            const floor = new THREE.Mesh(geometry, material);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 添加网格线效果
            const gridHelper = new THREE.GridHelper(100, 50, 0x666666, 0x222222);
            gridHelper.position.y = -1.99;
            scene.add(gridHelper);
        }
        
        // 创建粒子效果
        function createParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 30 - 10;
                positions[i + 2] = (Math.random() - 0.5) * 100;
                
                // 随机颜色（灰色系）
                const grayValue = Math.random() * 0.4 + 0.6; // 0.6-1.0
                colors[i] = grayValue;     // R
                colors[i + 1] = grayValue; // G
                colors[i + 2] = grayValue; // B
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        // 创建六个立牌
        function createStands() {
            const standWidth = 2;
            const standHeight = 3;
            const standDepth = 0.2;
            const spacing = 4;
            
            for (let i = 0; i < logoList.length; i++) {
                const xPosition = (i - logoList.length / 2 + 0.5) * spacing;
                
                // 立牌主体
                const geometry = new THREE.BoxGeometry(standWidth, standHeight, standDepth);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0a0a0a,
                    roughness: 0.4,
                    metalness: 0.6,
                    emissive: 0x111111,
                    emissiveIntensity: 0.08
                });
                
                const stand = new THREE.Mesh(geometry, material);
                stand.position.set(xPosition, 0, 0);
                stand.castShadow = true;
                stand.receiveShadow = true;
                scene.add(stand);
                
                // 添加发光边框 - 使用EdgesGeometry只显示边缘
                const edgesGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(standWidth, standHeight, standDepth));
                const borderMaterial = new THREE.LineBasicMaterial({
                    color: 0x888888,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.8
                });
                
                const border = new THREE.LineSegments(edgesGeometry, borderMaterial);
                border.position.copy(stand.position);
                scene.add(border);
                
                // 添加外发光框
                const glowGeometry = new THREE.BoxGeometry(standWidth + 0.15, standHeight + 0.15, standDepth + 0.05);
                const glowEdges = new THREE.EdgesGeometry(glowGeometry);
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: 0x666666,
                    transparent: true,
                    opacity: 0.4
                });
                const glowBorder = new THREE.LineSegments(glowEdges, glowMaterial);
                glowBorder.position.copy(stand.position);
                scene.add(glowBorder);
                
                // 加载 Logo 纹理
                const logoName = logoList[i];
                
                if (logoName === 'glm' || logoName === 'qianwen') {
                    // SVG 文件需要使用 Canvas 渲染
                    loadSVGAsTexture(`assets/${logoName}.svg`, xPosition, standDepth, i, standWidth, standHeight);
                } else {
                    // PNG 文件直接加载
                    let logoPath = `assets/${logoName}.png`;
                    if (logoName === 'deepseek') {
                        logoPath = `assets/seepseek.png`;
                    }
                    
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(logoPath, function(texture) {
                        createLogoMesh(texture, xPosition, standDepth, i, standWidth, standHeight);
                    });
                }
                
                // 保存立牌引用用于动画
                stands.push({
                    mesh: stand,
                    border: border,
                    glowBorder: glowBorder,
                    position: xPosition
                });
            }
        }
        
        // 创建英雄镜头控制按钮
        function createHeroControls() {
            const container = document.getElementById('hero-controls');
            
            // 为每个logo创建按钮
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'hero-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    activateHeroLens(index);
                });
                
                container.appendChild(btn);
            });
            
            // 添加返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'hero-btn';
            backBtn.textContent = '⟲';
            backBtn.title = '返回自动漫游';
            backBtn.addEventListener('click', () => {
                deactivateHeroLens();
            });
            container.appendChild(backBtn);
        }
        
        // 激活英雄镜头
        function activateHeroLens(index) {
            if (index < 0 || index >= stands.length) return;
            
            isHeroMode = true;
            autoRotateEnabled = false;
            
            const stand = stands[index];
            const targetX = stand.position;
            
            // 设置目标位置：正对logo，距离适中
            heroTarget = {
                position: new THREE.Vector3(targetX, 1, 6),
                lookAt: new THREE.Vector3(targetX, 0.5, 0)
            };
            
            // 更新按钮状态
            document.querySelectorAll('.hero-btn').forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 取消英雄镜头
        function deactivateHeroLens() {
            isHeroMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            // 清除所有按钮的active状态
            document.querySelectorAll('.hero-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 创建OUT控制按钮
        function createOutControls() {
            const container = document.getElementById('out-controls');
            container.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 150px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                opacity: 0.3;
                transition: opacity 0.3s ease;
                z-index: 100;
            `;
            container.onmouseover = () => container.style.opacity = '0.9';
            container.onmouseout = () => container.style.opacity = '0.3';
            
            // 为每个logo创建OUT按钮和标签
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'out-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    toggleOutState(index);
                });
                
                container.appendChild(btn);
                
                // 创建对应的OUT标签
                const label = document.createElement('div');
                label.className = 'out-label';
                label.id = `out-label-${index}`;
                label.textContent = 'OUT';
                document.getElementById('out-labels-container').appendChild(label);
            });
        }
        
        // 切换OUT状态
        function toggleOutState(index) {
            if (index < 0 || index >= stands.length) return;
            
            const stand = stands[index];
            outStates[index] = !outStates[index];
            
            if (outStates[index]) {
                // 设置为OUT状态：变灰
                if (stand.logoMaterial) {
                    stand.logoMaterial.color.setHex(0x666666); // 灰色
                    stand.logoMaterial.needsUpdate = true;
                }
                // 添加红色边框效果
                if (stand.border) {
                    stand.border.material.color.setHex(0xff0000);
                    stand.border.material.opacity = 1.0;
                }
                if (stand.glowBorder) {
                    stand.glowBorder.material.color.setHex(0xff3333);
                    stand.glowBorder.material.opacity = 0.8;
                }
                // 显示OUT标签
                const label = document.getElementById(`out-label-${index}`);
                if (label) {
                    label.classList.add('visible');
                    updateLabelPosition(index);
                }
            } else {
                // 恢复正常状态
                if (stand.logoMaterial) {
                    stand.logoMaterial.color.setHex(0xffffff); // 白色
                    stand.logoMaterial.needsUpdate = true;
                }
                // 恢复灰色边框
                if (stand.border) {
                    stand.border.material.color.setHex(0x888888);
                    stand.border.material.opacity = 0.8;
                }
                if (stand.glowBorder) {
                    stand.glowBorder.material.color.setHex(0x666666);
                    stand.glowBorder.material.opacity = 0.4;
                }
                // 隐藏OUT标签
                const label = document.getElementById(`out-label-${index}`);
                if (label) {
                    label.classList.remove('visible');
                }
            }
            
            // 更新按钮状态
            const buttons = document.querySelectorAll('#out-controls .out-btn');
            buttons.forEach((btn, i) => {
                if (i === index && outStates[index]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 更新标签位置
        function updateLabelPosition(index) {
            const stand = stands[index];
            if (!stand) return;
            
            const label = document.getElementById(`out-label-${index}`);
            if (!label) return;
            
            // 将3D坐标转换为2D屏幕坐标（使用logo的中心位置）
            const vector = new THREE.Vector3(stand.position, stand.mesh.position.y || 0, 0);
            vector.project(camera);
            
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
            
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
        }
        
        // 从 SVG 加载纹理
        function loadSVGAsTexture(svgPath, xPosition, standDepth, index, standWidth, standHeight) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // 绘制白色背景（避免透明问题）
                ctx.fillStyle = 'rgba(0, 0, 0, 0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制 SVG 图像
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const texture = new THREE.CanvasTexture(canvas);
                createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight);
            };
            img.src = svgPath;
        }
        
        // 创建 Logo 网格
        function createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight) {
            const logoGeometry = new THREE.PlaneGeometry(standWidth * 0.85, standHeight * 0.85);
            const logoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                opacity: 0.95
            });
            
            const logo = new THREE.Mesh(logoGeometry, logoMaterial);
            logo.position.set(xPosition, 0, standDepth / 2 + 0.01);
            scene.add(logo);
            
            // 保存logo引用到stands数组
            if (stands[index]) {
                stands[index].logo = logo;
                stands[index].logoMaterial = logoMaterial;
            }
            
            // 添加入场动画
            logo.scale.set(0, 0, 0);
            setTimeout(() => {
                animateLogoIn(logo);
            }, index * 300);
        }
        
        // Logo 入场动画
        function animateLogoIn(logo) {
            const targetScale = 1;
            const duration = 1000;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                logo.scale.set(eased * targetScale, eased * targetScale, eased * targetScale);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            update();
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // 镜头控制逻辑
            if (isHeroMode && heroTarget) {
                // 英雄镜头模式：平滑推进到目标位置
                const lerpFactor = 0.05; // 插值速度
                
                camera.position.lerp(heroTarget.position, lerpFactor);
                
                // 平滑调整视角
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt);
                const targetDirection = new THREE.Vector3().subVectors(
                    heroTarget.lookAt, 
                    camera.position
                ).normalize();
                
                // 使用lookAt直接设置视角
                camera.lookAt(heroTarget.lookAt);
            } else if (autoRotateEnabled) {
                // 自动漫游模式：原有的横移动画
                camera.position.x = Math.sin(elapsedTime * 0.15) * 12;
                camera.position.z = 15 + Math.cos(elapsedTime * 0.15) * 3;
                camera.position.y = 2 + Math.sin(elapsedTime * 0.3) * 0.5;
                camera.lookAt(0, 0.5, 0);
            }
            
            // 粒子动画
            if (particles) {
                particles.rotation.y = elapsedTime * 0.03;
                particles.rotation.x = elapsedTime * 0.01;
                
                // 粒子闪烁效果
                const positions = particles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += Math.sin(elapsedTime + positions[i - 1]) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            // 立牌发光效果动画
            stands.forEach((stand, index) => {
                const pulse = Math.sin(elapsedTime * 2 + index * 0.5) * 0.2 + 0.8;
                stand.border.material.opacity = pulse;
                
                const glowPulse = Math.sin(elapsedTime * 1.5 + index * 0.5) * 0.15 + 0.35;
                stand.glowBorder.material.opacity = glowPulse;
                
                // 立牌轻微浮动效果
                stand.mesh.position.y = Math.sin(elapsedTime * 1.5 + index) * 0.1;
                stand.border.position.y = stand.mesh.position.y;
                stand.glowBorder.position.y = stand.mesh.position.y;
            });
            
            // 更新所有OUT标签的位置
            logoList.forEach((logoName, index) => {
                if (outStates[index]) {
                    updateLabelPosition(index);
                }
            });
            
            renderer.render(scene, camera);
        }
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 启动场景
        init();
    </script>
</body>
</html>
