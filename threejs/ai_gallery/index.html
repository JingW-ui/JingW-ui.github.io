<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gallery - Cyberpunk Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading" id="loading">加载中...</div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Logo 列表
        const logoList = ["doubao", "deepseek", "kimi", "yuanbao", "glm", "longcat"];
        
        // 场景初始化
        let scene, camera, renderer;
        let stands = [];
        let particles;
        let clock = new THREE.Clock();
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000033, 0.02);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 15);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
            scene.add(ambientLight);
            
            // 添加方向光
            const directionalLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // 添加点光源（霓虹效果）
            const pointLight1 = new THREE.PointLight(0xff00ff, 2, 50);
            pointLight1.position.set(-10, 5, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x00ffff, 2, 50);
            pointLight2.position.set(10, 5, 0);
            scene.add(pointLight2);
            
            // 添加更多霓虹灯效果
            const pointLight3 = new THREE.PointLight(0xff0080, 1.5, 40);
            pointLight3.position.set(0, 8, -5);
            scene.add(pointLight3);
            
            const pointLight4 = new THREE.PointLight(0x00ff80, 1.5, 40);
            pointLight4.position.set(0, 3, 10);
            scene.add(pointLight4);
            
            // 创建赛博朋克风格的大厅地面
            createCyberFloor();
            
            // 创建粒子效果
            createParticles();
            
            // 创建六个立牌
            createStands();
            
            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            // 开始动画循环
            animate();
        }
        
        // 创建赛博朋克风格的地面
        function createCyberFloor() {
            const geometry = new THREE.PlaneGeometry(100, 100, 20, 20);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a0a2a,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x001133,
                emissiveIntensity: 0.2
            });
            
            const floor = new THREE.Mesh(geometry, material);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 添加网格线效果
            const gridHelper = new THREE.GridHelper(100, 50, 0x00ffff, 0x330066);
            gridHelper.position.y = -1.99;
            scene.add(gridHelper);
        }
        
        // 创建粒子效果
        function createParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 30 - 10;
                positions[i + 2] = (Math.random() - 0.5) * 100;
                
                // 随机颜色（青色、紫色、粉色）
                const colorChoice = Math.random();
                if (colorChoice < 0.33) {
                    colors[i] = 0;     // R
                    colors[i + 1] = 1; // G
                    colors[i + 2] = 1; // B (青色)
                } else if (colorChoice < 0.66) {
                    colors[i] = 1;     // R
                    colors[i + 1] = 0; // G
                    colors[i + 2] = 1; // B (紫色)
                } else {
                    colors[i] = 1;     // R
                    colors[i + 1] = 0; // G
                    colors[i + 2] = 0.5; // B (粉色)
                }
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        // 创建六个立牌
        function createStands() {
            const standWidth = 2;
            const standHeight = 3;
            const standDepth = 0.2;
            const spacing = 4;
            
            for (let i = 0; i < logoList.length; i++) {
                const xPosition = (i - logoList.length / 2 + 0.5) * spacing;
                
                // 立牌主体
                const geometry = new THREE.BoxGeometry(standWidth, standHeight, standDepth);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0a0a1a,
                    roughness: 0.3,
                    metalness: 0.7,
                    emissive: 0x000022,
                    emissiveIntensity: 0.1
                });
                
                const stand = new THREE.Mesh(geometry, material);
                stand.position.set(xPosition, 0, 0);
                stand.castShadow = true;
                stand.receiveShadow = true;
                scene.add(stand);
                
                // 添加发光边框 - 使用EdgesGeometry只显示边缘
                const edgesGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(standWidth, standHeight, standDepth));
                const borderMaterial = new THREE.LineBasicMaterial({
                    color: 0x00ffff,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.8
                });
                
                const border = new THREE.LineSegments(edgesGeometry, borderMaterial);
                border.position.copy(stand.position);
                scene.add(border);
                
                // 添加外发光框
                const glowGeometry = new THREE.BoxGeometry(standWidth + 0.15, standHeight + 0.15, standDepth + 0.05);
                const glowEdges = new THREE.EdgesGeometry(glowGeometry);
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.4
                });
                const glowBorder = new THREE.LineSegments(glowEdges, glowMaterial);
                glowBorder.position.copy(stand.position);
                scene.add(glowBorder);
                
                // 加载 Logo 纹理
                const logoName = logoList[i];
                
                if (logoName === 'glm') {
                    // SVG 文件需要使用 Canvas 渲染
                    loadSVGAsTexture(`assets/${logoName}.svg`, xPosition, standDepth, i, standWidth, standHeight);
                } else {
                    // PNG 文件直接加载
                    let logoPath = `assets/${logoName}.png`;
                    if (logoName === 'deepseek') {
                        logoPath = `assets/seepseek.png`;
                    }
                    
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(logoPath, function(texture) {
                        createLogoMesh(texture, xPosition, standDepth, i, standWidth, standHeight);
                    });
                }
                
                // 保存立牌引用用于动画
                stands.push({
                    mesh: stand,
                    border: border,
                    glowBorder: glowBorder,
                    position: xPosition
                });
            }
        }
        
        // 从 SVG 加载纹理
        function loadSVGAsTexture(svgPath, xPosition, standDepth, index, standWidth, standHeight) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // 绘制白色背景（避免透明问题）
                ctx.fillStyle = 'rgba(0, 0, 0, 0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制 SVG 图像
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const texture = new THREE.CanvasTexture(canvas);
                createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight);
            };
            img.src = svgPath;
        }
        
        // 创建 Logo 网格
        function createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight) {
            const logoGeometry = new THREE.PlaneGeometry(standWidth * 0.85, standHeight * 0.85);
            const logoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                opacity: 0.95
            });
            
            const logo = new THREE.Mesh(logoGeometry, logoMaterial);
            logo.position.set(xPosition, 0, standDepth / 2 + 0.01);
            scene.add(logo);
            
            // 添加入场动画
            logo.scale.set(0, 0, 0);
            setTimeout(() => {
                animateLogoIn(logo);
            }, index * 300);
        }
        
        // Logo 入场动画
        function animateLogoIn(logo) {
            const targetScale = 1;
            const duration = 1000;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                logo.scale.set(eased * targetScale, eased * targetScale, eased * targetScale);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            update();
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // 镜头横移动画 - 更流畅的扫过效果
            camera.position.x = Math.sin(elapsedTime * 0.15) * 12;
            camera.position.z = 15 + Math.cos(elapsedTime * 0.15) * 3;
            camera.position.y = 2 + Math.sin(elapsedTime * 0.3) * 0.5;
            camera.lookAt(0, 0.5, 0);
            
            // 粒子动画
            if (particles) {
                particles.rotation.y = elapsedTime * 0.03;
                particles.rotation.x = elapsedTime * 0.01;
                
                // 粒子闪烁效果
                const positions = particles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += Math.sin(elapsedTime + positions[i - 1]) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            // 立牌发光效果动画
            stands.forEach((stand, index) => {
                const pulse = Math.sin(elapsedTime * 2 + index * 0.5) * 0.2 + 0.8;
                stand.border.material.opacity = pulse;
                
                const glowPulse = Math.sin(elapsedTime * 1.5 + index * 0.5) * 0.15 + 0.35;
                stand.glowBorder.material.opacity = glowPulse;
                
                // 立牌轻微浮动效果
                stand.mesh.position.y = Math.sin(elapsedTime * 1.5 + index) * 0.1;
                stand.border.position.y = stand.mesh.position.y;
                stand.glowBorder.position.y = stand.mesh.position.y;
            });
            
            renderer.render(scene, camera);
        }
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 启动场景
        init();
    </script>
</body>
</html>
