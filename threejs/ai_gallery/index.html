<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gallery - Cyberpunk Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cccccc;
            font-size: 24px;
            text-shadow: 0 0 10px #cccccc;
        }
        /* 英雄镜头控制面板 */
        #hero-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #hero-controls:hover {
            opacity: 0.9;
        }
        .hero-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hero-btn:hover {
            background: rgba(100, 100, 100, 0.8);
            border-color: #999;
            color: #fff;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.5);
        }
        .hero-btn.active {
            background: rgba(150, 150, 150, 0.9);
            border-color: #ccc;
            color: #fff;
        }

        /* OUT按钮样式 */
        .out-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
            color: #777;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .out-btn:hover {
            background: rgba(60, 30, 30, 0.5);
            border-color: #883333;
            color: #aaa;
            box-shadow: 0 0 3px rgba(150, 0, 0, 0.2);
        }
        .out-btn.active {
            background: rgba(80, 35, 35, 0.6);
            border-color: #994444;
            color: #bbb;
        }
        /* 黑板控制面板 */
        #blackboard-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.15;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #blackboard-controls:hover {
            opacity: 0.7;
        }
        .bb-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #555;
            color: #888;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bb-btn:hover {
            background: rgba(80, 80, 80, 0.7);
            border-color: #999;
            color: #ccc;
        }
        .bb-btn.active {
            background: rgba(100, 100, 100, 0.8);
            border-color: #bbb;
            color: #fff;
        }
        /* 答题按钮 */
        #quiz-btn {
            position: fixed;
            bottom: 20px;
            left: 140px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #444;
            color: #6a6;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            opacity: 0.15;
            transition: opacity 0.3s ease, background 0.2s ease;
            z-index: 101;
            pointer-events: auto;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }
        #quiz-btn:hover {
            opacity: 0.75;
            background: rgba(30, 80, 30, 0.6);
            border-color: #6a6;
            color: #8f8;
        }
        #quiz-btn.active {
            background: rgba(100, 100, 100, 0.8);
            border-color: #bbb;
            color: #fff;
        }
        #run-code-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #444;
            color: #6a6;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 10px;
            border-radius: 3px;
            opacity: 0.15;
            transition: opacity 0.3s ease, background 0.2s ease;
            z-index: 101;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            display: none;
        }
        #run-code-btn:hover {
            opacity: 0.75;
            background: rgba(30, 80, 30, 0.6);
            border-color: #6a6;
            color: #8f8;
        }
        #run-code-btn.running {
            color: #a86;
            border-color: #864;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading" id="loading">加载中...</div>
    <div id="hero-controls"></div>
    <div id="out-controls"></div>

    <div id="blackboard-controls"></div>
    <button id="quiz-btn" title="开始答题">📝 答题</button>
    <button id="run-code-btn" title="运行代码">▶ Run</button>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Logo 列表
        const logoList = ["doubao", "deepseek", "kimi", "yuanbao", "glm", "longcat", "qianwen"];
        
        // 场景初始化
        let scene, camera, renderer;
        let stands = [];
        let particles;
        let clock = new THREE.Clock();
        let isHeroMode = false; // 是否处于英雄镜头模式
        let heroTarget = null; // 英雄镜头目标位置
        let autoRotateEnabled = true; // 自动旋转是否启用
        let outStates = {}; // 记录每个logo的OUT状态
        let blackboardMesh = null; // 黑板网格
        let isBlackboardMode = false; // 是否处于黑板视角模式
        let monitorMeshes = []; // 显示器数组（每个logo一个）
        let currentMonitorIndex = -1; // 当前激活的显示器索引
        let isMonitorMode = false; // 是否处于显示器视角模式
        let monitorScrollOffsets = []; // 每个显示器的滚动偏移量
        let monitorScrollTimers = []; // 每个显示器的滚动定时器
        let monitorsVisible = false; // 显示器是否可见
        let monitorAnimations = []; // 显示器动画状态
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 15);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x111111, 0.3);
            scene.add(ambientLight);
            
            // 添加方向光
            const directionalLight = new THREE.DirectionalLight(0xcccccc, 0.6);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // 添加点光源（灰色霓虹效果）
            const pointLight1 = new THREE.PointLight(0xaaaaaa, 1.5, 50);
            pointLight1.position.set(-10, 5, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x999999, 1.5, 50);
            pointLight2.position.set(10, 5, 0);
            scene.add(pointLight2);
            
            // 添加更多灰色霓虹灯效果
            const pointLight3 = new THREE.PointLight(0xbbbbbb, 1, 40);
            pointLight3.position.set(0, 8, -5);
            scene.add(pointLight3);
            
            const pointLight4 = new THREE.PointLight(0x888888, 1, 40);
            pointLight4.position.set(0, 3, 10);
            scene.add(pointLight4);
            
            // 创建赛博朋克风格的大厅地面
            createCyberFloor();
            
            // 创建粒子效果
            createParticles();
            
            // 创建六个立牌
            createStands();
            
            // 创建英雄镜头控制按钮
            createHeroControls();
            
            // 创建OUT控制按钮
            createOutControls();
            
            // 创建黑板
            createBlackboard();
            
            // 创建黑板控制按钮
            createBlackboardControls();
            
            // 创建显示器（每个logo一个）
            createMonitors();
            
            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            // 开始动画循环
            animate();
        }
        
        // 创建赛博朋克风格的地面
        function createCyberFloor() {
            const geometry = new THREE.PlaneGeometry(100, 100, 20, 20);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x111111,
                emissiveIntensity: 0.15
            });
            
            const floor = new THREE.Mesh(geometry, material);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 添加网格线效果
            const gridHelper = new THREE.GridHelper(100, 50, 0x666666, 0x222222);
            gridHelper.position.y = -1.99;
            scene.add(gridHelper);
        }
        
        // 创建粒子效果
        function createParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 30 - 10;
                positions[i + 2] = (Math.random() - 0.5) * 100;
                
                // 随机颜色（灰色系）
                const grayValue = Math.random() * 0.4 + 0.6; // 0.6-1.0
                colors[i] = grayValue;     // R
                colors[i + 1] = grayValue; // G
                colors[i + 2] = grayValue; // B
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        // 创建六个立牌
        function createStands() {
            const standWidth = 2;
            const standHeight = 3;
            const standDepth = 0.2;
            const spacing = 4;
            
            for (let i = 0; i < logoList.length; i++) {
                const xPosition = (i - logoList.length / 2 + 0.5) * spacing;
                
                // 立牌主体
                const geometry = new THREE.BoxGeometry(standWidth, standHeight, standDepth);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0a0a0a,
                    roughness: 0.4,
                    metalness: 0.6,
                    emissive: 0x111111,
                    emissiveIntensity: 0.08
                });
                
                const stand = new THREE.Mesh(geometry, material);
                stand.position.set(xPosition, 0, 0);
                stand.castShadow = true;
                stand.receiveShadow = true;
                scene.add(stand);
                
                // 添加发光边框 - 使用EdgesGeometry只显示边缘
                const edgesGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(standWidth, standHeight, standDepth));
                const borderMaterial = new THREE.LineBasicMaterial({
                    color: 0x888888,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.8
                });
                
                const border = new THREE.LineSegments(edgesGeometry, borderMaterial);
                border.position.copy(stand.position);
                scene.add(border);
                
                // 添加外发光框
                const glowGeometry = new THREE.BoxGeometry(standWidth + 0.15, standHeight + 0.15, standDepth + 0.05);
                const glowEdges = new THREE.EdgesGeometry(glowGeometry);
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: 0x666666,
                    transparent: true,
                    opacity: 0.4
                });
                const glowBorder = new THREE.LineSegments(glowEdges, glowMaterial);
                glowBorder.position.copy(stand.position);
                scene.add(glowBorder);
                
                // 加载 Logo 纹理
                const logoName = logoList[i];
                
                if (logoName === 'glm' || logoName === 'qianwen') {
                    // SVG 文件需要使用 Canvas 渲染
                    loadSVGAsTexture(`assets/${logoName}.svg`, xPosition, standDepth, i, standWidth, standHeight);
                } else {
                    // PNG 文件直接加载
                    let logoPath = `assets/${logoName}.png`;
                    if (logoName === 'deepseek') {
                        logoPath = `assets/seepseek.png`;
                    }
                    
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(logoPath, function(texture) {
                        createLogoMesh(texture, xPosition, standDepth, i, standWidth, standHeight);
                    });
                }
                
                // 保存立牌引用用于动画
                stands.push({
                    mesh: stand,
                    border: border,
                    glowBorder: glowBorder,
                    position: xPosition
                });
                
                // 创建3D OUT标签并保存引用
                const outLabel3D = createOutLabel3D(stand, standWidth, standHeight);
                stands[i].outLabel3D = outLabel3D;
            }
        }
        
        // 创建英雄镜头控制按钮
        function createHeroControls() {
            const container = document.getElementById('hero-controls');
            
            // 为每个logo创建按钮
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'hero-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    activateHeroLens(index);
                });
                
                container.appendChild(btn);
            });
            
            // 添加返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'hero-btn';
            backBtn.textContent = '⟲';
            backBtn.title = '返回自动漫游';
            backBtn.addEventListener('click', () => {
                deactivateHeroLens();
            });
            container.appendChild(backBtn);
        }
        
        // 激活英雄镜头
        function activateHeroLens(index) {
            if (index < 0 || index >= stands.length) return;
            
            isHeroMode = true;
            isMonitorMode = false;
            isBlackboardMode = false;
            autoRotateEnabled = false;
            
            const stand = stands[index];
            const targetX = stand.position;
            
            // 设置目标位置：正对logo，距离适中
            heroTarget = {
                position: new THREE.Vector3(targetX, 1, 6),
                lookAt: new THREE.Vector3(targetX, 0.5, 0)
            };
            
            // 更新按钮状态
            document.querySelectorAll('.hero-btn').forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 取消英雄镜头
        function deactivateHeroLens() {
            isHeroMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            // 清除所有按钮的active状态
            document.querySelectorAll('.hero-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 创建OUT控制按钮
        function createOutControls() {
            const container = document.getElementById('out-controls');
            container.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 150px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                opacity: 0.3;
                transition: opacity 0.3s ease;
                z-index: 100;
            `;
            container.onmouseover = () => container.style.opacity = '0.9';
            container.onmouseout = () => container.style.opacity = '0.3';
            
            // 为每个logo创建OUT按钮和标签
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'out-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    toggleOutState(index);
                });
                
                container.appendChild(btn);
                

            });
        }
        
        // 切换OUT状态
        function toggleOutState(index) {
            if (index < 0 || index >= stands.length) return;
            
            const stand = stands[index];
            outStates[index] = !outStates[index];
            
            if (outStates[index]) {
                // 设置为OUT状态：变灰
                if (stand.logoMaterial) {
                    stand.logoMaterial.color.setHex(0x666666); // 灰色
                    stand.logoMaterial.needsUpdate = true;
                }
                // 添加红色边框效果
                if (stand.border) {
                    stand.border.material.color.setHex(0xff0000);
                    stand.border.material.opacity = 1.0;
                }
                if (stand.glowBorder) {
                    stand.glowBorder.material.color.setHex(0xff3333);
                    stand.glowBorder.material.opacity = 0.8;
                }
                // 显示3D OUT标签
                if (stand.outLabel3D) {
                    stand.outLabel3D.visible = true;
                }
            } else {
                // 恢复正常状态
                if (stand.logoMaterial) {
                    stand.logoMaterial.color.setHex(0xffffff); // 白色
                    stand.logoMaterial.needsUpdate = true;
                }
                // 恢复灰色边框
                if (stand.border) {
                    stand.border.material.color.setHex(0x888888);
                    stand.border.material.opacity = 0.8;
                }
                if (stand.glowBorder) {
                    stand.glowBorder.material.color.setHex(0x666666);
                    stand.glowBorder.material.opacity = 0.4;
                }
                // 隐藏3D OUT标签
                if (stand.outLabel3D) {
                    stand.outLabel3D.visible = false;
                }
            }
            
            // 更新按钮状态
            const buttons = document.querySelectorAll('#out-controls .out-btn');
            buttons.forEach((btn, i) => {
                if (i === index && outStates[index]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 创建3D OUT标签（固定在立牌上）
        function createOutLabel3D(standMesh, standWidth, standHeight) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // 红色背景
            ctx.fillStyle = 'rgba(220, 0, 0, 0.9)';
            const rx = 10, ry = 10, rw = canvas.width - 20, rh = canvas.height - 20, radius = 12;
            ctx.beginPath();
            ctx.moveTo(rx + radius, ry);
            ctx.lineTo(rx + rw - radius, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + radius);
            ctx.lineTo(rx + rw, ry + rh - radius);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - radius, ry + rh);
            ctx.lineTo(rx + radius, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - radius);
            ctx.lineTo(rx, ry + radius);
            ctx.quadraticCurveTo(rx, ry, rx + radius, ry);
            ctx.closePath();
            ctx.fill();
            
            // 红色边框
            ctx.strokeStyle = 'rgba(255, 50, 50, 1)';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 外发光
            ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('OUT', canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(standWidth * 0.6, standHeight * 0.2, 1);
            sprite.position.set(0, standHeight * 0.55, 0.2);
            sprite.visible = false;
            
            // 添加到立牌mesh上，使其随立牌固定在世界坐标
            standMesh.add(sprite);
            return sprite;
        }
        
        // 从 SVG 加载纹理
        function loadSVGAsTexture(svgPath, xPosition, standDepth, index, standWidth, standHeight) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // 绘制白色背景（避免透明问题）
                ctx.fillStyle = 'rgba(0, 0, 0, 0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制 SVG 图像
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const texture = new THREE.CanvasTexture(canvas);
                createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight);
            };
            img.src = svgPath;
        }
        
        // 创建 Logo 网格
        function createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight) {
            const logoGeometry = new THREE.PlaneGeometry(standWidth * 0.85, standHeight * 0.85);
            const logoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                opacity: 0.95
            });
            
            const logo = new THREE.Mesh(logoGeometry, logoMaterial);
            logo.position.set(xPosition, 0, standDepth / 2 + 0.01);
            scene.add(logo);
            
            // 保存logo引用到stands数组
            if (stands[index]) {
                stands[index].logo = logo;
                stands[index].logoMaterial = logoMaterial;
            }
            
            // 添加入场动画
            logo.scale.set(0, 0, 0);
            setTimeout(() => {
                animateLogoIn(logo);
            }, index * 300);
        }
        
        // 创建黑板
        function createBlackboard() {
            // 黑板尺寸
            const boardWidth = 8;
            const boardHeight = 5;
            const boardDepth = 0.15;
            
            // 创建黑板主体 - 使用深绿色模拟真实黑板
            const geometry = new THREE.BoxGeometry(boardWidth, boardHeight, boardDepth);
            const material = new THREE.MeshStandardMaterial({
                color: 0x1a3d1a,
                roughness: 0.85,
                metalness: 0.05,
                emissive: 0x0a1f0a,
                emissiveIntensity: 0.1
            });
            
            blackboardMesh = new THREE.Mesh(geometry, material);
            // 放置在摄像头后面（z轴负方向），高度适中

        time.sleep(1)

def _detect_indent_size(lines):
    indents = set()
    for line in lines:
        stripped = line.lstrip(' ')
        indent = len(line) - len(stripped)
        if indent > 0 and stripped:
            indents.add(indent)
    return min(indents) if indents else 4


def _predict_next_indent(line, current_indent, indent_size):
    content = line.rstrip()
    stripped = content.strip()
    if content.endswith(':'):
        return current_indent + indent_size
    dedent_words = ('pass', 'break', 'continue', 'return', 'raise')
    if stripped in dedent_words or stripped.startswith(('return ', 'raise ')):

    return current_indent

def _nearby_key(char):

            for (let i = startLine; i < endLine; i++) {
                const y = startY + (i * lineHeight) - scrollOffset;
                if (y < startY - lineHeight || y > canvas.height - 10) continue;
                        
                ctx.fillStyle = '#484f58';
                ctx.fillText(String(i + 1).padStart(3), 10, y);
                        
                // 简单语法高亮
                const line = codeLines[i];
                if (line.trim().startsWith('#') || line.trim().startsWith('"""') || line.trim().startsWith("'''")) {
                    ctx.fillStyle = '#8b949e';
                } else if (line.includes('def ') || line.includes('class ') || line.includes('import ') || line.includes('from ')) {
                    ctx.fillStyle = '#ff7b72';
                } else if (line.includes('if ') || line.includes('else') || line.includes('for ') || line.includes('while ') || line.includes('return ') || line.includes('try:') || line.includes('except')) {
                    ctx.fillStyle = '#ff7b72';
                } else {
                    ctx.fillStyle = '#c9d1d9';
                }
                        
                ctx.fillText(line, 55, y);
            }
                    
            return canvas;
        }
        
        // 更新指定显示器的代码滚动
        function updateMonitorScroll(monitorIndex, scrollOffset) {
            if (!monitorMeshes[monitorIndex]) return;
            const monitor = monitorMeshes[monitorIndex];
            monitor.scrollOffset = scrollOffset;
            
            const newCanvas = createCodeScreen(4.5, 3.0, monitor.codeContent, logoList[monitorIndex], scrollOffset);
            const newTexture = new THREE.CanvasTexture(newCanvas);
            newTexture.minFilter = THREE.LinearFilter;
            
            monitor.screenPlane.material.map = newTexture;
            monitor.screenPlane.material.needsUpdate = true;
            monitor.texture = newTexture;
        }
        
        // 创建黑板控制按钮
        function createBlackboardControls() {
            const container = document.getElementById('blackboard-controls');
            
            // 查看黑板按钮
            const viewBtn = document.createElement('button');
            viewBtn.className = 'bb-btn';
            viewBtn.textContent = '📋 黑板';
            viewBtn.title = '查看黑板任务';
            
            viewBtn.addEventListener('click', () => {
                activateBlackboardView();
            });
            
            container.appendChild(viewBtn);
            
            // 显示器按钮组（每个logo一个）
            const monitorScrollContainer = document.createElement('div');
            monitorScrollContainer.style.cssText = 'margin-top: 5px; display: flex; flex-direction: column; gap: 4px;';
            monitorScrollContainer.id = 'monitor-scroll-controls';
            
            logoList.forEach((logoName, index) => {
                const monitorBtn = document.createElement('button');
                monitorBtn.className = 'bb-btn';
                monitorBtn.textContent = `🖥 ${logoName}`;
                monitorBtn.title = `查看 ${logoName} 的代码`;
                monitorBtn.addEventListener('click', () => {
                    if (monitorsVisible) {
                        activateMonitorView(index);
                    }
                });
                container.appendChild(monitorBtn);
            });
            
            // 返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'bb-btn';
            backBtn.textContent = '⟲';
            backBtn.title = '返回自动漫游';
            
            backBtn.addEventListener('click', () => {
                deactivateBlackboardView();
                deactivateMonitorView();
            });
            
            container.appendChild(backBtn);
        }
        
        // 激活黑板视角
        function activateBlackboardView() {
            if (!blackboardMesh) return;
            
            isBlackboardMode = true;
            isMonitorMode = false;
            isHeroMode = false;
            autoRotateEnabled = false;
            
            // 设置目标位置：扭转到摄像头后面查看黑板
            heroTarget = {
                position: new THREE.Vector3(0, 1.5, 20),
                lookAt: new THREE.Vector3(0, 1.5, 24)
            };
            
            // 更新按钮状态
            document.querySelectorAll('.bb-btn').forEach(btn => {
                if (btn.textContent.includes('黑板')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 取消黑板视角
        function deactivateBlackboardView() {
            isBlackboardMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 激活显示器视角
        function activateMonitorView(index) {
            if (!monitorMeshes[index] || !monitorsVisible) return;
            
            currentMonitorIndex = index;
            isMonitorMode = true;
            isBlackboardMode = false;
            isHeroMode = false;
            autoRotateEnabled = false;
            
            const monitor = monitorMeshes[index];
            
            // 相机推进到显示器正前方（z方向靠近）
            heroTarget = {
                position: new THREE.Vector3(monitor.mesh.position.x, monitor.mesh.position.y, monitor.mesh.position.z + 3),
                lookAt: monitor.mesh.position.clone()
            };
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                if (btn.textContent.includes(logoList[index])) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        
        // 取消显示器视角
        function deactivateMonitorView() {
            isMonitorMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 更新运行按钮位置（跟随当前激活显示器右下角）
        function updateRunButtonPosition() {
            if (!monitorsVisible || currentMonitorIndex < 0 || !monitorMeshes[currentMonitorIndex]) {
                document.getElementById('run-code-btn').style.display = 'none';
                return;
            }
            
            const monitor = monitorMeshes[currentMonitorIndex];
            const runBtn = document.getElementById('run-code-btn');
            
            const mWidth = 4.5, mHeight = 3.0;
            const localCorner = new THREE.Vector3(mWidth / 2, -mHeight / 2, 0.07);
            const worldCorner = localCorner.applyMatrix4(monitor.mesh.matrixWorld);
            
            const vector = worldCorner.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
            
            if (vector.z < 1 && x > -100 && x < window.innerWidth + 100 && y > -100 && y < window.innerHeight + 100) {
                runBtn.style.display = 'block';
                runBtn.style.left = (x - 60) + 'px';
                runBtn.style.top = (y + 4) + 'px';
            } else {
                runBtn.style.display = 'none';
            }
        }
        
        // Logo 入场动画
        function animateLogoIn(logo) {
            const targetScale = 1;
            const duration = 1000;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                logo.scale.set(eased * targetScale, eased * targetScale, eased * targetScale);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            update();
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // 镜头控制逻辑
            if ((isBlackboardMode || isMonitorMode) && heroTarget) {
                // 黑板/显示器视角模式：平滑推进
                const lerpFactor = 0.05;
                camera.position.lerp(heroTarget.position, lerpFactor);
                
                // 平滑调整视角方向
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt);
                const targetDirection = new THREE.Vector3().subVectors(
                    heroTarget.lookAt, 
                    camera.position
                ).normalize();
                
                // 使用球面插值平滑旋转视角
                const currentQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(currentQuaternion);
                
                const targetQuaternion = new THREE.Quaternion();
                const targetCamera = new THREE.Camera();
                targetCamera.position.copy(camera.position);
                targetCamera.lookAt(heroTarget.lookAt);
                targetCamera.getWorldQuaternion(targetQuaternion);
                
                currentQuaternion.slerp(targetQuaternion, lerpFactor);
                camera.quaternion.copy(currentQuaternion);
            } else if (isHeroMode && heroTarget) {
                // 英雄镜头模式：平滑推进到目标位置
                const lerpFactor = 0.05; // 插值速度
                
                camera.position.lerp(heroTarget.position, lerpFactor);
                
                // 平滑调整视角
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt);
                const targetDirection = new THREE.Vector3().subVectors(
                    heroTarget.lookAt, 
                    camera.position
                ).normalize();
                
                // 使用lookAt直接设置视角
                camera.lookAt(heroTarget.lookAt);
            } else if (autoRotateEnabled) {
                // 自动漫游模式：原有的横移动画
                camera.position.x = Math.sin(elapsedTime * 0.15) * 12;
                camera.position.z = 15 + Math.cos(elapsedTime * 0.15) * 3;
                camera.position.y = 2 + Math.sin(elapsedTime * 0.3) * 0.5;
                camera.lookAt(0, 0.5, 0);
            }
            
            // 粒子动画
            if (particles) {
                particles.rotation.y = elapsedTime * 0.03;
                particles.rotation.x = elapsedTime * 0.01;
                
                // 粒子闪烁效果
                const positions = particles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += Math.sin(elapsedTime + positions[i - 1]) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            // 立牌发光效果动画
            stands.forEach((stand, index) => {
                const pulse = Math.sin(elapsedTime * 2 + index * 0.5) * 0.2 + 0.8;
                stand.border.material.opacity = pulse;
                
                const glowPulse = Math.sin(elapsedTime * 1.5 + index * 0.5) * 0.15 + 0.35;
                stand.glowBorder.material.opacity = glowPulse;
            });
            

            
            // 更新运行按钮位置
            updateRunButtonPosition();
            
            renderer.render(scene, camera);
        }
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 答题按钮点击事件
        document.getElementById('quiz-btn').addEventListener('click', function() {
            const btn = this;
            if (monitorsVisible) {
                // 隐藏显示器
                hideMonitors();
                btn.classList.remove('active');
                btn.textContent = '📝 答题';
            } else {
                // 显示显示器（蒙太奇动画）
                showMonitorsWithAnimation();
                btn.classList.add('active');
                btn.textContent = '📝 收起';
            }
        });
        
        // 显示显示器（蒙太奇动画）
        function showMonitorsWithAnimation() {
            monitorsVisible = true;
            
            monitorMeshes.forEach((monitor, index) => {
                const anim = monitorAnimations[index];
                anim.visible = true;
                anim.animating = true;
                anim.targetOpacity = 1;
                anim.targetScale = 1;
                
                // 延迟启动每个显示器的动画
                setTimeout(() => {
                    monitor.mesh.visible = true;
                    monitor.screenPlane.visible = true;
                    animateMonitorIn(index);
                }, index * 200);
            });
        }
        
        // 隐藏显示器
        function hideMonitors() {
            monitorsVisible = false;
            
            monitorMeshes.forEach((monitor, index) => {
                const anim = monitorAnimations[index];
                anim.visible = false;
                anim.animating = true;
                anim.targetOpacity = 0;
                anim.targetScale = 0;
                
                // 延迟隐藏每个显示器
                setTimeout(() => {
                    animateMonitorOut(index);
                }, index * 100);
            });
        }
        
        // 显示器进入动画（蒙太奇效果）
        function animateMonitorIn(index) {
            const monitor = monitorMeshes[index];
            const anim = monitorAnimations[index];
            const duration = 800;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                
                // 更新透明度和缩放
                anim.opacity = eased * anim.targetOpacity;
                anim.scale = eased * anim.targetScale;
                
                monitor.mesh.scale.set(anim.scale, anim.scale, anim.scale);
                monitor.screenPlane.material.opacity = anim.opacity;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    anim.animating = false;
                }
            }
            
            update();
        }
        
        // 显示器退出动画
        function animateMonitorOut(index) {
            const monitor = monitorMeshes[index];
            const anim = monitorAnimations[index];
            const duration = 600;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                
                // 更新透明度和缩放
                anim.opacity = (1 - eased) * anim.targetOpacity;
                anim.scale = (1 - eased) * anim.targetScale;
                
                monitor.mesh.scale.set(anim.scale, anim.scale, anim.scale);
                monitor.screenPlane.material.opacity = anim.opacity;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    monitor.mesh.visible = false;
                    monitor.screenPlane.visible = false;
                    anim.animating = false;
                }
            }
            
            update();
        }
        // 运行按钮点击事件
        document.getElementById('run-code-btn').addEventListener('click', function() {
            const btn = this;
            if (btn.classList.contains('running')) return;
            btn.classList.add('running');
            btn.textContent = '⏳ Running...';
            setTimeout(() => {
                btn.classList.remove('running');
                btn.textContent = '▶ Run';
            }, 3000);
        });
        
        // 鼠标滚轮滚动代码
        window.addEventListener('wheel', function(e) {
            if (!monitorsVisible || !isMonitorMode || currentMonitorIndex < 0) return;
            
            const monitor = monitorMeshes[currentMonitorIndex];
            if (!monitor) return;
            
            // 滚动步长
            const scrollStep = 30;
            monitor.scrollOffset += e.deltaY > 0 ? scrollStep : -scrollStep;
            
            // 限制滚动范围
            const codeLines = monitor.codeContent.split('\n');
            const lineHeight = 28;
            const maxScroll = Math.max(0, codeLines.length * lineHeight - 580);
            monitor.scrollOffset = Math.max(0, Math.min(monitor.scrollOffset, maxScroll));
            
            // 更新显示
            updateMonitorScroll(currentMonitorIndex, monitor.scrollOffset);
        });
        
        // 启动场景
        init();
    </script>
</body>
