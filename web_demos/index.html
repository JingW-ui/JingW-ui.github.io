<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目导航 - Web演示集</title>

    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #D4AF37;
            --dark-brown: #2C1810;
            --light-cream: #F5F5DC;
            --accent-red: #8B0000;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary-gold);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transform: translateX(-100%);
            transition: var(--transition);
        }

        .project-card:hover::before {
            transform: translateX(100%);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3);
            border-color: var(--primary-gold);
        }

        .project-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            display: block;
            text-align: center;
        }

        .project-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-gold);
        }

        .project-description {
            font-size: 1rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 1.5rem;
        }

        .project-features {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .project-features li {
            padding: 0.3rem 0;
            color: #bbb;
            font-size: 0.9rem;
        }

        .project-features li::before {
            content: '•';
            color: var(--primary-gold);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .enter-btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--primary-gold), #B8860B);
            color: var(--dark-brown);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.4);
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .project-card {
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        .project-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .project-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Web演示项目集</h1>
            <p class="subtitle">精心打造的多媒体互动体验项目，融合传统文化与现代技术，带来沉浸式的数字艺术享受</p>
        </header>

        <main class="projects-grid">
            <a href="/web_demos/godfather/" class="project-card">
                <div class="project-icon">🎬</div>
                <h2 class="project-title">教父三部曲研究</h2>
                <p class="project-description">深入探索电影史上的经典之作《教父》三部曲，通过互动式界面了解角色关系、经典场景和深度分析。</p>
                <ul class="project-features">
                    <li>角色画廊与关系图谱</li>
                    <li>经典场景回顾</li>
                    <li>互动问答测试</li>
                    <li>电影艺术分析</li>
                </ul>
                <span class="enter-btn">进入项目</span>
            </a>

            <a href="/web_demos/kouji/" class="project-card">
                <div class="project-icon">🎭</div>
                <h2 class="project-title">口技十景</h2>
                <p class="project-description">戴敦邦国画风互动体验，结合传统口技艺术与古典绘画，配以精心编排的音频，重现古典文学魅力。</p>
                <ul class="project-features">
                    <li>国画风格场景展示</li>
                    <li>传统口技音频体验</li>
                    <li>文学典故解读</li>
                    <li>沉浸式文化体验</li>
                </ul>
                <span class="enter-btn">进入项目</span>
            </a>
        </main>

        <footer class="footer">
            <p>© 2024 Web演示项目集 - 传承经典，创新体验</p>
        </footer>
    </div>
</body>
</html>
