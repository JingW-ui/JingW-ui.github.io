<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gallery - Cyberpunk Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cccccc;
            font-size: 24px;
            text-shadow: 0 0 10px #cccccc;
        }
        /* 英雄镜头控制面板 */
        #hero-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #hero-controls:hover {
            opacity: 0.9;
        }
        .hero-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hero-btn:hover {
            background: rgba(100, 100, 100, 0.8);
            border-color: #999;
            color: #fff;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.5);
        }
        .hero-btn.active {
            background: rgba(150, 150, 150, 0.9);
            border-color: #ccc;
            color: #fff;
        }

        /* OUT按钮样式 */
        .out-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
            color: #777;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .out-btn:hover {
            background: rgba(60, 30, 30, 0.5);
            border-color: #883333;
            color: #aaa;
            box-shadow: 0 0 3px rgba(150, 0, 0, 0.2);
        }
        .out-btn.active {
            background: rgba(80, 35, 35, 0.6);
            border-color: #994444;
            color: #bbb;
        }
        /* 黑板控制面板 */
        #blackboard-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.15;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        #blackboard-controls:hover {
            opacity: 0.7;
        }
        .bb-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #555;
            color: #888;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bb-btn:hover {
            background: rgba(80, 80, 80, 0.7);
            border-color: #999;
            color: #ccc;
        }
        .bb-btn.active {
            background: rgba(100, 100, 100, 0.8);
            border-color: #bbb;
            color: #fff;
        }
        /* 答题按钮 */
        #quiz-btn {
            position: fixed;
            bottom: 20px;
            left: 140px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #444;
            color: #6a6;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            opacity: 0.15;
            transition: opacity 0.3s ease, background 0.2s ease;
            z-index: 101;
            pointer-events: auto;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }
        #quiz-btn:hover {
            opacity: 0.75;
            background: rgba(30, 80, 30, 0.6);
            border-color: #6a6;
            color: #8f8;
        }
        #quiz-btn.active {
            background: rgba(100, 100, 100, 0.8);
            border-color: #bbb;
            color: #fff;
        }
        #run-code-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #444;
            color: #6a6;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 10px;
            border-radius: 3px;
            opacity: 0.15;
            transition: opacity 0.3s ease, background 0.2s ease;
            z-index: 101;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            display: none;
        }
        #run-code-btn:hover {
            opacity: 0.75;
            background: rgba(30, 80, 30, 0.6);
            border-color: #6a6;
            color: #8f8;
        }
        #run-code-btn.running {
            color: #a86;
            border-color: #864;
        }
        /* 黑板右下角隐蔽更新按钮 */
        #update-prompt-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #333;
            color: #555;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            opacity: 0.08;
            transition: opacity 0.3s ease;
            z-index: 102;
            pointer-events: auto;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            display: none;
        }
        #update-prompt-btn:hover {
            opacity: 0.6;
            background: rgba(60, 60, 60, 0.5);
            border-color: #777;
            color: #aaa;
        }
        #update-prompt-btn.updated {
            color: #6a6;
            border-color: #4a4;
        }
        /* 黑板右下角复制按钮 */
        #copy-blackboard-btn {
            position: fixed;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #333;
            color: #555;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            opacity: 0.08;
            transition: opacity 0.3s ease;
            z-index: 102;
            pointer-events: auto;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            display: none;
        }
        #copy-blackboard-btn:hover {
            opacity: 0.6;
            background: rgba(60, 60, 60, 0.5);
            border-color: #777;
            color: #aaa;
        }
        #copy-blackboard-btn.copied {
            color: #6a6;
            border-color: #4a4;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="loading" id="loading">加载中...</div>
    <div id="hero-controls"></div>
    <div id="out-controls"></div>

    <div id="blackboard-controls"></div>
    <button id="quiz-btn" title="开始答题">📝 答题</button>
    <button id="run-code-btn" title="运行代码">▶ Run</button>
    <button id="update-prompt-btn" title="更新提示词">更新</button>
    <button id="copy-blackboard-btn" title="复制黑板内容">复制</button>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Logo 列表
        const logoList = ["doubao", "deepseek", "kimi", "yuanbao", "glm", "longcat", "qianwen"];
        
        // 场景初始化
        let scene, camera, renderer;
        let stands = [];
        let particles;
        let clock = new THREE.Clock();
        let isHeroMode = false; // 是否处于英雄镜头模式
        let heroTarget = null; // 英雄镜头目标位置
        let autoRotateEnabled = true; // 自动旋转是否启用
        let outStates = {}; // 记录每个logo的OUT状态
        let blackboardMesh = null; // 黑板网格
        let isBlackboardMode = false; // 是否处于黑板视角模式
        let monitorMeshes = []; // 显示器数组（每个logo一个）
        let currentMonitorIndex = -1; // 当前激活的显示器索引
        let isMonitorMode = false; // 是否处于显示器视角模式
        let monitorScrollOffsets = []; // 每个显示器的滚动偏移量
        let monitorScrollTimers = []; // 每个显示器的滚动定时器
        let monitorsVisible = false; // 显示器是否可见
        let monitorAnimations = []; // 显示器动画状态
        let blackboardPromptVersion = 0; // 0=原始提示词, 1=更新后提示词
        let blackboardTextPlane = null; // 黑板文字平面引用
        let blackboardCanvas = null; // 黑板画布引用
        let blackboardDims = {}; // 黑板尺寸
        let codes2Map = {}; // codes2目录的代码内容映射
        let codes2Loaded = false; // codes2是否已加载完成
        // Dolly Zoom (希区柯克变焦) 状态
        let isDollyZooming = false;       // 是否正在执行 Dolly Zoom
        let dollyZoomStartTime = 0;       // 动画开始时间
        let dollyZoomDuration = 2000;     // 动画持续时间(ms)
        let dollyZoomStartPos = null;     // 起始相机位置
        let dollyZoomTargetPos = null;    // 目标相机位置
        let dollyZoomStartFov = 75;       // 起始 FOV
        let dollyZoomEndFov = 75;         // 结束 FOV
        let dollyZoomLookAt = null;       // 注视目标点
        let dollyZoomOutIndex = -1;       // Dolly Zoom 完成后需要应用 OUT 视觉效果的索引
        
        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 15);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x111111, 0.3);
            scene.add(ambientLight);
            
            // 添加方向光
            const directionalLight = new THREE.DirectionalLight(0xcccccc, 0.6);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // 添加点光源（灰色霓虹效果）
            const pointLight1 = new THREE.PointLight(0xaaaaaa, 1.5, 50);
            pointLight1.position.set(-10, 5, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x999999, 1.5, 50);
            pointLight2.position.set(10, 5, 0);
            scene.add(pointLight2);
            
            // 添加更多灰色霓虹灯效果
            const pointLight3 = new THREE.PointLight(0xbbbbbb, 1, 40);
            pointLight3.position.set(0, 8, -5);
            scene.add(pointLight3);
            
            const pointLight4 = new THREE.PointLight(0x888888, 1, 40);
            pointLight4.position.set(0, 3, 10);
            scene.add(pointLight4);
            
            // 创建赛博朋克风格的大厅地面
            createCyberFloor();
            
            // 创建粒子效果
            createParticles();
            
            // 创建六个立牌
            createStands();
            
            // 创建英雄镜头控制按钮
            createHeroControls();
            
            // 创建OUT控制按钮
            createOutControls();
            
            // 创建黑板
            createBlackboard();
            
            // 创建黑板控制按钮
            createBlackboardControls();
            
            // 创建显示器（每个logo一个）
            createMonitors();
            
            // 异步加载codes2代码
            loadCodes2();
            
            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
            
            // 开始动画循环
            animate();
        }
        
        // 创建赛博朋克风格的地面
        function createCyberFloor() {
            const geometry = new THREE.PlaneGeometry(100, 100, 20, 20);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x111111,
                emissiveIntensity: 0.15
            });
            
            const floor = new THREE.Mesh(geometry, material);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 添加网格线效果
            const gridHelper = new THREE.GridHelper(100, 50, 0x666666, 0x222222);
            gridHelper.position.y = -1.99;
            scene.add(gridHelper);
        }
        
        // 创建粒子效果
        function createParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 30 - 10;
                positions[i + 2] = (Math.random() - 0.5) * 100;
                
                // 随机颜色（灰色系）
                const grayValue = Math.random() * 0.4 + 0.6; // 0.6-1.0
                colors[i] = grayValue;     // R
                colors[i + 1] = grayValue; // G
                colors[i + 2] = grayValue; // B
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        // 创建六个立牌
        function createStands() {
            const standWidth = 2;
            const standHeight = 3;
            const standDepth = 0.2;
            const spacing = 4;
            
            for (let i = 0; i < logoList.length; i++) {
                const xPosition = (i - logoList.length / 2 + 0.5) * spacing;
                
                // 立牌主体
                const geometry = new THREE.BoxGeometry(standWidth, standHeight, standDepth);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x0a0a0a,
                    roughness: 0.4,
                    metalness: 0.6,
                    emissive: 0x111111,
                    emissiveIntensity: 0.08,
                    transparent: true,
                    opacity: 1
                });
                
                const stand = new THREE.Mesh(geometry, material);
                stand.position.set(xPosition, 0, 0);
                stand.castShadow = true;
                stand.receiveShadow = true;
                scene.add(stand);
                
                // 添加发光边框 - 使用EdgesGeometry只显示边缘
                const edgesGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(standWidth, standHeight, standDepth));
                const borderMaterial = new THREE.LineBasicMaterial({
                    color: 0x888888,
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.8
                });
                
                const border = new THREE.LineSegments(edgesGeometry, borderMaterial);
                border.position.copy(stand.position);
                scene.add(border);
                
                // 添加外发光框
                const glowGeometry = new THREE.BoxGeometry(standWidth + 0.15, standHeight + 0.15, standDepth + 0.05);
                const glowEdges = new THREE.EdgesGeometry(glowGeometry);
                const glowMaterial = new THREE.LineBasicMaterial({
                    color: 0x666666,
                    transparent: true,
                    opacity: 0.4
                });
                const glowBorder = new THREE.LineSegments(glowEdges, glowMaterial);
                glowBorder.position.copy(stand.position);
                scene.add(glowBorder);
                
                // 加载 Logo 纹理
                const logoName = logoList[i];
                
                if (logoName === 'glm' || logoName === 'qianwen') {
                    // SVG 文件需要使用 Canvas 渲染
                    loadSVGAsTexture(`assets/${logoName}.svg`, xPosition, standDepth, i, standWidth, standHeight);
                } else {
                    // PNG 文件直接加载
                    let logoPath = `assets/${logoName}.png`;
                    if (logoName === 'deepseek') {
                        logoPath = `assets/seepseek.png`;
                    }
                    
                    const textureLoader = new THREE.TextureLoader();
                    textureLoader.load(logoPath, function(texture) {
                        createLogoMesh(texture, xPosition, standDepth, i, standWidth, standHeight);
                    });
                }
                
                // 保存立牌引用用于动画
                stands.push({
                    mesh: stand,
                    border: border,
                    glowBorder: glowBorder,
                    position: xPosition
                });
                
                // 创建3D OUT标签并保存引用
                const outLabel3D = createOutLabel3D(stand, standWidth, standHeight);
                stands[i].outLabel3D = outLabel3D;
            }
        }
        
        // 创建英雄镜头控制按钮
        function createHeroControls() {
            const container = document.getElementById('hero-controls');
            
            // 为每个logo创建按钮
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'hero-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    activateHeroLens(index);
                });
                
                container.appendChild(btn);
            });
            
            // 添加返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'hero-btn';
            backBtn.textContent = '⟲';
            backBtn.title = '返回自动漫游';
            backBtn.addEventListener('click', () => {
                deactivateHeroLens();
            });
            container.appendChild(backBtn);
        }
        
        // 激活英雄镜头
        function activateHeroLens(index) {
            if (index < 0 || index >= stands.length) return;
            
            isHeroMode = true;
            isMonitorMode = false;
            isBlackboardMode = false;
            autoRotateEnabled = false;
            
            const stand = stands[index];
            const targetX = stand.position;
            
            // 设置目标位置：正对logo，距离适中
            heroTarget = {
                position: new THREE.Vector3(targetX, 1, 6),
                lookAt: new THREE.Vector3(targetX, 0.5, 0)
            };
            
            // 更新按钮状态
            document.querySelectorAll('.hero-btn').forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 取消英雄镜头
        function deactivateHeroLens() {
            isHeroMode = false;
            isDollyZooming = false; // 同步取消未完成的 dolly zoom
            autoRotateEnabled = true;
            heroTarget = null;
            // 恢复默认 FOV（Dolly Zoom 会修改 FOV，需重置）
            camera.fov = 75;
            camera.updateProjectionMatrix();
            
            // 清除所有按钮的active状态
            document.querySelectorAll('.hero-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 创建OUT控制按钮
        function createOutControls() {
            const container = document.getElementById('out-controls');
            container.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 150px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                opacity: 0.3;
                transition: opacity 0.3s ease;
                z-index: 100;
            `;
            container.onmouseover = () => container.style.opacity = '0.9';
            container.onmouseout = () => container.style.opacity = '0.3';
            
            // 为每个logo创建OUT按钮和标签
            logoList.forEach((logoName, index) => {
                const btn = document.createElement('button');
                btn.className = 'out-btn';
                btn.textContent = logoName;
                btn.dataset.index = index;
                
                btn.addEventListener('click', () => {
                    toggleOutState(index);
                });
                
                container.appendChild(btn);
                

            });
        }
        
        // 切换OUT状态
        function toggleOutState(index) {
            if (index < 0 || index >= stands.length) return;
            
            const stand = stands[index];
            outStates[index] = !outStates[index];
            
            if (outStates[index]) {
                // 不立即应用视觉变化，等 Dolly Zoom 完成后再渐入显示
                // 记录索引，Dolly Zoom 完成后会读取
                dollyZoomOutIndex = index;
                // 触发 Dolly Zoom 效果
                startDollyZoom(index);
            } else {
                // 恢复正常状态
                stand.isShattering = false;
                stand.isProgressiveShattering = false;
                // 隐藏裂纹线
                if (stand.crackLines) stand.crackLines.forEach(cl => { cl.visible = false; });
                // 碎片复原动画（飞回拼合 + 交叉淡入原始画框）
                if (stand.fragments && stand.fragments.length > 0) {
                    animateShatterReset(stand, index);
                } else {
                    // 没有碎片，直接恢复
                    restoreLogoMaterials(stand);
                }
                // 边框渐变为灰色（延迟恢复）
                if (stand.border) {
                    stand.border.material.color.setHex(0x888888);
                    stand.border.material.opacity = 0.8;
                }
                if (stand.glowBorder) {
                    stand.glowBorder.material.color.setHex(0x666666);
                    stand.glowBorder.material.opacity = 0.4;
                }
                // 隐藏 OUT 标签
                if (stand.outLabel3D) {
                    stand.outLabel3D.visible = false;
                }
            }
            
            // 更新按钮状态
            const buttons = document.querySelectorAll('#out-controls .out-btn');
            buttons.forEach((btn, i) => {
                if (i === index && outStates[index]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 希区柯克变焦（Dolly Zoom / Vertigo Shot）
        // 左右位置跳切（直接到位），仅前后移动镜头 + FOV 变化
        function startDollyZoom(index) {
            const stand = stands[index];
            if (!stand) return;

            // 禁用其他镜头模式
            autoRotateEnabled = false;
            isHeroMode = false;
            isMonitorMode = false;
            isBlackboardMode = false;

            const standX = stand.position;
            const lookAtPos = new THREE.Vector3(standX, 0, 0);

            // Hero 镜头标准位置（用作 dolly zoom 的目标终点）
            const heroPos = new THREE.Vector3(standX, 1, 6);

            // 左右位置直接跳切：立即将相机 X/Y 对齐目标
            camera.position.x = standX;
            camera.position.y = heroPos.y;
            camera.lookAt(lookAtPos);

            // 确保足够的运动距离：起始距离至少为 18（远处长焦），制造强烈透视畸变效果
            const minStartDist = 18;
            const currentDist = camera.position.distanceTo(lookAtPos);
            if (currentDist < minStartDist) {
                // 相机太近，强制拉远到 minStartDist 的距离
                // 计算需要的 Z 值：dist² = (y-0)² + (z-0)² => z = sqrt(dist² - y²)
                const y = camera.position.y;
                const neededZ = Math.sqrt(minStartDist * minStartDist - y * y);
                camera.position.z = neededZ;
                camera.lookAt(lookAtPos);
            }

            const startPos = camera.position.clone();
            const startDist = startPos.distanceTo(lookAtPos);
            const targetDist = heroPos.distanceTo(lookAtPos); // ≈ 6.08

            // 使用默认 FOV 75° 作为起始值（远处标准视角）
            const startFov = 75;
            camera.fov = startFov;
            camera.updateProjectionMatrix();

            // 根据 Dolly Zoom 公式: tan(fov/2) ∝ 1/d
            // 保持主体可视高度 h 不变: h = d × tan(fov/2) = 常数
            const h = startDist * Math.tan((startFov / 2) * Math.PI / 180);

            // 目标 FOV = 2 × atan(h / targetDist)
            let endFov = 2 * Math.atan(h / targetDist) * 180 / Math.PI;
            // 限制 FOV 在合理范围内（最大不超过 120°）
            endFov = Math.min(Math.max(endFov, 40), 120);

            // 设置动画参数
            isDollyZooming = true;
            dollyZoomStartTime = performance.now();
            dollyZoomStartPos = startPos;
            dollyZoomTargetPos = heroPos;
            dollyZoomStartFov = startFov;
            dollyZoomEndFov = endFov;
            dollyZoomLookAt = lookAtPos;
        }

        // OUT 渐进式三阶段破碎动画
        // 阶段1: 裂纹出现 (0~1200ms)
        // 阶段2: 碎片分离 (1200~2400ms)
        // 阶段3: 散落漂浮 (2400~4500ms)
        function animateOutAppear(index) {
            const stand = stands[index];
            if (!stand) return;

            if (stand.logoMaterial) stand.logoMaterial.color.setHex(0xffffff);
            if (stand.logoMaterialRight) stand.logoMaterialRight.color.setHex(0xffffff);
            if (stand.border) stand.border.material.opacity = 0;
            if (stand.glowBorder) stand.glowBorder.material.opacity = 0;

            if (!stand.fragments || stand.fragments.length === 0) createShatterFragments(index);
            if (stand.fragmentGroup) stand.fragmentGroup.visible = false;
            if (stand.crackLines) stand.crackLines.forEach(cl => { cl.visible = false; cl.material.opacity = 0; });
            if (stand.outLabel3D) { stand.outLabel3D.visible = false; stand.outLabel3D.material.opacity = 0; }

            stand.shatterStartTime = performance.now();
            animateProgressiveShatter(index);
        }

        // 渐进式破碎动画控制器（3阶段）
        function animateProgressiveShatter(index) {
            const stand = stands[index];
            if (!stand || !outStates[index]) return;
            if (stand.isProgressiveShattering) return;
            stand.isProgressiveShattering = true;

            const PHASE1_END = 1200, PHASE2_END = 2400, PHASE3_END = 4500;
            const baseStartTime = stand.shatterStartTime;
            const outLabelBaseScale = stand.outLabel3D ? stand.outLabel3D.scale.clone() : null;
            let lastTime = baseStartTime;

            // 阶段1 初始化：隐藏原始对象，显示碎片
            if (stand.logo) stand.logo.visible = false;
            if (stand.mesh) stand.mesh.material.opacity = 0.03;
            if (stand.fragmentGroup) {
                stand.fragmentGroup.visible = true;
                stand.fragments.forEach(frag => {
                    frag.mesh.position.copy(frag.originalPosition);
                    frag.mesh.rotation.set(0, 0, 0);
                    frag.frontMat.opacity = 0.92;
                    frag.sideMat.opacity = 0.92;
                });
            }

            function tick() {
                if (!outStates[index] || !stand.fragments) { stand.isProgressiveShattering = false; return; }
                const now = performance.now();
                const elapsed = now - baseStartTime;
                const dt = Math.min((now - lastTime) / 1000, 0.05); // 真实 dt，上限 50ms 防跳帧
                lastTime = now;

                // ---- 阶段1: 裂纹出现 (0~1200ms) ----
                if (elapsed < PHASE1_END) {
                    const p = elapsed / PHASE1_END;
                    // 裂纹线逐渐显现（每条有延迟，从中心向外依次出现）
                    if (stand.crackLines) {
                        stand.crackLines.forEach(cl => {
                            cl.visible = true;
                            const lineDelay = cl.userData.delay || 0;
                            const lp = Math.max(0, (p - lineDelay) / (1 - lineDelay));
                            cl.material.opacity = lp * 0.9;
                        });
                    }
                    // 边框微红
                    if (stand.border) { stand.border.material.color.setHex(0xcc3333); stand.border.material.opacity = p * 0.4; }
                }
                // ---- 阶段2: 碎片分离 (1200~2400ms) ----
                else if (elapsed < PHASE2_END) {
                    const p = (elapsed - PHASE1_END) / (PHASE2_END - PHASE1_END);
                    const eased = 1 - (1 - p) * (1 - p); // easeOutQuad
                    // 裂纹线渐隐
                    if (stand.crackLines) stand.crackLines.forEach(cl => { cl.material.opacity = 0.9 * (1 - eased * 0.85); });
                    // 边框变红
                    if (stand.border) { stand.border.material.color.setHex(0xff0000); stand.border.material.opacity = 0.4 + eased * 0.6; }
                    if (stand.glowBorder) { stand.glowBorder.material.color.setHex(0xff3333); stand.glowBorder.material.opacity = eased * 0.6; }
                    // 碎片微微撑开（Z 前推 + XY 微分离 + 微旋转）
                    if (stand.fragments) {
                        stand.fragments.forEach(frag => {
                            frag.mesh.position.z = frag.originalPosition.z + eased * 0.12;
                            frag.mesh.position.x = frag.originalPosition.x + frag.velocity.x * eased * 0.04;
                            frag.mesh.position.y = frag.originalPosition.y + frag.velocity.y * eased * 0.04;
                            frag.mesh.rotation.x = eased * frag.angularVelocity.x * 0.02;
                            frag.mesh.rotation.y = eased * frag.angularVelocity.y * 0.02;
                        });
                    }
                }
                // ---- 阶段3: 散落漂浮 (2400~4500ms) ----
                else if (elapsed < PHASE3_END) {
                    const p = (elapsed - PHASE2_END) / (PHASE3_END - PHASE2_END);
                    if (stand.crackLines) stand.crackLines.forEach(cl => { cl.material.opacity = Math.max(0, 0.135 * (1 - p)); });
                    // 碎片飞散物理（使用真实 dt）
                    if (stand.fragments) {
                        stand.fragments.forEach(frag => {
                            frag.mesh.position.x += frag.velocity.x * dt;
                            frag.mesh.position.y += frag.velocity.y * dt;
                            frag.mesh.position.z += frag.velocity.z * dt;
                            frag.velocity.y -= 0.04 * dt;
                            frag.velocity.z *= Math.pow(0.5, dt * 0.6); // 帧率无关阻尼
                            frag.mesh.rotation.x += frag.angularVelocity.x * dt;
                            frag.mesh.rotation.y += frag.angularVelocity.y * dt;
                            frag.mesh.rotation.z += frag.angularVelocity.z * dt;
                            frag.angularVelocity.multiplyScalar(Math.pow(0.65, dt)); // 帧率无关角衰减
                        });
                    }
                    // OUT 标签渐入
                    if (stand.outLabel3D && outLabelBaseScale) {
                        stand.outLabel3D.visible = true;
                        const lp = Math.min(p * 2, 1);
                        const c1 = 1.70158, c3 = c1 + 1;
                        const le = 1 + c3 * Math.pow(lp - 1, 3) + c1 * Math.pow(lp - 1, 2);
                        stand.outLabel3D.material.opacity = le;
                        stand.outLabel3D.scale.set(outLabelBaseScale.x * le, outLabelBaseScale.y * le, 1);
                    }
                }
                // ---- 完成后切换到漂浮模式 ----
                else {
                    stand.isProgressiveShattering = false;
                    stand.shatterPhase = 4;
                    if (stand.crackLines) stand.crackLines.forEach(cl => cl.visible = false);
                    return;
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // ===== 碎片化系统 =====

        // Voronoi 不规则碎片：生成真实破碎效果
        function createShatterFragments(index) {
            const stand = stands[index];
            if (!stand) return;

            disposeShatterFragments(stand);

            const group = new THREE.Group();
            group.position.set(stand.position, 0, 0);
            const fragments = [];

            const standWidth = 2, standHeight = 3, standDepth = 0.2;
            const halfW = standWidth / 2, halfH = standHeight / 2;

            // ---- 渲染画框正面合成纹理 ----
            const texCanvas = document.createElement('canvas');
            texCanvas.width = 512;
            texCanvas.height = Math.round(512 * (standHeight / standWidth)); // 768
            const texCtx = texCanvas.getContext('2d');
            texCtx.fillStyle = '#0a0a0a';
            texCtx.fillRect(0, 0, texCanvas.width, texCanvas.height);
            try {
                if (stand.logoLeft && stand.logoLeft.material && stand.logoLeft.material.map) {
                    const img = stand.logoLeft.material.map.image;
                    if (img && img.width) {
                        texCtx.globalAlpha = 0.95;
                        // logoLeft UV: offset(0,0) repeat(0.5,1) → 只取图像左半
                        texCtx.drawImage(img, 0, 0, img.width / 2, img.height, 0, 0, texCanvas.width / 2, texCanvas.height);
                    }
                }
            } catch(e) {}
            try {
                if (stand.logoRight && stand.logoRight.material && stand.logoRight.material.map) {
                    const img = stand.logoRight.material.map.image;
                    if (img && img.width) {
                        texCtx.globalAlpha = 0.95;
                        // logoRight UV: offset(0.5,0) repeat(0.5,1) → 只取图像右半
                        texCtx.drawImage(img, img.width / 2, 0, img.width / 2, img.height, texCanvas.width / 2, 0, texCanvas.width / 2, texCanvas.height);
                    }
                }
            } catch(e) {}
            const compositeTexture = new THREE.CanvasTexture(texCanvas);
            compositeTexture.minFilter = THREE.LinearFilter;

            // ---- 生成 Voronoi 种子点（链式裂纹分布）----
            const seeds = [];
            // 2~4 个冲击中心
            const impacts = [];
            for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) {
                impacts.push({ x: (Math.random() - 0.5) * standWidth * 0.7, y: (Math.random() - 0.5) * standHeight * 0.7 });
            }
            // 从每个冲击中心发射裂纹线，种子沿裂纹分布
            for (const imp of impacts) {
                const numCracks = 5 + Math.floor(Math.random() * 5); // 5~9 条裂纹
                for (let c = 0; c < numCracks; c++) {
                    const crackAngle = (c / numCracks) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
                    const crackLen = 0.4 + Math.random() * 1.2;
                    const numPts = 3 + Math.floor(Math.random() * 5); // 3~7 个种子点
                    let cx = imp.x, cy = imp.y;
                    for (let p = 0; p < numPts; p++) {
                        const step = crackLen / numPts * (0.7 + Math.random() * 0.6);
                        cx += Math.cos(crackAngle + (Math.random() - 0.5) * 0.4) * step;
                        cy += Math.sin(crackAngle + (Math.random() - 0.5) * 0.4) * step;
                        cx = Math.max(-halfW + 0.01, Math.min(halfW - 0.01, cx));
                        cy = Math.max(-halfH + 0.01, Math.min(halfH - 0.01, cy));
                        seeds.push({ x: cx, y: cy });
                    }
                    // 裂纹分支
                    if (Math.random() > 0.4) {
                        const branchAngle = crackAngle + (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.8);
                        const bLen = crackLen * 0.4;
                        let bx = imp.x + Math.cos(crackAngle) * crackLen * 0.5;
                        let by = imp.y + Math.sin(crackAngle) * crackLen * 0.5;
                        for (let p = 0; p < 2 + Math.floor(Math.random() * 3); p++) {
                            bx += Math.cos(branchAngle + (Math.random() - 0.5) * 0.3) * (bLen / 3);
                            by += Math.sin(branchAngle + (Math.random() - 0.5) * 0.3) * (bLen / 3);
                            bx = Math.max(-halfW + 0.01, Math.min(halfW - 0.01, bx));
                            by = Math.max(-halfH + 0.01, Math.min(halfH - 0.01, by));
                            seeds.push({ x: bx, y: by });
                        }
                    }
                }
            }
            // 补充随机散布的种子
            for (let i = 0; i < 15; i++) {
                seeds.push({ x: (Math.random() - 0.5) * standWidth * 0.95, y: (Math.random() - 0.5) * standHeight * 0.95 });
            }
            // 边缘补充
            for (let i = 0; i < 10; i++) {
                const e = Math.floor(Math.random() * 4);
                let x, y;
                if (e === 0) { x = -halfW + 0.02; y = (Math.random() - 0.5) * standHeight; }
                else if (e === 1) { x = halfW - 0.02; y = (Math.random() - 0.5) * standHeight; }
                else if (e === 2) { y = -halfH + 0.02; x = (Math.random() - 0.5) * standWidth; }
                else { y = halfH - 0.02; x = (Math.random() - 0.5) * standWidth; }
                seeds.push({ x, y });
            }

            // ---- 计算每个种子的 Voronoi 单元格 ----
            const angleSteps = 10 + Math.floor(Math.random() * 8); // 10~17 个顶点 → 精细不规则碎片
            const maxR = Math.max(standWidth, standHeight) * 0.6;

            for (let si = 0; si < seeds.length; si++) {
                const seed = seeds[si];
                // 采样角度（随机扰动，非均匀），生成尖锐不规则多边形
                const angles = [];
                for (let ai = 0; ai < angleSteps; ai++) {
                    const base = (ai / angleSteps) * Math.PI * 2;
                    // 每个角度随机偏移，让形状更不规则
                    angles.push(base + (Math.random() - 0.5) * (Math.PI * 2 / angleSteps) * 0.8);
                }
                angles.sort((a, b) => a - b);

                const poly = [];
                for (let ai = 0; ai < angleSteps; ai++) {
                    const angle = angles[ai];
                    const dx = Math.cos(angle), dy = Math.sin(angle);
                    let minT = maxR;
                    for (let sj = 0; sj < seeds.length; sj++) {
                        if (sj === si) continue;
                        const other = seeds[sj];
                        const mx = (other.x - seed.x), my = (other.y - seed.y);
                        const dist = Math.sqrt(mx * mx + my * my);
                        if (dist < 0.001) continue;
                        const nx = mx / dist, ny = my / dist;
                        const dot = nx * dx + ny * dy;
                        if (dot <= 0.01) continue;
                        const t = (dist * 0.5) / dot;
                        if (t > 0 && t < minT) minT = t;
                    }
                    // 边界裁剪
                    if (Math.abs(dx) > 0.001) {
                        const tx1 = (-halfW - seed.x) / dx;
                        const tx2 = (halfW - seed.x) / dx;
                        if (tx1 > 0 && tx1 < minT) minT = tx1;
                        if (tx2 > 0 && tx2 < minT) minT = tx2;
                    }
                    if (Math.abs(dy) > 0.001) {
                        const ty1 = (-halfH - seed.y) / dy;
                        const ty2 = (halfH - seed.y) / dy;
                        if (ty1 > 0 && ty1 < minT) minT = ty1;
                        if (ty2 > 0 && ty2 < minT) minT = ty2;
                    }
                    // 大幅度锯齿扰动（模拟真实碎裂边缘）
                    const jitter = 0.6 + Math.random() * 0.8; // 0.6~1.4 倍
                    poly.push({ x: seed.x + dx * minT * jitter, y: seed.y + dy * minT * jitter });
                }
                if (poly.length < 3) continue;

                // 碎片随机厚度
                const depth = standDepth * (0.1 + Math.random() * 0.6); // 更大幅度厚度变化

                // ---- 构建 ExtrudeGeometry（不规则多边形 + 厚度）----
                const shape = new THREE.Shape();
                shape.moveTo(poly[0].x, poly[0].y);
                for (let p = 1; p < poly.length; p++) {
                    shape.lineTo(poly[p].x, poly[p].y);
                }
                shape.closePath();

                const extrudeSettings = {
                    depth: depth,
                    bevelEnabled: true,
                    bevelThickness: 0.005,
                    bevelSize: 0.005,
                    bevelSegments: 1
                };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);

                // ---- UV 映射：正面采样合成纹理对应区域 ----
                const posAttr = geo.attributes.position;
                const uvAttr = geo.attributes.uv;
                for (let vi = 0; vi < posAttr.count; vi++) {
                    const vx = posAttr.getX(vi);
                    const vy = posAttr.getY(vi);
                    // 将世界坐标映射到纹理 UV (0~1)
                    const u = (vx + halfW) / standWidth;
                    const v = 1 - (vy + halfH) / standHeight;
                    uvAttr.setXY(vi, u, v);
                }
                uvAttr.needsUpdate = true;

                // 正面材质（采样画框纹理）
                const frontMat = new THREE.MeshStandardMaterial({
                    map: compositeTexture.clone(),
                    transparent: true, opacity: 0.95,
                    roughness: 0.45, metalness: 0.3,
                    side: THREE.FrontSide
                });
                frontMat.map.needsUpdate = true;

                // 侧面/断面材质（深色断面，模拟碎裂截面）
                const sideColor = new THREE.Color(0x0d0d0d).lerp(new THREE.Color(0x2a1a1a), Math.random() * 0.5);
                const sideMat = new THREE.MeshStandardMaterial({
                    color: sideColor,
                    transparent: true, opacity: 0.95,
                    roughness: 0.85, metalness: 0.1,
                    side: THREE.FrontSide
                });

                // ExtrudeGeometry groups: [0]=侧面, [1]=正面+背面
                const mesh = new THREE.Mesh(geo, [sideMat, frontMat]);

                // 定位碎片（Z 居中，正面朝外）
                const origX = seed.x;
                const origY = seed.y;
                const origZ = standDepth / 2 - depth / 2;
                mesh.position.set(origX, origY, origZ);
                group.add(mesh);

                // ---- 碎片飞散物理 ----
                const distFromCenter = Math.sqrt(origX * origX + origY * origY);
                const angle = Math.atan2(origY, origX) + (Math.random() - 0.5) * 1.0;
                const spread = 0.12 + Math.random() * 0.3;

                fragments.push({
                    mesh: mesh,
                    frontMat: frontMat,
                    sideMat: sideMat,
                    originalPosition: new THREE.Vector3(origX, origY, origZ),
                    originalRotation: new THREE.Euler(0, 0, 0),
                    velocity: new THREE.Vector3(
                        Math.cos(angle) * spread + (Math.random() - 0.5) * 0.12,
                        Math.sin(angle) * spread * 0.5 + (Math.random() - 0.5) * 0.12,
                        0.25 + Math.random() * 0.7
                    ),
                    angularVelocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 2.5,
                        (Math.random() - 0.5) * 2.5,
                        (Math.random() - 0.5) * 1.8
                    ),
                    delay: (distFromCenter * 25) + Math.random() * 60,
                    polyVerts: poly // 存储原始多边形顶点，用于裂纹线生成
                });
            }

            // ---- 生成裂纹线（贴在画框表面）----
            const crackLines = [];
            const crackGroup = new THREE.Group();
            crackGroup.position.set(stand.position, 0, 0);
            // 收集所有碎片的多边形边作为裂纹线（去重共享边）
            const edgeSet = new Set();
            for (let fi = 0; fi < fragments.length; fi++) {
                const frag = fragments[fi];
                const poly = frag.polyVerts;
                if (!poly || poly.length < 3) continue;
                for (let vi = 0; vi < poly.length; vi++) {
                    const p1 = poly[vi];
                    const p2 = poly[(vi + 1) % poly.length];
                    // 去重（按端点排序 hash）
                    const key = `${Math.min(p1.x, p2.x).toFixed(2)},${Math.min(p1.y, p2.y).toFixed(2)}-${Math.max(p1.x, p2.x).toFixed(2)},${Math.max(p1.y, p2.y).toFixed(2)}`;
                    if (edgeSet.has(key)) continue;
                    edgeSet.add(key);
                    // 跳过靠近画框边缘的边
                    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                    if (Math.abs(mx) > halfW - 0.05 || Math.abs(my) > halfH - 0.05) continue;
                    // 创建裂纹线（贴在画框正面 Z = standDepth/2 + 0.005）
                    const v1 = new THREE.Vector3(p1.x, p1.y, standDepth / 2 + 0.005);
                    const v2 = new THREE.Vector3(p2.x, p2.y, standDepth / 2 + 0.005);
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([v1, v2]);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0, linewidth: 1 });
                    const line = new THREE.Line(lineGeo, lineMat);
                    // 延迟基于距中心的距离（中心的裂纹先出现）
                    const dist = Math.sqrt(mx * mx + my * my);
                    const maxDist = Math.sqrt(halfW * halfW + halfH * halfH);
                    line.userData.delay = (dist / maxDist) * 0.6;
                    crackLines.push(line);
                    crackGroup.add(line);
                }
            }
            scene.add(crackGroup);
            stand.crackLines = crackLines;
            stand.crackGroup = crackGroup;

            stand.fragmentGroup = group;
            stand.fragments = fragments;
            scene.add(group);
        }

        // 碎片复原动画（取消 OUT 时碎片飞回拼合 + 原始画框交叉渐入）
        function animateShatterReset(stand, index) {
            if (!stand.fragments || stand.fragments.length === 0) return;

            const FLYBACK_DUR = 600;   // 碎片飞回时长
            const FADE_DUR = 400;      // 交叉淡入时长（与飞回尾部重叠）
            const TOTAL_DUR = FLYBACK_DUR + FADE_DUR; // 总时长 1000ms
            const startTime = performance.now();

            // 初始状态：原始画框完全透明，logo 隐藏
            if (stand.mesh) stand.mesh.material.opacity = 0.03;
            if (stand.logo) stand.logo.visible = false;
            if (stand.logoMaterial) { stand.logoMaterial.opacity = 0; stand.logoMaterial.needsUpdate = true; }
            if (stand.logoMaterialRight) { stand.logoMaterialRight.opacity = 0; stand.logoMaterialRight.needsUpdate = true; }

            // 快照当前碎片状态
            const snap = stand.fragments.map(f => ({
                px: f.mesh.position.x, py: f.mesh.position.y, pz: f.mesh.position.z,
                rx: f.mesh.rotation.x, ry: f.mesh.rotation.y, rz: f.mesh.rotation.z,
                fOpacity: f.frontMat.opacity, sOpacity: f.sideMat.opacity
            }));

            function update() {
                const elapsed = performance.now() - startTime;

                // ---- 阶段 A: 碎片飞回 (0 ~ FLYBACK_DUR) ----
                if (elapsed < FLYBACK_DUR) {
                    const p = elapsed / FLYBACK_DUR;
                    const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic

                    stand.fragments.forEach((frag, i) => {
                        const s = snap[i];
                        frag.mesh.position.x = s.px + (frag.originalPosition.x - s.px) * eased;
                        frag.mesh.position.y = s.py + (frag.originalPosition.y - s.py) * eased;
                        frag.mesh.position.z = s.pz + (frag.originalPosition.z - s.pz) * eased;
                        frag.mesh.rotation.x = s.rx * (1 - eased);
                        frag.mesh.rotation.y = s.ry * (1 - eased);
                        frag.mesh.rotation.z = s.rz * (1 - eased);
                    });

                    // 飞回后半段开始淡入原始画框（重叠区域）
                    if (p > 0.5) {
                        const fadeP = (p - 0.5) / 0.5; // 0~1 in last half
                        const fadeEased = fadeP * fadeP; // easeInQuad for smooth start
                        if (stand.mesh) stand.mesh.material.opacity = 0.03 + fadeEased * 0.97;
                        if (stand.logoMaterial) { stand.logoMaterial.opacity = fadeEased * 0.95; stand.logoMaterial.needsUpdate = true; }
                        if (stand.logoMaterialRight) { stand.logoMaterialRight.opacity = fadeEased * 0.95; stand.logoMaterialRight.needsUpdate = true; }
                        // 碎片渐隐
                        stand.fragments.forEach((frag, i) => {
                            const s = snap[i];
                            frag.frontMat.opacity = s.fOpacity * (1 - fadeEased * 0.5);
                            frag.sideMat.opacity = s.sOpacity * (1 - fadeEased * 0.5);
                        });
                    }
                }
                // ---- 阶段 B: 交叉淡入 (FLYBACK_DUR ~ TOTAL_DUR) ----
                else if (elapsed < TOTAL_DUR) {
                    const p = (elapsed - FLYBACK_DUR) / FADE_DUR;
                    const eased = 1 - (1 - p) * (1 - p); // easeOutQuad

                    // 原始画框完全显现
                    if (stand.mesh) stand.mesh.material.opacity = 1;
                    if (stand.logo) stand.logo.visible = true;
                    if (stand.logoMaterial) { stand.logoMaterial.color.setHex(0xffffff); stand.logoMaterial.opacity = 0.95; stand.logoMaterial.needsUpdate = true; }
                    if (stand.logoMaterialRight) { stand.logoMaterialRight.color.setHex(0xffffff); stand.logoMaterialRight.opacity = 0.95; stand.logoMaterialRight.needsUpdate = true; }

                    // 碎片快速淡出
                    stand.fragments.forEach(frag => {
                        frag.frontMat.opacity = 0.45 * (1 - eased);
                        frag.sideMat.opacity = 0.45 * (1 - eased);
                    });
                }
                // ---- 完成 ----
                else {
                    disposeShatterFragments(stand);
                    stand.isShattering = false;
                    stand.isProgressiveShattering = false;
                    return;
                }
                requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // 每帧更新碎片漂浮（animate 循环调用）
        function updateShatterFragments() {
            stands.forEach((stand, idx) => {
                if (!outStates[idx] || !stand.fragments || stand.isShattering || stand.isProgressiveShattering) return;
                const time = clock.getElapsedTime();
                stand.fragments.forEach((frag, i) => {
                    // 缓慢漂浮 + 微微旋转（在原位附近轻轻摇摆）
                    frag.mesh.position.y += Math.sin(time * 0.8 + i * 0.7) * 0.0008;
                    frag.mesh.position.x += Math.cos(time * 0.5 + i * 0.5) * 0.0004;
                    frag.mesh.position.z += Math.sin(time * 0.6 + i * 0.3) * 0.0004;
                    frag.mesh.rotation.x += 0.0008;
                    frag.mesh.rotation.y += 0.0012;
                });
            });
        }

        // 清理碎片资源
        function disposeShatterFragments(stand) {
            if (stand.fragmentGroup) {
                scene.remove(stand.fragmentGroup);
                stand.fragmentGroup.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
                        } else {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    }
                });
                stand.fragmentGroup = null;
            }
            // 清理裂纹线
            if (stand.crackGroup) {
                scene.remove(stand.crackGroup);
                stand.crackGroup.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                stand.crackGroup = null;
            }
            stand.crackLines = [];
            stand.fragments = [];
        }

        // 创建3D OUT标签（固定在立牌上）
        function createOutLabel3D(standMesh, standWidth, standHeight) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // 红色背景
            ctx.fillStyle = 'rgba(220, 0, 0, 0.9)';
            const rx = 10, ry = 10, rw = canvas.width - 20, rh = canvas.height - 20, radius = 12;
            ctx.beginPath();
            ctx.moveTo(rx + radius, ry);
            ctx.lineTo(rx + rw - radius, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + radius);
            ctx.lineTo(rx + rw, ry + rh - radius);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - radius, ry + rh);
            ctx.lineTo(rx + radius, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - radius);
            ctx.lineTo(rx, ry + radius);
            ctx.quadraticCurveTo(rx, ry, rx + radius, ry);
            ctx.closePath();
            ctx.fill();
            
            // 红色边框
            ctx.strokeStyle = 'rgba(255, 50, 50, 1)';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 外发光
            ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('OUT', canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(standWidth * 0.6, standHeight * 0.2, 1);
            sprite.position.set(0, standHeight * 0.55, 0.2);
            sprite.visible = false;
            
            // 添加到立牌mesh上，使其随立牌固定在世界坐标
            standMesh.add(sprite);
            return sprite;
        }

        // Logo 入场动画
        function animateLogoIn(obj) {
            const duration = 600;
            const startTime = Date.now();
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                obj.scale.set(eased, eased, eased);
                if (progress < 1) requestAnimationFrame(update);
            }
            update();
        }

        // 创建 Logo 网格（左右两半，支持裂开效果）
        function createLogoMesh(texture, xPosition, standDepth, index, standWidth, standHeight) {
            const logoW = standWidth * 0.85;
            const logoH = standHeight * 0.85;
            const halfW = logoW / 2;

            // 左半纹理（UV 取纹理左半）
            const leftTex = texture.clone();
            leftTex.offset.set(0, 0);
            leftTex.repeat.set(0.5, 1);
            leftTex.needsUpdate = true;

            // 右半纹理（UV 取纹理右半）
            const rightTex = texture.clone();
            rightTex.offset.set(0.5, 0);
            rightTex.repeat.set(0.5, 1);
            rightTex.needsUpdate = true;

            const leftMat = new THREE.MeshBasicMaterial({
                map: leftTex, transparent: true, side: THREE.DoubleSide, opacity: 0.95
            });
            const rightMat = new THREE.MeshBasicMaterial({
                map: rightTex, transparent: true, side: THREE.DoubleSide, opacity: 0.95
            });

            const leftMesh = new THREE.Mesh(new THREE.PlaneGeometry(halfW, logoH), leftMat);
            leftMesh.position.x = -halfW / 2;

            const rightMesh = new THREE.Mesh(new THREE.PlaneGeometry(halfW, logoH), rightMat);
            rightMesh.position.x = halfW / 2;

            // 用 Group 包裹两半，整体定位
            const logoGroup = new THREE.Group();
            logoGroup.add(leftMesh);
            logoGroup.add(rightMesh);
            logoGroup.position.set(xPosition, 0, standDepth / 2 + 0.01);
            scene.add(logoGroup);

            // 保存引用
            if (stands[index]) {
                stands[index].logo = logoGroup;
                stands[index].logoLeft = leftMesh;
                stands[index].logoRight = rightMesh;
                stands[index].logoMaterial = leftMat;
                stands[index].logoMaterialRight = rightMat;
            }

            // 入场动画
            logoGroup.scale.set(0, 0, 0);
            setTimeout(() => {
                animateLogoIn(logoGroup);
            }, index * 300);
        }

        // 粉笔字绘制：模拟真实粉笔的粗糙、不均匀、有粉尘效果
        function drawChalkChar(ctx, char, x, y, color, fontSize) {
            const baseAlpha = 0.75 + Math.random() * 0.2;
            const passes = 3;
            for (let p = 0; p < passes; p++) {
                const ox = (Math.random() - 0.5) * 1.8;
                const oy = (Math.random() - 0.5) * 1.2;
                const a = baseAlpha * (0.25 + Math.random() * 0.35);
                ctx.save();
                ctx.globalAlpha = a;
                ctx.fillStyle = color;
                ctx.translate(x + ox, y + oy);
                ctx.rotate((Math.random() - 0.5) * 0.02);
                ctx.fillText(char, 0, 0);
                ctx.restore();
            }
            // 主笔触
            ctx.save();
            ctx.globalAlpha = baseAlpha;
            ctx.fillStyle = color;
            ctx.fillText(char, x, y);
            ctx.restore();
            // 粉笔粉尘颗粒
            const dustCount = Math.floor(Math.random() * 4) + 1;
            for (let d = 0; d < dustCount; d++) {
                const dx = x + Math.random() * fontSize * 0.6 - fontSize * 0.1;
                const dy = y + Math.random() * fontSize * 0.8 - fontSize * 0.3;
                const ds = Math.random() * 1.8 + 0.3;
                ctx.save();
                ctx.globalAlpha = Math.random() * 0.15 + 0.03;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(dx, dy, ds, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 绘制粉笔文字行（返回结束X位置）
        function drawChalkLine(ctx, text, startX, y, color, fontSize) {
            let curX = startX;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                drawChalkChar(ctx, char, curX, y, color, fontSize);
                curX += ctx.measureText(char).width + (Math.random() - 0.5) * 1.0;
            }
            return curX;
        }

        // 粉笔波浪下划线
        function drawChalkUnderline(ctx, x1, x2, y, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.0;
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            for (let wx = x1; wx < x2; wx += 2) {
                const wy = y + Math.sin((wx - x1) * 0.13) * 2.5 + (Math.random() - 0.5) * 1.2;
                if (wx === x1) ctx.moveTo(wx, wy);
                else ctx.lineTo(wx, wy);
            }
            ctx.stroke();
            ctx.restore();
        }

            ctx.fillStyle = '#1a3d1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillRect(x, y, Math.random() * 4 + 1, Math.random() * 4 + 1);

            for (let i = 0; i < 60; i++) {

                ctx.save();
                ctx.globalAlpha = Math.random() * 0.02 + 0.005;
                ctx.fillStyle = '#ccc';

                ctx.rotate(Math.random() * Math.PI);
                ctx.fillRect(-15, -1, 30 + Math.random() * 20, 2 + Math.random() * 2);

def auto_type_code(file_path='code.txt'):

            elif target_indent < editor_indent:

def _detect_indent_size(lines):
    indents = set()
    for line in lines:
        stripped = line.lstrip(' ')
        indent = len(line) - len(stripped)
        if indent > 0 and stripped:
            indents.add(indent)
    return min(indents) if indents else 4


def _predict_next_indent(line, current_indent, indent_size):
    content = line.rstrip()
    stripped = content.strip()
    if content.endswith(':'):
        return current_indent + indent_size
    dedent_words = ('pass', 'break', 'continue', 'return', 'raise')
    if stripped in dedent_words or stripped.startswith(('return ', 'raise ')):

    return current_indent

def _nearby_key(char):
    neighbors = {

        'a': 's', 's': 'd', 'd': 'f', 'f': 'g', 'g': 'h',
        'h': 'j', 'j': 'k', 'k': 'l',
        'z': 'x', 'x': 'c', 'c': 'v', 'v': 'b', 'b': 'n', 'n': 'm',
    }
    c = char.lower()
    if c in neighbors:
        n = neighbors[c]
        return n if char.islower() else n.upper()
    return None

    return random.triangular(min_s, max_s, (min_s + max_s) / 2)

            isBlackboardMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 激活显示器视角
        function activateMonitorView(index) {
            if (!monitorMeshes[index] || !monitorsVisible) return;
            
            currentMonitorIndex = index;
            isMonitorMode = true;
            isBlackboardMode = false;
            isHeroMode = false;
            autoRotateEnabled = false;
            
            const monitor = monitorMeshes[index];
            
            // 相机推进到显示器正前方（z方向靠近）
            heroTarget = {
                position: new THREE.Vector3(monitor.mesh.position.x, monitor.mesh.position.y, monitor.mesh.position.z + 3),
                lookAt: monitor.mesh.position.clone()
            };
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                if (btn.textContent.includes(logoList[index])) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        
        // 取消显示器视角
        function deactivateMonitorView() {
            isMonitorMode = false;
            autoRotateEnabled = true;
            heroTarget = null;
            
            document.querySelectorAll('.bb-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        // 更新运行按钮位置（跟随当前激活显示器右下角）
        function updateRunButtonPosition() {
            if (!monitorsVisible || currentMonitorIndex < 0 || !monitorMeshes[currentMonitorIndex]) {
                document.getElementById('run-code-btn').style.display = 'none';
                return;
            }
            
            const monitor = monitorMeshes[currentMonitorIndex];
            const runBtn = document.getElementById('run-code-btn');
            
            const mWidth = 4.5, mHeight = 3.0;
            const localCorner = new THREE.Vector3(mWidth / 2, -mHeight / 2, 0.07);
            const worldCorner = localCorner.applyMatrix4(monitor.mesh.matrixWorld);
            
            const vector = worldCorner.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
            
            if (vector.z < 1 && x > -100 && x < window.innerWidth + 100 && y > -100 && y < window.innerHeight + 100) {
                runBtn.style.display = 'block';
                runBtn.style.left = (x - 60) + 'px';
                runBtn.style.top = (y + 4) + 'px';
            } else {
                runBtn.style.display = 'none';
            }
        }
        
        // Logo 入场动画
        function animateLogoIn(logo) {
            const targetScale = 1;
            const duration = 1000;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                logo.scale.set(eased * targetScale, eased * targetScale, eased * targetScale);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            update();
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            
            // 镜头控制逻辑
            if (isDollyZooming) {
                // === 希区柯克变焦（Dolly Zoom）===
                const elapsed = performance.now() - dollyZoomStartTime;
                const progress = Math.min(elapsed / dollyZoomDuration, 1);
                // easeInOutCubic 缓动函数，开始和结束平滑
                const eased = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                // 平滑插值相机位置（相机向前推）
                camera.position.lerpVectors(dollyZoomStartPos, dollyZoomTargetPos, eased);

                // 平滑插值 FOV（FOV 同步增大，保持主体大小不变）
                camera.fov = dollyZoomStartFov + (dollyZoomEndFov - dollyZoomStartFov) * eased;
                camera.updateProjectionMatrix();

                // 始终朝向目标主体
                camera.lookAt(dollyZoomLookAt);

                if (progress >= 1) {
                    isDollyZooming = false;
                    // 动画完成后进入英雄镜头模式，保持相机位置
                    isHeroMode = true;
                    heroTarget = {
                        position: dollyZoomTargetPos.clone(),
                        lookAt: dollyZoomLookAt.clone()
                    };
                    // Dolly Zoom 完成后，渐入显示 OUT 视觉效果
                    if (dollyZoomOutIndex >= 0 && outStates[dollyZoomOutIndex]) {
                        animateOutAppear(dollyZoomOutIndex);
                        dollyZoomOutIndex = -1;
                    }
                }
            } else if ((isBlackboardMode || isMonitorMode) && heroTarget) {
                // 黑板/显示器视角模式：平滑推进
                const lerpFactor = 0.05;
                camera.position.lerp(heroTarget.position, lerpFactor);
                
                // 平滑调整视角方向
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt);
                const targetDirection = new THREE.Vector3().subVectors(
                    heroTarget.lookAt, 
                    camera.position
                ).normalize();
                
                // 使用球面插值平滑旋转视角
                const currentQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(currentQuaternion);
                
                const targetQuaternion = new THREE.Quaternion();
                const targetCamera = new THREE.Camera();
                targetCamera.position.copy(camera.position);
                targetCamera.lookAt(heroTarget.lookAt);
                targetCamera.getWorldQuaternion(targetQuaternion);
                
                currentQuaternion.slerp(targetQuaternion, lerpFactor);
                camera.quaternion.copy(currentQuaternion);
            } else if (isHeroMode && heroTarget) {
                // 英雄镜头模式：平滑推进到目标位置
                const lerpFactor = 0.05; // 插值速度
                
                camera.position.lerp(heroTarget.position, lerpFactor);
                
                // 平滑调整视角
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt);
                const targetDirection = new THREE.Vector3().subVectors(
                    heroTarget.lookAt, 
                    camera.position
                ).normalize();
                
                // 使用lookAt直接设置视角
                camera.lookAt(heroTarget.lookAt);
            } else if (autoRotateEnabled) {
                // 自动漫游模式：原有的横移动画
                camera.position.x = Math.sin(elapsedTime * 0.15) * 12;
                camera.position.z = 15 + Math.cos(elapsedTime * 0.15) * 3;
                camera.position.y = 2 + Math.sin(elapsedTime * 0.3) * 0.5;
                camera.lookAt(0, 0.5, 0);
                // 确保自动漫游时 FOV 为默认值
                if (Math.abs(camera.fov - 75) > 0.5) {
                    camera.fov = 75;
                    camera.updateProjectionMatrix();
                }
            }
            
            // 粒子动画
            if (particles) {
                particles.rotation.y = elapsedTime * 0.03;
                particles.rotation.x = elapsedTime * 0.01;
                
                // 粒子闪烁效果
                const positions = particles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] += Math.sin(elapsedTime + positions[i - 1]) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            // 更新碎片漂浮
            updateShatterFragments();

            // 立牌发光效果动画（跳过OUT状态）
            stands.forEach((stand, index) => {
                if (outStates[index]) return;
                const pulse = Math.sin(elapsedTime * 2 + index * 0.5) * 0.2 + 0.8;
                stand.border.material.opacity = pulse;
                
                const glowPulse = Math.sin(elapsedTime * 1.5 + index * 0.5) * 0.15 + 0.35;
                stand.glowBorder.material.opacity = glowPulse;
            });
            

            
            // 更新运行按钮位置
            updateRunButtonPosition();
            // 更新黑板更新按钮位置
            updateBlackboardUpdateBtnPosition();
            
            renderer.render(scene, camera);
        }
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 答题按钮点击事件
        document.getElementById('quiz-btn').addEventListener('click', function() {
            const btn = this;
            if (monitorsVisible) {
                // 隐藏显示器
                hideMonitors();
                btn.classList.remove('active');
                btn.textContent = '📝 答题';
            } else {
                // 显示显示器（蒙太奇动画）
                showMonitorsWithAnimation();
                btn.classList.add('active');
                btn.textContent = '📝 收起';
            }
        });
        
        // 显示显示器（蒙太奇动画）
        function showMonitorsWithAnimation() {
            monitorsVisible = true;
            
            monitorMeshes.forEach((monitor, index) => {
                const anim = monitorAnimations[index];
                anim.visible = true;
                anim.animating = true;
                anim.targetOpacity = 1;
                anim.targetScale = 1;
                
                // 延迟启动每个显示器的动画
                setTimeout(() => {
                    monitor.mesh.visible = true;
                    monitor.screenPlane.visible = true;
                    animateMonitorIn(index);
                }, index * 200);
            });
        }
        
        // 隐藏显示器
        function hideMonitors() {
            monitorsVisible = false;
            
            monitorMeshes.forEach((monitor, index) => {
                const anim = monitorAnimations[index];
                anim.visible = false;
                anim.animating = true;
                anim.targetOpacity = 0;
                anim.targetScale = 0;
                
                // 延迟隐藏每个显示器
                setTimeout(() => {
                    animateMonitorOut(index);
                }, index * 100);
            });
        }
        
        // 显示器进入动画（蒙太奇效果）
        function animateMonitorIn(index) {
            const monitor = monitorMeshes[index];
            const anim = monitorAnimations[index];
            const duration = 800;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                
                // 更新透明度和缩放
                anim.opacity = eased * anim.targetOpacity;
                anim.scale = eased * anim.targetScale;
                
                monitor.mesh.scale.set(anim.scale, anim.scale, anim.scale);
                monitor.screenPlane.material.opacity = anim.opacity;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    anim.animating = false;
                }
            }
            
            update();
        }
        
        // 显示器退出动画
        function animateMonitorOut(index) {
            const monitor = monitorMeshes[index];
            const anim = monitorAnimations[index];
            const duration = 600;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const eased = 1 - Math.pow(1 - progress, 3);
                
                // 更新透明度和缩放
                anim.opacity = (1 - eased) * anim.targetOpacity;
                anim.scale = (1 - eased) * anim.targetScale;
                
                monitor.mesh.scale.set(anim.scale, anim.scale, anim.scale);
                monitor.screenPlane.material.opacity = anim.opacity;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    monitor.mesh.visible = false;
                    monitor.screenPlane.visible = false;
                    anim.animating = false;
                }
            }
            
            update();
        }
        // 运行按钮点击事件
        document.getElementById('run-code-btn').addEventListener('click', function() {
            const btn = this;
            if (btn.classList.contains('running')) return;
            btn.classList.add('running');
            btn.textContent = '⏳ Running...';
            setTimeout(() => {
                btn.classList.remove('running');
                btn.textContent = '▶ Run';
            }, 3000);
        });
        
        // 黑板更新提示词按钮点击事件
        document.getElementById('update-prompt-btn').addEventListener('click', function() {
            blackboardPromptVersion = blackboardPromptVersion === 0 ? 1 : 0;
            this.classList.toggle('updated', blackboardPromptVersion === 1);
            this.title = blackboardPromptVersion === 1 ? '切换回原始提示词' : '更新提示词';
            redrawBlackboard();
            updateMonitorsCode();
        });
        
        // 黑板复制按钮点击事件
        document.getElementById('copy-blackboard-btn').addEventListener('click', function() {
            const btn = this;
            let textToCopy;
            if (blackboardPromptVersion === 0) {
                textToCopy = `输入：Python代码文本文件路径 （txt格式）默认 code.txt

功能：
  读取文件中缩进规范的Python代码
  等待5秒，供用户定位光标
  使用 pyautogui逐字符模拟人为输入到光标位置

要求：仅实现函数，环境已就绪，不处理依赖

注意：
  处理.py 文件中常见软件会自动处理缩进的情况
  不要频繁使用home 模拟人真实的输入
  即非匀速输入 有几率输入错误字符

写好函数的调用 代码可直接运行`;
            } else {
                textToCopy = `输入：Python代码文本文件路径 （txt格式）默认 code.txt

功能：
  读取文件中缩进规范的Python代码
  等待5秒，供用户定位光标
  使用 pyautogui逐字符模拟人为输入到光标位置

要求：仅实现函数，环境已就绪，不处理依赖

注意：
  注意处理.py 文件中常见软件会自动处理缩进的情况
  所以你不能输入额外的缩进
  下行相同或长的缩进 交给软件自动处理
  短的缩进通过home+键入本身缩进进行处理
  每一行输入结束后 应该多输入一个空格再换行
  不要频繁使用home 模拟人真实的输入
  即非匀速输入 有几率输入错误字符
写好函数的调用 代码可直接运行`;
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.classList.add('copied');
                btn.textContent = '已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '复制';
                }, 1500);
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = textToCopy;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.classList.add('copied');
                btn.textContent = '已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '复制';
                }, 1500);
            });
        });
        
        // 鼠标滚轮滚动代码
        window.addEventListener('wheel', function(e) {
            if (!monitorsVisible || !isMonitorMode || currentMonitorIndex < 0) return;
            
            const monitor = monitorMeshes[currentMonitorIndex];
            if (!monitor) return;
            
            // 滚动步长
            const scrollStep = 30;
            monitor.scrollOffset += e.deltaY > 0 ? scrollStep : -scrollStep;
            
            // 限制滚动范围
            const codeLines = getCurrentMonitorCode(currentMonitorIndex).split('\n');
            const lineHeight = 28;
            const maxScroll = Math.max(0, codeLines.length * lineHeight - 580);
            monitor.scrollOffset = Math.max(0, Math.min(monitor.scrollOffset, maxScroll));
            
            // 更新显示
            updateMonitorScroll(currentMonitorIndex, monitor.scrollOffset);
        });
        
        // 启动场景
        init();
    </script>
</body>
</html>
