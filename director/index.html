<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导演 项目展示</title>
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans SC 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 背景渐变 */
            --bg-gradient-1: #e7f1f0;
            --bg-gradient-2: #dfe9ec;
            --bg-gradient-3: #e6edf2;

            /* 卡片样式 */
            --card-bg: rgba(255, 255, 255, 0.50);
            --card-bg-strong: rgba(255, 255, 255, 0.68);
            --card-border: rgba(255, 255, 255, 0.55);

            /* 文字层级 */
            --text-primary: #2c3e50;
            --text-secondary: #5a6c7d;
            --text-muted: #8e9aaf;

            /* 强调色 */
            --accent-teal: #2dd4bf;
            --accent-blue: #3b82f6;
            --accent-pink: #f472b6;

            /* 阴影层级 */
            --shadow-sm: 0 2px 8px rgba(20,40,50,0.05);
            --shadow-md: 0 6px 24px rgba(20,40,50,0.08);
            --shadow-lg: 0 12px 40px rgba(20,40,50,0.12);

            /* 圆角尺寸 */
            --radius-sm: 14px;
            --radius-md: 20px;
            --radius-lg: 28px;

            /* 过渡动画 */
            --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            overflow-x: hidden;
        }

        /* 粒子网络画布：浅色背景上的青绿粒子，保留原页面标志性交互 */
        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* 背景装饰光斑：与主页一致的模糊光团，叠加在粒子之上 */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .bg-decoration-1 {
            width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(94,234,212,0.30) 0%, transparent 70%);
            top: -180px; left: -120px;
            animation: float 22s ease-in-out infinite;
        }
        .bg-decoration-2 {
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(125,211,252,0.28) 0%, transparent 70%);
            bottom: -140px; right: -120px;
            animation: float 26s ease-in-out infinite reverse;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            padding: 90px 0 70px;
            animation: fadeUp 1s .2s both;
        }

        h1 {
            font-size: 3.2rem;
            margin-bottom: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-teal));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto 12px;
            line-height: 1.7;
        }

        .desc {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            max-width: 900px;
            margin: 50px auto;
        }

        /* 玻璃态卡片 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 35px;
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
            animation: fadeUp .8s .5s both;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s ease,
                        backdrop-filter 0.35s ease;
            overflow: hidden;
        }

        /* 3D Hover：轻微倾斜 + 上浮 + 放大 + 增强模糊 */
        .card:hover {
            transform: perspective(800px) rotateX(2deg) rotateY(-2deg)
                       translateY(-6px) scale(1.015);
            box-shadow: 0 16px 48px rgba(20,40,50,0.16),
                        0 0 0 1px rgba(255,255,255,0.5) inset;
            backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
            -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
        }

        .tags { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

        .tag {
            padding: 5px 12px;
            background: rgba(45,212,191,0.12);
            border-radius: 50px;
            font-size: 12px;
            color: var(--accent-teal);
            font-weight: 600;
        }

        .card h2 {
            font-size: 1.9rem;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .card p {
            line-height: 1.75;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 28px;
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            font-weight: 500;
            transition: var(--transition);
        }

        .btn:hover {
            transform: scale(1.04);
            background: rgba(255,255,255,0.72);
            box-shadow: var(--shadow-sm);
            color: var(--accent-teal);
        }

        .btn i { transition: var(--transition); }
        .btn:hover i { transform: translateX(3px); }

        footer {
            text-align: center;
            padding: 70px 0 40px;
            color: var(--text-muted);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* 不支持 backdrop-filter 的降级：提高不透明度保证可读 */
        @supports not (backdrop-filter: blur(24px)) {
            .card { background: rgba(255, 255, 255, 0.85); }
        }

        /* 细窄半透明滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(20,40,50,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(20,40,50,0.22); }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .grid { grid-template-columns: 1fr; }
            header { padding: 60px 0 50px; }
        }
    </style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="bg-decoration bg-decoration-1"></div>
<div class="bg-decoration bg-decoration-2"></div>

<div class="container">
    <header>
        <h1>导演 项目展示</h1>
        <p class="subtitle">在这个虚拟的3D世界，即使你没有专业的相机，也能用代码来"拍摄"镜头！</p>
        <p class="desc">用代码实现运镜｜用 Three.js 创作影像</p>
    </header>

    <div class="grid">
        <div class="card">
            <div class="tags">
                <span class="tag">Three.js</span>
                <span class="tag">排序算法</span>
                <span class="tag">AI 生成</span>
            </div>
            <h2>AI Gallery</h2>
            <p>基于 Three.js 的 3D 项目，采用希区柯克变焦等专业运镜，展示提示词对 AI 生成能力边界的重要性。</p>
            <a href="/director/ai_gallery/" class="btn">进入项目 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="card">
            <div class="tags">
                <span class="tag">Three.js</span>
                <span class="tag">3D 运镜</span>
                <span class="tag">AI 生成</span>
            </div>
            <h2>排序动画</h2>
            <p>基于 Three.js 的 3D 项目，直观展示各种排序算法的执行过程。</p>
            <a href="/director/sort_animation/" class="btn">进入项目 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </div>

    <footer>更多「导演」项目正在开发中...</footer>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
const mouse = { x: 0, y: 0, r: 150 };

const resize = () => {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
};

class P {
    constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - .5) * .5;
        this.vy = (Math.random() - .5) * .5;
    }
    update() {
        this.x = (this.x + this.vx + W) % W;
        this.y = (this.y + this.vy + H) % H;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.4, 0, 7);
        ctx.fill();
    }
}

const init = () => {
    resize();
    particles = Array.from({ length: 80 }, () => new P());
};

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const line = (a, b, d, max, color) => {
    if (d >= max) return;
    ctx.strokeStyle = color(1 - d / max);
    ctx.lineWidth = (1 - d / max) * 1.2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
};

const loop = () => {
    ctx.clearRect(0, 0, W, H);
    // 青绿粒子 + 青绿连线，在浅色渐变背景上保持可读
    ctx.fillStyle = 'rgba(45,212,191,0.55)';
    ctx.strokeStyle = 'rgba(45,212,191,0.1)';

    particles.forEach(p => { p.update(); p.draw(); });

    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            line(particles[i], particles[j], dist(particles[i], particles[j]), 70,
                t => `rgba(45,212,191,${t * .12})`);
        }
        const d = dist(particles[i], mouse);
        // 鼠标连线用蓝色，区分交互
        line(particles[i], mouse, d, mouse.r,
            t => `rgba(59,130,246,${t * .18})`);
    }

    requestAnimationFrame(loop);
};

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('resize', init);
init();
loop();
</script>
</body>
</html>
