<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导演 项目展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 粒子连线背景 Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #08080a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 90px 0 70px;
            animation: titleFade 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0 0 20px;
            text-shadow: 0 0 12px rgba(100, 150, 255, 0.4),
                         0 0 35px rgba(50, 100, 200, 0.25);
            letter-spacing: 1.2px;
        }

        .subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            max-width: 700px;
            margin: 0 auto 12px;
            line-height: 1.7;
        }

        .desc {
            font-size: 1rem;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
            margin-top: 50px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .project-card {
            background: rgba(20, 22, 28, 0.85);
            border-radius: 18px;
            padding: 35px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(180, 180, 220, 0.12);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            animation: cardFade 0.8s ease-out 0.5s forwards;
        }

        .project-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 18px 40px rgba(80, 120, 200, 0.2);
            border-color: rgba(120, 160, 255, 0.3);
            background: rgba(25, 28, 36, 0.9);
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tag {
            padding: 5px 11px;
            background: rgba(90, 130, 220, 0.22);
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: rgba(255,255,255,0.2);
        }

        .project-card h2 {
            font-size: 1.9rem;
            margin-bottom: 15px;
        }

        .project-card p {
            line-height: 1.75;
            opacity: 0.92;
            color: rgba(255,255,255,0.5);
            margin-bottom: 25px;
        }

        .project-link {
            display: inline-block;
            padding: 13px 28px;
            background: rgba(70, 110, 190, 0.3);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(100, 150, 255, 0.4);
            font-weight: 500;
        }

        .project-link:hover {
            background: rgba(90, 140, 220, 0.45);
            border-color: rgba(130, 170, 255, 0.6);
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(80, 120, 200, 0.25);
        }

        footer {
            text-align: center;
            padding: 70px 0 40px;
            opacity: 0.6;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        @keyframes titleFade {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .projects-grid { grid-template-columns: 1fr; }
            header { padding: 60px 0 50px; }
        }
    </style>
</head>
<body>

<!-- 核心：粒子连线动态背景 -->
<canvas id="particleCanvas"></canvas>

<div class="container">
    <header>
        <h1>导演 项目展示</h1>
        <p class="subtitle">在这个虚拟的3D世界 即使你没有专业的相机 也能用代码来‘拍摄’镜头!</p>
        <p class="desc">用代码实现运镜｜用 Three.js 创作影像</p>
    </header>

    <div class="projects-grid">
        <div class="project-card">
            <div class="tags">
                <span class="tag">Three.js</span>
                <span class="tag">3D 运镜</span>
                <span class="tag">AI 生成</span>
            </div>
            <h2>AI Gallery</h2>
            <p>一个基于Three.js的3D项目，采用如希区柯克变焦等专业运镜，直观展示提示词对于AI生成能力边界的重要性。</p>
            <a href="/director/ai_gallery/" class="project-link">进入项目</a>
        </div>
    </div>

    <footer>
        <p>更多「导演」项目正在开发中...</p>
    </footer>
</div>

<script>
// ==========================
// 粒子连线 + 鼠标互动背景
// 纯Canvas实现 ✅ 无图片 ✅ 高性能 ✅
// ==========================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
const mouse = { x: null, y: null, radius: 150 };

// 鼠标位置追踪
window.addEventListener('mousemove', (e) => {
    mouse.x = e.x;
    mouse.y = e.y;
});

// 创建粒子
class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.size = 1.2;
        this.color = '#ffffff';
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

function init() {
    particles = [];
    for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
    }
}

// 粒子连线
function connect() {
    for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 70) {
                const opacity = 1 - (distance / 70);
                ctx.strokeStyle = `rgba(255,255,255,${opacity * 0.1})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }

            // 鼠标连线（核心效果）
            const mdx = particles[a].x - mouse.x;
            const mdy = particles[a].y - mouse.y;
            const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mDist < mouse.radius) {
                const mop = 1 - (mDist / mouse.radius);
                ctx.strokeStyle = `rgba(255,255,255,${mop * 0.1})`;
                ctx.lineWidth = mop * 1.2;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();
            }
        }
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    connect();
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
});
</script>
</body>
</html>
