<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imgs/logo/github_logo.png" type="image/png">
    <meta name="description" content="JingW-ui「导演」实验室：用 Three.js 以代码实现运镜的 3D 影像实验，包含 AI Gallery 提示词边界展示与排序算法动画可视化。">
    <title>导演 - 用代码拍摄 3D 镜头 | JingW-ui</title>
    <style>
        :root {
            /* 纸面清单主题：纯白底 / 黑字 / 灰阶层级 / 无彩色强调（与 tools/index.html 同源） */
            --bg: #ffffff;

            /* 灰阶层级 */
            --chip: #f5f5f5;          /* 浅灰素面 */
            --chip-hover: #ffffff;    /* hover 反转为白 */
            --line: #e5e5e5;          /* 分隔线 */
            --line-strong: #111111;   /* hover 黑边 */

            /* 文字层级 */
            --text: #111111;
            --text-soft: #555555;
            --text-dim: #999999;

            /* 强调色：黑，仅用于竖条 / selection 等小面积点缀 */
            --accent: #111111;
            --accent-raw: #111111;

            /* 阴影：极简基本弃用 */
            --shadow-sm: none;
            --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.06);

            /* 圆角：极简小圆角 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 30px 20px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        ::selection { background: rgba(17, 17, 17, 0.12); }

        :focus-visible { outline: 2px solid var(--accent-raw); outline-offset: 2px; border-radius: 4px; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        .title-section {
            text-align: center;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(18px);
            animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.02s forwards;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            line-height: 1.2;
            color: var(--text);
        }

        .highlight {
            color: var(--text);
            display: block;
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-bottom: 0.5rem;
        }

        .stats-banner {
            background-color: transparent;
            color: var(--text-dim);
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            margin-top: 0.3rem;
        }

        /* 项目区块：纸面清单——1px 顶线 + 黑竖条标题分区 */
        .project-section {
            border-top: 1px solid var(--line);
            padding: 16px 0 8px;
            margin-bottom: 1.4rem;
            opacity: 0;
            animation: rise 0.45s ease 0.08s forwards;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.6rem;
            padding-left: 11px;
            position: relative;
            letter-spacing: 0.3px;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 14px;
            border-radius: 1px;
            background: var(--accent-raw);
        }

        .section-count {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-left: 8px;
        }

        /* 项目网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 项目卡：白底细线，hover 黑边浮现（无阴影无抬升） */
        .card {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 22px;
            box-shadow: none;
            transition: border-color 0.2s ease,
                        background 0.2s ease;
            display: flex;
            flex-direction: column;
            animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.14s backwards;
        }

        .card:nth-child(2) { animation-delay: 0.2s; }

        .card:hover {
            border-color: var(--line-strong);
        }

        /* 标签：细线胶囊，静态非交互 */
        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .tag {
            padding: 3px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.66rem;
            color: var(--text-dim);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .card h2 {
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.8rem;
            color: var(--text-soft);
            line-height: 1.7;
            margin-bottom: 18px;
        }

        /* 进入按钮：低存在感——透明底 + 细边 + 浅 hover，中性文字无 emoji */
        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            margin-top: auto;
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--text-soft);
            font-size: 0.75rem;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
        }

        .card-link:hover {
            color: var(--text);
            border-color: var(--line-strong);
            background: var(--chip);
        }

        .card-link .arrow {
            transition: transform 0.2s ease;
        }

        .card-link:hover .arrow { transform: translateX(2px); }

        footer {
            text-align: center;
            padding: 34px 0 26px;
            color: var(--text-dim);
            font-size: 0.72rem;
        }

        /* 动画关键帧 */
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 仓库入口（页面右上角）：fixed 钉住，无框 octocat 常态灰 hover 黑 */
        .repo-actions {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 15;
            display: flex;
            gap: 8px;
        }

        .repo-btn {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: var(--radius-sm);
            background: transparent;
            box-shadow: none;
            color: var(--text-soft);
            transition: var(--transition);
        }

        .repo-btn:hover { color: var(--text); }

        .repo-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 22px 12px 16px;
            }

            h1 { font-size: 1.15rem; }
            .highlight { font-size: 1.3rem; }
            .subtitle { font-size: 0.72rem; margin-bottom: 0.35rem; }
            .stats-banner { font-size: 0.62rem; padding: 0.25rem 0.7rem; }

            .project-section { padding: 12px 0 6px; margin-bottom: 1.1rem; }
            .section-title { font-size: 0.85rem; margin-bottom: 0.5rem; }

            .grid { grid-template-columns: 1fr; gap: 8px; }
            .card { padding: 18px 16px; }
            .card h2 { font-size: 0.92rem; }
            .card p { font-size: 0.74rem; margin-bottom: 14px; }
            .card-link { padding: 6px 12px; font-size: 0.7rem; }

            footer { padding: 24px 0 18px; font-size: 0.65rem; }
        }

        @media (max-width: 480px) {
            body { padding: 16px 8px 12px; }
            h1 { font-size: 1rem; }
            .highlight { font-size: 1.15rem; }
            .subtitle { font-size: 0.65rem; }
            .stats-banner { font-size: 0.56rem; padding: 0.2rem 0.55rem; }
            .card { padding: 15px 14px; }
            .tag { font-size: 0.6rem; padding: 2px 8px; }
            .card p { font-size: 0.72rem; }
        }

        /* 尊重减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
            .title-section, .project-section, .card {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

        <a class="repo-btn" href="https://github.com/JingW-ui/JingW-ui.github.io" target="_blank" rel="noopener noreferrer" title="查看本站源码" aria-label="查看本站源码">

        </a>
    </div>

    <div class="container">
        <!-- 标题区域 -->
        <div class="title-section">
            <h1><span class="highlight">导演</span>项目展示</h1>
            <p class="subtitle">在这个虚拟的 3D 世界，即使没有专业的相机，也能用代码来“拍摄”镜头</p>
            <div class="stats-banner">
                🎬 用代码实现运镜 · Three.js 创作影像
            </div>
        </div>

        <!-- 项目列表 -->
        <section class="project-section">
            <h2 class="section-title">项目<span class="section-count">2 个</span></h2>
            <div class="grid">
                <div class="card">
                    <div class="tags">
                        <span class="tag">Three.js</span>
                        <span class="tag">3D 运镜</span>
                        <span class="tag">AI 生成</span>
                    </div>
                    <h2>AI Gallery</h2>
                    <p>基于 Three.js 的 3D 项目，采用希区柯克变焦等专业运镜，展示提示词对 AI 生成能力边界的重要性。</p>
                    <a href="/director/ai_gallery/" class="card-link">进入项目 <span class="arrow">→</span></a>
                </div>
                <div class="card">
                    <div class="tags">
                        <span class="tag">Three.js</span>
                        <span class="tag">排序算法</span>
                        <span class="tag">可视化</span>
                    </div>
                    <h2>排序动画</h2>
                    <p>基于 Three.js 的 3D 项目，直观展示各种排序算法的执行过程。</p>
                    <a href="/director/sort_animation/" class="card-link">进入项目 <span class="arrow">→</span></a>
                </div>
            </div>
        </section>

        <footer>更多「导演」项目正在开发中...</footer>
    </div>
</body>
</html>
