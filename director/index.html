<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导演 项目展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            background: #08080a;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            padding: 90px 0 70px;
            animation: fadeUp 1s .2s both;
        }

        h1 {
            font-size: 3.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(100,150,255,.4), 0 0 35px rgba(50,100,200,.25);
        }

        .subtitle {
            font-size: 1.25rem;
            opacity: .9;
            max-width: 700px;
            margin: 0 auto 12px;
            line-height: 1.7;
        }

        .desc { opacity: .7; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
            max-width: 900px;
            margin: 50px auto;
        }

        .card {
            background: rgba(20,22,28,.85);
            border-radius: 18px;
            padding: 35px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(180,180,220,.12);
            animation: fadeUp .8s .5s both;
            transition: transform .4s, box-shadow .4s, border-color .4s;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 18px 40px rgba(80,120,200,.2);
            border-color: rgba(120,160,255,.3);
        }

        .tags { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

        .tag {
            padding: 5px 11px;
            background: rgba(90,130,220,.22);
            border-radius: 50px;
            font-size: 12px;
            color: rgba(255,255,255,.65);
        }

        .card h2 { font-size: 1.9rem; margin-bottom: 15px; }

        .card p {
            line-height: 1.75;
            color: rgba(255,255,255,.5);
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            background: rgba(70,110,190,.3);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(100,150,255,.4);
            transition: all .3s;
        }

        .btn:hover {
            background: rgba(90,140,220,.45);
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(80,120,200,.25);
        }

        footer {
            text-align: center;
            padding: 70px 0 40px;
            opacity: .6;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .grid { grid-template-columns: 1fr; }
            header { padding: 60px 0 50px; }
        }
    </style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="container">
    <header>
        <h1>导演 项目展示</h1>
        <p class="subtitle">在这个虚拟的3D世界，即使你没有专业的相机，也能用代码来"拍摄"镜头！</p>
        <p class="desc">用代码实现运镜｜用 Three.js 创作影像</p>
    </header>

    <div class="grid">
        <div class="card">
            <div class="tags">
                <span class="tag">Three.js</span>
                <span class="tag">排序算法</span>
                <span class="tag">AI 生成</span>
            </div>
            <h2>AI Gallery</h2>
            <p>基于 Three.js 的 3D 项目，采用希区柯克变焦等专业运镜，展示提示词对 AI 生成能力边界的重要性。</p>
            <a href="/director/ai_gallery/" class="btn">进入项目</a>
        </div>
        <div class="card">
            <div class="tags">
                <span class="tag">Three.js</span>
                <span class="tag">3D 运镜</span>
                <span class="tag">AI 生成</span>
            </div>
            <h2>排序动画</h2>
            <p>基于 Three.js 的 3D 项目，直观展示各种排序算法的执行过程。</p>
            <a href="/director/sort_animation/" class="btn">进入项目</a>
        </div>
    </div>

    <footer>更多「导演」项目正在开发中...</footer>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
const mouse = { x: 0, y: 0, r: 150 };

const resize = () => {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
};

class P {
    constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - .5) * .5;
        this.vy = (Math.random() - .5) * .5;
    }
    update() {
        this.x = (this.x + this.vx + W) % W;
        this.y = (this.y + this.vy + H) % H;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.2, 0, 7);
        ctx.fill();
    }
}

const init = () => {
    resize();
    particles = Array.from({ length: 80 }, () => new P());
};

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const line = (a, b, d, max, color) => {
    if (d >= max) return;
    ctx.strokeStyle = color(1 - d / max);
    ctx.lineWidth = (1 - d / max) * 1.2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
};

const loop = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';

    particles.forEach(p => { p.update(); p.draw(); });

    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            line(particles[i], particles[j], dist(particles[i], particles[j]), 70,
                t => `rgba(255,255,255,${t * .1})`);
        }
        const d = dist(particles[i], mouse);
        line(particles[i], mouse, d, mouse.r,
            t => `rgba(255,255,255,${t * .15})`);
    }

    requestAnimationFrame(loop);
};

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('resize', init);
init();
loop();
</script>
</body>
</html>
